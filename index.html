          </div>`}

        <div class="card">
          <div class="lbl">מי מטפל כעת</div>
          <div class="val">${site.owner.name} · ${site.owner.role}</div>
          <div class="btnrow" style=${{marginTop:12}}>
            <button class="btn pri" onClick=${()=>setSheet(true)}>פנייה לאחראי</button>
          </div>
        </div>

        ${log && log.length > 0 && html`
          <div class="card">
            <div class="lbl">יומן פעולות באתר</div>
            ${log.map((l, i) => html`<div class="logrow" key=${i}><span class="tm">${dmy(l.ts)} ${hhmm(l.ts)}</span> · <b>${l.who}</b><br/>${l.text}</div>`)}
          </div>`}

        ${sheet && html`
          <div class="scrim" onClick=${()=>setSheet(false)}>
            <div class="sheet" onClick=${e=>e.stopPropagation()}>
              <h3>פנייה לאחראי</h3>
              <div class="who">${site.owner.name} · ${site.owner.role} — ${site.name}</div>
              <button class="opt" onClick=${()=>{ setSheet(false); notify("מחייג ל"+site.owner.name+"…"); }}><span class="e">📞</span> חיוג</button>
              <button class="opt" onClick=${()=>{ setSheet(false); notify("נפתח צ׳אט האתר"); }}><span class="e">💬</span> צ׳אט האתר</button>
            </div>
          </div>`}
      </div>`;
  }

  function FieldHome({ sites, now, onCheckin, onOpen, onAddUnit, onWeekly }){
    const active = sites.filter(s=>s.active);
    const [sid, setSid] = useState(active[0].id);
    const [adding, setAdding] = useState(false);
    const [issue, setIssue] = useState(false);
    const [note, setNote] = useState("");
    const [nu, setNu] = useState({ title:"", floor:"" });
    const site = sites.find(s=>s.id===sid) || active[0];
    const wk = curWeekly(site, now);

    function submitUnit(e){
      e.preventDefault();
      if(!nu.title.trim()) return;
      onAddUnit(site.id, nu);
      setNu({ title:"", floor:"" });
      setAdding(false);
    }

    return html`
      <div class="screen narrow">
        <div class="shead"><h2>דיווח שטח</h2><span class="sub">בחר אתר · דוח שבועי, דיווח יומי ומשימות</span></div>
        <select class="pick" value=${sid} onChange=${e=>{ setSid(e.target.value); setAdding(false); }}>
          ${active.map(s => html`<option key=${s.id} value=${s.id}>${s.name} · ${s.contractor}${curWeekly(s, now) ? " ✓" : ""}</option>`)}
        </select>

        <div class="card ci" style=${{marginBottom:12}}>
          <div class="lbl">דוח תוכנית עבודה שבועית · ${weekLabel(now)}</div>
          ${wk
            ? html`<div class="val">✓ הוגש ${dmy(wk.at)} ${hhmm(wk.at)} · ${wk.by}</div>
                <div class="sub2">${TRACKS.filter(t => wk.tracks && wk.tracks[t.k]).map(t => t.label + " " + wk.tracks[t.k].pct + "%").join(" · ") || "אין מסלולים רלוונטיים"} · כ״א ${wk.workers == null ? "—" : wk.workers}</div>`
            : html`<div class="val" style=${{color:"var(--warn)"}}>טרם הוגש דוח שבועי לאתר הזה</div>`}
          <div class="btnrow" style=${{marginTop:10}}>
            <button class="btn pri" onClick=${()=>onWeekly(site.id)}>${wk ? "עדכן דוח שבועי" : "📅 מלא דוח שבועי"}</button>
          </div>
        </div>

        <div class="card ci" style=${{marginBottom:12}}>
          <div class="lbl">דיווח יומי · ${site.name}</div>
          ${site.checkin && site.checkin.date === dstr(now)
            ? html`<div class="val">✓ דווח היום ${hhmm(site.checkin.at)} · ${site.checkin.by} · ${site.checkin.status === "issue" ? "חריגה: " + site.checkin.note : "אין חריגים"}</div>`
            : html`<div class="val" style=${{color:"var(--warn)"}}>טרם דווח היום${new Date(now).getHours() >= CFG.checkinBy ? " — נדרש דיווח" : ""}</div>`}
          ${!issue
            ? html`<div class="btnrow" style=${{marginTop:10}}>
                <button class="btn ok" onClick=${()=>onCheckin(site.id, "ok", "")}>✓ אין חריגים</button>
                <button class="btn danger" onClick=${()=>setIssue(true)}>⚠ יש חריגה</button>
              </div>`
            : html`<form class="addrow" onSubmit=${(e)=>{ e.preventDefault(); if(!note.trim()) return; onCheckin(site.id, "issue", note.trim()); setNote(""); setIssue(false); }}>
                <input type="text" value=${note} onInput=${e=>setNote(e.target.value)} placeholder="תאר בקצרה את החריגה…" maxLength=${100} />
                <button type="submit" class="add" disabled=${!note.trim()} aria-label="שלח">➤</button>
              </form>`}
        </div>
        <div class="lbl" style=${{marginTop:6}}>משימות ותיעוד מצולם באתר</div>
        <div style=${{display:"flex", flexDirection:"column", gap:9}}>
          ${site.units.map(u=>{
            const done = u.checklist.length>0 && u.checklist.every(c=>c.done);
            return html`
              <button key=${u.id} class="wu" onClick=${()=>onOpen(site.id, u.id)}>
                <span class="ic">${done ? "✓" : "📋"}</span>
                <span class="m"><b>${u.title}</b><span>${u.floor} · ${u.checklist.filter(c=>c.done).length}/${u.checklist.length} משימות · ${(u.photos||[]).length} תמונות</span></span>
              </button>`;
          })}
          ${site.units.length === 0 && !adding && html`<div class="empty" style=${{padding:"14px 0"}}>אין עדיין משימות לתיעוד באתר הזה</div>`}

          ${adding
            ? html`
              <form class="newunit" onSubmit=${submitUnit}>
                <input type="text" placeholder="שם המשימה (למשל: צילום ליווי שלד קומה 4)" value=${nu.title} onInput=${e=>setNu({...nu, title:e.target.value})} maxLength=${60} />
                <input type="text" placeholder="מיקום / קומה" value=${nu.floor} onInput=${e=>setNu({...nu, floor:e.target.value})} maxLength=${30} />
                <div class="btnrow">
                  <button type="button" class="btn" onClick=${()=>setAdding(false)}>ביטול</button>
                  <button type="submit" class="btn pri" disabled=${!nu.title.trim()}>הוסף משימה</button>
                </div>
              </form>`
            : html`<button class="addsection" onClick=${()=>setAdding(true)}>＋ הוסף משימה / תיעוד</button>`}
        </div>
        <div class="hint">אפשר לפתוח משימה, להוסיף לה סעיפי צ׳קליסט ולצרף תמונות. ההנהלה רואה את התמונות ביומן הפעולות.</div>
      </div>`;
  }

  /* הטופס השבועי — אותן עמודות כמו הטופס על הנייר */
  function WeeklyForm({ site, now, onSubmit, onBack }){
    const cur = curWeekly(site, now);
    const hist = weekHistory(site, now), prev = hist.length ? hist[hist.length - 1] : null;
    const old = site.weekly && !cur ? site.weekly : null;   // דוח קודם: חריגים פתוחים עוברים הלאה
    const [d, setD] = useState(()=>{
      const tracks = {};
      TRACKS.forEach(t => {
        const v = cur && cur.tracks ? cur.tracks[t.k] : null, p = prev ? pctOf(prev, t.k) : null;
        tracks[t.k] = cur ? (v ? { pct: v.pct, goal: v.goal == null ? null : v.goal } : null) : (p != null && p < 100 ? { pct: p, goal: null } : null);
      });
      const base = cur || site.weekly || {};
      const openNote = old && old.issue && !old.issueResolvedAt && hasText(old.note);
      const openSafety = old && hasText(old.safety) && !old.safetyResolvedAt;
      return {
        tracks, foreman: base.foreman || "", lead: base.lead || "",
        workers: cur ? (cur.workers == null ? "" : String(cur.workers)) : (prev && prev.workers != null ? String(prev.workers) : ""),
        note: cur ? (cur.note || "") : (openNote ? old.note : ""), issue: cur ? !!cur.issue : !!openNote,
        safety: cur ? (cur.safety || "") : (openSafety ? old.safety : "")
      };
    });
    const set = patch => setD(x => ({ ...x, ...patch }));
    const setTrack = (k, v) => setD(x => ({ ...x, tracks: { ...x.tracks, [k]: v } }));
    const wOk = d.workers !== "" && !isNaN(Number(d.workers));
    const goals = [];
    for(let g = 5; g <= 100; g += 5) goals.push(g);

    function submit(e){
      e.preventDefault();
      if(!wOk) return;
      onSubmit(site.id, {
        tracks: d.tracks, workers: Math.max(0, Math.round(Number(d.workers))),
        foreman: d.foreman.trim(), lead: d.lead.trim(),
        note: d.note.trim(), issue: d.issue && hasText(d.note), safety: d.safety.trim()
      });
    }

    return html`
      <form class="screen narrow" onSubmit=${submit}>
        <div class="shead">
          <button type="button" class="back" onClick=${onBack} aria-label="חזרה">→</button>
          <div><h2 style=${{fontSize:"1.25rem"}}>דוח שבועי · ${site.name}</h2><span class="sub">${site.contractor} · שבוע ${weekLabel(now)} · מנהל פרויקט: ${site.owner.name}</span></div>
        </div>

        ${TRACKS.map(t => {
          const v = d.tracks[t.k], p = prev ? pctOf(prev, t.k) : null;
          return html`
            <div class=${"card trk "+(v ? "" : "off")} key=${t.k}>
              <div class="rowbet">
                <b>${t.label}</b>
                <label class="tgl"><input type="checkbox" checked=${!!v} onChange=${e => setTrack(t.k, e.target.checked ? { pct: p != null ? p : 0, goal: null } : null)} /> רלוונטי</label>
              </div>
              ${v ? html`
                <div class="prow">
                  <input type="range" class="rng" min="0" max="100" step="5" value=${v.pct} onInput=${e => setTrack(t.k, { ...v, pct: Number(e.target.value) })} aria-label=${t.label + " אחוז ביצוע"} />
                  <b class="pv">${v.pct}%</b>
                </div>
                <div class="grow">
                  <span>יעד לסוף השבוע</span>
                  <select value=${v.goal == null ? "" : v.goal} onChange=${e => setTrack(t.k, { ...v, goal: e.target.value === "" ? null : Number(e.target.value) })}>
                    <option value="">ללא יעד</option>
                    ${goals.map(g => html`<option key=${g} value=${g}>${g}%</option>`)}
                  </select>
                  ${p != null ? html`<span class="prevv">שבוע שעבר: ${p}%</span>` : null}
                </div>` : html`<div class="prevv">לא רלוונטי באתר הזה</div>`}
            </div>`;
        })}

        <div class="card fl">
          <label>כ״א בשטח השבוע (מס׳ עובדים)
            <input type="number" inputMode="numeric" min="0" value=${d.workers} onInput=${e => set({ workers: e.target.value })} placeholder="0" required />
          </label>
          <label>מנהל עבודה
            <input type="text" value=${d.foreman} onInput=${e => set({ foreman: e.target.value })} maxLength=${40} />
          </label>
          <label>ראש צוות (במידה ויש)
            <input type="text" value=${d.lead} onInput=${e => set({ lead: e.target.value })} maxLength=${40} />
          </label>
        </div>

        <div class="card fl">
          <label>הערות / חריגים
            <textarea rows="3" value=${d.note} onInput=${e => set({ note: e.target.value })} maxLength=${300} placeholder="מה עוצר או מעכב? מה צריך מההנהלה?"></textarea>
          </label>
          <label class="tgl" style=${{opacity: hasText(d.note) ? 1 : .5}}><input type="checkbox" disabled=${!hasText(d.note)} checked=${d.issue && hasText(d.note)} onChange=${e => set({ issue: e.target.checked })} /> זה חריג שדורש טיפול (יופיע במרכז הבקרה עד שיסומן "טופל")</label>
          <label>נקודות בטיחות / חריגים בטיחותיים
            <textarea rows="2" value=${d.safety} onInput=${e => set({ safety: e.target.value })} maxLength=${300} placeholder="השאר ריק אם אין"></textarea>
          </label>
        </div>

        <button type="submit" class="btn pri wide" disabled=${!wOk}>${cur ? "עדכן דוח שבועי" : "הגש דוח שבועי"}</button>
        <div class="hint">הדוח נרשם ביומן הפעולות ועולה למרכז הבקרה. נקודת בטיחות מסומנת אדומה ועולה מיד לדרג 2.</div>
      </form>`;
  }

  function Report({ site, unit, photoMap, onBack, onToggle, onAddTask, onRemoveTask, onAddPhoto, onRemovePhoto, notify }){
    const [newTask, setNewTask] = useState("");
    const [busy, setBusy] = useState(false);
    const [view, setView] = useState(null);
    const fileRef = useRef(null);
    const locked = false;
    const cl = unit.checklist;
    const photos = Array.isArray(unit.photos) ? unit.photos : [];
    const nPhotos = photos.length;
    const urlOf = p => p.url || (photoMap || {})[p.id] || "";
    const allDone = cl.length > 0 && cl.every(c=>c.done);

    function submitTask(e){
      e.preventDefault();
      const v = newTask.trim();
      if(!v || locked) return;
      onAddTask(site.id, unit.id, v);
      setNewTask("");
    }

    async function onPick(e){
      const files = Array.from(e.target.files || []);
      e.target.value = "";
      if(!files.length) return;
      setBusy(true);
      let added = 0;
      for(const f of files){
        try{
          const url = await fileToScaledDataURL(f, 1024, 0.6);
          onAddPhoto(site.id, unit.id, url);
          added++;
        }catch(err){
          notify("תמונה אחת לא נקלטה — נסה שוב");
        }
      }
      setBusy(false);
      if(added) notify(added === 1 ? "תמונה נוספה" : added + " תמונות נוספו");
    }

    return html`
      <div class="screen narrow">
        <div class="shead">
          <button class="back" onClick=${onBack} aria-label="חזרה">→</button>
          <div class="rowbet" style=${{flex:1}}>
            <div><h2 style=${{fontSize:"1.15rem"}}>${unit.title}</h2><span class="sub">${site.name} · ${unit.floor}</span></div>
          </div>
        </div>

        <div class="card" style=${{marginTop:14}}>
          <div class="lbl">צ׳קליסט · ${cl.filter(c=>c.done).length}/${cl.length}</div>
          <div class="check">
            ${cl.map((c,i)=> html`
              <div class="citem" key=${i}>
                <button class=${"ctoggle "+(c.done?"on":"")} disabled=${locked} onClick=${()=>onToggle(site.id, unit.id, i)}>
                  <span class="bx">${c.done ? "✓" : ""}</span>${c.t}
                </button>
                ${!locked && html`<button class="xbtn" title="הסר סעיף" onClick=${()=>onRemoveTask(site.id, unit.id, i)}>✕</button>`}
              </div>`)}
            ${cl.length===0 && html`<div style=${{fontFamily:"Heebo,sans-serif", fontSize:".82rem", color:"var(--ink-3)", padding:"6px 2px"}}>אין עדיין סעיפים — הוסף למטה</div>`}
          </div>
          ${!locked && html`
            <form class="addrow" onSubmit=${submitTask}>
              <input type="text" value=${newTask} onInput=${e=>setNewTask(e.target.value)} placeholder="הוסף סעיף לצ׳קליסט…" maxLength=${80} />
              <button type="submit" class="add" disabled=${!newTask.trim()} aria-label="הוסף">＋</button>
            </form>`}
        </div>

        <div class="card">
          <div class="lbl">תיעוד מצולם · ${nPhotos}</div>
          <input ref=${fileRef} type="file" accept="image/*" multiple hidden onChange=${onPick} />
          <button class="camera" disabled=${locked || busy} onClick=${()=>fileRef.current && fileRef.current.click()}>
            ${busy ? "מעבד תמונה…" : "📷 צלם או בחר תמונה"}
          </button>
          <div class="thumbs">
            ${photos.map(p => html`
              <button key=${p.id} class="thumb" onClick=${()=>{ if(urlOf(p)) setView(urlOf(p)); }}>
                ${urlOf(p) ? html`<img src=${urlOf(p)} alt="תמונת דיווח" />` : html`<span class="ph">טוען…</span>`}
                ${!locked && html`<span class="del" role="button" title="מחק" onClick=${(e)=>{ e.stopPropagation(); onRemovePhoto(site.id, unit.id, p.id); }}>✕</span>`}
              </button>`)}
            ${nPhotos===0 && html`<span style=${{fontFamily:"Heebo,sans-serif", fontSize:".78rem", color:"var(--ink-3)"}}>טרם צורפו תמונות</span>`}
          </div>
        </div>

        <button class="btn pri wide" disabled=${nPhotos===0} onClick=${()=>{ notify(allDone ? "הדיווח נשמר · המשימה הושלמה" : "הדיווח נשמר"); onBack(); }}>
          ${nPhotos===0 ? "צרף תמונה כדי לשמור" : allDone ? "שמור וסיים משימה" : "שמור דיווח"}
        </button>

        ${view && html`
          <div class="lightbox" onClick=${()=>setView(null)}>
            <button class="x" aria-label="סגור">✕</button>
            <img src=${view} alt="תמונת דיווח מוגדלת" onClick=${(e)=>e.stopPropagation()} />
          </div>`}
      </div>`;
  }

  /* מלאי באתר — מנהל הפרויקט מזין, ההנהלה רואה בלשונית "מלאי" במרכז הבקרה */
  function QtyCell({ value, onCommit }){
    const [v, setV] = useState(String(value));
    useEffect(()=>{ setV(String(value)); }, [value]);
    const commit = x => { const n = Number(x); if(x !== "" && !isNaN(n) && n >= 0 && n !== value) onCommit(n); else setV(String(value)); };
    return html`
      <div class="qty">
        <button type="button" aria-label="הוסף" onClick=${()=>onCommit(value + 1)}>＋</button>
        <input type="number" inputMode="decimal" min="0" value=${v} onInput=${e=>setV(e.target.value)} onBlur=${e=>commit(e.target.value)}
          onKeyDown=${e=>{ if(e.key === "Enter") e.target.blur(); }} aria-label="כמות במלאי" />
        <button type="button" aria-label="הפחת" onClick=${()=>value > 0 && onCommit(value - 1)}>−</button>
      </div>`;
  }

  function StockForm({ init, onSave, onCancel, onDelete }){
    const [f, setF] = useState(init || { item:"", onSite:"", unit:"יח׳", need:"", blocksTomorrow:false });
    const ok = f.item.trim() && f.onSite !== "" && !isNaN(Number(f.onSite));
    function submit(e){
      e.preventDefault(); if(!ok) return;
      onSave({ item: f.item.trim(), onSite: Number(f.onSite), unit: (f.unit || "יח׳").trim(), need: f.need === "" ? 0 : Number(f.need), blocksTomorrow: !!f.blocksTomorrow });
    }
    return html`
      <form class="newunit" onSubmit=${submit}>
        <input type="text" placeholder="שם הפריט (למשל: צנרת 4״)" value=${f.item} onInput=${e=>setF({...f, item:e.target.value})} maxLength=${50} />
        <div class="two">
          <input type="number" inputMode="decimal" min="0" placeholder="כמות במלאי" value=${f.onSite} onInput=${e=>setF({...f, onSite:e.target.value})} />
          <input type="text" list="units" placeholder="יחידה" value=${f.unit} onInput=${e=>setF({...f, unit:e.target.value})} maxLength=${12} />
        </div>
        <datalist id="units">${["יח׳","מ׳","ק״ג","גליל","קופסה","שק","צרור","מ״ר"].map(u => html`<option key=${u} value=${u}></option>`)}</datalist>
        <input type="number" inputMode="decimal" min="0" placeholder="מינימום נדרש באתר (אופציונלי) — מתחתיו נפתח חריג" value=${f.need} onInput=${e=>setF({...f, need:e.target.value})} />
        <label class="tgl"><input type="checkbox" checked=${!!f.blocksTomorrow} onChange=${e=>setF({...f, blocksTomorrow:e.target.checked})} /> חוסר בפריט הזה עוצר עבודה (חריג אדום)</label>
        <div class="btnrow">
          ${onDelete ? html`<button type="button" class="btn danger" onClick=${onDelete}>מחק פריט</button>` : null}
          <button type="button" class="btn" onClick=${onCancel}>ביטול</button>
          <button type="submit" class="btn pri" disabled=${!ok}>${init ? "שמור" : "הוסף"}</button>
        </div>
      </form>`;
  }

  function StockEditor({ st, now, who, onSave, onDelete, onConfirm }){
    const actives = st.sites.filter(s => s.active);
    const mine = actives.filter(s => s.owner && s.owner.name === who);
    const [all, setAll] = useState(false);
    const list = (all || mine.length === 0) ? actives : mine;
    const [sid, setSid] = useState(null);
    const [adding, setAdding] = useState(false);
    const [editing, setEditing] = useState(null);
    const site = list.find(s => s.id === sid) || list[0];
    if(!site) return html`<div class="empty">אין אתרים פעילים</div>`;
    const info = stockInfo(site, st, now);
    const mats = site.materials || [];

    return html`
      <div>
        ${mine.length > 0 && html`<div class="chips" style=${{margin:"0 0 10px"}}>
          <button class=${"chip "+(!all?"on":"")} onClick=${()=>setAll(false)}>האתרים שלי (${mine.length})</button>
          <button class=${"chip "+(all?"on":"")} onClick=${()=>setAll(true)}>כל האתרים</button>
        </div>`}
        <select class="pick" value=${site.id} onChange=${e=>{ setSid(e.target.value); setAdding(false); setEditing(null); }}>
          ${list.map(s => html`<option key=${s.id} value=${s.id}>${s.name} · ${s.contractor}${s.owner ? " · " + s.owner.name : ""}</option>`)}
        </select>

        <div class="card ci" style=${{marginBottom:12}}>
          <div class="lbl">מלאי באתר · ${site.name}</div>
          <div class=${"val "+(info.fresh ? "" : "crit")} style=${{fontSize:".88rem"}}>
            ${info.last ? (info.fresh ? "✓ עודכן " : "לא עודכן · ") + ageText(now - info.last) + " · " + dmy(info.last) + " " + hhmm(info.last) + (info.by ? " · " + info.by : "") : "טרם עודכן ע״י מנהל הפרויקט — הכמויות למטה הן הדגמה"}
          </div>
          <div class="btnrow" style=${{marginTop:10}}>
            <button class="btn ok" onClick=${()=>onConfirm(site.id)}>✓ המלאי מעודכן להיום</button>
          </div>
        </div>

        <div style=${{display:"flex", flexDirection:"column", gap:9}}>
          ${mats.map(m => editing === m.item
            ? html`<${StockForm} key=${m.item} init=${{ item:m.item, onSite:String(m.onSite), unit:m.unit, need: m.need ? String(m.need) : "", blocksTomorrow:!!m.blocksTomorrow }}
                onSave=${p => { onSave(site.id, m.item, p); setEditing(null); }} onCancel=${()=>setEditing(null)}
                onDelete=${()=>{ onDelete(site.id, m.item); setEditing(null); }} />`
            : html`
              <div key=${m.item} class=${"req stkrow "+(m.onSite < m.need ? "blocked" : "")}>
                <div class="top">
                  <div style=${{minWidth:0}}>
                    <div class="sitenm">${m.item}</div>
                    <div style=${{fontFamily:"Heebo,sans-serif", fontSize:".72rem", color: m.onSite < m.need ? "var(--crit)" : "var(--ink-3)"}}>
                      ${m.onSite < m.need ? "חוסר " + (m.need - m.onSite) + " " + m.unit + " · " : ""}${m.need ? "מינימום " + m.need + " " + m.unit : "ללא מינימום"}${m.at ? "" : " · לא נספר"}
                    </div>
                  </div>
                  <button type="button" class="xbtn" style=${{width:34, height:34}} aria-label="ערוך פריט" onClick=${()=>{ setEditing(m.item); setAdding(false); }}>✎</button>
                </div>
                <div class="rowbet">
                  <${QtyCell} value=${m.onSite} onCommit=${n => onSave(site.id, m.item, { onSite:n })} />
                  <span class="unit">${m.unit}</span>
                </div>
              </div>`)}
          ${mats.length === 0 && !adding && html`<div class="empty" style=${{padding:"22px 0"}}>עדיין לא הוזן מלאי באתר הזה</div>`}
          ${adding
            ? html`<${StockForm} onSave=${p => { onSave(site.id, null, p); setAdding(false); }} onCancel=${()=>setAdding(false)} />`
            : html`<button class="addsection" onClick=${()=>{ setAdding(true); setEditing(null); }}>＋ הוסף פריט למלאי</button>`}
        </div>
        <div class="hint">כל עדכון נרשם ביומן עם שמך. מינימום נדרש: כשהכמות יורדת מתחתיו נפתח חריג במרכז הבקרה. בלי עדכון ${CFG.stockDays} ימים — נפתח חריג "מלאי לא עודכן".</div>
      </div>`;
  }

  function StockHome({ st, now, who, onStockSave, onStockDelete, onStockConfirm }){
    return html`
      <div class="screen narrow">
        <div class="shead"><h2>מלאי באתר</h2><span class="sub">כל מנהל מנהל את המלאי של האתרים שלו · ההנהלה רואה בזמן אמת</span></div>
        <div style=${{marginTop:12}}>
          <${StockEditor} st=${st} now=${now} who=${who} onSave=${onStockSave} onDelete=${onStockDelete} onConfirm=${onStockConfirm} />
        </div>
      </div>`;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
</script>

</body>
</html>
