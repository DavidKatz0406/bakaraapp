<body>
<style>
  :root{
    --paper:#F4F6F8; --surface:#FFFFFF; --surface-2:#EBEEF3; --surface-3:#E1E6EC;
    --ink:#19212B; --ink-2:#54606E; --ink-3:#8792A1;
    --line:#D5DCE4; --line-2:#E5E9EF;
    --accent:#2C60D0; --accent-ink:#204CA6; --accent-wash:#E6EDFB;
    --ok:#2E8555; --warn:#C4820F; --crit:#C93E30;
    --ok-wash:#E2F0E8; --warn-wash:#F6EBD6; --crit-wash:#F8E3E0;
    --shadow:0 1px 2px rgba(20,30,45,.05), 0 10px 28px rgba(20,30,45,.08);
    --shadow-lg:0 8px 20px rgba(20,30,45,.1), 0 28px 60px rgba(20,30,45,.16);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#10141A; --surface:#181D24; --surface-2:#222932; --surface-3:#2C343E;
      --ink:#E7EBF1; --ink-2:#9EAAB8; --ink-3:#6D7987;
      --line:#2B333D; --line-2:#232A33;
      --accent:#6E9CF1; --accent-ink:#AAC5F8; --accent-wash:#1E2A44;
      --ok:#54B37D; --warn:#E0AC53; --crit:#E56C5E;
      --ok-wash:#16281E; --warn-wash:#2B2414; --crit-wash:#2E1B18;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.42);
      --shadow-lg:0 10px 26px rgba(0,0,0,.45), 0 30px 70px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --paper:#10141A; --surface:#181D24; --surface-2:#222932; --surface-3:#2C343E;
    --ink:#E7EBF1; --ink-2:#9EAAB8; --ink-3:#6D7987;
    --line:#2B333D; --line-2:#232A33;
    --accent:#6E9CF1; --accent-ink:#AAC5F8; --accent-wash:#1E2A44;
    --ok:#54B37D; --warn:#E0AC53; --crit:#E56C5E;
    --ok-wash:#16281E; --warn-wash:#2B2414; --crit-wash:#2E1B18;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.42);
    --shadow-lg:0 10px 26px rgba(0,0,0,.45), 0 30px 70px rgba(0,0,0,.55);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    direction:rtl; background:var(--paper); color:var(--ink);
    font-family:"Assistant","Segoe UI",Tahoma,sans-serif; font-size:16px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  button,select{ font-family:inherit; }
  button{ cursor:pointer; }
  h1,h2,h3,h4{ font-family:"Frank Ruhl Libre","Assistant",serif; margin:0; line-height:1.22; }

  .app{ max-width:1180px; margin:0 auto; min-height:100vh; padding-bottom:40px; }

  .topbar{
    position:sticky; top:0; z-index:40; background:var(--paper);
    background:color-mix(in srgb, var(--paper) 90%, transparent);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:14px; padding:12px 20px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:10px; margin-inline-end:auto; }
  .brand .plate{ background:#fff; border:1px solid var(--line); border-radius:9px; padding:5px 7px; display:flex; flex:none; }
  .brand .plate img{ height:26px; width:auto; display:block; }
  .brand .txt{ display:flex; flex-direction:column; line-height:1.15; }
  .brand .txt b{ font-family:"Frank Ruhl Libre",serif; font-weight:900; font-size:1.05rem; letter-spacing:-.01em; }
  .brand .txt span{ font-family:"Heebo",sans-serif; font-size:.68rem; color:var(--ink-3); margin-top:1px; }
  .brandfoot{ text-align:center; font-family:"Heebo",sans-serif; font-size:.72rem; color:var(--ink-3); padding:26px 16px 4px; }
  .brandfoot b{ color:var(--ink-2); font-weight:700; }

  .seg{ display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:11px; padding:3px; gap:2px; }

    9:{ name:"סאמר" },  10:{ name:"באהה" },  11:{ name:"מוראר", co:["מג׳ד"], with:["מג׳ד"] },  12:{ name:"אבו לאבן" },
    13:{ name:"אבו לאבן" },  14:{ name:"יער", co:["ליאור"], with:["ליאור"] },  15:{ name:"וואהל" },  16:{ name:"וואהל" },
    17:{ name:"באהה" },  18:{ name:"סאמר" },  19:{ name:"צביקה" },  20:{ name:"יזיד", with:["מג׳ד"] },  21:{ name:"מוראר", with:["מג׳ד"] },
    23:{ name:"משה" },  24:{ name:"אולג", with:["גנאדי"] },  25:{ name:"אולג", with:["גנאדי"] },  26:{ name:"באהה" },  27:{ name:"וואהל" },
    28:{ name:"אולג", with:["גנאדי"] },  29:{ name:"אולג", with:["גנאדי"] },  30:{ name:"יניב" },  31:{ name:"כרובי", with:["שלומי"] },
    32:{ name:"סאמר" },  33:{ name:"וואהל" },  34:{ name:"וואהל" },  35:{ name:"אלי" }
  };
  // אתרים שנפתחו מחדש (עדכון 11/2026 לפי רשימת העובדים)
  const REOPEN = [4];
  function applyRoster(site){
    if(REOPEN.includes(site.num)) site.active = true;
    if(MERGED["s" + site.num]) site.active = false;
    if(RAWBY[site.num]) site.name = RAWBY[site.num][3];
    if(site.mgrManual) return;   // המנהלים שויכו ידנית במסך "שיוך מנהלים" — הרשימה הקבועה לא דורסת
    const m = MGR[site.num];
    site.owner = m
      ? { name:m.name, role:"מנהל פרויקט" }
      : { name:"לא משויך", role:"דרוש שיוך מנהל" };
    site.senior = (m && m.co) ? m.co.join(", ") : "";
    site.mgrs = (m && m.with) ? m.with.slice() : [];
  }

  // עדכון רשימת הפרויקטים: מוסיף פרויקטים חדשים מ-RAW, מעדכן שמות ומנהלים
  function rosterSync(d){
    RAW.forEach(([contractor, exists, n, name]) => {
      if(!d.sites.some(x => x.num === n)) d.sites.push({ id:"s"+n, num:n, name, contractor, active: exists !== "אין", materials:[], units:[], owner:null });
    });
    d.sites.sort((a, b) => (a.num || 0) - (b.num || 0));
    d.sites.forEach(applyRoster);
    return d;
  }

  /* ניקוי נתוני הדגמה ישנים (שלבי שחור/לחץ/לבן, יחידות עבודה, מלאי שלא נספר) — פעם אחת */
  const CLEAN_V = 1;
  function applyClean(site){
    ["stages","schedule","blackConsultant","surplus"].forEach(k => { delete site[k]; });
    if(site.owner) delete site.owner.status;
    site.units = (site.units || []).filter(u => (u.photos || []).length > 0);
    site.materials = (site.materials || []).filter(m => m.at);
  }

  function seed(){
    const sites = RAW.map(([contractor, exists, n, name])=>{
      return { id:"s"+n, num:n, name, contractor, active: exists !== "אין", materials:[], units:[], owner:null };
    });
    sites.forEach(applyRoster);
    const T = Date.now();
    return {
      sites, rosterV: 5, cleanV: CLEAN_V,
      log: [], nudges: {}, trackStart: T,
      since: {},
      requests: [], transfers: []
    };
  }

  const KEY = "pls_state_v4";
  function load(){
    try{
      const s = localStorage.getItem(KEY);
      if(s){
        const st = JSON.parse(s);
        (st.sites || []).forEach(site => {
          site.checkinLog = site.checkinLog || [];
          (site.units || []).forEach(u => { if(!Array.isArray(u.photos)) u.photos = []; });
        });
        if(st.rosterV !== 5){ st.sites = st.sites || []; rosterSync(st); st.rosterV = 5; }
        if(st.cleanV !== CLEAN_V){ (st.sites || []).forEach(applyClean); st.cleanV = CLEAN_V; }
        st.log = st.log || []; st.nudges = st.nudges || {}; st.since = st.since || {};
        st.trackStart = st.trackStart || Date.now();
        return st;
      }
    }catch(e){}
    return seed();
  }
  function persist(st){
    try{ localStorage.setItem(KEY, JSON.stringify(st)); return true; }
    catch(e){ return false; }
  }

  // Read a picked image file, downscale, return a compressed JPEG data URL.
  function fileToScaledDataURL(file, maxDim, quality){
    return new Promise((resolve, reject)=>{
      if(!file || !/^image\//.test(file.type)) { reject(new Error("not an image")); return; }
      const reader = new FileReader();
      reader.onerror = ()=> reject(new Error("read failed"));
      reader.onload = ()=>{
        const img = new Image();
        img.onerror = ()=> reject(new Error("decode failed"));
        img.onload = ()=>{
          let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
          const scale = Math.min(1, maxDim / Math.max(w, h));
          w = Math.round(w * scale); h = Math.round(h * scale);
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          try{ resolve(canvas.toDataURL("image/jpeg", quality)); }
          catch(err){ reject(err); }
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  /* ───────── בקרה וניטור: נושאי הבקרה = עמודות תוכנית העבודה השבועית ─────────
     ליווי שלד · קומפלטים · השלמות · ספרינקלרים · חניונים · כ"א בשטח · הערות/חריגים · בטיחות
     (+ מלאי באתר שמנהל הפרויקט מזין). כל הספים במקום אחד (CFG). */
  const CFG = {
    checkinBy: 8,          // שעה: מכאן אתר בלי דיווח יומי מסומן (נוכחות ודיווח יומי עד 08:00 — החלטת דוד 11/2026)
    checkinEsc: 10,        // שעה: מכאן החריגה עוברת לדרג בעלים (שעתיים אחרי המועד)
    weeklyBy: 12,          // שעה ביום א׳: עד אז צריך להגיש את הדוח השבועי
    matPct: 27,            // תקציב חומר = 27% מההכנסה הצפויה של החודש (יעד הכמויות של המשרד × מחירי החשבון) — החלטת דוד 11/2026
    stockDays: 3,          // ימים: מלאי שלא עודכן מעבר לזה נחשב לא מעודכן
    workerDrop: 0.6,       // ירידת כ"א: ביחס לשבוע שעבר מתחת ל-60% = חריג
    escL2h: 4,             // שעות פתוחה → דרג 2
    escL3h: 24,            // שעות פתוחה → דרג 3 (בעלים)
    workDays: [0,1,2,3,4]  // א׳–ה׳
  };
  const LEVEL_SHORT = { 1:"דרג 1", 2:"דרג 2", 3:"דרג 3" };
  const LEVEL_TEXT = { 1:"דרג 1 · מנהל אחראי", 2:"דרג 2 · מנהל בכיר", 3:"דרג 3 · בעלים" };
  const HOUR = 3600e3, DAY = 24 * HOUR;

  /* עמודות הטופס "דוח תוכנית עבודה שבועית" */
  const TRACKS = [
    { k:"skeleton",   label:"ליווי שלד", short:"שלד" },
    { k:"complets",   label:"קומפלטים" },
    { k:"finishing",  label:"השלמות" },
    { k:"sprinklers", label:"ספרינקלרים", short:"ספרינק׳" },
    { k:"parking",    label:"חניונים" }
  ];

  /* פיילוט: רק המנהלים האלה נספרים בחריגי "דוח חסר", "מלאי לא עודכן" ו"דיווח יומי חסר".
     כשמצטרפים עוד מנהלים — מוסיפים לכאן, או מרוקנים את הרשימה כדי לכלול את כולם. */
  const PILOT = [];   // הפיילוט (יער, סאמר, יניב) הסתיים ב-17.11.2026 — המערכת פתוחה לכל המנהלים
  const inPilot = name => PILOT.length === 0 || PILOT.includes(name);
  const ownerName = s => (s.owner && s.owner.name) || "—";
  // כל מי שמנהל את האתר: המנהל הראשי + מנהלים נוספים
  const siteMgrs = s => [ownerName(s), ...((s && s.mgrs) || [])];
  const managedBy = (s, n) => siteMgrs(s).includes(n);

  const pad2 = n => String(n).padStart(2, "0");
  function dstr(ts){ const d = new Date(ts); return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
  function hhmm(ts){ const d = new Date(ts); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
  function dmy(ts){ const d = new Date(ts); return pad2(d.getDate()) + "/" + pad2(d.getMonth()+1); }
  function isWorkday(ts){ return CFG.workDays.includes(new Date(ts).getDay()); }
  function ageText(ms){
    const m = Math.max(0, Math.round(ms / 60000));
    if(m < 60) return m + " דק׳";
    const h = Math.round(m / 60);
    if(h < 48) return h + " שע׳";
    return Math.round(h / 24) + " ימים";
  }
  function pushLog(d, who, text, siteId){
    d.log = d.log || [];
    d.log.unshift({ id: "l" + Date.now().toString(36) + Math.random().toString(36).slice(2,6), ts: Date.now(), who, text, siteId: siteId || null });
    if(d.log.length > 400) d.log.length = 400;
  }
  /* ---- צריכת חומר: כל ירידה במלאי נרשמת באתר (site.usage) עם סוג, כמות, מי ולמה ---- */
  const USE_KIND = { use:"שימוש בעבודה", waste:"פחת / נזק", count:"ירידה בספירה" };
  function addUsage(s, e){
    s.usage = s.usage || [];
    const now = Date.now(), last = s.usage[0];
    const r3 = x => Math.round(x * 1000) / 1000;
    // לחיצות חוזרות על − של אותו אדם על אותו פריט — רישום אחד
    if(e.kind === "count" && last && last.kind === "count" && last.item === e.item && last.by === e.by && now - last.at < 15 * 60e3){
      last.q = r3(last.q + e.q); last.at = now;
      if(last.q <= 0) s.usage.shift();
      return;
    }
    if(e.q <= 0) return;
    s.usage.unshift({ id:"u" + now.toString(36) + Math.random().toString(36).slice(2,5), item:e.item, q:r3(e.q), unit:e.unit || "", kind:e.kind, note:e.note || "", at:now, by:e.by || "" });
    if(s.usage.length > 300) s.usage.length = 300;
  }

  /* ---- שבוע עבודה: מתחיל ביום א׳ ---- */
  function weekStart(ts){ const d = new Date(ts); d.setHours(0,0,0,0); d.setDate(d.getDate() - d.getDay()); return d.getTime(); }
  const weekKey = ts => dstr(weekStart(ts));
  const weekLabel = ts => dmy(weekStart(ts)) + "–" + dmy(weekStart(ts) + 4 * DAY);
  const curWeekly = (s, now) => (s.weekly && s.weekly.week === weekKey(now)) ? s.weekly : null;
  const pctOf = (r, k) => { const v = r && r.tracks ? r.tracks[k] : null; return v == null ? null : (typeof v === "object" ? v.pct : v); };
  /* דוחות של שבועות קודמים, מהישן לחדש */
  function weekHistory(s, now){
    const h = (s.weeklyHist || []).slice();
    if(s.weekly && s.weekly.week !== weekKey(now)) h.push(s.weekly);
    return h;
  }
  function compactWeekly(w){
    const tracks = {};
    TRACKS.forEach(t => { tracks[t.k] = pctOf(w, t.k); });
    return { week: w.week, at: w.at || null, tracks, workers: w.workers == null ? null : w.workers, txt: w.txt || null, bq: w.bq || null };
  }

  /* ───────── חשבון ביצוע חודשי ─────────
     המשרד מעלה את החשבון של האתר (אקסל) פעם בחודש. כל סעיף משויך למסלול בדוח השבועי, והמנהל מדווח
     כל שבוע מלל חופשי + כמה בוצע בכל סעיף פתוח. בסוף החודש יוצאת טיוטת חשבון עם "כמות נוכחית".
     החשבון (כולל מחירים ויעד הכמויות של החודש) שמור ב-bills/{אתר}: רק המשרד, הצופה והמנהל של האתר קוראים. */
  // r2 (עיגול ל-2 ספרות) מוגדר למטה, בדוחות של חברות כ״א
  const monthKey = ts => { const d = new Date(ts); return d.getFullYear() + "-" + pad2(d.getMonth() + 1); };
  const mLabel = mk => { const [y, m] = mk.split("-"); return ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"][+m - 1] + " " + y; };
  const unitTxt = u => ({ "ק":"קומות", "יח":"יח׳", "קמפ":"קומפ׳", "מ\"א":"מ״א", "מ'":"מ׳" })[String(u || "").trim()] || String(u || "").trim();
  const nisR = x => "₪" + Math.round(+x || 0).toLocaleString("he-IL");
  const fmtQ = x => String(r2(x));
  const BILL_OTHER = { k:"", label:"סעיפים נוספים בחשבון" };
  // שיוך סעיף למסלול לפי שם הסעיף והפרק. "" = סעיף כללי (טופס 4, מסירה, פיתוח, עבודות נוספות)
  function billTrack(d, ch){
    const s = String(d || ""), c = String(ch || "");
    if(/פיתוח|נוספות/.test(c) || /טופס\s*4|מסיר|^הפעלה|ביקורת/.test(s.trim())) return "";
    if(/ביציק|ליווי\s*שלד|שרוול/.test(s)) return "skeleton";
    if(/מתז|ספרינקלר/.test(s)) return "sprinklers";
    if(/חניו[נן]|מרת[פף]/.test(c + " " + s) || /בורות\s*שאיבה|מפרידי?\s*שומן/.test(s)) return "parking";
    if(/אמבטי|ניאגר|אסל|כיור|ברז|גלגלונ|סניטר|משאבות\s*בגג/.test(s)) return "finishing";
    if(/קולטנ|דלוחין|צנרת\s*מים|הידרנט|ביוב|ניקוז|גז\b/.test(s)) return "complets";
    return "";
  }
  // שורות של גיליון חשבון → { title, items:[{ c, d, u, q, p, base, t, ch }] }
  // מבנים נתמכים (לפי שורת הכותרת):
  //  • טבלת סעיפים: מספר סעיף / מס' / מס"ד / סעיף · תאור · יח' · כמות (או כמות חוזית) · מחיר (או עלות) · מצטבר.
  //    כותרות שממשיכות בשורה שמתחת (קבוצה/סעיף, כמות קודמת/נוכחית/מצטברת) נקראות גם הן.
  //    כמה כותרות באותו גיליון = כמה מבנים (השם מהשורה שמעל הכותרת) — מספר הסעיף מקבל את שם המבנה.
  //  • אחוזים לפי קומה (קומה · סעיף · סה"כ ₪ לסעיף) ואבני דרך (% אבן דרך · שלבי ביצוע · חשבון מצטבר):
  //    כל שורה = סעיף באחוזים — כמות 100, מחיר = סכום השורה / 100, מצטבר = האחוז שבוצע.
  function billParse(rows){
    rows = rows.map(r => Array.from(r || [], x => String(x == null ? "" : x).trim()));
    const num = v => { const n = parseFloat(String(v || "").replace(/,/g, "")); return isFinite(n) ? n : 0; };
    const has = (r, re) => r.some(c => re.test(c));
    const RQ = /^כמות(\s*חוזית)?$/, RD = /^(תאור|תיאור)/, RU = /^(יחידת|יחידה|יח['׳"]?$)/, RP = /^(מחיר|עלות)/;
    const RFL = /^קומה$/, RSEC = /^סעיף$/, RMS = /אבן\s*דרך/;
    const kind = r => has(r, RFL) && has(r, RSEC) ? "F" : has(r, RMS) ? "M"
      : has(r, RQ) && (has(r, RD) || (has(r, RU) && has(r, RP))) ? "S" : "";
    const heads = [];
    rows.forEach((r, i) => { const k = kind(r); if(k) heads.push({ i, k }); });
    if(!heads.length) return { err:"לא נמצאה בגיליון שורת כותרת (תאור + כמות, קומה + סעיף, או אבני דרך)." };
    let title = "";
    rows.slice(0, heads[0].i).forEach(r => r.forEach(c => { if(!title && /חשבון/.test(c)) title = c.replace(/\s+/g, " "); }));
    const LBLROW = r => r.some(c => /^כמות\s+\S/.test(c) || /^(קבוצה|סעיף)$/.test(c));
    // cur = "כמות נוכחית" של כל סעיף (בגיליון "תוכנית עבודה" זו הכמות המתוכננת לחודש)
    const items = [], seen = {}, cur = {};
    const add = ({ cu, ...it }) => {
      let c = it.c; if(seen[c]) c = c + "#" + (++seen[c]); else seen[c] = 1;
      items.push({ ...it, c, base: r2(it.base) });
      if(cu > 0) cur[c] = r2(cu);
    };
    heads.forEach((h, hn) => {
      const end = hn + 1 < heads.length ? heads[hn + 1].i : rows.length;
      // תוויות לכל עמודה: שורת הכותרת + עד 3 שורות תוויות שמתחתיה
      const L = [rows[h.i]];
      for(let j = h.i + 1; j < Math.min(end, h.i + 4); j++) if(LBLROW(rows[j])) L.push(rows[j]);
      const f = re => { const w = Math.max(...L.map(r => r.length)); for(let j = 0; j < w; j++) if(L.some(r => re.test(r[j] || ""))) return j; return -1; };
      const fx = (...res) => { for(const re of res){ const j = f(re); if(j >= 0) return j; } return -1; };
      // שם המבנה כשיש כמה כותרות בגיליון: התא הראשון בשורה שמעל הכותרת
      const prevRow = rows[h.i - 1] || [], block = heads.length > 1 ? (prevRow.find(c => c && !/^-?[\d.]+$/.test(c)) || "") : "";
      const pre = block ? block + "/" : "";
      let ch = "", sub = "", grp = "";
      if(h.k === "S"){
        let cC = f(/מס.{0,3}\s*סעיף|^מס["״'׳]?ד?$|^מס['׳]$|^סעיף$/);
        const cG = f(/^קבוצה$/), cU = f(RU), cQ = f(RQ), cP = f(RP);
        let cD = f(RD); if(cD < 0 && cU > 0) cD = cU - 1;
        // בלי כותרת למספר הסעיף: העמודה (לפני התאור) שיש בה מספרים כמו 1.07.01.0010
        for(let j = 0; cC < 0 && j < cD; j++) if(rows.slice(h.i + 1, end).filter(r => /^\d+(\.\d+){2,}$/.test(r[j] || "")).length >= 3) cC = j;
        const cCum = fx(/^כמות\s*מצטבר/, /^(ביצוע\s*)?מצטבר/), cPrev = fx(/^כמות\s*(קודמת|עד)/, /קודמת/), cCur = fx(/^כמות\s*(נוכחית|.*להזנה)/, /נוכחית/);
        const cumIsQty = cCum >= 0 && L.some(r => /כמות/.test(r[cCum] || ""));
        if(cD < 0 || cQ < 0) return;
        for(let j = h.i + 1; j < end; j++){
          const r = rows[j];
          if(cG >= 0 && r[cG]) grp = r[cG];
          let d = (r[cD] || "").replace(/\s+/g, " ").trim();
          const u = cU >= 0 ? (r[cU] || "").trim() : "", code = cC >= 0 ? (r[cC] || "").trim() : "";
          if(!d && !code) continue;
          if(u === "פרק"){ if(d) ch = d; continue; }
          if(/^סה"?״?כ/.test(d)) continue;
          const q = num(r[cQ]);
          if(!(q > 0)){ if(d && !u && !code) sub = d; continue; }
          if(!d) continue;
          // מיקום/סוג שבין מספר הסעיף לתאור (למשל "כיבוי אש ראשי") — נוסף לתאור
          const mid = cC >= 0 && cD > cC + 1 ? r.slice(cC + 1, cD).filter(x => x && !/^(רגיל|פרק|תת-פרק)$/.test(x) && !/^-?[\d.]+$/.test(x)).join(" ") : "";
          const p = cP >= 0 ? num(r[cP]) : 0;
          let base = cCum >= 0 && r[cCum] !== "" && r[cCum] != null ? num(r[cCum]) : num(cPrev >= 0 ? r[cPrev] : 0) + num(cCur >= 0 ? r[cCur] : 0);
          if(!cumIsQty && p > 0 && base > q * 1.001) base = base / p;   // עמודת "ביצוע מצטבר" בשקלים
          const dd = (block ? block + " · " : "") + (sub ? sub + " · " : "") + d + (mid ? " (" + mid + ")" : "");
          add({ cu: cCur >= 0 ? num(r[cCur]) : 0, c: code ? pre + (grp ? grp + "/" : "") + code : "+" + dd.slice(0, 40), d: dd, u, q, p, base, t: billTrack(d, ch) || (/חניו[נן]|מרת[פף]/.test(sub + " " + block) ? "parking" : ""), ch: ch || block });
        }
      }
      else if(h.k === "F"){
        const cFl = f(RFL), cD = f(RSEC), cV = f(/לסעיף/), cCum = f(/^כמות\s*מצטבר/), cCur = f(/^כמות\s*נוכחית/);
        if(cD < 0 || cV < 0) return;
        let cC = -1;
        for(let j = 0; j < Math.min(cFl, cD) && cC < 0; j++) if(rows.slice(h.i + 1, end).some(r => /^\d+(\.\d+){2,}$/.test(r[j] || ""))) cC = j;
        let floor = "";
        for(let j = h.i + 1; j < end; j++){
          const r = rows[j];
          if(cFl >= 0 && r[cFl]) floor = r[cFl];
          const d = (r[cD] || "").replace(/\s+/g, " ").trim(), v = num(r[cV]);
          if(!d || /^סה"?״?כ/.test(d)) continue;
          if(!(v > 0)){ ch = d; continue; }
          const dd = (floor ? floor + " · " : "") + d, cum = num(r[cCum]), cu = cCur >= 0 ? num(r[cCur]) : 0;
          add({ cu: cu > 1.0001 ? cu : cu * 100, c: cC >= 0 && r[cC] ? pre + r[cC] : "+" + (floor + " " + d).slice(0, 40), d: dd, u:"%", q:100, p: r2(v / 100), base: Math.min(100, cum > 1.0001 ? cum : cum * 100), t: billTrack(d, ch) || (/חניו[נן]|מרת[פף]/.test(floor + " " + ch) ? "parking" : ""), ch });
        }
      }
      else {
        const cD = f(RD), cS = f(/שלבי/), cCum = f(/^חשבון\s*מצ[טת]בר/);
        if(cD < 0 || cCum < 1) return;
        let ms = "";
        for(let j = h.i + 1; j < end; j++){
          const r = rows[j];
          if(r[cD]) ms = r[cD].replace(/\s+/g, " ").trim();
          if(!ms || /^סה"?״?כ/.test(ms)) continue;
          const v = num(r[cCum - 1]); if(!(v > 0)) continue;
          const st = cS >= 0 ? (r[cS] || "").trim() : "", d = (block ? block + " · " : "") + ms + (st ? " · " + st : ""), cum = num(r[cCum]);
          add({ c: "+" + d.slice(0, 40), d, u:"%", q:100, p: r2(v / 100), base: Math.min(100, cum > 1.0001 ? cum : cum * 100), t: billTrack(ms, ""), ch: block });
        }
      }
    });
    return items.length ? { title, items, cur } : { err:"לא נמצאו סעיפים עם כמות מתחת לשורת הכותרת." };
  }
  // איזה גיליון בקובץ הוא החשבון: האחרון ששמו "חשבון…" או שם של חודש (ולא "תוכנית…"), אחרת הראשון שנקרא
  const MONTHS_RE = /ינואר|פברואר|מרץ|אפריל|מאי|יוני|יולי|אוגוסט|ספטמבר|אוקטובר|נובמבר|דצמבר/;
  function billPickSheet(sheets){
    let i = -1;
    sheets.forEach((s, j) => { if(!/תוכנית/.test(s.name) && (/חשבון/.test(s.name) || MONTHS_RE.test(s.name)) && !billParse(s.rows).err) i = j; });
    if(i < 0) i = sheets.findIndex(s => !/תוכנית/.test(s.name) && !billParse(s.rows).err);
    if(i < 0) i = Math.max(0, sheets.findIndex(s => !billParse(s.rows).err));
    return i;
  }
  // כל הדוחות השבועיים של האתר (היסטוריה + האחרון), אחד לכל שבוע
  function billWeeks(site){
    const m = {};
    (site.weeklyHist || []).forEach(w => { if(w && w.week) m[w.week] = w; });
    if(site.weekly && site.weekly.week) m[site.weekly.week] = site.weekly;
    return Object.values(m).sort((a, b) => a.week < b.week ? -1 : 1);
  }
  // סיכום כמויות: מצטבר (בסיס החשבון + דוחות שהוגשו אחרי שהחשבון נטען), לפני החודש, ובחודש עצמו
  function billSums(bill, site, mk, skipWeek){
    const done = {}, before = {}, month = {}, notes = [];
    (bill.items || []).forEach(i => { done[i.c] = i.base || 0; before[i.c] = i.base || 0; month[i.c] = 0; });
    billWeeks(site).forEach(w => {
      if(!(w.at > (bill.at || 0)) || w.week === skipWeek) return;
      const wm = w.week.slice(0, 7);
      Object.entries(w.bq || {}).forEach(([c, q]) => {
        if(!(c in done)) return;
        q = +q || 0;
        done[c] = r2(done[c] + q);
        if(mk && wm < mk) before[c] = r2(before[c] + q);
        if(mk && wm === mk) month[c] = r2(month[c] + q);
      });
      if(mk && wm === mk && w.txt) Object.entries(w.txt).forEach(([k, t]) => { if(hasText(t)) notes.push({ week: w.week, k, t }); });
    });
    return { done, before, month, notes };
  }
  // כסף לחודש: הכנסה צפויה (יעד המשרד), תקציב חומר, וביצוע לפי הדוחות השבועיים
  function billMoney(bill, site, mk){
    const plan = (bill.plan || {})[mk] || {}, s = billSums(bill, site, mk);
    let target = 0, actual = 0;
    (bill.items || []).forEach(i => { target += (+plan[i.c] || 0) * (i.p || 0); actual += (s.month[i.c] || 0) * (i.p || 0); });
    return { target, budget: target * CFG.matPct / 100, actual, hasPlan: Object.keys(plan).length > 0 };
  }
  // גישה לחשבון: ענן (bills/{אתר}) או אחסון מקומי במצב בדיקה
  const billLocal = {
    get(){ try{ return JSON.parse(localStorage.getItem("bakara_bills") || "{}"); }catch(e){ return {}; } },
    set(o){ try{ localStorage.setItem("bakara_bills", JSON.stringify(o)); }catch(e){} }
  };
  function useBill(siteId){
    const [b, setB] = useState(undefined);   // undefined = טוען · null = אין חשבון
    useEffect(()=>{
      if(!siteId) return;
      setB(undefined);
      if(!Cloud.on){
        const h = ()=> setB(billLocal.get()[siteId] || null);
        h(); window.addEventListener("bakara-bills", h);
        return ()=> window.removeEventListener("bakara-bills", h);
      }
      return Cloud.base.collection("bills").doc(docKey(siteId)).onSnapshot(d => setB(d.exists ? d.data() : null), ()=> setB(null));
    }, [siteId]);
    return b;
  }
  function billWrite(siteId, patch, planMonth){
    if(!Cloud.on){
      const all = billLocal.get(), o = { ...(all[siteId] || {}), ...patch };
      if(planMonth) o.plan = { ...(o.plan || {}), [planMonth]: patch.plan[planMonth] };
      all[siteId] = o; billLocal.set(all); window.dispatchEvent(new Event("bakara-bills"));
      return Promise.resolve();
    }
    const ref = Cloud.base.collection("bills").doc(docKey(siteId));
    // יעד של חודש מחליף את כל הסעיפים של אותו חודש (merge רגיל היה משאיר סעיפים שנמחקו)
    if(planMonth) return ref.set({ site: siteId }, { merge:true }).then(()=> ref.update({ ["plan." + planMonth]: patch.plan[planMonth], planAt: patch.planAt, planBy: patch.planBy }));
    return ref.set({ ...patch, site: siteId }, { merge:true });
  }
  const trackOpen = w => TRACKS.some(t => { const v = w.tracks && w.tracks[t.k]; return v && v.pct < 100; });
  const hasText = v => !!(v && String(v).trim());

  /* מצב מסלול אחד באתר: האם עומד, האם יש פער ליעד השבועי */
  function trackState(s, k, now){
    const cur = curWeekly(s, now);
    const v = cur && cur.tracks ? cur.tracks[k] : null;
    if(!v) return null;
    const hist = weekHistory(s, now);
    const prev = hist.length ? pctOf(hist[hist.length - 1], k) : null;
    let streak = 1;
    for(let i = hist.length - 1; i >= 0 && pctOf(hist[i], k) === v.pct; i--) streak++;
    const d = new Date(now), late = d.getDay() > 4 || (d.getDay() === 4 && d.getHours() >= 12);
    return {
      pct: v.pct, goal: v.goal == null ? null : v.goal, prev,
      delta: prev == null ? null : v.pct - prev,
      stalled: v.pct < 100 && prev != null && v.pct <= prev,
      streak: prev != null && v.pct === prev ? streak : 1,
      gap: (v.goal != null && v.pct < v.goal && late) ? v.goal - v.pct : 0
    };
  }

  /* מלאי: מתי עודכן לאחרונה (לא פחות מתחילת המעקב) */
  const stockRef = (s, floor) => Math.max(s.stockAt || 0, ...(s.materials || []).map(m => m.at || 0), floor || 0);
  const stockLast = s => Math.max(s.stockAt || 0, ...(s.materials || []).map(m => m.at || 0));

  /* חריגים מחושבים מהמצב עצמו (לא נשמרים), ו"מאז מתי" נשמר ב-st.since */
  function deriveExceptions(st, now, rk){
    const out = [];
    const today = dstr(now), hour = new Date(now).getHours(), wk = weekKey(now);
    const since = st.since || {};
    const add = (e)=>{
      e.sinceTs = e.fixedTs || since[e.key] || now;
      e.ageMs = Math.max(0, now - e.sinceTs);
      const ageH = e.ageMs / HOUR;
      e.level = e.kind === "checkin"
        ? (hour >= CFG.checkinEsc ? 3 : 1)
        : (ageH >= CFG.escL3h ? 3 : ageH >= CFG.escL2h ? 2 : 1);
      if(e.minLevel) e.level = Math.max(e.level, e.minLevel);
      out.push(e);
    };
    const ownerOf = s => (s.owner && s.owner.name) || "—";

    st.sites.forEach(s=>{
      if(!s.active) return;
      const ow = ownerOf(s);
      const role = (s.owner && s.owner.role) || "";
      const base = { siteId: s.id, siteName: s.name, owner: ow, ownerRole: role, senior: s.senior || "" };
      if(ow === "לא משויך"){
        add({ ...base, key: s.id + ":noowner", kind: "noowner", sev: "crit",
          title: "אתר פעיל בלי מנהל משויך", detail: "אין אחראי על הדוח השבועי, החומרים והבקרה באתר",
          waitingOn: "הנהלה — לשייך מנהל פרויקט" });
      }
      const w = s.weekly, cur = curWeekly(s, now);

      /* עמודות: ליווי שלד / קומפלטים / השלמות / ספרינקלרים / חניונים */
      TRACKS.forEach(t=>{
        const ts = trackState(s, t.k, now);
        if(!ts || ts.pct >= 100 || !(ts.stalled || ts.gap)) return;
        const parts = [];
        if(ts.stalled) parts.push(ts.streak >= 2 ? "ללא שינוי " + ts.streak + " דוחות רצופים" : "כמו בשבוע שעבר (" + ts.prev + "%)");
        if(ts.gap) parts.push("פער של " + ts.gap + " נק׳ מיעד השבוע (" + ts.goal + "%)");
        add({ ...base, key: s.id + ":track:" + t.k, kind: "track", sub: ts.stalled ? "stalled" : "gap",
          sev: (ts.streak >= 3 || ts.gap >= 30) ? "crit" : "warn",
          title: t.label + (ts.stalled ? " לא התקדם" : " מתחת ליעד") + " — " + ts.pct + "%",
          detail: parts.join(" · "),
          waitingOn: "מנהל הפרויקט — הסבר ותוכנית החזרה", fixedTs: cur.at });
      });

      /* כ"א בשטח */
      if(cur && cur.workers != null){
        const hist = weekHistory(s, now), pw = hist.length ? hist[hist.length - 1].workers : null;
        if(cur.workers === 0 && trackOpen(cur)){
          add({ ...base, key: s.id + ":workers", kind: "workers", sev: "crit",
            title: "אין כוח אדם בשטח", detail: "יש מסלולים פתוחים בדוח השבועי, וכ״א מדווח 0",
            waitingOn: "מנהל הפרויקט — איוש הצוות", fixedTs: cur.at });
        } else if(pw != null && pw >= 5 && cur.workers <= pw * CFG.workerDrop){
          add({ ...base, key: s.id + ":workers", kind: "workers", sev: "warn",
            title: "ירידה בכוח אדם: " + pw + " ← " + cur.workers, detail: "ירידה חדה ביחס לדוח הקודם",
            waitingOn: "מנהל הפרויקט — הסבר ותוספת כ״א", fixedTs: cur.at });
        }
      }

      /* הערות / חריגים מהדוח השבועי */
      if(w && w.issue && hasText(w.note) && !w.issueResolvedAt){
        add({ ...base, key: s.id + ":wissue", kind: "wissue", sev: "warn",
          title: "חריג בדוח השבועי: " + w.note.trim(),
          detail: "דווח ע״י " + (w.by || "—") + " ב-" + dmy(w.at) + " " + hhmm(w.at),
          waitingOn: "מנהל אחראי — טיפול וסימון 'טופל'", fixedTs: w.at });
      }
      /* בטיחות — עולה מיד לדרג 2 */
      if(w && hasText(w.safety) && !w.safetyResolvedAt){
        add({ ...base, key: s.id + ":safety", kind: "safety", sev: "crit", minLevel: 2,
          title: "בטיחות: " + w.safety.trim(),
          detail: "דווח ע״י " + (w.by || "—") + " ב-" + dmy(w.at) + " " + hhmm(w.at),
          waitingOn: "מנהל הפרויקט — טיפול ותיעוד", fixedTs: w.at });
      }

      /* מלאי באתר מול המינימום שהמנהל הגדיר */
      (s.materials || []).forEach(m=>{
        if(!(m.onSite < m.need)) return;
        const lack = m.need - m.onSite;
        const donor = st.sites.filter(o => o.active && o.id !== s.id)
          .map(o => ({ o, d: (o.materials || []).find(x => x.at && x.item.trim() === m.item.trim() && x.need > 0 && x.onSite - x.need > 0) }))
          .filter(x => x.d).sort((a, b) => (b.d.onSite - b.d.need) - (a.d.onSite - a.d.need))[0];
        const oo = rkOnOrder(rk, s.id, m.item), covered = oo.q >= lack;
        add({ ...base, key: s.id + ":material:" + m.item, kind: "material",
          sev: m.blocksTomorrow && !covered ? "crit" : "warn",
          title: "חוסר " + lack + " " + m.unit + " " + m.item + (oo.q ? " · 🚚 הוזמן " + oo.q : ""),
          detail: "במלאי " + m.onSite + " מתוך מינימום " + m.need + (m.blocksTomorrow ? " · יעכב את העבודה" : "") +
            (oo.q ? " · בדרך " + oo.q + " " + m.unit + (oo.sup.length ? " מ" + oo.sup.join(", ") : "") + (covered ? " — מכסה את החוסר" : " — עדיין חסר " + (lack - oo.q)) : "") +
            (donor ? " · אפשר לנייד מ" + donor.o.name + " (" + ((donor.o.owner && donor.o.owner.name) || "—") + "): עודף " + (donor.d.onSite - donor.d.need) + " " + donor.d.unit : ""),
          waitingOn: covered ? "קבלת ההזמנה מהספק (ולסמן קבלה ברכש)" : "מנהל הפרויקט — השלמת החומר (ניוד מאתר אחר או הזמנה ברכש)" });
      });

      if(s.checkin && s.checkin.status === "issue" && !s.checkin.resolvedAt){
        add({ ...base, key: s.id + ":reported", kind: "reported", sev: "warn",
          title: "חריגה מהשטח: " + s.checkin.note,
          detail: "דווח ע״י " + s.checkin.by + " ב-" + dmy(s.checkin.at) + " " + hhmm(s.checkin.at),
          waitingOn: "מנהל אחראי — טיפול וסימון 'טופל'", fixedTs: s.checkin.at });
      }
    });

    /* חריגים מקובצים לפי מנהל (כדי לא להציף) */
    const grouped = (pick, mk)=>{
      const g = {};
      st.sites.forEach(s=>{ if(s.active && inPilot(ownerName(s)) && pick(s)) (g[ownerName(s)] = g[ownerName(s)] || []).push(s); });
      Object.keys(g).forEach(name => mk(name, g[name]));
    };
    const names = arr => arr.slice(0, 4).map(x => x.name).join(" · ") + (arr.length > 4 ? " · ועוד " + (arr.length - 4) : "");
    const roleOf = arr => (arr[0].owner && arr[0].owner.role) || "";

    if(isWorkday(now) && hour >= CFG.checkinBy){
      const deadline = new Date(now); deadline.setHours(CFG.checkinBy, 0, 0, 0);
      grouped(s => !(s.checkin && s.checkin.date === today), (name, arr)=>
        add({ key: "mgr:" + name + ":checkin:" + today, kind: "checkin",
          sev: hour >= CFG.checkinEsc ? "crit" : "warn",
          siteId: arr[0].id, siteIds: arr.map(x => x.id), siteName: null, owner: name, ownerRole: roleOf(arr),
          title: arr.length + (arr.length === 1 ? " אתר בלי דיווח יומי" : " אתרים בלי דיווח יומי"),
          detail: names(arr), waitingOn: "דיווח יומי מהשטח", fixedTs: deadline.getTime() }));
    }

    /* דוח שבועי חסר: מיום א׳ 12:00 ועד ההגשה */
    const weeklyDue = new Date(weekStart(now)); weeklyDue.setHours(CFG.weeklyBy, 0, 0, 0);
    if(isWorkday(now) && now >= weeklyDue.getTime()){
      grouped(s => !curWeekly(s, now), (name, arr)=>
        add({ key: "mgr:" + name + ":weekly:" + wk, kind: "weekly", sev: "warn",
          siteId: arr[0].id, siteIds: arr.map(x => x.id), siteName: null, owner: name, ownerRole: roleOf(arr),
          title: arr.length + (arr.length === 1 ? " אתר בלי דוח שבועי" : " אתרים בלי דוח שבועי"),
          detail: names(arr), waitingOn: "דוח תוכנית עבודה שבועית — שטח ← הגש דוח שבועי", fixedTs: weeklyDue.getTime() }));
    }

    /* מלאי שלא עודכן */
    if(isWorkday(now)){
      grouped(s => now - stockRef(s, st.trackStart) >= CFG.stockDays * DAY, (name, arr)=>
        add({ key: "mgr:" + name + ":stock", kind: "stock", sev: "warn",
          siteId: arr[0].id, siteIds: arr.map(x => x.id), siteName: null, owner: name, ownerRole: roleOf(arr),
          title: arr.length + (arr.length === 1 ? " אתר בלי עדכון מלאי" : " אתרים בלי עדכון מלאי"),
          detail: names(arr) + " · מעל " + CFG.stockDays + " ימים", waitingOn: "עדכון מלאי בלשונית מלאי",
          fixedTs: Math.min(...arr.map(x => stockRef(x, st.trackStart) + CFG.stockDays * DAY)) }));
    }

    const sevRank = { crit: 0, warn: 1 };
    out.sort((a, b) => b.level - a.level || sevRank[a.sev] - sevRank[b.sev] || b.ageMs - a.ageMs);
    return out;
  }

  const exOfSite = (exceptions, id) => exceptions.filter(e => e.siteIds ? e.siteIds.includes(id) : e.siteId === id);

  /* סטטוס אתר לפי החריגים שלו */
  function siteStatus(s, exs, now){
    if(!s.active) return "inactive";
    const mine = exOfSite(exs, s.id);
    if(mine.some(e => e.sev === "crit")) return "crit";
    if(mine.length) return "warn";
    return curWeekly(s, now) ? "ok" : "nodata";
  }
  const STATUS_TEXT = { ok:"בקצב", warn:"דורש מעקב", crit:"בסיכון", inactive:"לא פעיל", nodata:"אין דוח השבוע" };

  function scorecards(st, exceptions, now){
    const hour = new Date(now).getHours();
    const startDs = dstr(st.trackStart || now);
    const days = [];
    for(let i = 0; i < 7; i++){
      const ts = now - i * DAY;
      if(!isWorkday(ts)) continue;
      const ds = dstr(ts);
      if(ds < startDs) continue;
      if(i === 0 && hour < CFG.checkinBy) continue;
      days.push(ds);
    }
    const names = [...new Set(st.sites.filter(s => s.active).map(s => (s.owner && s.owner.name) || "—"))];
    const rank = { crit: 0, warn: 1, ok: 2 };
    return names.map(name=>{
      const sites = st.sites.filter(s => s.active && ((s.owner && s.owner.name) || "—") === name);
      const ex = exceptions.filter(e => e.owner === name);
      const reps = sites.map(s => curWeekly(s, now)).filter(Boolean);

     staffmeta/owner  { phone } — הבעלים; נוצר פעם אחת, בכניסה הראשונה למערכת
     משרד רואה ומשנה הכול; מנהל פרויקט רואה ומשנה רק את האתרים שבהם הוא המנהל ואת העובדים שלהם.
     האכיפה האמיתית בחוקי Firestore (firestore.rules) — האפליקציה רק מתאימה את התצוגה. */
  let fbReady = false;
  function fbInit(){
    if(typeof firebase === "undefined") return null;
    if(!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    if(!fbReady){ fbReady = true; try{ firebase.firestore().enablePersistence({ synchronizeTabs:true }).catch(()=>{}); }catch(e){} }
    return firebase;
  }
  function normPhone(v){
    let d = String(v || "").replace(/[^\d+]/g, "");
    if(d.startsWith("+")) return /^\+\d{9,15}$/.test(d) ? d : null;
    if(d.startsWith("972")) d = "+" + d;
    else if(d.startsWith("0")) d = "+972" + d.slice(1);
    else return null;
    return /^\+972\d{8,9}$/.test(d) ? d : null;
  }
  const fmtPhone = p => p && p.startsWith("+972") ? ("0" + p.slice(4)).replace(/^(\d{3})(\d+)$/, "$1-$2") : (p || "");
  function authErr(e){
    const c = String((e && e.code) || "");
    if(location.protocol === "file:") return "זה עותק של הבקרה ששמור במחשב — הוא לא יכול להתחבר. פתח בדפדפן את הכתובת davidkatz0406.github.io/bakaraapp ושמור אותה במועדפים.";
    if(c.includes("invalid-phone")) return "מספר הטלפון לא תקין";
    if(c.includes("invalid-verification-code")) return "הקוד שגוי — בדוק את ה-SMS ונסה שוב";
    if(c.includes("code-expired")) return "תוקף הקוד פג — בקש קוד חדש";
    if(c.includes("too-many-requests") || c.includes("quota")) return "יותר מדי ניסיונות — נסה שוב מאוחר יותר";
    if(c.includes("error-code:-39")) return "Google חסמה זמנית את שליחת ה-SMS למספר הזה (כנראה בגלל כמה ניסיונות ברצף). אל תלחץ שוב עכשיו — נסה בעוד כמה שעות, פעם אחת בלבד, מדפדפן Chrome.";
    if(c.includes("operation-not-allowed") || c.includes("billing")) return "שליחת SMS לא אושרה ב-Firebase — פנה לדוד (" + c + ": " + String((e && e.message) || "").replace(/^Firebase:\s*/, "").slice(0, 120) + ")";
    if(c.includes("unauthorized-domain") || c.includes("captcha") || c.includes("app-not-authorized")) return "בעיית אימות של האתר (" + c + ") — פנה לדוד";
    if(c.includes("network")) return "אין חיבור לרשת";
    return "הכניסה נכשלה: " + (c || (e && e.message) || e);
  }

  function readTeamCode(){
    try{
      const m = /[#&?]k=([A-Za-z0-9]{16,64})/.exec(location.hash || "");
      if(m){
        localStorage.setItem(TEAM_KEY, m[1]);
        sessionStorage.removeItem("bakara_local");
        history.replaceState(null, "", location.pathname + location.search);
      }
      if(sessionStorage.getItem("bakara_local") === "1") return null;
      return localStorage.getItem(TEAM_KEY) || null;
    }catch(e){ return null; }
  }
  function emptyState(){
    return { sites:[], requests:[], transfers:[], nudges:{}, since:{}, log:[], trackStart:Date.now(), rosterV:ROSTER_V };
  }
  const docKey = k => String(k).replace(/\//g, "|");
  const cleanDoc = x => JSON.parse(JSON.stringify(x));
  function stripSite(site){
    const s = cleanDoc(site);
    (s.units || []).forEach(u => { u.photos = (u.photos || []).map(p => ({ id:p.id, ts:p.ts || 0, by:p.by || "" })); });
    return s;
  }

  function cloudStart(code, h){
    if(!fbInit()){ h.status("error", { code:"sdk-missing" }); return ()=>{}; }
    const db = firebase.firestore();
    Cloud.db = db; Cloud.base = db.collection("t").doc(code); Cloud.on = true;
    const unsubs = [];
    let stopped = false;
    // המשתמש כבר מחובר בטלפון (נבדק באפליקציה לפני שמגיעים לכאן)
    Promise.resolve().then(()=>{
      if(stopped) return;
      const col = n => Cloud.base.collection(n);
      const err = e => h.status("error", e);
      ["sites","requests","transfers","nudges","since"].forEach(n =>
        unsubs.push(col(n).onSnapshot(s => h.data(n, s.docs.map(d => d.data()), s.metadata.fromCache), err)));
      unsubs.push(col("log").orderBy("ts", "desc").limit(150)
        .onSnapshot(s => h.data("log", s.docs.map(d => d.data()), s.metadata.fromCache), err));
      unsubs.push(col("meta").doc("app").onSnapshot(d => h.meta(d.exists ? d.data() : null), err));
      h.status("connecting");
    }).catch(e => h.status("error", e));
    return ()=>{ stopped = true; unsubs.forEach(u => { try{ u(); }catch(e){} }); };
  }

  function cloudWrite(prev, next){
    if(!Cloud.on) return;
    const col = n => Cloud.base.collection(n);
    const batch = Cloud.db.batch();
    let ops = 0;
    const set = (n, id, data) => { batch.set(col(n).doc(docKey(id)), data); ops++; };
    // מסמך קיים: כותבים רק את השדות שהשתנו במכשיר הזה (mergeFields), כך שמכשיר עם עותק ישן לא מוחק שדות
    // שהוא בכלל לא מכיר או לא נגע בהם (דוחות שבועיים, מלאי, תמונות). שדה שנמחק במכוון — נמחק.
    const patch = (n, id, before, after) => {
      const keys = [], data = {};
      Object.keys(after).forEach(k => { if(JSON.stringify(before[k]) !== JSON.stringify(after[k])){ keys.push(k); data[k] = after[k]; } });
      Object.keys(before).forEach(k => { if(!(k in after)){ keys.push(k); data[k] = firebase.firestore.FieldValue.delete(); } });
      if(keys.length){ batch.set(col(n).doc(docKey(id)), data, { mergeFields: keys }); ops++; }
    };
    const del = (n, id) => { batch.delete(col(n).doc(docKey(id))); ops++; };

    // מנהל פרויקט כותב רק לאתרים שלו (החוקים במסד חוסמים כל דבר אחר — ואז כל הצרור נכשל)
    const mine = (n, x) => !Cloud.mgr || n !== "sites" || (x && managedBy(x, Cloud.mgr));
    [["sites", stripSite], ["requests", cleanDoc], ["transfers", cleanDoc]].forEach(([n, fix])=>{
      const before = new Map((prev[n] || []).map(x => [x.id, JSON.stringify(x)]));
      const prevObj = new Map((prev[n] || []).map(x => [x.id, x]));
      const ids = new Set();
      (next[n] || []).forEach(x => { ids.add(x.id); if(before.get(x.id) !== JSON.stringify(x) && mine(n, x)){
        const p0 = prevObj.get(x.id);
        if(p0) patch(n, x.id, fix(p0), fix(x)); else set(n, x.id, fix(x));
      } });
      before.forEach((_, id) => { if(!ids.has(id) && !(Cloud.mgr && n === "sites")) del(n, id); });
    });
    const pn = prev.nudges || {}, nn = next.nudges || {};
    Object.keys(nn).forEach(k => { if(JSON.stringify(pn[k]) !== JSON.stringify(nn[k])) set("nudges", k, { k, at:nn[k].at, by:nn[k].by }); });
    Object.keys(pn).forEach(k => { if(!(k in nn)) del("nudges", k); });
    const ps = prev.since || {}, ns = next.since || {};
    Object.keys(ns).forEach(k => { if(ps[k] !== ns[k]) set("since", k, { k, ts:ns[k] }); });
    Object.keys(ps).forEach(k => { if(!(k in ns)) del("since", k); });
    const seen = new Set((prev.log || []).map(l => l.id));
    (next.log || []).forEach(l => { if(l.id && !seen.has(l.id)) set("log", l.id, cleanDoc(l)); });
    // השדה הישן rosterV נשאר כמו שהוא: גרסאות ישנות של האפליקציה מגיבות לכל שינוי בו ודורסות את רשימת המנהלים.
    // הגרסה החדשה של הרשימה נשמרת בשדה נפרד (roster2) שגרסאות ישנות לא מכירות.
    if(!Cloud.mgr && (prev.trackStart !== next.trackStart || (prev.roster2 || 0) !== (next.roster2 || 0) || prev.cleanV !== next.cleanV)){
      batch.set(col("meta").doc("app"), { trackStart:next.trackStart, roster2:next.roster2 || 0, cleanV:next.cleanV || 0 }, { merge:true }); ops++;
    }
    if(ops) batch.commit().catch(e => console.warn("cloud write failed", e));
  }
  function cloudPhotos(siteId, cb){
    if(!Cloud.on) return ()=>{};
    return Cloud.base.collection("photos").where("siteId", "==", siteId)
      .onSnapshot(s => cb(s.docs.map(d => d.data())), ()=>{});
  }
  const cloudPhotoPut = p => Cloud.on && Cloud.base.collection("photos").doc(p.id).set(p).catch(e => console.warn("photo write failed", e));
  const cloudPhotoDel = id => Cloud.on && Cloud.base.collection("photos").doc(id).delete().catch(()=>{});

  /* ═════════════ נוכחות עובדים — סלפי בכניסה וביציאה ═════════════
     מרחב נפרד במסד: t/{קוד נוכחות}/...  (הקוד נשמר אצל המנהלים ב-meta/att)
     העובד מקבל קישור אישי (#a=קוד נוכחות&w=מזהה עובד) — הוא לא מקבל את קוד הצוות של הבקרה.
     הסלפי עצמו יוצר את הרישום: שעת שרת + GPS + מזהה מכשיר, כך שאין "תמונה בצד ודוח בצד".
       workers/{id}  שם, אתר קבוע, פעיל, מכשיר שנקשר
       sites/{id}    שם, מנהל, מיקום ורדיוס (נקבע ע״י מנהל)
       punch/{id}    רישום: עובד, אתר, כניסה/יציאה, שעת שרת ושעת מכשיר, GPS, מכשיר, אופליין
       pph/{id}      התמונה של הרישום (מסמך נפרד כדי שהדוחות לא יורידו תמונות)
       fix/{id}      תיקון/אישור של מנהל — לא דורס את הרישום המקורי, נשמר כהיסטוריה */
  const ATT_R = 300;              // רדיוס אתר ברירת מחדל (מטר)
  const ATT_SKEW = 5 * 60000;     // פער שעון טלפון/שרת שנחשב חשוד
  const ATT_LONG = 13;            // משמרת ארוכה מזה (שעות) = חריג
  const ATT_NOOUT_H = 20;         // מהשעה הזו כניסה בלי יציאה של היום = חריג
  const ATT_QUICK = 15 * 60000;   // יציאה מהר כל כך אחרי כניסה = כנראה לחיצה בטעות (סימון למנהל)
  const ATT_EARLY = 30 * 60000;   // יציאה לפני זה אחרי הכניסה = העובד מתבקש לאשר
  const FV = () => firebase.firestore.FieldValue.serverTimestamp();
  const tsMs = x => x && typeof x.toMillis === "function" ? x.toMillis() : (typeof x === "number" ? x : null);
  function rid(n){
    const c = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789", a = new Uint8Array(n);
    crypto.getRandomValues(a);
    return Array.from(a, x => c[x % c.length]).join("");
  }
  function geoDist(a, b){
    const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
    const h = Math.sin(dLat/2) ** 2 + Math.cos(a.lat*r) * Math.cos(b.lat*r) * Math.sin(dLng/2) ** 2;
    return 2 * 6371000 * Math.asin(Math.sqrt(h));
  }
  const fmtDist = d => d < 1000 ? Math.round(d) + " מ׳" : (d / 1000).toFixed(1) + " ק״מ";
  const hm = ms => ms == null ? "—" : hhmm(ms);
  const hrs = ms => (Math.round((ms || 0) / 36e5 * 100) / 100);
  const WDAY = ["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","ש׳"];
  const dayDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDay = (s, n) => { const d = dayDate(s); d.setDate(d.getDate() + n); return dstr(d.getTime()); };
  const dayLabel = s => { const d = dayDate(s); return "יום " + WDAY[d.getDay()] + " " + pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1) + "/" + d.getFullYear(); };
  const atTime = (day, hhmmStr) => { if(!hhmmStr) return null; const [h, m] = hhmmStr.split(":").map(Number); const d = dayDate(day); d.setHours(h, m, 0, 0); return d.getTime(); };
  const workerLink = (code, w) => location.origin + location.pathname + "#a=" + code + "&w=" + w.id;

  function readWorker(){
    try{
      const h = location.hash || "";
      if(/[#&?]k=/.test(h)){ localStorage.removeItem("att_worker"); return null; }
      const a = /[#&?]a=([A-Za-z0-9]{16,64})/.exec(h), w = /[#&?]w=([A-Za-z0-9]{6,40})/.exec(h);
      if(a && w){ const v = { a:a[1], w:w[1] }; localStorage.setItem("att_worker", JSON.stringify(v)); return v; }
      const s = JSON.parse(localStorage.getItem("att_worker") || "null");
      return s && s.a && s.w ? s : null;
    }catch(e){ return null; }
  }
  function deviceId(){
    try{ let d = localStorage.getItem("att_dev"); if(!d){ d = rid(12); localStorage.setItem("att_dev", d); } return d; }
    catch(e){ return "nostore"; }
  }

  /* השעה שנספרת לשכר: שעת השרת. אם הרישום נעשה בלי רשת ונשלח מאוחר — שעת הטלפון, עם סימון לבדיקה */
  function punchTime(p){
    const ts = tsMs(p.ts);
    if(ts == null) return { t:p.dts, src:"dev" };
    if(p.off && ts - p.dts > ATT_SKEW) return { t:p.dts, src:"late" };
    return { t:ts, src:"srv" };
  }
  function punchFlags(p, site, worker){
    const f = [], ts = tsMs(p.ts);
    if(p.lat == null) f.push({ k:"nogps", t:"בלי מיקום", sev:"warn" });
    else if(site && site.lat != null){
      const d = geoDist(p, site);
      if(d - Math.min(p.acc || 0, 500) > (site.r || ATT_R)) f.push({ k:"far", t:"רחוק מהאתר " + fmtDist(d), sev:"crit" });
    }
    if(ts != null && !p.off && Math.abs(ts - p.dts) > ATT_SKEW) f.push({ k:"skew", t:"שעון הטלפון לא תואם (" + Math.round((p.dts - ts) / 60000) + " דק׳)", sev:"crit" });
    if(ts != null && p.off && ts - p.dts > ATT_SKEW) f.push({ k:"late", t:"נרשם בלי רשת · הגיע " + hhmm(ts), sev:"warn" });
    if(worker && worker.dev && p.dev && p.dev !== worker.dev) f.push({ k:"dev", t:"מטלפון אחר", sev:"warn" });
    if(p.cam === "file") f.push({ k:"file", t:"צילום לא חי", sev:"warn" });
    return f;
  }

  /* מרכיב שורת עובד-יום מכל הרישומים + התיקון האחרון של המנהל */
  function dayRows(punches, fixes, workers, sitesById, nowMs){
    const today = dstr(nowMs), lateHour = new Date(nowMs).getHours() >= ATT_NOOUT_H;
    const groups = new Map(), fixBy = new Map(), wById = new Map(workers.map(w => [w.id, w]));
    punches.forEach(p => { const k = p.w + "|" + p.day; if(!groups.has(k)) groups.set(k, []); groups.get(k).push(p); });
    fixes.slice().sort((a, b) => (tsMs(a.at) || 0) - (tsMs(b.at) || 0)).forEach(f => { fixBy.set(f.w + "|" + f.day, f); if(!groups.has(f.w + "|" + f.day)) groups.set(f.w + "|" + f.day, []); });
    const rows = [];
    groups.forEach((list, key) => {
      const [wid, day] = key.split("|"), w = wById.get(wid);
      const ps = list.map(p => ({ ...p, _t:punchTime(p), _f:punchFlags(p, sitesById[p.site], w) })).sort((a, b) => a._t.t - b._t.t);
      const spans = [], flags = [];
      let open = null;
      ps.forEach(p => {
        if(p.type === "in"){ if(!open) open = p; }
        else if(open){ spans.push([open._t.t, p._t.t]); open = null; }
        else if(spans.length) spans[spans.length - 1][1] = p._t.t;
        else flags.push({ k:"noin", t:"יציאה בלי כניסה", sev:"crit" });
      });
      const firstIn = ps.find(p => p.type === "in"), lastOut = [...ps].reverse().find(p => p.type === "out");
      let inT = firstIn ? firstIn._t.t : null;
      let outT = open || !lastOut ? null : lastOut._t.t;
      let ms = spans.reduce((s, [a, b]) => s + (b - a), 0);
      if(open){
        if(day < today || (day === today && lateHour)) flags.push({ k:"noout", t:"אין יציאה", sev:"crit" });
        else if(day === today) flags.push({ k:"inside", t:"בעבודה עכשיו", sev:"ok" });
      }
      // יציאה דקות ספורות אחרי כניסה = כנראה לחיצה בטעות. אם העובד לא נכנס שוב — שעת היציאה האמיתית חסרה
      let quick = null;
      for(let i = 0; i + 1 < ps.length && !quick; i++) if(ps[i].type === "in" && ps[i + 1].type === "out" && ps[i + 1]._t.t - ps[i]._t.t < ATT_QUICK){
        const reentered = ps.slice(i + 2).some(p => p.type === "in"), gap = Math.max(0, Math.round((ps[i + 1]._t.t - ps[i]._t.t) / 60000));
        quick = { outT: ps[i + 1]._t.t, gap, reentered };
        flags.push({ k:"quick", t:"יציאה בטעות? " + hhmm(quick.outT) + " · " + (gap < 1 ? "פחות מדקה" : gap + " דק׳") + " אחרי הכניסה" + (reentered ? "" : " · לא נכנס שוב"),
          sev: !reentered && (day < today || lateHour) ? "crit" : "warn" });
      }
      const seen = new Set();
      ps.forEach(p => p._f.forEach(f => { if(!seen.has(f.k)){ seen.add(f.k); flags.push(f); } }));
      const fx = fixBy.get(key) || null;
      if(fx){
        if(fx.absent){ inT = null; outT = null; ms = 0; }
        else{
          if(fx.inT != null) inT = fx.inT;
          if(fx.outT != null) outT = fx.outT;
          if(fx.inT != null || fx.outT != null) ms = inT != null && outT != null ? Math.max(0, outT - inT) : ms;
        }
      }
      if(ms > ATT_LONG * 36e5) flags.push({ k:"long", t:"משמרת של " + hrs(ms) + " שעות", sev:"warn" });
      if(!ps.length) flags.push({ k:"manual", t:"נוסף ידנית ע״י מנהל", sev:"warn" });
      const stillOpen = fx ? (open && outT == null && !fx.absent && (day < today || lateHour)) : false;
      const openFlags = fx ? (stillOpen ? [{ k:"noout", t:"אין יציאה", sev:"crit" }] : []) : flags.filter(f => f.sev !== "ok");
      const site = (ps.length ? ps[ps.length - 1].site : "") || (w && w.site) || "";
      rows.push({ key, w:wid, day, name: w ? w.name : (ps[0] && ps[0].name) || "?", site,
        sites:[...new Set(ps.map(p => p.site))], inT, outT, ms, flags, openFlags, ps, fix:fx, quick,
        inside: !!open && day === today && !(fx && (fx.absent || fx.outT != null)) });
    });
    return rows.sort((a, b) => a.name.localeCompare(b.name, "he") || a.day.localeCompare(b.day));
  }

  /* ───── קובץ אקסל אמיתי (xlsx) בלי ספריות: zip בלי דחיסה + XML ───── */
  function zipStore(files){
    const enc = new TextEncoder();
    const T = zipStore.t || (zipStore.t = (()=>{ const t = new Uint32Array(256); for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })());
    const crc = d => { let c = 0xFFFFFFFF; for(let i = 0; i < d.length; i++) c = T[(c ^ d[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
    const parts = [], cen = [];
    let off = 0;
    files.forEach(f => {
      const nm = enc.encode(f.name), d = enc.encode(f.data), c = crc(d);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
      h.setUint16(12, 0x21, true); h.setUint32(14, c, true); h.setUint32(18, d.length, true); h.setUint32(22, d.length, true); h.setUint16(26, nm.length, true);

    const lo = 2, lw = Math.ceil(sc.wMm * lo), lh = Math.ceil(sc.hMm * lo), hist = new Map();
    for(let ty = 0; ty < lh; ty += T) for(let tx = 0; tx < lw; tx += T){
      const w = Math.min(T, lw - tx), h = Math.min(T, lh - ty);
      cv.width = w; cv.height = h; ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
      await page.render({ canvasContext:ctx, viewport:page.getViewport({ scale:lo * PT_MM, offsetX:-tx, offsetY:-ty }), background:"rgba(255,255,255,1)" }).promise;
      const px = ctx.getImageData(0, 0, w, h).data;
      for(let p = 0; p < px.length; p += 4) if(chroma(px[p], px[p + 1], px[p + 2])){ const k = (px[p] << 16) | (px[p + 1] << 8) | px[p + 2]; hist.set(k, (hist.get(k) || 0) + 1); }
    }
    const dom = [];
    for(const [k, n] of [...hist.entries()].sort((a, b) => b[1] - a[1])){
      if(n < 30 || dom.length >= 24) break;
      const c = [k >> 16 & 255, k >> 8 & 255, k & 255];
      // אותו צבע בגוון כהה/בהיר יותר (למשל מילוי כחול עם מסגרת כחול כהה) — צבע אחד
      if(dom.some(d => blendRes(c, d) <= 22 || blendRes(d, c) <= 22 || Math.abs(c[0] - d[0]) + Math.abs(c[1] - d[1]) + Math.abs(c[2] - d[2]) < 30)) continue;
      dom.push(c);
    }
    const cache = new Map();
    const clusterOf = (r, g, b) => {
      const k = (r << 16) | (g << 8) | b; let v = cache.get(k);
      if(v === undefined){ let bi = -1, br = 26; dom.forEach((d, i) => { const e = blendRes([r, g, b], d); if(e < br){ br = e; bi = i; } }); v = bi; cache.set(k, v); }
      return v;
    };
    const stats = dom.map(d => ({ d, n:0, hist:new Uint32Array(64), cells:new Map() })), cellCol = new Map();
    const gstats = new Map();
    const GBANDS = [[Math.round(pxMm * 0.4), Math.round(pxMm * 0.65)], [Math.round(pxMm * 0.65) + 1, Math.round(pxMm * 1.0)], [Math.round(pxMm * 1.0) + 1, Math.round(pxMm * 1.4)], [Math.round(pxMm * 1.4) + 1, Math.min(63, Math.round(pxMm * 2.2))]];
    const tiles = [];
    for(let ty = 0; ty < H; ty += T) for(let tx = 0; tx < W; tx += T) tiles.push([tx, ty]);
    const ov = document.createElement("canvas"); ov.width = view.gw; ov.height = view.gh;
    const octx = ov.getContext("2d"); octx.fillStyle = "#fff"; octx.fillRect(0, 0, ov.width, ov.height);
    let done = 0;
    for(const [tx, ty] of tiles){
      const w = Math.min(T, W - tx), h = Math.min(T, H - ty);
      cv.width = w; cv.height = h;
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
      await page.render({ canvasContext:ctx, viewport:page.getViewport({ scale:pxMm * PT_MM, offsetX:-tx, offsetY:-ty }), background:"rgba(255,255,255,1)" }).promise;
      octx.drawImage(cv, 0, 0, w, h, tx / CELL, ty / CELL, w / CELL, h / CELL);
      const px = ctx.getImageData(0, 0, w, h).data;
      // מפתח לכל פיקסל: מספר צבע בסיס (חיובי) / דרגת אפור (שלילי) / 0 = רקע
      const key = new Int32Array(w * h);
      for(let i = 0, p = 0; i < key.length; i++, p += 4){
        const r = px[p], g = px[p + 1], b = px[p + 2], mx = Math.max(r, g, b), mn = Math.min(r, g, b);
        // צבעוני (גם כהה — שולי קו כהים) או שוליים בהירים של קו צבעוני → צבע הבסיס הקרוב
        if(mx - mn >= 40 || (mx - mn >= 20 && mx >= 150 && mx < 235)){ const c = clusterOf(r, g, b); if(c >= 0){ key[i] = c + 1; continue; } }
        if(mx - mn < 40 || mx < 90) key[i] = mx >= 200 ? 0 : -(mx < 70 ? 1 : mx < 140 ? 2 : 3);
        else key[i] = 0;
      }
      const hr = new Uint16Array(w * h);
      for(let y = 0; y < h; y++){
        let x = 0;
        while(x < w){
          const kk = key[y * w + x];
          let e = x + 1; while(e < w && key[y * w + e] === kk) e++;
          if(kk !== 0) for(let j = x; j < e; j++) hr[y * w + j] = e - x;
          x = e;
        }
      }
      for(let x = 0; x < w; x++){
        let y = 0;
        while(y < h){
          const kk = key[y * w + x];
          let e = y + 1; while(e < h && key[e * w + x] === kk) e++;
          const vr = e - y;
          if(kk > 0){
            const st = stats[kk - 1];
            // כל פיקסל תורם 1/(עובי הקו במקום שלו) — סכום זה אורך הקו בפיקסלים, גם כשהעובי משתנה
            for(let j = y; j < e; j++){
              const m = Math.min(vr, hr[j * w + x]);
              st.hist[m > 63 ? 63 : m]++; st.n++;
              if(m < 2) continue;   // שוליים של פיקסל אחד
              const ci = Math.floor((ty + j) / CELL) * gw + Math.floor((tx + x) / CELL);
              st.cells.set(ci, (st.cells.get(ci) || 0) + 1 / m);
              // הצבע האמיתי בכל משבצת (לזיהוי הדוגמית במקרא)
              const pi = (j * w + x) * 4; let cc = cellCol.get(ci); if(!cc){ cc = [0, 0, 0, 0]; cellCol.set(ci, cc); }
              cc[0] += px[pi]; cc[1] += px[pi + 1]; cc[2] += px[pi + 2]; cc[3]++;
            }
          } else if(kk < 0){
            for(let j = y; j < e; j++){
              const m = Math.min(vr, hr[j * w + x]);
              const band = GBANDS.findIndex(b => m >= b[0] && m <= b[1]);
              if(band < 0) continue;
              const gk = "g" + (-kk) + "_" + band;
              let st = gstats.get(gk);
              if(!st){ st = { level:-kk, band, n:0, hist:new Uint32Array(64), cells:new Map() }; gstats.set(gk, st); }
              st.hist[m]++; st.n++;
              const ci = Math.floor((ty + j) / CELL) * gw + Math.floor((tx + x) / CELL);
              st.cells.set(ci, (st.cells.get(ci) || 0) + 1);
            }
          }
          y = e;
        }
      }
      done++; onProgress && onProgress(done, tiles.length);
      await new Promise(r => setTimeout(r, 0));
    }
    const cellMm = CELL / pxMm, toM = scale / 1000;
    // רכיבים מחוברים במפת המשבצות (מגשר על רווח של משבצת אחת)
    function compsOf(cells){
      const seen = new Set(), out = [];
      for(const c0 of cells.keys()){
        if(seen.has(c0)) continue;
        const comp = [c0]; seen.add(c0);
        for(let q = 0; q < comp.length; q++){
          const c = comp[q], cx = c % gw, cy = (c - cx) / gw;
          for(let dy = -2; dy <= 2; dy++) for(let dx = -2; dx <= 2; dx++){
            const nx = cx + dx, ny = cy + dy, nc = ny * gw + nx;
            if(nx < 0 || nx >= gw || ny < 0 || seen.has(nc) || !cells.has(nc)) continue;
            seen.add(nc); comp.push(nc);
          }
        }
        out.push(comp);
      }
      return out;
    }
    const lines = textLines(sc.texts), labels = planLabels(sc.texts).filter(l => l.dia).map(l => ({ t:l, lb:l }));
    // מסגרות הכיתוב (אופקי/אנכי), עם שוליים קטנים
    const tbox = sc.texts.filter(t => t.w > 0 && t.h > 0).map(t => { const hz = Math.abs(t.dx) > 0.7, a = (hz ? t.w : t.h) / 2 + 0.6, b = (hz ? t.h : t.w) / 2 + 0.6; return [t.x - a, t.x + a, t.y - b, t.y + b]; });
    const bbOf = comp => {
      let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9, px = 0;
      comp.forEach(c => { const cx = c % gw, cy = (c - cx) / gw; px += st0.cells.get(c) || 0; if(cx < x0) x0 = cx; if(cx > x1) x1 = cx; if(cy < y0) y0 = cy; if(cy > y1) y1 = cy; });
      return { x0, x1, y0, y1, px, b:{ x0:x0 * cellMm, x1:(x1 + 1) * cellMm, y0:y0 * cellMm, y1:(y1 + 1) * cellMm } };
    };
    let st0 = null;
    // 1. דוגמיות מקרא — בכל הצבעים, גם בצבע שמופיע רק במקרא (בתוכנית הסרוקה הגוון של הקו לפעמים כהה מהדוגמית)
    const cand0 = [];
    stats.forEach((st, si) => {
      if(st.n < 30) return;
      st0 = st;
      compsOf(st.cells).forEach(comp => { const q = bbOf(comp), nm = legendName(q.b, lines); if(!nm) return;
        const a = [0, 0, 0, 0]; comp.forEach(c => { const cc = cellCol.get(c); if(cc) for(let k = 0; k < 4; k++) a[k] += cc[k]; });
        cand0.push({ ...q.b, cy:(q.b.y0 + q.b.y1) / 2, nm, comp, si, d: a[3] ? [a[0] / a[3], a[1] / a[3], a[2] / a[3]] : st.d }); });
    });
    const allCand = legendStack(cand0);
    allCand.forEach(c => c.comp.forEach(ci => stats[c.si].cells.delete(ci)));
    // 2. הצבעים עצמם: בלי כתמים ממולאים (לוגו), נקודות (אותיות) וכיתוב צבעוני
    const pre = [];
    stats.forEach((st, si) => {
      if(st.n < 400) return;
      let acc = 0, th = 1;
      for(let t = 1; t < 64; t++){ acc += st.hist[t]; if(acc >= st.n / 2){ th = t; break; } }
      if(th < 2) return;
      st0 = st;
      compsOf(st.cells).forEach(comp => {
        const { x0, x1, y0, y1, px, b } = bbOf(comp);
        const span = (b.x1 - b.x0) + (b.y1 - b.y0), est = px / pxMm;
        // כיתוב צבעוני (שם פרויקט, לוגו) — רוב הרכיב בתוך מסגרות של כיתוב
        const inTxt = comp.filter(c => { const x = (c % gw + 0.5) * cellMm, y = (Math.floor(c / gw) + 0.5) * cellMm; return tbox.some(t => x >= t[0] && x <= t[1] && y >= t[2] && y <= t[3]); }).length;
        // לוגו / סמל ממולא: רכיב רחב בשני הכיוונים שרובו "מלא" — צינור הוא קו דק
        const bw = x1 - x0 + 1, bh = y1 - y0 + 1, dense = Math.min(bw, bh) >= 6 && comp.length > bw * bh * 0.35;
        if(span < 3 || (est > 4 * span && span < 60) || dense || inTxt > comp.length * 0.5) comp.forEach(c => st.cells.delete(c));
      });
      pre.push({ st, si, th });
    });
    const items = [];
    pre.forEach(p => {
      const st = p.st, myLeg = allCand.filter(c => c.si === p.si);
      let n = 0; st.cells.forEach(v => n += v);
      const lenM = n / pxMm * toM;
      if(lenM < 1) return;
      // קוטר מהכיתוב: הכיתוב נצמד למשבצת הקרובה של הצבע, ומשם מתפשט לאורך הקו (הקרוב ביותר זוכה)
      const lab = new Map(), q = [], R = Math.ceil(6 / cellMm);
      labels.forEach(({ t, lb }) => {
        const cx = Math.floor(t.x / cellMm), cy = Math.floor(t.y / cellMm);
        let best = -1, bd = 1e9;
        for(let dy = -R; dy <= R; dy++) for(let dx = -R; dx <= R; dx++){ const c = (cy + dy) * gw + cx + dx; if(st.cells.has(c)){ const d = dx * dx + dy * dy; if(d < bd){ bd = d; best = c; } } }
        if(best >= 0 && !lab.has(best)){ lab.set(best, lb.dia); q.push(best); }
      });
      for(let h = 0; h < q.length; h++){
        const c = q[h], cx = c % gw, cy = (c - cx) / gw, d = lab.get(c);
        for(let dy = -2; dy <= 2; dy++) for(let dx = -2; dx <= 2; dx++){ const nc = (cy + dy) * gw + cx + dx; if(st.cells.has(nc) && !lab.has(nc)){ lab.set(nc, d); q.push(nc); } }
      }
      const pm = new Map();
      st.cells.forEach((v, c) => { const d = lab.get(c) || ""; pm.set(d, (pm.get(d) || 0) + v); });
      const parts = [...pm.entries()].map(([dia, v]) => ({ dia, lenM:Math.round(v / pxMm * toM * 10) / 10, slope:"" })).filter(x => x.lenM >= 0.1).sort((a, b) => diaMm(b.dia) - diaMm(a.dia));
      const partsT = tidyParts(parts), color = hexOf(...st.d);
      items.push({ id:color, color, layer:"", gray:false, hint:"", legend:myLeg.length ? myLeg[0].nm : "", lenM:Math.round(lenM * 10) / 10, parts:partsT, fits:[], cells:new Set(st.cells.keys()), thickMm:Math.round(p.th / pxMm * scale) });
    });
    // שם מהמקרא: כל צבע מקבל את הדוגמית הקרובה אליו בצבע האמיתי שלה (כל דוגמית פעם אחת, הזוגות הקרובים קודם)
    const cdist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]), pairs = [];
    items.forEach(i => { i.legend = ""; const c = rgbOf(i.color); allCand.forEach(l => { const d = cdist(c, l.d) - (l.si === stats.indexOf(stats.find(st => hexOf(...st.d) === i.color)) ? 25 : 0); if(d < 150) pairs.push([d, i, l]); }); });
    const usedI = new Set(), usedL = new Set();
    pairs.sort((a, b) => a[0] - b[0]).forEach(([d, i, l]) => { if(usedI.has(i) || usedL.has(l.nm)) return; i.legend = l.nm; usedI.add(i); usedL.add(l.nm); });
    items.sort((a, b) => b.lenM - a.lenM);
    // שחור/אפור — כל טווח עובי בשורה נפרדת (כבויה כברירת מחדל: רובם קווי אדריכלות)
    const GHEX = { 1:"#000000", 2:"#6e6e6e", 3:"#b0b0b0" }, GNAME = { 1:"שחור", 2:"אפור כהה", 3:"אפור" };
    const grays = [];
    for(const st of gstats.values()){
      let pn = 0, cuts = 0;
      for(let t = 0; t < 64; t++) if(st.hist[t]){ pn += st.hist[t]; cuts += st.hist[t] / t; }
      const keep = new Set(); let keptPx = 0;
      compsOf(st.cells).forEach(comp => {
        let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
        comp.forEach(c => { const cx = c % gw, cy = (c - cx) / gw; if(cx < x0) x0 = cx; if(cx > x1) x1 = cx; if(cy < y0) y0 = cy; if(cy > y1) y1 = cy; });
        if(Math.max(x1 - x0, y1 - y0) * cellMm * toM >= 3) comp.forEach(c => { keep.add(c); keptPx += st.cells.get(c); });
      });
      if(!keep.size) continue;
      const tmm = (pn / cuts) / pxMm;
      cuts *= keptPx / st.n;
      const lenM = Math.round(cuts / pxMm * toM * 10) / 10;
      if(lenM < 3) continue;
      grays.push({ id:GHEX[st.level] + "@" + st.band, color:GHEX[st.level], gray:GNAME[st.level] + " · קו בעובי " + tmm.toFixed(1) + " מ״מ", layer:"", hint:"", legend:"",
        lenM, parts:[{ dia:"", lenM, slope:"" }], fits:[], cells:keep });
    }
    grays.sort((a, b) => a.color.localeCompare(b.color) || a.lenM - b.lenM);
    return { items:items.concat(grays), overview:ov, legendN:allCand.length };
  }

  // ── סמלים: צורות סגורות קטנות (עיגולי ירידה/עלייה, ספרינקלרים, קולטנים, ארונות) ──
  function planSymbols(sc, scale, view){
    const toM = scale / 1000, groups = new Map();
    const shortTag = s => s.length <= 5 && /^[A-Za-zא-ת0-9.\-\/']+$/.test(s) && !parseLabel(s).dia;
    for(const f of sc.shapes){
      const size = f.size * toM;
      const [r, g, b] = rgbOf(f.color), gray = Math.max(r, g, b) - Math.min(r, g, b) < 40;
      if(gray && Math.max(r, g, b) >= 200) continue;          // אפור בהיר = רקע אדריכלי
      if(size < 0.04 || size > 1.2) continue;
      if(!f.curve && (gray || f.n > 12)) continue;            // מצולע: רק צבעוני ופשוט
      const sz = Math.round(size * 20) / 20, kind = f.curve ? "o" : "s";
      const id = "sym:" + f.color + "@" + sz + kind + (f.layer ? "|" + f.layer : "");
      let gr = groups.get(id);
      if(!gr){ gr = { id, color:f.color, curve:f.curve, size:sz, gray, layer:f.layer, pts:[], tag:0 }; groups.set(id, gr); }
      if(gr.pts.some(p => Math.hypot(p[0] - f.x, p[1] - f.y) * toM < 0.05)) continue;   // אותו סמל במילוי + קו
      gr.pts.push([f.x, f.y]);
      // כיתוב קצר בתוך העיגול = בועת ציר / תגית
      if(sc.texts.some(t => Math.hypot(t.x - f.x, t.y - f.y) < f.size * 0.45 && t.h < f.size && shortTag(t.s))) gr.tag++;
    }
    const cmm = view.cell / view.pxMm, out = [];
    for(const g of groups.values()){
      const cells = new Set(g.pts.map(([x, y]) => Math.floor(y / cmm) * view.gw + Math.floor(x / cmm)));
      out.push({ id:g.id, color:g.color, curve:g.curve, size:g.size, gray:g.gray, layer:g.layer, hint:layerHint(g.layer), count:g.pts.length, pts:g.pts, tagged:g.tag >= g.pts.length / 2, cells });
    }
    out.sort((a, b) => (a.tagged - b.tagged) || (a.gray - b.gray) || b.count - a.count);
    return out;
  }

  // ── ניתוח עמוד אחד ──
  async function analyzePage(plan, pageNo, onProgress){
    const sc = await planScan(plan, pageNo);
    const scale = sc.scale || 100, pxMm = PLAN_PX, cell = PLAN_CELL;
    const gw = Math.ceil(sc.wMm * pxMm / cell), gh = Math.ceil(sc.hMm * pxMm / cell), view = { pxMm, cell, gw, gh };
    const vec = vecAnalyze(sc, scale, view);
    const vecLen = vec.items.filter(i => !i.gray).reduce((s, i) => s + i.lenM, 0);
    const raster = (sc.imgFrac > 0.05 && vecLen < 150) || vecLen < 3;   // תמונות שמכסות את הגיליון ומעט קווים וקטוריים = הצנרת בתמונה
    let items, overview, legendN;
    if(raster){
      const r = await rasterMeasure(sc, scale, view, onProgress);
      items = r.items; overview = r.overview; legendN = r.legendN;
    } else {
      items = vec.items; legendN = vec.legendN;
      overview = document.createElement("canvas"); overview.width = gw; overview.height = gh;
      const g = overview.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, gw, gh);
      await sc.page.render({ canvasContext:g, viewport:sc.page.getViewport({ scale:pxMm / cell * PT_MM }), background:"rgba(255,255,255,1)" }).promise;
      onProgress && onProgress(1, 1);
    }
    let syms = [];
    try{ syms = planSymbols(sc, scale, view); }catch(e){ console.warn(e); }
    const head = sc.texts.slice().sort((a, b) => b.h - a.h).map(t => t.s);
    let floor = "";
    for(const s of head){ floor = floorOf(s, true); if(floor) break; }
    if(!floor && plan.pages === 1) floor = floorOf(plan.name);
    return { no:pageNo, mode: raster ? "ras" : "vec", scale0:scale, detected:!!sc.scale, floor, items, syms, overview, gw, gh, cell, legendN,
      layers: !!plan.ocg && vec.items.some(i => i.layer) };
  }

  // ── שאלות על כתבי הכמויות של אתר ──
  // כל השורות השמורות, בטבלה אחת
  function boqFlat(list){
    return (list || []).flatMap(b => (b.rows || []).map(r => ({ plan:b.plan, pid:b.id, at:b.at, f:r.f || (b.floors && b.floors.length === 1 ? b.floors[0] : ""),
      name:r.name, dia:r.dia || "", sl:r.sl || "", qty:+r.qty || 0, unit:r.unit, k:r.k || (r.unit === "מ״א" ? "p" : "s") })));
  }
  const BOQ_K = { p:"צנרת", h:"תליות", s:"סמלים/פריטים", v:"צנרת אנכית", f:"ספחים", x:"ידני" };
  const BOQ_COLS = { f:"קומה", name:"פריט", dia:"קוטר", sl:"שיפוע", plan:"תוכנית", k:"סוג" };
  const heStem = w => w.replace(/[״"'׳]/g, "").replace(/(ים|ות|יות)$/, "");
  function boqVocab(flat){
    const u = a => [...new Set(a.filter(Boolean))];
    return { plans:u(flat.map(r => r.plan)), floors:u(flat.map(r => r.f)), names:u(flat.map(r => r.name)), dias:u(flat.map(r => r.dia)), kinds:Object.keys(BOQ_K) };
  }
  // פענוח שאלה בלי AI: קומה, קוטר, מערכת, סוג, "לפי…", השוואה

  /* צילום ריבועי קטן (~20KB) עם חותמת תאריך ושעה */
  function selfieFrame(src, w, h){
    const S = 360, side = Math.min(w, h), c = document.createElement("canvas");
    c.width = S; c.height = S;
    const g = c.getContext("2d");
    g.drawImage(src, (w - side) / 2, (h - side) / 2, side, side, 0, 0, S, S);
    const t = Date.now();
    g.fillStyle = "rgba(0,0,0,.55)"; g.fillRect(0, S - 26, S, 26);
    g.fillStyle = "#fff"; g.font = "bold 15px sans-serif"; g.textAlign = "center";
    g.fillText(dmy(t) + "/" + new Date(t).getFullYear() + "  " + hhmm(t), S / 2, S - 8);
    return c.toDataURL("image/jpeg", 0.62);
  }
  function SelfieCam({ L, onShot, onCancel }){
    const vid = useRef(null), fileRef = useRef(null);
    const [err, setErr] = useState(false);
    useEffect(()=>{
      let stream = null, dead = false;
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ setErr(true); return; }
      navigator.mediaDevices.getUserMedia({ video:{ facingMode:"user", width:{ ideal:720 }, height:{ ideal:720 } }, audio:false })
        .then(s => {
          if(dead){ s.getTracks().forEach(t => t.stop()); return; }
          stream = s;
          const v = vid.current; if(!v) return;
          v.muted = true; v.setAttribute("playsinline", ""); v.srcObject = s; v.play().catch(()=>{});
        })
        .catch(()=> setErr(true));
      const watch = setTimeout(()=>{ const v = vid.current; if(!dead && !(v && v.videoWidth)) setErr(true); }, 6000);
      return ()=>{ dead = true; clearTimeout(watch); if(stream) stream.getTracks().forEach(t => t.stop()); };
    }, []);
    function shoot(){
      const v = vid.current;
      if(!v || !v.videoWidth){ setErr(true); fileRef.current && fileRef.current.click(); return; }
      onShot(selfieFrame(v, v.videoWidth, v.videoHeight), "live");
    }
    function fromFile(e){
      const file = e.target.files && e.target.files[0]; if(!file) return;
      const img = new Image();
      img.onload = ()=>{ onShot(selfieFrame(img, img.naturalWidth, img.naturalHeight), "file"); URL.revokeObjectURL(img.src); };
      img.src = URL.createObjectURL(file);
    }
    return html`
      <div class="wcam">
        ${err
          ? html`<button class="wcamerr" onClick=${()=>fileRef.current && fileRef.current.click()}>📷<br/>${L.camErr}</button>`
          : html`<div class="wvid"><video ref=${vid} playsInline=${true} muted=${true} autoPlay=${true}></video><i class="wface"></i></div>`}
        <input ref=${fileRef} type="file" accept="image/*" capture="user" style=${{ display:"none" }} onChange=${fromFile} />
        <div class="whint">${L.face}</div>
        <div class="btnrow">
          <button class="btn" onClick=${onCancel}>${L.cancel}</button>
          ${!err && html`<button class="btn pri" onClick=${shoot}>📸 ${L.snap}</button>`}
        </div>
      </div>`;
  }
