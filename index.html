<body>
<style>
  :root{
    --paper:#F4F6F8; --surface:#FFFFFF; --surface-2:#EBEEF3; --surface-3:#E1E6EC;
    --ink:#19212B; --ink-2:#54606E; --ink-3:#8792A1;
    --line:#D5DCE4; --line-2:#E5E9EF;
    --accent:#2C60D0; --accent-ink:#204CA6; --accent-wash:#E6EDFB;
    --ok:#2E8555; --warn:#C4820F; --crit:#C93E30;
    --ok-wash:#E2F0E8; --warn-wash:#F6EBD6; --crit-wash:#F8E3E0;
    --shadow:0 1px 2px rgba(20,30,45,.05), 0 10px 28px rgba(20,30,45,.08);
    --shadow-lg:0 8px 20px rgba(20,30,45,.1), 0 28px 60px rgba(20,30,45,.16);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#10141A; --surface:#181D24; --surface-2:#222932; --surface-3:#2C343E;
      --ink:#E7EBF1; --ink-2:#9EAAB8; --ink-3:#6D7987;
      --line:#2B333D; --line-2:#232A33;
      --accent:#6E9CF1; --accent-ink:#AAC5F8; --accent-wash:#1E2A44;
      --ok:#54B37D; --warn:#E0AC53; --crit:#E56C5E;
      --ok-wash:#16281E; --warn-wash:#2B2414; --crit-wash:#2E1B18;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.42);
      --shadow-lg:0 10px 26px rgba(0,0,0,.45), 0 30px 70px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --paper:#10141A; --surface:#181D24; --surface-2:#222932; --surface-3:#2C343E;
    --ink:#E7EBF1; --ink-2:#9EAAB8; --ink-3:#6D7987;
    --line:#2B333D; --line-2:#232A33;
    --accent:#6E9CF1; --accent-ink:#AAC5F8; --accent-wash:#1E2A44;
    --ok:#54B37D; --warn:#E0AC53; --crit:#E56C5E;
    --ok-wash:#16281E; --warn-wash:#2B2414; --crit-wash:#2E1B18;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.42);
    --shadow-lg:0 10px 26px rgba(0,0,0,.45), 0 30px 70px rgba(0,0,0,.55);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    direction:rtl; background:var(--paper); color:var(--ink);
    font-family:"Assistant","Segoe UI",Tahoma,sans-serif; font-size:16px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  button,select{ font-family:inherit; }
  button{ cursor:pointer; }
  h1,h2,h3,h4{ font-family:"Frank Ruhl Libre","Assistant",serif; margin:0; line-height:1.22; }

  .app{ max-width:1180px; margin:0 auto; min-height:100vh; padding-bottom:40px; }

  .topbar{
    position:sticky; top:0; z-index:40; background:var(--paper);
    background:color-mix(in srgb, var(--paper) 90%, transparent);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:14px; padding:12px 20px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:10px; margin-inline-end:auto; }
  .brand .plate{ background:#fff; border:1px solid var(--line); border-radius:9px; padding:5px 7px; display:flex; flex:none; }
  .brand .plate img{ height:26px; width:auto; display:block; }
  .brand .txt{ display:flex; flex-direction:column; line-height:1.15; }
  .brand .txt b{ font-family:"Frank Ruhl Libre",serif; font-weight:900; font-size:1.05rem; letter-spacing:-.01em; }
  .brand .txt span{ font-family:"Heebo",sans-serif; font-size:.68rem; color:var(--ink-3); margin-top:1px; }
  .brandfoot{ text-align:center; font-family:"Heebo",sans-serif; font-size:.72rem; color:var(--ink-3); padding:26px 16px 4px; }
  .brandfoot b{ color:var(--ink-2); font-weight:700; }

  .seg{ display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:11px; padding:3px; gap:2px; }

  function defStages(n){

  // Read a picked image file, downscale, return a compressed JPEG data URL.
  function fileToScaledDataURL(file, maxDim, quality){
    return new Promise((resolve, reject)=>{
      if(!file || !/^image\//.test(file.type)) { reject(new Error("not an image")); return; }
      const reader = new FileReader();
      reader.onerror = ()=> reject(new Error("read failed"));
      reader.onload = ()=>{
        const img = new Image();
        img.onerror = ()=> reject(new Error("decode failed"));
        img.onload = ()=>{
          let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
          const scale = Math.min(1, maxDim / Math.max(w, h));
          w = Math.round(w * scale); h = Math.round(h * scale);
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          try{ resolve(canvas.toDataURL("image/jpeg", quality)); }
          catch(err){ reject(err); }
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function siteStatus(s){
    if(!s.active) return "inactive";
    if((s.materials||[]).some(m => m.onSite < m.need && m.blocksTomorrow)) return "crit";
    if(s.stages.pressure === "failed") return "crit";
    if(s.schedule === "behind") return "warn";
    if(s.stages.pressure === "pending" && s.stages.black === "done") return "warn";
    if(s.stages.black === "active" && !s.blackConsultant) return "warn";
    return "ok";
  }
  const STATUS_TEXT = { ok:"בקצב", warn:"דורש מעקב", crit:"בסיכון", inactive:"לא פעיל" };

  function siteLine(s){
    if(!s.active) return "אין התקשרות פעילה — לא בביצוע";
    const short = (s.materials||[]).find(m => m.onSite < m.need && m.blocksTomorrow);
    if(short) return `חוסר ${short.need - short.onSite} ${short.unit} ${short.item} — יעכב עבודה מחר`;
    if(s.stages.pressure === "failed") return "בדיקת לחץ פאזה א׳ נכשלה — דרוש תיקון וצילום חוזר";
    if(s.stages.pressure === "pending" && s.stages.black === "done") return "מוכן לבדיקת לחץ — טרם בוצעה";
    if(s.stages.black === "active" && !s.blackConsultant) return "שלב שחור בעבודה — ממתין לאישור יועץ";
    if(s.stages.white === "active") return "בשלב לבן — התקנת כלים סניטריים";
    if(s.stages.black === "active") return "שלב שחור בעבודה — פריסת תשתיות";
    return "בקצב · חומרי מפתח באתר";
  }
  function stageFill(s){
    return ["black","pressure","white"].map(k=>{
      const v = s.stages[k];
      if(v === "done") return "f";
      if(v === "active" || v === "pending" || v === "failed") return "p";
      return "";
    });
  }
  function alertsFor(sites){
    const out = [];
    sites.forEach(s=>{
      if(!s.active) return;
      const short = (s.materials||[]).find(m => m.onSite < m.need && m.blocksTomorrow);
      if(short) out.push({ id:s.id+"-m", level:"crit", text:`חוסר של ${short.need-short.onSite} ${short.unit} ${short.item} באתר ${s.name} — יעכב עבודה מחר` });
      if(s.stages.pressure === "failed") out.push({ id:s.id+"-p", level:"warn", text:`בדיקת לחץ פאזה א׳ נכשלה — ${s.name} (${s.contractor})` });
    });
    return out;
  }

  function App(){

    const notify = useCallback((m)=>{ setToast(m); clearTimeout(notify._t); notify._t = setTimeout(()=>setToast(null), 2600); }, []);
    const update = useCallback((fn)=> setSt(prev => fn(structuredClone(prev))), []);

      setRole(r);
      setNav({ screen: r === "vp" ? "vp.dash" : r === "field" ? "field.home" : "wh.home" });

    const sites = st.sites;
    const bySite = useCallback((id)=> sites.find(s=>s.id===id), [sites]);

    function approveRequest(reqId){
      update(d=>{
        const r = d.requests.find(x=>x.id===reqId); if(!r || r.status!=="pending") return d;
        r.status = "approved";
        const s = d.sites.find(x=>x.id===r.siteId);
        const m = (s.materials||[]).find(x=>x.item===r.item);
        if(m) m.onSite += r.qty; else (s.materials=s.materials||[]).push({item:r.item,need:r.qty,onSite:r.qty,unit:r.unit,blocksTomorrow:false});
        if(s.owner) s.owner.status = "החומר נופק — בדרך לאתר";
        return d;
      });
      notify("החומר נופק · הגאנט והמלאי עודכנו");
    }
    function markShortage(reqId){
      const r = st.requests.find(x=>x.id===reqId);
      const match = st.transfers.find(t=>t.status==="open" && t.toId===r.siteId && t.item===r.item);
      if(match){ setNav({ screen:"wh.tinder" }); notify("נמצאה התאמת ניוד לבקשה — אשר או דלג"); }
      else notify("אין מלאי ואין ניוד זמין — נפתחה הזמנת רכש");
    }
    function acceptTransfer(tId){
      update(d=>{
        const t = d.transfers.find(x=>x.id===tId); if(!t || t.status!=="open") return d;
        t.status = "accepted";
        const dest = d.sites.find(s=>s.id===t.toId);
        if(dest){
          const m = (dest.materials||[]).find(x=>x.item===t.item);
          if(m) m.onSite += t.qty; else (dest.materials=dest.materials||[]).push({item:t.item,need:t.qty,onSite:t.qty,unit:t.unit,blocksTomorrow:false});
          const req = d.requests.find(rr=>rr.siteId===dest.id && rr.item===t.item && rr.status==="pending");
          if(req) req.status = "approved";
          if(dest.owner) dest.owner.status = "חומר בניוד מאתר סמוך — נמנעה הזמנה כפולה";
        }
        return d;
      });
      notify("ניוד אושר · נמנעה הזמנת חירום כפולה");
    }
    function skipTransfer(tId){ update(d=>{ const t=d.transfers.find(x=>x.id===tId); if(t) t.status="skipped"; return d; }); }

    function toggleTask(siteId, unitId, i){
      update(d=>{
        const s = d.sites.find(x=>x.id===siteId);
        const u = s.units.find(x=>x.id===unitId);
        u.checklist[i].done = !u.checklist[i].done;
        if(u.checklist.length && u.checklist.every(c=>c.done) && u.stage==="black" && s.stages.black!=="done") s.stages.black = "done";
        return d;
      });
    }
    function addTask(siteId, unitId, text){
      update(d=>{
        const u = d.sites.find(s=>s.id===siteId).units.find(x=>x.id===unitId);
        u.checklist.push({ t:text, done:false });
        return d;
      });
      notify("סעיף נוסף לצ׳קליסט");
    }
    function removeTask(siteId, unitId, i){
      update(d=>{
        const u = d.sites.find(s=>s.id===siteId).units.find(x=>x.id===unitId);
        u.checklist.splice(i,1);
        return d;
      });
    }
    function addPhoto(siteId, unitId, dataUrl){
      update(d=>{
        const u = d.sites.find(s=>s.id===siteId).units.find(x=>x.id===unitId);
        if(!Array.isArray(u.photos)) u.photos = [];

      });

    function removePhoto(siteId, unitId, photoId){
      update(d=>{
        const u = d.sites.find(s=>s.id===siteId).units.find(x=>x.id===unitId);

    function runPressure(siteId, unitId, pass){
      update(d=>{
        const s = d.sites.find(x=>x.id===siteId);
        const u = s.units.find(x=>x.id===unitId);
        if(pass){
          u.checklist = u.checklist.map(c=>({...c,done:true}));
          s.stages.pressure = "done";
          if(s.stages.white === "locked") s.stages.white = "active";
        } else {
          s.stages.pressure = "failed";
        }
        return d;
      });
      notify(pass ? "בדיקת לחץ אושרה · שלב הלבן נפתח" : "כישלון נרשם · שלב הלבן נשאר נעול");
    }
    function approveConsultant(siteId){
      update(d=>{
        const s = d.sites.find(x=>x.id===siteId); s.blackConsultant = true;
        const r = d.requests.find(x=>x.siteId===siteId && x.status==="blocked"); if(r) r.status = "pending";

    let body;

            onPressure=${runPressure} notify=${notify} />`
        : html`<div class="screen narrow"><div class="empty">היחידה לא נמצאה</div></div>`;

  function VPDash({ sites, onOpen }){
    const [filter, setFilter] = useState("all");
    const activeCount = sites.filter(s=>s.active).length;
    const ranked = useMemo(()=>{
      const rank = { crit:0, warn:1, ok:2, inactive:3 };
      return sites.map(s=>({ s, status:siteStatus(s) }))
        .filter(x=>{
          if(filter==="off") return !x.s.active;
          if(!x.s.active) return false;
          if(filter==="mat") return siteLine(x.s).includes("חוסר");
          if(filter==="sch") return x.s.schedule==="behind";
          return true;
        })
        .sort((a,b)=> rank[a.status]-rank[b.status] || a.s.num-b.s.num);
    }, [sites, filter]);
    const alerts = useMemo(()=>alertsFor(sites), [sites]);

    return html`
      <div class="screen">
        <div class="shead">
          <h2>מבט על</h2>
          <span class="sub">${activeCount} אתרים פעילים · ${sites.length} בתיק · עודכן עכשיו</span>
        </div>
        <div class="chips">
          <button class=${"chip "+(filter==="all"?"on":"")} onClick=${()=>setFilter("all")}>הכל</button>
          <button class=${"chip "+(filter==="mat"?"on":"")} onClick=${()=>setFilter("mat")}>ממתין לחומר</button>
          <button class=${"chip "+(filter==="sch"?"on":"")} onClick=${()=>setFilter("sch")}>באיחור לו״ז</button>
          <button class=${"chip "+(filter==="off"?"on":"")} onClick=${()=>setFilter("off")}>לא פעיל</button>
        </div>
        <div class="grid">
          ${ranked.map(({s,status})=> html`
            <button key=${s.id} class=${"site "+(status==="crit"?"crit ":status==="inactive"?"inactive ":"")} onClick=${()=>onOpen(s.id)}>
              <div class="r1">
                <div><div class="nm">${s.name}</div><div class="bd">${s.contractor}</div></div>
                <span class=${"dot "+status}></span>
              </div>
              <div>
                <div class="stagebar">${stageFill(s).map((f,i)=> html`<i key=${i} class=${f}></i>`)}</div>
                <div class="stagelbl"><span>שחור</span><span>לחץ</span><span>לבן</span></div>
              </div>
              <div class="st">${siteLine(s)}</div>
            </button>`)}
          ${ranked.length===0 && html`<div class="empty">אין אתרים בקטגוריה זו</div>`}
        </div>

        <div class="alerts">
          <h4>התראות פתוחות</h4>
          ${alerts.length === 0
            ? html`<div class="alert empty"><span class="b"></span>אין התראות פעילות — כל האתרים בקצב</div>`
            : alerts.map(a => html`<div key=${a.id} class=${"alert "+a.level}><span class="b"></span>${a.text}</div>`)}
        </div>
        <div class="hint">להבנת אתר בסיכון: הקשה על כרטיס ← הקשה על "פנייה לאחראי". שני קליקים למידע מלא, שלישי לפעולה.</div>
        <div class="disc">שמות הפרויקטים והקבלנים — נתוני אמת מהתיק שלך. סטטוס שלבים, מלאי ואחראים — נתוני הדגמה עד לחיבור לדיווחי השטח. הפעולות נשמרות מקומית בדפדפן; ↺ מאפס.</div>
      </div>`;
  }

  function SiteDetail({ site, onBack, onApproveConsultant, notify }){
    const [sheet, setSheet] = useState(false);
    if(!site) return null;
    const status = siteStatus(site);
    const short = (site.materials||[]).find(m => m.onSite < m.need);
    const steps = [{k:"black"},{k:"pressure"},{k:"white"}].map(x=>({ k:x.k, state:site.stages[x.k] }));
    const stateText = { done:"הושלם · אישור מצולם ✓", active:"בעבודה כעת", pending:"ממתין לביצוע", failed:"נכשל · דרוש תיקון וצילום חוזר", locked:"נעול" };
    const mkClass = { done:"done", active:"active", pending:"active", failed:"fail", locked:"lock" };

    return html`
      <div class="screen narrow">
        <div class="shead">
          <button class="back" onClick=${onBack} aria-label="חזרה">→</button>
          <div class="rowbet" style=${{flex:1}}>
            <div><h2 style=${{fontSize:"1.3rem"}}>${site.name}</h2><span class="sub">${site.contractor}${site.active?"":" · לא פעיל"}</span></div>
            <span class=${"pill "+status}>${STATUS_TEXT[status]}</span>
          </div>
        </div>

        <div class="card" style=${{marginTop:14}}>
          <div class="lbl">שלבי ביצוע</div>
          <div class="tl">
            ${steps.map(s=> html`
              <div class="step" key=${s.k}>
                <span class=${"mk "+(mkClass[s.state]||"lock")}></span>
                <span class="tx"><b>${STAGES[s.k]}</b><span>${stateText[s.state]||s.state}</span></span>
              </div>`)}
          </div>
          ${site.stages.black === "active" && !site.blackConsultant && html`
            <button class="btn wide" style=${{marginTop:10}} onClick=${()=>onApproveConsultant(site.id)}>רשום אישור יועץ אינסטלציה על השחור</button>`}
        </div>

        ${short && html`
          <div class="card">
            <div class="lbl">מה עוצר</div>
            <div class=${"val "+(short.blocksTomorrow?"crit":"")}>
              חוסר ${short.need - short.onSite} ${short.unit} ${short.item}${short.blocksTomorrow ? " · יעכב את העבודה מחר בבוקר" : " · אין השפעה מיידית על הלו״ז"}
            </div>
          </div>`}

        ${site.stages.pressure === "failed" && html`
          <div class="card">
            <div class="lbl">חריגה פתוחה</div>
            <div class="val">בדיקת לחץ פאזה א׳ נכשלה — שלב הלבן חסום עד לצילום בדיקה תקינה</div>
          </div>`}

        <div class="card">
          <div class="lbl">מי מטפל כעת</div>
          <div class="val">${site.owner.name} · ${site.owner.role}</div>
          <div style=${{fontFamily:"Heebo, sans-serif", fontSize:".82rem", color:"var(--ink-2)", marginTop:4}}>${site.owner.status}</div>
          <div class="btnrow" style=${{marginTop:12}}>
            <button class="btn pri" onClick=${()=>setSheet(true)}>פנייה לאחראי</button>
          </div>
        </div>

        ${sheet && html`
          <div class="scrim" onClick=${()=>setSheet(false)}>
            <div class="sheet" onClick=${e=>e.stopPropagation()}>
              <h3>פנייה לאחראי</h3>
              <div class="who">${site.owner.name} · ${site.owner.role} — ${site.name}</div>
              <button class="opt" onClick=${()=>{ setSheet(false); notify("מחייג ל"+site.owner.name+"…"); }}><span class="e">📞</span> חיוג</button>
              <button class="opt" onClick=${()=>{ setSheet(false); notify("נפתח צ׳אט האתר"); }}><span class="e">💬</span> צ׳אט האתר</button>
              <button class="opt" onClick=${()=>{ setSheet(false); notify("מציג את המשימה הפעילה של "+site.owner.name); }}><span class="e">📋</span> צפייה במשימה הנוכחית</button>
            </div>
          </div>`}
      </div>`;
  }

  function FieldHome({ sites, onOpen, onAddUnit }){
    const active = sites.filter(s=>s.active);
    const [sid, setSid] = useState(active[0].id);
    const [adding, setAdding] = useState(false);
    const [nu, setNu] = useState({ title:"", floor:"", stage:"black" });
    const site = sites.find(s=>s.id===sid) || active[0];

    function submitUnit(e){
      e.preventDefault();
      if(!nu.title.trim()) return;
      onAddUnit(site.id, nu);
      setNu({ title:"", floor:"", stage:"black" });
      setAdding(false);
    }

    return html`
      <div class="screen narrow">
        <div class="shead"><h2>דיווח שטח</h2><span class="sub">בחר אתר ויחידת עבודה</span></div>
        <select class="pick" value=${sid} onChange=${e=>{ setSid(e.target.value); setAdding(false); }}>
          ${active.map(s => html`<option key=${s.id} value=${s.id}>${s.name} · ${s.contractor}</option>`)}
        </select>
        <div style=${{display:"flex", flexDirection:"column", gap:9}}>
          ${site.units.map(u=>{
            const locked = u.stage === "white" && site.stages.white === "locked";
            const done = u.checklist.length>0 && u.checklist.every(c=>c.done);
            return html`
              <button key=${u.id} class="wu" onClick=${()=>onOpen(site.id, u.id)}>
                <span class="ic">${u.stage==="pressure" ? "🧪" : locked ? "🔒" : done ? "✓" : "🛠"}</span>
                <span class="m"><b>${u.title}</b><span>${u.floor} · ${u.checklist.filter(c=>c.done).length}/${u.checklist.length} משימות · ${(u.photos||[]).length} תמונות</span></span>
                <span class=${"stgbadge "+u.stage}>${u.stage==="black"?"שחור":u.stage==="pressure"?"לחץ":"לבן"}</span>
              </button>`;
          })}

          ${adding
            ? html`
              <form class="newunit" onSubmit=${submitUnit}>
                <input type="text" placeholder="שם הסעיף (למשל: פריסת קווי מים קומה 4)" value=${nu.title} onInput=${e=>setNu({...nu, title:e.target.value})} maxLength=${60} />
                <input type="text" placeholder="מיקום / קומה" value=${nu.floor} onInput=${e=>setNu({...nu, floor:e.target.value})} maxLength=${30} />
                <select value=${nu.stage} onChange=${e=>setNu({...nu, stage:e.target.value})}>
                  <option value="black">שלב: שחור — תשתיות</option>
                  <option value="pressure">שלב: בדיקת לחץ</option>
                  <option value="white">שלב: לבן — סניטריה</option>
                </select>
                <div class="btnrow">
                  <button type="button" class="btn" onClick=${()=>setAdding(false)}>ביטול</button>
                  <button type="submit" class="btn pri" disabled=${!nu.title.trim()}>הוסף סעיף</button>
                </div>
              </form>`
            : html`<button class="addsection" onClick=${()=>setAdding(true)}>＋ הוסף סעיף עבודה לאתר</button>`}
        </div>
        <div class="hint">סימון שלב כ״הושלם״ מחייב תמונה אחת לפחות. סעיפים לצ׳קליסט מוסיפים בתוך כל יחידת עבודה.</div>
      </div>`;
  }

  function Report({ site, unit, onBack, onToggle, onAddTask, onRemoveTask, onAddPhoto, onRemovePhoto, onPressure, notify }){
    const [newTask, setNewTask] = useState("");
    const [busy, setBusy] = useState(false);
    const [view, setView] = useState(null);
    const fileRef = useRef(null);
    const isPressure = unit.stage === "pressure";
    const locked = unit.stage === "white" && site.stages.white === "locked";
    const cl = unit.checklist;
    const photos = Array.isArray(unit.photos) ? unit.photos : [];
    const nPhotos = photos.length;
    const allDone = cl.length > 0 && cl.every(c=>c.done);
    const canSave = nPhotos > 0 && !locked;

    function submitTask(e){
      e.preventDefault();
      const v = newTask.trim();
      if(!v || locked) return;
      onAddTask(site.id, unit.id, v);
      setNewTask("");
    }

    async function onPick(e){
      const files = Array.from(e.target.files || []);
      e.target.value = "";
      if(!files.length) return;
      setBusy(true);
      let added = 0;
      for(const f of files){
        try{
          const url = await fileToScaledDataURL(f, 1024, 0.6);
          onAddPhoto(site.id, unit.id, url);
          added++;
        }catch(err){
          notify("תמונה אחת לא נקלטה — נסה שוב");
        }
      }
      setBusy(false);
      if(added) notify(added === 1 ? "תמונה נוספה" : added + " תמונות נוספו");
    }

    return html`
      <div class="screen narrow">
        <div class="shead">
          <button class="back" onClick=${onBack} aria-label="חזרה">→</button>
          <div class="rowbet" style=${{flex:1}}>
            <div><h2 style=${{fontSize:"1.15rem"}}>${unit.title}</h2><span class="sub">${site.name} · ${unit.floor}</span></div>
            <span class=${"stgbadge "+unit.stage}>${unit.stage==="black"?"שחור":unit.stage==="pressure"?"לחץ":"לבן"}</span>
          </div>
        </div>

        ${locked && html`<div class="gate">⛔ שלב ״לבן״ נעול — נדרש אישור מצולם של בדיקת לחץ תקינה או אישור יועץ אינסטלציה על השחור. לא ניתן לדווח כאן עדיין.</div>`}

        <div class="card" style=${{marginTop:14}}>
          <div class="lbl">${isPressure ? "שלבי הבדיקה" : "צ׳קליסט יחידת עבודה"} · ${cl.filter(c=>c.done).length}/${cl.length}</div>
          <div class="check">
            ${cl.map((c,i)=> html`
              <div class="citem" key=${i}>
                <button class=${"ctoggle "+(c.done?"on":"")} disabled=${locked} onClick=${()=>onToggle(site.id, unit.id, i)}>
                  <span class="bx">${c.done ? "✓" : ""}</span>${c.t}
                </button>
                ${!locked && html`<button class="xbtn" title="הסר סעיף" onClick=${()=>onRemoveTask(site.id, unit.id, i)}>✕</button>`}
              </div>`)}
            ${cl.length===0 && html`<div style=${{fontFamily:"Heebo,sans-serif", fontSize:".82rem", color:"var(--ink-3)", padding:"6px 2px"}}>אין עדיין סעיפים — הוסף למטה</div>`}
          </div>
          ${!locked && html`
            <form class="addrow" onSubmit=${submitTask}>
              <input type="text" value=${newTask} onInput=${e=>setNewTask(e.target.value)} placeholder="הוסף סעיף לצ׳קליסט…" maxLength=${80} />
              <button type="submit" class="add" disabled=${!newTask.trim()} aria-label="הוסף">＋</button>
            </form>`}
        </div>

        <div class="card">
          <div class="lbl">תיעוד מצולם · ${nPhotos}</div>
          <input ref=${fileRef} type="file" accept="image/*" multiple hidden onChange=${onPick} />
          <button class="camera" disabled=${locked || busy} onClick=${()=>fileRef.current && fileRef.current.click()}>
            ${busy ? "מעבד תמונה…" : "📷 צלם או בחר תמונה"}
          </button>
          <div class="thumbs">
            ${photos.map(p => html`
              <button key=${p.id} class="thumb" onClick=${()=>setView(p.url)}>
                <img src=${p.url} alt="תמונת דיווח" />
                ${!locked && html`<span class="del" role="button" title="מחק" onClick=${(e)=>{ e.stopPropagation(); onRemovePhoto(site.id, unit.id, p.id); }}>✕</span>`}
              </button>`)}
            ${nPhotos===0 && html`<span style=${{fontFamily:"Heebo,sans-serif", fontSize:".78rem", color:"var(--ink-3)"}}>טרם צורפו תמונות</span>`}
          </div>
        </div>

        ${isPressure ? html`
          <div class="btnrow">
            <button class="btn danger" disabled=${nPhotos===0} onClick=${()=>{ onPressure(site.id, unit.id, false); onBack(); }}>רשום: נכשלה</button>
            <button class="btn ok" disabled=${!allDone || nPhotos===0} onClick=${()=>{ onPressure(site.id, unit.id, true); onBack(); }}>רשום: עברה</button>
          </div>
          ${nPhotos===0 && html`<div class="hint">נדרשת תמונה של מד־הלחץ כדי לרשום תוצאה.</div>`}
        ` : html`
          <button class="btn pri wide" disabled=${!canSave} onClick=${()=>{ notify(allDone ? "הדיווח נשמר · השלב הושלם" : "הדיווח נשמר"); onBack(); }}>
            ${locked ? "שמירה חסומה" : nPhotos===0 ? "צרף תמונה כדי לשמור" : allDone ? "שמור וסיים שלב" : "שמור דיווח"}
          </button>`}

        ${view && html`
          <div class="lightbox" onClick=${()=>setView(null)}>
            <button class="x" aria-label="סגור">✕</button>
            <img src=${view} alt="תמונת דיווח מוגדלת" onClick=${(e)=>e.stopPropagation()} />
          </div>`}
      </div>`;
  }

  function WarehouseHome({ st, onApprove, onShortage, onTinder }){
    const pending = st.requests.filter(r=>r.status==="pending");
    const blocked = st.requests.filter(r=>r.status==="blocked");
    const openTransfers = st.transfers.filter(t=>t.status==="open").length;

    return html`
      <div class="screen narrow">
        <div class="shead"><h2>מחסן</h2><span class="sub">${pending.length} בקשות ניפוק ממתינות</span></div>

        <button class="wu" style=${{marginBottom:16}} onClick=${onTinder}>
          <span class="ic">🔁</span>
          <span class="m"><b>ניוד מלאי בין אתרים</b><span>${openTransfers} התאמות פתוחות · מונע הזמנות כפולות</span></span>
          <span class="rt">פתח ›</span>
        </button>

        <div class="lbl">בקשות ניפוק</div>
        <div style=${{display:"flex", flexDirection:"column", gap:10, marginTop:6}}>
          ${pending.length===0 && blocked.length===0 && html`<div class="empty">אין בקשות פתוחות</div>`}
          ${pending.map(r=>{
            const site = st.sites.find(s=>s.id===r.siteId);
            return html`
              <div key=${r.id} class="req">
                <div class="top">
                  <div>
                    <div class="sitenm">${site.name} · ${site.contractor}</div>
                    <div style=${{fontFamily:"Heebo,sans-serif", fontSize:".78rem", color:"var(--ink-2)"}}>${r.item}</div>
                  </div>
                  <div style=${{textAlign:"center"}}>
                    <div class="q">${r.qty}</div>
                    <div style=${{fontFamily:"Heebo,sans-serif", fontSize:".66rem", color:"var(--ink-3)"}}>${r.unit}</div>
                  </div>
                </div>
                <div class="why">${r.why}</div>
                <div class="btnrow">
                  <button class="btn" onClick=${()=>onShortage(r.id)}>אין במלאי</button>
                  <button class="btn pri" onClick=${()=>onApprove(r.id)}>אשר ניפוק</button>
                </div>
              </div>`;
          })}
          ${blocked.map(r=>{
            const site = st.sites.find(s=>s.id===r.siteId);
            return html`
              <div key=${r.id} class="req blocked">
                <div class="top">
                  <div><div class="sitenm">${site.name} · ${site.contractor}</div>
                    <div style=${{fontFamily:"Heebo,sans-serif", fontSize:".78rem", color:"var(--ink-2)"}}>${r.item} · ${r.qty} ${r.unit}</div></div>
                  <span class="pill lock">🔒 חסום</span>
                </div>
                <div class="why">${r.why}</div>
                <button class="btn wide" disabled=${true}>ממתין לאישור שלב קודם</button>
              </div>`;
          })}
        </div>
        <div class="hint">ניפוק מאושר רק בהתאם לכמות שהשלב הבא בגאנט צורך.</div>
      </div>`;
  }

  function Tinder({ transfers, onAccept, onSkip, onBack }){
    const queue = transfers.filter(t=>t.status==="open");
    const [anim, setAnim] = useState(null);
    function go(t, dir){
      setAnim({ id:t.id, dir });
      setTimeout(()=>{ dir==="right" ? onAccept(t.id) : onSkip(t.id); setAnim(null); }, 340);
    }
    return html`
      <div class="screen narrow">
        <div class="shead">
          <button class="back" onClick=${onBack} aria-label="חזרה">→</button>
          <div><h2 style=${{fontSize:"1.25rem"}}>ניוד מלאי</h2><span class="sub">עודף באתר אחד ← חוסר מיידי באחר</span></div>
        </div>
        <div class="deck">
          ${queue.length === 0 && html`<div class="deck-empty"><div style=${{fontSize:"1.6rem"}}>✓</div>אין התאמות ניוד פתוחות<br/>כל החוסרים המיידיים מכוסים</div>`}
          ${queue.slice(0,2).reverse().map((t, idx, arr)=>{
            const isTop = idx === arr.length - 1;
            const cls = isTop ? (anim && anim.id===t.id ? "gone-"+anim.dir : "") : "behind";
            return html`
              <div key=${t.id} class=${"swipe "+cls}>
                <div><div class="tag">עודף באתר</div><div class="big">${t.fromSite}</div>
                  <div class="meta">${t.qty} ${t.unit} ${t.item} · פנוי עד שלב הלבן</div></div>
                <div class="arrow">↓</div>
                <div><div class="tag">חוסר מיידי</div><div class="big">${t.toSite}</div>
                  <div class="meta crit">חסרים ${t.qty} ${t.unit} · עוצר עבודה מחר</div></div>
                <hr/>
                <div class="meta" style=${{textAlign:"center", color:"var(--ink-3)"}}>${t.distanceKm} ק״מ · ${t.eta}</div>
                <div class="save">חוסך הזמנת חירום · ≈ ₪${t.saving.toLocaleString("he-IL")}</div>
              </div>`;
          })}
        </div>
        ${queue.length > 0 && html`
          <div class="btnrow" style=${{marginTop:18}}>
            <button class="btn" onClick=${()=>go(queue[0], "left")}>✕ דלג</button>
            <button class="btn pri" onClick=${()=>go(queue[0], "right")}>✓ אשר ניוד</button>
          </div>`}
        <div class="hint">אישור יוצר תעודת ניוד בין־אתרית ומעדכן מלאי בשני האתרים.</div>
      </div>`;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
</script>

</body>
</html>
