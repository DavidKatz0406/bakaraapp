      setFlow({ type, step:"cam", photo:null, cam:"live", pos:null, posErr:null, site:null });
      if(!navigator.geolocation){ setFlow(f => f && { ...f, posErr:"na" }); return; }
      setTimeout(()=> setFlow(f => f && !f.pos && !f.posErr ? { ...f, posErr:"slow" } : f), 25000);
      navigator.geolocation.getCurrentPosition(
        p => setFlow(f => f && { ...f, pos:{ lat:p.coords.latitude, lng:p.coords.longitude, acc:Math.round(p.coords.accuracy) } }),
        e => setFlow(f => f && { ...f, posErr: String(e.code || "err") }),
        { enableHighAccuracy:true, timeout:20000, maximumAge:0 });
    }
    // אתר: מה שהעובד בחר → אתר ממופה שהעובד בתוך הרדיוס שלו → אם הוא לא ליד שום אתר ממופה ויש לו ברשומה
    // אתרים בלי מיקום: האחד היחיד, או שהוא בוחר בעצמו (לא משייכים אוטומטית לאתר הקבוע ומסמנים "רחוק") →
    // אתר ממופה עד ק״מ → האתר האחרון היום → האתר הקבוע
    function autoSite(f){
      if(f.site) return f.site;
      if(f.pos){
        const near = sites.filter(s => s.lat != null).map(s => ({ s, d: geoDist(f.pos, s) })).sort((a, b) => a.d - b.d)[0];
        if(near && near.d - Math.min(f.pos.acc || 0, 500) <= (near.s.r || ATT_R)) return near.s.id;
        const um = wSites(worker || {}).filter(id => { const s = sites.find(x => x.id === id); return s && s.lat == null; });
        if(um.length === 1) return um[0];
        if(um.length > 1) return (last && um.includes(last.site)) ? last.site : "";
        if(near && near.d < 1000) return near.s.id;
      }
      return (last && last.site) || (worker && worker.site) || (sites[0] && sites[0].id) || "";
    }
    function retryLoc(){
      setFlow(f => f && { ...f, posErr:null, pos:null });
      if(!navigator.geolocation){ setFlow(f => f && { ...f, posErr:"na" }); return; }
      navigator.geolocation.getCurrentPosition(
        p => setFlow(f => f && { ...f, pos:{ lat:p.coords.latitude, lng:p.coords.longitude, acc:Math.round(p.coords.accuracy) } }),
        e => setFlow(f => f && { ...f, posErr: String(e.code || "err") }),
        { enableHighAccuracy:true, timeout:20000, maximumAge:0 });
    }
    function send(){
      const f = flow, b = base.current;
      if(!f || !f.photo || !b) return;
      const sid = autoSite(f), t = Date.now();
      if(!sid) return;
      const pid = today.replace(/-/g, "") + "_" + id.w + "_" + rid(5);
      const off = !navigator.onLine;
      const p = {
        id:pid, w:id.w, name:worker.name, site:sid, siteName:siteName(sid), type:f.type, day:today, dts:t, ts:FV(),
        lat: f.pos ? f.pos.lat : null, lng: f.pos ? f.pos.lng : null, acc: f.pos ? f.pos.acc : null, gpsErr: f.pos ? null : (f.posErr || "pending"),
        dev, off, cam:f.cam, ua:navigator.userAgent.slice(0, 160), v:1
      };
      const batch = firebase.firestore().batch();
      batch.set(b.collection("punch").doc(pid), p);
      batch.set(b.collection("pph").doc(pid), { id:pid, w:id.w, day:today, site:sid, url:f.photo });
      // הסלפי הראשון נשמר כתמונת הזיהוי של העובד (לא נמחקת במחיקה החודשית; מנהל יכול להחליף)
      batch.commit().catch(e => setDone({ err: String(e.code || e.message || e) }));
      // תמונת הזיהוי נכתבת בנפרד — אם תיכשל, הרישום עצמו לא נפגע
      if(!worker.hasRef && f.cam === "live")
        b.collection("ref").doc(id.w).set({ w:id.w, url:f.photo, pid, at:FV(), by:"auto" })
          .then(()=> b.collection("workers").doc(id.w).set({ hasRef:true }, { merge:true })).catch(()=>{});
      setFlow(null);
      setDone({ type:f.type, at:t, off, photo:f.photo, site:siteName(sid) });
      // אחרי כניסה: דקה וחצי בלי כפתור יציאה גדול, כדי שלחיצה נוספת לא תרשום יציאה
      if(f.type === "in"){ setCalm(true); clearTimeout(calmT.current); calmT.current = setTimeout(()=> setCalm(false), 90000); }
    }

    const wrap = inner => html`
      <div class="wapp">
        <div class="wtop">
          <span class="plate"><img src=${LOGO} alt="ט.ש. מי רון" /></span>
          <select class="wlang" value=${lang} onChange=${e => setLang(e.target.value)}>
            ${Object.keys(WT).map(k => html`<option key=${k} value=${k}>${WT[k].name}</option>`)}
          </select>
        </div>
        ${inner}
      </div>`;
    if(phase === "taken") return wrap(html`
      <div class="wmsg" style=${{ marginTop:"18vh" }}>${L.taken}</div>
      <div style=${{ display:"flex", flexDirection:"column", gap:10, padding:"20px 10px 0" }}>
        ${relSent ? html`<div class="alert empty"><span class="b"></span>${L.relSent}</div>`
          : html`<button class="btn pri wide" disabled=${relBusy} onClick=${askRelease}>📱 ${L.relReq}</button>`}
        <button class="btn wide" onClick=${()=>location.reload()}>↻ ${L.retry}</button>
      </div>`);
    if(phase !== "ok") return wrap(html`<div class="wmsg">${phase === "load" ? L.loading : L[phase]}</div>`);
    if(early != null) return wrap(html`
      <div class="wq">⚠️<b>${L.earlyQ.replace("{m}", early)}</b></div>
      <button class="wbig in" onClick=${()=>setEarly(null)}><span>👷</span>${L.stay}</button>
      <button class="btn wide" style=${{ flex:"none", marginTop:6 }} onClick=${()=>start("out", true)}>${L.leave}</button>`);

    if(flow){
      const sid = autoSite(flow);
      return wrap(html`
        <div class=${"wflow " + flow.type}>
          <div class="wflowh">${flow.type === "in" ? L.in : L.out}</div>
          ${flow.step === "cam"
            ? html`<${SelfieCam} L=${L} onCancel=${()=>setFlow(null)} onShot=${(photo, cam)=> setFlow(f => f && { ...f, photo, cam, step:"review" })} />`
            : html`
              <img class="wshot" src=${flow.photo} alt="" />
              <label class="wfield">${L.site}
                <select value=${sid} onChange=${e => setFlow(f => ({ ...f, site:e.target.value }))} style=${!sid ? { borderColor:"var(--warn)" } : null}>
                  ${!sid && html`<option value="">— ${L.pickSite} —</option>`}
                  ${(()=>{ const mineS = wSites(worker || {}); return [...sites.filter(s => mineS.includes(s.id)), ...sites.filter(s => !mineS.includes(s.id))]; })().map(s => html`<option key=${s.id} value=${s.id}>${s.name}</option>`)}
                </select>
              </label>
              <div class=${"wloc " + (flow.pos ? "ok" : flow.posErr ? "bad" : "")}>📍 ${flow.pos ? L.locOk + " (±" + flow.pos.acc + "m)" : flow.posErr ? L.noLoc : L.locating}</div>
              ${flow.posErr === "1" && html`<div class="wlochelp">
                <b>${L.locHelpT}</b>
                <div>📱 ${L.locIos}</div>
                <div>🤖 ${L.locAnd}</div>
                <button class="btn" style=${{ marginTop:6 }} onClick=${retryLoc}>🔄 ${L.locRetry}</button>
              </div>`}
              ${flow.posErr && flow.posErr !== "1" && html`<button class="btn" style=${{ marginBottom:8 }} onClick=${retryLoc}>🔄 ${L.retry}</button>`}
              ${!online && html`<div class="wloc bad">${L.net}</div>`}
              <div class="btnrow">
                <button class="btn" onClick=${()=>setFlow(f => ({ ...f, step:"cam", photo:null }))}>${L.retake}</button>
                <button class=${"btn " + (flow.type === "in" ? "ok" : "pri")} disabled=${(!flow.pos && !flow.posErr) || !sid} onClick=${send}>${!flow.pos && !flow.posErr ? L.locating : !sid ? L.pickSite : L.send}</button>
              </div>`}
        </div>`);
    }

    return wrap(html`
      <div class="whello">${L.hello}, <b>${worker.name}</b></div>
      <div class=${"wstat " + (openAt != null ? "in" : last ? "out" : "")}>
        ${openAt != null ? L.since + " " + hhmm(openAt) : last ? L.left + hhmm(last._t.t) : L.notIn}
        ${mine.length > 0 && html`<small>${L.hours}: ${Math.floor(workedMs / 36e5)}:${pad2(Math.floor(workedMs % 36e5 / 60000))}</small>`}
      </div>
      ${!online && html`<div class="wloc bad">${L.net}</div>`}
      ${done && !done.err && html`
        <div class="wdone">
          <img src=${done.photo} alt="" />
          <div><b>✓ ${L.saved}</b><br/>${done.type === "in" ? L.inL : L.outL} · ${hhmm(done.at)}${done.site ? " · " + done.site : ""}${done.off ? html`<br/><small>${L.savedOff}</small>` : null}</div>
        </div>`}
      ${done && done.err && html`<div class="wloc bad">${L.err} (${done.err})</div>`}
      ${calm && next === "out"
        ? html`<div class="wgood">✓ ${L.inL} ${done ? hhmm(done.at) : ""}<small>${L.goodDay}</small></div>
            <button class="btn wide" style=${{ flex:"none" }} onClick=${()=>start("out")}>${L.out}</button>`
        : html`<button class=${"wbig " + next} onClick=${()=>start(next)}>
        <span>📸</span>${next === "in" ? L.in : L.out}
      </button>`}
      ${mine.length > 0 && html`
        <div class="wlist">
          <div class="lbl">${L.todayList}</div>
          ${mine.map(p => html`<div key=${p.id} class="wrow"><b>${hhmm(p._t.t)}</b> ${p.type === "in" ? L.inL : L.outL}${p.siteName ? " · " + p.siteName : ""}${p._pending ? html` <small>(${L.pending})</small>` : null}</div>`)}
        </div>`}
    `);
  }

  /* ═════════════ נוכחות — מסך המנהלים / המשרד ═════════════ */
  // עובד יכול לעבוד בכמה פרויקטים של הצוות: site = אתר הבית, sites = כל הפרויקטים
  const wSites = w => [...new Set([w.site, ...(w.sites || [])].filter(Boolean))];
  /* 📍 מיקום אתרים — הצעות ממיקומי ההחתמות, ורשימת עובדים שהטלפון שלהם חוסם מיקום.
     אשכול = מקום שעובדים מחתימים בו (300 מ׳) ואינו בתוך הרדיוס של שום אתר ממופה. ההצעה: אתר בלי מיקום
     שמופיע ברשומה של העובדים שבאשכול, או אתר ממופה שהרישומים נרשמו אליו (= המיקום שלו כנראה שגוי). */
  function AttLoc({ B, workers, sitesById, visSites, visIds, who, notify }){
    const [data, setData] = useState(null), [busy, setBusy] = useState(false), [other, setOther] = useState({});
    const days = 30;
    async function load(){
      setBusy(true);
      try{
        const since = dstr(Date.now() - days * 864e5);
        const q = await B.collection("punch").where("day", ">=", since).get();
        setData(q.docs.map(d => d.data()));
      }catch(e){ notify("טעינה נכשלה: " + (e.code || e.message)); setData([]); }
      setBusy(false);
    }
    useEffect(()=>{ if(B) load(); }, [B]);
    if(!data) return html`<div class="empty">${busy ? "טוען רישומים של " + days + " יום…" : ""}</div>`;
    const act = Object.values(sitesById).filter(x => x.active !== false && visIds.has(x.id));
    const mapped = act.filter(x => x.lat != null), unmapped = act.filter(x => x.lat == null);
    const Wm = {}; workers.forEach(w => { Wm[w.id] = w; });
    const med = a => { const x = a.slice().sort((p, q) => p - q); return x[Math.floor(x.length / 2)]; };
    const inside = (p, x) => geoDist(p, x) - Math.min(p.acc || 0, 500) <= (x.r || ATT_R);
    const pts = data.filter(p => p.lat != null && (p.acc || 999) <= 150 && !mapped.some(x => inside(p, x)));
    const cl = [];
    pts.forEach(p => { let c = cl.find(c => geoDist(p, c) <= 300); if(!c){ c = { lat:p.lat, lng:p.lng, ps:[] }; cl.push(c); } c.ps.push(p); });
    const groups = cl.filter(c => c.ps.length >= 3).map(c => {
      const ctr = { lat: med(c.ps.map(p => p.lat)), lng: med(c.ps.map(p => p.lng)) };
      const ws = [...new Set(c.ps.map(p => p.w))];
      const cand = {};
      ws.forEach(w => wSites(Wm[w] || {}).forEach(id => { const x = sitesById[id]; if(x && x.active !== false && x.lat == null && visIds.has(id)) cand[id] = (cand[id] || 0) + 1; }));
      const reg = {}; c.ps.forEach(p => { reg[p.site] = (reg[p.site] || 0) + 1; });
      const moves = Object.entries(reg).filter(([id]) => sitesById[id] && sitesById[id].lat != null && visIds.has(id)).sort((a, b) => b[1] - a[1]);
      return { ctr, n:c.ps.length, ws, cand:Object.entries(cand).sort((a, b) => b[1] - a[1]), reg:Object.entries(reg).sort((a, b) => b[1] - a[1]), moves };
    }).filter(g => g.cand.length || g.moves.length || g.n >= 5).sort((a, b) => b.n - a.n);
    function setLoc(id, g, move){
      const x = sitesById[id]; if(!x) return;
      if(move && !confirm("להזיז את המיקום של " + x.name + " למקום הזה? הרישומים מכאן יפסיקו להיות מסומנים \"רחוק מהאתר\".")) return;
      B.collection("sites").doc(docKey(id)).set({ lat:g.ctr.lat, lng:g.ctr.lng, r: x.r || ATT_R, locBy:who, locAt:Date.now(),
        locHow:"לפי " + g.n + " החתמות של " + g.ws.length + " עובדים" + (move ? " (הוזז)" : "") }, { merge:true })
        .then(()=> notify("📍 המיקום של " + x.name + " נשמר")).catch(e => notify("לא נשמר: " + (e.code || e.message)));
    }
    // עובדים שהטלפון שלהם חוסם מיקום (קוד 1)
    const den = {};
    data.filter(p => p.lat == null && String(p.gpsErr) === "1").forEach(p => {
      const d = den[p.w] || (den[p.w] = { n:0, ios:0, last:"", site:p.site });
      d.n++; if(/iPhone|iPad/.test(p.ua || "")) d.ios++; if(p.day > d.last){ d.last = p.day; d.site = p.site; } });
    const okW = new Set(data.filter(p => p.lat != null).map(p => p.w));
    const denList = Object.entries(den).filter(([w, d]) => visIds.has(d.site) || wSites(Wm[w] || {}).some(x => visIds.has(x)))
      .sort((a, b) => b[1].n - a[1].n);
    const mapL = (lat, lng) => "https://maps.google.com/?q=" + lat + "," + lng;
    return html`<div>
      <div class="kpis" style=${{ marginBottom:12 }}>
        <div class=${"kpi " + (unmapped.length ? "warn" : "")}><b>${unmapped.length}/${act.length}</b><span>אתרים בלי מיקום</span></div>
        <div class=${"kpi " + (groups.length ? "warn" : "")}><b>${groups.length}</b><span>מקומות להצעה</span></div>
        <div class=${"kpi " + (denList.length ? "crit" : "")}><b>${denList.length}</b><span>עובדים שחוסמים מיקום</span></div>
      </div>

      <div class="card" style=${{ marginBottom:12 }}>
        <div class="lbl">📍 מקומות שעובדים מחתימים בהם, ולא ליד אתר ממופה (${days} יום)</div>
        <div class="sub2">לכל מקום — האתר המוצע לפי האתרים שברשומה של העובדים. מאשרים בלחיצה, והמערכת תשייך לשם החתמות מעכשיו. רישומים שכבר נרשמו לא משתנים.</div>
        ${!groups.length && html`<div class="empty" style=${{ padding:"14px 0" }}>אין מקומות חדשים להצעה 👍</div>`}
        ${groups.map((g, i) => html`<div key=${i} class="locg">
          <div class="rowbet" style=${{ gap:8, flexWrap:"wrap" }}>
            <div><b>${g.n} החתמות · ${g.ws.length} עובדים</b>
              <div class="sub2">${g.ws.slice(0, 4).map(w => (Wm[w] || {}).name || w).join(", ")}${g.ws.length > 4 ? " ועוד " + (g.ws.length - 4) : ""}</div>
              <div class="sub2">נרשמו בתור: ${g.reg.slice(0, 2).map(([id, n]) => ((sitesById[id] || {}).name || "—") + " (" + n + ")").join(" · ")}</div></div>
            <a class="btn" style=${{ flex:"none" }} href=${mapL(g.ctr.lat, g.ctr.lng)} target="_blank" rel="noopener">🗺 במפה</a>
          </div>
          <div class="locbtns">
            ${g.cand.slice(0, 3).map(([id, k]) => html`<button key=${id} class="btn ok" onClick=${()=>setLoc(id, g, false)}>✓ זה ${sitesById[id].name}${g.ws.length > 1 ? " (" + k + "/" + g.ws.length + ")" : ""}</button>`)}
            ${(g.cand.length ? [] : g.moves.slice(0, 1)).map(([id]) => html`<button key=${"m" + id} class="btn" onClick=${()=>setLoc(id, g, true)}>↔ להזיז את ${sitesById[id].name} לכאן</button>`)}
            <select class="tin" value=${other[i] || ""} onChange=${e => { const v = e.target.value; setOther(o => ({ ...o, [i]:v })); if(v) setLoc(v, g, sitesById[v].lat != null); }}>
              <option value="">אתר אחר…</option>
              ${act.slice().sort((a, b) => a.name.localeCompare(b.name, "he")).map(x => html`<option key=${x.id} value=${x.id}>${x.name}${x.lat != null ? " (ממופה)" : ""}</option>`)}
            </select>
          </div>
        </div>`)}
        ${unmapped.length > 0 && html`<div class="sub2" style=${{ marginTop:10 }}><b>עדיין בלי מיקום:</b> ${unmapped.map(x => x.name).join(" · ")}</div>`}
      </div>

      <div class="card">
        <div class="lbl">🚫 עובדים שהטלפון שלהם חוסם מיקום (${days} יום)</div>
        <div class="sub2">כשהעובד מחתים, הוא רואה עכשיו הסבר בשפה שלו איך לאשר מיקום. אם זה חוזר — כדאי לעזור לו פעם אחת בשטח.</div>
        ${!denList.length && html`<div class="empty" style=${{ padding:"14px 0" }}>אין 👍</div>`}
        ${denList.map(([w, d]) => html`<div key=${w} class="rowbet" style=${{ padding:"8px 0", borderTop:"1px solid var(--line-2)", gap:8 }}>
          <div><b>${(Wm[w] || {}).name || w}</b><div class="sub2">${(sitesById[d.site] || {}).name || ""} · אחרון ${d.last.slice(8) + "/" + d.last.slice(5, 7)}${okW.has(w) ? " · לפעמים כן נותן מיקום" : ""}</div></div>
          <div style=${{ textAlign:"end", flex:"none" }}><b>${d.n}</b><div class="sub2">${d.ios > d.n / 2 ? "אייפון" : "אנדרואיד"}</div></div>
        </div>`)}
      </div>
    </div>`;
  }

  function Attendance({ st, now, mgr, who, notify, office, av, setAv }){
    office = office && !RO.on;   // צופה רואה כמו המשרד, אבל לא מריץ את פעולות התחזוקה של המשרד
    const [code, setCode] = useState(null);
    const [err, setErr] = useState("");
    const [view0, setView0] = useState("day");
    const view = av || view0;
    const setView = v => { setView0(v); if(setAv) setAv(v); };
    const [day, setDay] = useState(()=> dstr(Date.now()));
    const [month, setMonth] = useState(()=> dstr(Date.now()).slice(0, 7));
    const [rws, setRws] = useState(()=> addDay(wkStartOf(dstr(Date.now())), -7));
    const [rdata, setRdata] = useState(null);
    const [rbusy, setRbusy] = useState("");
    const [rels, setRels] = useState([]);
    const [workers, setWorkers] = useState([]);
    const [asites, setAsites] = useState([]);
    const [asLoaded, setAsLoaded] = useState(false);
    const [punches, setPunches] = useState([]);
    const [fixes, setFixes] = useState([]);
    const [mdata, setMdata] = useState(null);
    const [sheet, setSheet] = useState(null);
    const [gallery, setGallery] = useState({});
    const [photos, setPhotos] = useState({});
    const [big, setBig] = useState(null);
    const [refs, setRefs] = useState({});
    const [mstat, setMstat] = useState(null);
    const [delRun, setDelRun] = useState(null);
    const [agencies, setAgencies] = useState([]);
    const [agReps, setAgReps] = useState([]);
    const [agAcks, setAgAcks] = useState([]);
    const B = useMemo(()=> code && Cloud.db ? Cloud.db.collection("t").doc(code) : null, [code]);

    // קוד הנוכחות נוצר פעם אחת ונשמר במסד הבקרה — כל המנהלים רואים את אותו מרחב
    useEffect(()=>{
      if(!Cloud.on) return;
      const ref = Cloud.base.collection("meta").doc("att");
      return ref.onSnapshot(d => {
        if(d.exists && d.data().code) setCode(d.data().code);
        else if(!d.metadata.fromCache && !office) setErr("מרחב הנוכחות עוד לא נפתח — המשרד צריך לפתוח את לשונית הנוכחות פעם אחת");
        else if(!d.metadata.fromCache)
          Cloud.db.runTransaction(tx => tx.get(ref).then(x => { if(!x.exists || !x.data().code) tx.set(ref, { code: rid(24), at: Date.now(), by: who }); }))
            .catch(e => setErr(String(e.code || e.message || e)));
      }, e => setErr(String(e.code || e.message || e)));
    }, []);

        if(!per.has(r.w)) per.set(r.w, { w:r.w, name:r.name, home, days:0, ms:0, open:0, fixed:0, rows:[] });
        const a = per.get(r.w);
        a.rows.push(r); a.ms += r.ms; if(r.ms > 0) a.days++; if(r.openFlags.length) a.open++; if(r.fix) a.fixed++;
      });
      const list = [...per.values()].sort((a, b) => a.name.localeCompare(b.name, "he"));
      const totalOpen = list.reduce((s, a) => s + a.open, 0);
      const [y, m] = month.split("-").map(Number);
      const shiftMonth = n => { const d = new Date(y, m - 1 + n, 1); setMonth(d.getFullYear() + "-" + pad2(d.getMonth() + 1)); };
      function exportX(){
        const sName = id => (sitesById[id] && sitesById[id].name) || "";
        const summary = [["עובד", "אתר קבוע", "ימי עבודה", "סה״כ שעות", "ימים לבדיקה", "ימים שתוקנו"]];
        const detail = [["תאריך", "יום", "עובד", "אתר", "כניסה", "יציאה", "שעות", "מקור", "תוקן ע״י", "סיבת תיקון", "הערות לבדיקה"]];
        list.forEach(a => {
          summary.push([a.name, sName(a.home), a.days, hrs(a.ms), a.open, a.fixed]);
          a.rows.forEach(r => {
            const d = dayDate(r.day);
            detail.push([pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1) + "/" + d.getFullYear(), WDAY[d.getDay()], r.name, r.sites.map(sName).filter(Boolean).join(" + ") || sName(r.site),
              hm(r.inT), r.outT == null ? "" : hm(r.outT), hrs(r.ms), r.fix ? (r.fix.absent ? "סומן כהיעדרות" : r.ps.length ? "תוקן/אושר ע״י מנהל" : "הוזן ידנית") : "סלפי",
              r.fix ? r.fix.by || "" : "", r.fix ? r.fix.reason || "" : "", r.openFlags.map(f => f.t).join(", ")]);
          });
        });
        const tag = mgr === "all" ? "" : " - " + mgr;
        saveFile(xlsxBlob([
          { name:"סיכום", rows:summary, widths:[22, 24, 11, 11, 13, 13] },
          { name:"פירוט יומי", rows:detail, widths:[12, 6, 22, 26, 9, 9, 8, 18, 12, 28, 34] }
        ]), "נוכחות " + pad2(m) + "-" + y + tag + ".xlsx");
        if(mgr === "all") B.collection("months").doc(month).set({ exportedAt:FV(), exportedBy:who }, { merge:true }).catch(()=>{});
        notify("קובץ האקסל הופק");
      }
      // מחיקת תמונות: רק מהמשרד (כל האתרים), רק לחודש שהסתיים, ורק אחרי הפקת האקסל
      const phIds = mdata && mdata.punches ? [...new Set(mdata.punches.map(p => p.id))].sort() : [];
      const ended = month < dstr(now).slice(0, 7);
      const ms = mstat || {};
      // חברות כ״א שיש להן עובדים: כל השבועות של החודש חייבים להיות נעולים ומאושרים לפני מחיקת התמונות
      const agPend = agencies.filter(a => a.active !== false && workers.some(w => w.agency === a.id)).flatMap(a => {
        const mo = agMonth(month, a.id, agReps, agAcks);
        const miss = mo.weeks.filter(x => !(x.ack && x.ack.status === "approved")).map(x => x.ws.slice(8) + "/" + x.ws.slice(5, 7));
        return miss.length ? [a.name + " (שבועות " + miss.join(", ") + ")"] : [];
      });
      let photoCard = null;
      if(mgr === "all" && mdata && mdata.punches){
        const when = x => tsMs(x) ? dmy(tsMs(x)) + " " + hhmm(tsMs(x)) : "";
        let body;
        if(ms.phDeletedAt) body = html`<div class="sub2">✓ התמונות של החודש נמחקו ב-${when(ms.phDeletedAt)} ע״י ${ms.phDeletedBy || ""}. השעות, הרישומים, המיקומים והתיקונים נשמרו, וכך גם תמונות הזיהוי של העובדים.</div>`;
        else if(!phIds.length) body = html`<div class="sub2">אין תמונות בחודש הזה.</div>`;
        else if(!ended) body = html`<div class="sub2">אפשר למחוק את התמונות רק אחרי שהחודש נגמר והאקסל לשכר הופק.</div>`;
        else if(!ms.exportedAt) body = html`<div class="sub2">קודם מפיקים את קובץ האקסל לשכר (למעלה), ורק אז אפשר למחוק את התמונות.</div>`;
        else if(agPend.length) body = html`<div class="sub2">התמונות הן הראיה לשעות. אפשר למחוק אותן רק אחרי שחברות כ״א אישרו את כל השבועות של החודש. עוד חסר: ${agPend.join(" · ")}.</div>`;
        else body = html`
          <div class="sub2">האקסל הופק ב-${when(ms.exportedAt)} ע״י ${ms.exportedBy || ""}. ${totalOpen > 0 ? html`<b style=${{ color:"var(--crit)" }}>שימו לב: ${totalOpen} ימים עוד לא נבדקו — אחרי המחיקה לא תהיה תמונה לבדוק לפיה.</b>` : ""}</div>
          ${delRun && html`<div class="sub2" style=${{ marginTop:6 }}>נמחקו ${delRun.done} מתוך ${delRun.total}${delRun.err ? "" : "…"}</div>`}
          ${delRun && delRun.err && html`<div class="alert warn" style=${{ marginTop:8 }}><span class="b"></span>${delRun.err}</div>`}
          <button class="btn wide" style=${{ marginTop:10, color:"var(--crit)" }} disabled=${delRun && !delRun.err}
            onClick=${()=> confirm("למחוק " + (phIds.length - (ms.phDone || 0)) + " תמונות של " + pad2(m) + "/" + y + "?\n\nאי אפשר לשחזר אותן. השעות, הרישומים והתיקונים נשארים, וגם תמונות הזיהוי של העובדים.") && deletePhotos(phIds)}>
            🗑 ${ms.phDone ? "המשך מחיקה (" + ms.phDone + " מתוך " + phIds.length + " כבר נמחקו)" : "מחיקת " + phIds.length + " התמונות של החודש"}
          </button>`;
        photoCard = html`<div class="card" style=${{ marginTop:12 }}><div class="lbl">תמונות החודש</div>${body}</div>`;
      }
      content = html`
        <div class="rowbet adate">
          <button class="chip" onClick=${()=>shiftMonth(-1)}>‹ הקודם</button>
          <b>${pad2(m)}/${y}</b>
          <button class="chip" disabled=${month >= dstr(now).slice(0, 7)} onClick=${()=>shiftMonth(1)}>הבא ›</button>
        </div>
        ${!mdata || mdata.loading ? html`<div class="empty">טוען את החודש…</div>` : html`
          ${totalOpen > 0
            ? html`<div class="alert crit" style=${{ margin:"12px 0" }}><span class="b"></span>${totalOpen} ימי עבודה עם חריגים שלא נבדקו — כדאי לאשר או לתקן אותם לפני העברה לשכר.</div>`
            : list.length > 0 && html`<div class="alert empty" style=${{ margin:"12px 0" }}><span class="b"></span>כל הימים בחודש נבדקו — מוכן להעברה לשכר.</div>`}
          <button class="btn pri rokeep wide" disabled=${!list.length} onClick=${exportX}>⬇ ייצוא לאקסל לשכר${mgr !== "all" ? " (" + mgr + ")" : ""}</button>
          <div class="card" style=${{ marginTop:12, padding:"6px 12px" }}>
            <div class="arow head"><span class="an">עובד</span><span class="at">ימים</span><span class="ah">שעות</span><span class="af">לבדיקה</span></div>
            ${list.map(a => html`
              <details key=${a.w} class="amon">
                <summary class="arow">
                  <span class="an">${a.name}<small>${(sitesById[a.home] && sitesById[a.home].name) || ""}</small></span>
                  <span class="at">${a.days}</span><span class="ah">${hrs(a.ms).toFixed(2)}</span>
                  <span class="af">${a.open ? html`<span class="aflag crit">${a.open}</span>` : html`<span class="aflag ok">✓</span>`}</span>
                </summary>
                ${a.rows.map(r => html`
                  <button key=${r.key} class=${"arow sm " + (r.openFlags.length ? "warn" : "")} onClick=${()=>{ setSheet({ kind:"row", key:r.key, month:true }); loadPhotos(r.ps.map(p => p.id)); loadRefs([r.w]); }}>
                    <span class="an">${dayLabel(r.day).replace(/\/\d{4}$/, "")}</span>
                    <span class="at">${hm(r.inT)}–${hm(r.outT)}</span><span class="ah">${hrs(r.ms).toFixed(2)}</span>
                    <span class="af">${flagChips(r.openFlags, true)}${r.fix ? html`<i class="afix">✎</i>` : null}</span>
                  </button>`)}
              </details>`)}
            ${list.length === 0 && html`<div class="empty" style=${{ padding:"20px 0" }}>אין רישומים בחודש הזה.</div>`}
          </div>
          ${photoCard}`}`;
    }

    if(view === "rev"){
      const ready = rdata && rdata.punches && rdata.ws === rws;
      const all = ready ? dayRows(rdata.punches, rdata.fixes, workers, sitesById, now).filter(r => r.openFlags.length) : [];
      // ימים בלי כניסה או בלי יציאה — חסרה שעה, אי אפשר לאשר אותם כמו שהם
      const needTime = r => r.openFlags.some(f => f.k === "noout" || f.k === "noin" || (f.k === "quick" && f.sev === "crit"));
      const bySite = new Map();
      all.forEach(r => { const k = visIds.has(r.site) ? r.site : (mgr === "all" ? "_none" : null); if(k == null) return; if(!bySite.has(k)) bySite.set(k, []); bySite.get(k).push(r); });
      const list = [...visSites.filter(s => bySite.has(s.id)), ...(bySite.has("_none") ? [{ id:"_none", name:"ללא אתר / אתר לא פעיל" }] : [])];
      const tot = [...bySite.values()].reduce((s, a) => s + a.length, 0);
      content = html`
        <div class="rowbet adate">
          <button class="chip" onClick=${()=>setRws(addDay(rws, -7))}>‹ שבוע קודם</button>
          <b>${wkLabel(rws)}</b>
          <button class="chip" disabled=${addDay(rws, 7) > dstr(now)} onClick=${()=>setRws(addDay(rws, 7))}>שבוע הבא ›</button>
        </div>
        <div class="hint" style=${{ textAlign:"start", margin:"8px 0" }}>כל הימים בשבוע שסומנו לבדיקה, לפי אתר. לוחצים על שורה כדי לראות תמונות ומיקום ולתקן. <b>"אשר את כל השלמים"</b> מאשר במכה אחת ימים שיש בהם כניסה ויציאה — כל אישור נרשם על שם המאשר ונשמר בהיסטוריה. ימים בלי יציאה צריכים שעת יציאה ידנית.</div>
        ${!ready ? html`<div class="empty">טוען את השבוע…</div>` : tot === 0 ? html`<div class="alert empty" style=${{ marginTop:12 }}><span class="b"></span>אין ימים לבדיקה בשבוע הזה${mgr !== "all" ? " באתרים של " + mgr : ""}.</div>` : html`
          <div class="kpis"><div class="kpi crit"><b>${tot}</b><span>ימים לבדיקה</span></div><div class="kpi"><b>${list.length}</b><span>אתרים</span></div></div>
          <div class="asites">
            ${list.map(s => {
              const rs = bySite.get(s.id).slice().sort((a, b) => a.day.localeCompare(b.day) || a.name.localeCompare(b.name, "he"));
              const okList = rs.filter(r => !needTime(r)), timeN = rs.length - okList.length;
              return html`
                <div key=${s.id} class="card asite">
                  <div class="rowbet">
                    <div><b>${s.name}</b><div class="sub2">${s.owner ? ownerName(s) + " · " : ""}${rs.length} לבדיקה${timeN ? " · " + timeN + " בלי שעת יציאה/כניסה" : ""}</div></div>
                  </div>
                  ${okList.length > 0 && html`<button class="btn ok wide roh" style=${{ marginTop:8 }} disabled=${!!rbusy} onClick=${()=>bulkApprove(okList, s.name)}>${rbusy === s.name ? "מאשר…" : "✓ אשר את כל השלמים (" + okList.length + ")"}</button>`}
                  <div class="arows">
                    ${rs.map(r => html`
                      <button key=${r.key} class=${"arow sm " + (needTime(r) || r.openFlags.some(f => f.sev === "crit") ? "crit" : "warn")} onClick=${()=>{ setSheet({ kind:"row", key:r.key, rev:true }); loadPhotos(r.ps.map(p => p.id)); loadRefs([r.w]); }}>
                        <span class="an">${r.name}<small>${dayLabel(r.day).replace(/\/\d{4}$/, "")}</small></span>
                        <span class="at">${hm(r.inT)}–${hm(r.outT)}</span>
                        <span class="ah">${r.ms ? hrs(r.ms).toFixed(2) : "—"}</span>
                        <span class="af">${needTime(r) ? html`<span class="aflag crit">✎ חסרה שעה</span>` : null}${flagChips(r.openFlags.filter(f => !needTime(r) || (f.k !== "noout" && f.k !== "noin")), true)}</span>
                      </button>`)}
                  </div>
                </div>`;
            })}
          </div>`}`;
    }

    if(view === "ag" && mgr === "all")
      content = html`<${AttAgencies} B=${B} workers=${workers} sitesById=${sitesById} who=${who} notify=${notify} now=${now} office=${office}
        agencies=${agencies} reps=${agReps} acks=${agAcks} onReview=${ws => { setRws(ws); setView("rev"); }} />`;
    if(view === "loc")
      content = html`<${AttLoc} B=${B} workers=${workers} sitesById=${sitesById} visSites=${visSites} visIds=${visIds} who=${who} notify=${notify} />`;
    if(view === "workers")
      content = html`<${AttWorkers} B=${B} code=${code} workers=${workers} visSites=${visSites} mgr=${mgr} who=${who} notify=${notify} rels=${rels} />`;

    // ── חלוניות ──
    let sheetEl = null;
    if(sheet && sheet.kind === "row"){
      const src = sheet.rev && rdata && rdata.punches ? rdata : sheet.month && mdata && mdata.punches ? mdata : { punches, fixes };
      const [wid, sday] = sheet.key.split("|");
      const r = dayRows(src.punches.filter(p => p.w === wid && p.day === sday), src.fixes.filter(f => f.w === wid && f.day === sday), workers, sitesById, now)[0];
      const w = workers.find(x => x.id === wid);
      const hist = src.fixes.filter(f => f.w === wid && f.day === sday).sort((a, b) => (tsMs(b.at) || 0) - (tsMs(a.at) || 0));
      sheetEl = html`<${AttRowSheet} key=${sheet.key} r=${r} w=${w} day=${sday} hist=${hist} photos=${photos} sitesById=${sitesById} onBig=${setBig}
        refUrl=${refs[wid]} onSetRef=${pid => setRef(wid, pid)}
        onClose=${()=>setSheet(null)}
        onSave=${fx => {
          const id = sday.replace(/-/g, "") + "_" + wid + "_" + rid(5);
          B.collection("fix").doc(id).set({ id, w:wid, day:sday, ...fx, by:who, at:FV() })
            .then(()=>{ if(sheet.month) loadMonth(); if(sheet.rev) loadRev(); }).catch(e => notify("שמירה נכשלה: " + (e.code || e.message)));
          setSheet(null); notify(fx.approved ? "סומן כנבדק" : "התיקון נשמר — הרישום המקורי נשאר ביומן");
        }} />`;
    }
    if(sheet && sheet.kind === "loc"){
      const s = sitesById[sheet.site] || {};
      const pts = punches.filter(p => p.site === sheet.site && p.lat != null && (p.acc || 999) < 150);
      const med = a => { const x = a.slice().sort((p, q) => p - q); return x[Math.floor(x.length / 2)]; };
      const save = (lat, lng, how) => {
        B.collection("sites").doc(docKey(sheet.site)).set({ lat, lng, r: s.r || ATT_R, locBy:who, locAt:Date.now(), locHow:how }, { merge:true });
        setSheet(null); notify("מיקום האתר נשמר");
      };
      const here = ()=> navigator.geolocation ? navigator.geolocation.getCurrentPosition(
        p => save(p.coords.latitude, p.coords.longitude, "מיקום המנהל"), ()=> notify("לא התקבל מיקום מהמכשיר"), { enableHighAccuracy:true, timeout:20000 }) : notify("המכשיר לא תומך במיקום");
      sheetEl = html`
        <div class="scrim" onClick=${()=>setSheet(null)}>
          <div class="sheet" onClick=${e => e.stopPropagation()}>
            <h3>📍 מיקום האתר · ${s.name || ""}</h3>
            <div class="who">לפי המיקום הזה המערכת מסמנת רישום שנעשה רחוק מהאתר (מעל ${s.r || ATT_R} מ׳).
              ${s.lat != null ? html`<br/>מוגדר כעת: <a href=${"https://maps.google.com/?q=" + s.lat + "," + s.lng} target="_blank" rel="noopener">פתח במפה</a>${s.locBy ? " · נקבע ע״י " + s.locBy : ""}${s.locHow ? " (" + s.locHow + ")" : ""}` : html`<br/><b>עוד לא הוגדר מיקום.</b> המערכת תאתר אותו לבד ברגע שלפחות 3 רישומים של 2 עובדים יגיעו מהאתר עם GPS מדויק. אפשר גם לקבע אותו עכשיו:`}</div>
            <button class="opt" onClick=${here}><span class="e">📱</span>אני נמצא באתר עכשיו — קבע לפי המיקום שלי</button>
            <button class="opt" disabled=${pts.length < 3} onClick=${()=> save(med(pts.map(p => p.lat)), med(pts.map(p => p.lng)), "חציון רישומי " + day)}><span class="e">👷</span>לפי רישומי העובדים ביום הזה (${pts.length} רישומים עם מיקום מדויק)</button>
            <label class="afield">רדיוס האתר (מטר)
              <input type="number" min="50" max="3000" step="50" value=${s.r || ATT_R} onChange=${e => { const v = Math.max(50, Math.min(3000, +e.target.value || ATT_R)); B.collection("sites").doc(docKey(sheet.site)).set({ r:v }, { merge:true }); }} />
            </label>
            <button class="btn wide" style=${{ marginTop:10 }} onClick=${()=>setSheet(null)}>סגור</button>
          </div>
        </div>`;
    }

    return html`
      <div class="att">
        <div class="chips navchips" style=${{ marginTop:0 }}>
          ${T("day", "יומי")}
          ${T("month", "חודשי ושכר")}
          ${T("rev", "לבדיקה")}
          ${mgr === "all" && T("ag", "חברות כ״א")}
          ${T("workers", "עובדים (" + workers.filter(w => w.active !== false && (mgr === "all" || wSites(w).some(x => visIds.has(x)))).length + ")")}
          ${T("loc", "📍 מיקום")}
        </div>
        ${err && html`<div class="alert crit" style=${{ marginBottom:10 }}><span class="b"></span>${err}</div>`}
        ${relOpen.length > 0 && html`
          <div class="card" style=${{ marginBottom:12, borderColor:"var(--warn)" }}>
            <div class="lbl">📱 עובדים שמבקשים לאשר טלפון חדש (${relOpen.length})</div>
            <div class="sub2" style=${{ marginBottom:6 }}>העובד פתח את הקישור בטלפון או בדפדפן אחר. אם זה באמת הוא — מאשרים, והוא לוחץ "נסה שוב" באותו קישור. לא צריך לשלוח קישור חדש.</div>
            ${relOpen.map(({ r, w }) => html`
              <div key=${r.id} class="rowbet" style=${{ padding:"8px 0", borderTop:"1px solid var(--line-2)", gap:8, flexWrap:"wrap" }}>
                <div><b>${w.name}</b><div class="sub2">${(sitesById[w.site] && sitesById[w.site].name) || ""} · ${tsMs(r.at) ? dmy(tsMs(r.at)) + " " + hhmm(tsMs(r.at)) : ""} · ${relDevTxt(r)}</div></div>
                <div class="roh" style=${{ display:"flex", gap:6 }}>
                  <button class="btn ok" onClick=${()=>relDecide(r, true)}>✓ אשר</button>
                  <button class="btn" onClick=${()=> confirm("לדחות את הבקשה של " + w.name + "?") && relDecide(r, false)}>דחה</button>
                </div>
              </div>`)}
          </div>`}
        ${content}
        <div class="hint">כל עובד נרשם מהטלפון שלו עם סלפי. השעה נלקחת מהשרת (לא מהטלפון), ונשמרים גם המיקום והטלפון שממנו נרשם. תיקון של מנהל לא מוחק את הרישום המקורי: הוא נשמר עם שם המתקן והסיבה.</div>
        ${sheetEl}
        ${big && html`<div class="lightbox" onClick=${()=>setBig(null)}><img src=${big} alt="" /><button class="x">✕</button></div>`}
      </div>`;
  }

  /* ═════════════ דוחות שעות לחברות כ״א ═════════════
     המשרד נועל שבוע שהסתיים (א׳–ש׳) לכל חברה ← נוצר דוח קבוע (agreports). נעילה חוזרת = גרסה חדשה,
     והגרסה הקודמת נשמרת בדיוק כמו שהייתה (agreportsv). החברה רואה רק את הדוחות שלה ומאשרת או משיגה (agacks).
     הסכום: שעות × התעריף לשעה של החברה, בלי חישוב שעות נוספות אצלנו. אין בדוח תמונות, מיקומים או טלפונים. */
  const AG_RATE = 75;
  const r2 = x => Math.round((Number(x) || 0) * 100) / 100;

      }catch(e){ notify("השמירה נכשלה: " + (e.code || e.message)); }

    function copyMissing(){

      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(()=> notify(missing.length + " שורות הועתקו — הדבק בלשונית עובדים ← הוספת כמה עובדים"))

    return html`
      <div class="agimp">
        <b>📥 ייבוא רשימה מהחברה</b>
        <div class="sub2">קובץ אקסל מהחברה עם עמודות "מספר עובד" ושם. הקובץ נקרא רק במכשיר הזה. נשמרים רק החברה ומספר העובד — טלפונים ושאר העמודות לא נשמרים.</div>
        <div class="btnrow" style=${{ marginTop:8, alignItems:"center" }}>
          <select class="tin" style=${{ fontFamily:"inherit", flex:"1 1 140px", width:"auto" }} value=${ag} onChange=${e => { setAg(e.target.value); setData(null); }}>
            <option value="">בחר חברה…</option>
            ${act.map(a => html`<option key=${a.id} value=${a.id}>${a.name}</option>`)}
          </select>
          <label class=${"btn " + (agOk ? "pri" : "")} style=${{ flex:"none", opacity:agOk ? 1 : .5, pointerEvents:agOk ? "auto" : "none" }}>בחר קובץ
            <input type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style=${{ display:"none" }} onChange=${onFile} />
          </label>
        </div>
        ${agOk && !data && html`<details style=${{ marginTop:6 }}><summary class="sub2">או הדבקה של הטבלה מאקסל</summary>
          <textarea class="tin" rows="4" style=${{ marginTop:6 }} placeholder="מעתיקים מאקסל את הטבלה כולל שורת הכותרת" value=${paste} onInput=${e => setPaste(e.target.value)}></textarea>
          <button class="chip" disabled=${!paste.trim()} onClick=${()=>load(paste.split(/\r?\n/).map(l => l.split("\t")))}>קרא את הטבלה</button>
        </details>`}
        ${err && html`<div class="alert crit" style=${{ marginTop:8 }}><span class="b"></span>${err}</div>`}
        ${data && html`
          <div class="kpis" style=${{ marginTop:10 }}>
            <div class="kpi"><b>${data.rows.length}</b><span>בקובץ</span></div>
            <div class="kpi"><b>${data.auto.filter(Boolean).length}</b><span>זוהו לבד</span></div>
            <div class="kpi"><b>${chosen}</b><span>עם עובד</span></div>
            <div class=${"kpi " + (missing.length ? "warn" : "")}><b>${missing.length}</b><span>בלי עובד</span></div>
          </div>
          <div class="sub2" style=${{ margin:"8px 0" }}>לבדוק כל שורה: השם מהקובץ מימין, העובד בבקרה משמאל. התאמה אוטומטית מסומנת ✓ — גם אותה כדאי לעבור בעין.</div>
          <button class=${"chip " + (onlyOpen ? "on" : "")} onClick=${()=>setOnlyOpen(!onlyOpen)}>רק מה שלא זוהה לבד</button>
          ${data.rows.map((r, i) => {
            if(onlyOpen && data.auto[i]) return null;
            const w = data.pick[i] && wById.get(data.pick[i]);
            const sug = new Set(data.cand[i].map(c => c.w));
            return html`
              <div key=${i} class="agw">
                <span class="an">${data.auto[i] ? (data.cand[i][0] && data.cand[i][0].s === 9 ? "✓ לפי מספר · " : "✓ ") : ""}<bdi>#${r.empNo || "—"}</bdi> <bdi>${r.name}</bdi><small>${r.proj}${w && w.agency && w.agency !== ag ? " · ⚠ היום ב-" + agName(w.agency) : ""}${w && cnt[w.id] > 1 ? " · ⚠ נבחר פעמיים" : ""}${w && !r.empNo ? " · ⚠ אין מספר עובד" : ""}</small></span>
                <select style=${{ maxWidth:"52%" }} class=${w && cnt[w.id] > 1 ? "bad" : ""} value=${data.pick[i]} onChange=${e => setPick(i, e.target.value)}>
                  <option value="">— אין בבקרה —</option>
                  ${data.cand[i].length > 0 && html`<optgroup label="הצעות">${data.cand[i].map(c => wById.get(c.w) && html`<option key=${c.w} value=${c.w}>${wById.get(c.w).name} · ${sName(wById.get(c.w).site)}</option>`)}</optgroup>`}
                  <optgroup label="כל העובדים">${sorted.filter(x => !sug.has(x.id)).map(x => html`<option key=${x.id} value=${x.id}>${x.name} · ${sName(x.site)}</option>`)}</optgroup>
                </select>
              </div>`;
          })}
          ${dups > 0 && html`<div class="alert crit" style=${{ marginTop:8 }}><span class="b"></span>אותו עובד נבחר ליותר משורה אחת. מתקנים לפני השמירה.</div>`}
          ${noNo > 0 && html`<div class="alert warn" style=${{ marginTop:8 }}><span class="b"></span>${noNo} שורות בלי מספר עובד — הן לא יישמרו.</div>`}
          ${notInFile.length > 0 && html`<div class="alert warn" style=${{ marginTop:8 }}><span class="b"></span>${notInFile.length} עובדים משויכים היום ל-${agName(ag)} ולא נבחרו לאף שורה בקובץ: ${notInFile.slice(0, 8).map(w => w.name).join(", ")}${notInFile.length > 8 ? "…" : ""}. השיוך שלהם לא משתנה.</div>`}
          ${missing.length > 0 && html`<div class="sub2" style=${{ marginTop:8 }}>${missing.length} עובדים מהקובץ לא נמצאו בבקרה. אם הם עובדים אצלנו, מוסיפים אותם בלשונית עובדים ← "הוספת כמה עובדים" ואז מייבאים שוב. <button class="chip" onClick=${copyMissing}>📋 העתק את הרשימה</button></div>`}
          <div class="btnrow" style=${{ marginTop:10 }}>
            <button class="btn pri" disabled=${busy || dups > 0 || !chosen} onClick=${save}>${busy ? "שומר…" : "💾 שמור שיוך (" + data.rows.filter((r, i) => data.pick[i] && r.empNo).length + ")"}</button>
            <button class="btn" onClick=${()=>setData(null)}>ביטול</button>
          </div>`}
      </div>`;
  }
  function AttAgencies({ B, workers, sitesById, who, notify, now, office, agencies, reps, acks, onReview }){
    const today = dstr(now);
    const [ws, setWs] = useState(()=> addDay(wkStartOf(dstr(Date.now())), -7));
    const [wd, setWd] = useState(null);
    const [busy, setBusy] = useState("");
    const [open, setOpen] = useState(null);
    const [nag, setNag] = useState({ name:"", rate:String(AG_RATE) });
    const [onlyNone, setOnlyNone] = useState(true);
    const [q, setQ] = useState("");
    const we = addDay(ws, 6), ended = addDay(ws, 7) <= today;
    function loadWeek(){
      setWd(null);
      Promise.all([
        B.collection("punch").where("day", ">=", ws).where("day", "<=", we).get(),
        B.collection("fix").where("day", ">=", ws).where("day", "<=", we).get()
      ]).then(([p, f]) => setWd({ ws, punches:p.docs.map(d => d.data({ serverTimestamps:"estimate" })), fixes:f.docs.map(d => d.data({ serverTimestamps:"estimate" })) }))
        .catch(e => { setWd({ ws, err:String(e.code || e.message || e) }); });
    }
    useEffect(()=>{ if(B) loadWeek(); }, [B, ws]);
    const wById = new Map(workers.map(w => [w.id, w]));
    const rows = wd && wd.punches ? dayRows(wd.punches, wd.fixes, workers, sitesById, now) : [];
    const act = agencies.filter(a => a.active !== false).sort((a, b) => String(a.name).localeCompare(String(b.name), "he"));
    const agName = id => { const a = agencies.find(x => x.id === id); return a ? a.name : ""; };

    async function lock(ag, built, rep){
      if(!confirm((rep ? "לנעול מחדש (גרסה " + built.version + ")" : "לנעול") + " את שבוע " + wkLabel(ws) + " של " + ag.name + "?\n\n" +
        built.tot.length + " עובדים · " + built.totalHrs + " שעות · " + nis(built.amount) +
        "\n\nהדוח יישלח לאישור החברה." + (rep ? " הגרסה הקודמת נשמרת כמו שהיא." : ""))) return;
      setBusy(ag.id);
      try{
        const batch = Cloud.db.batch();
        if(rep) batch.set(B.collection("agreportsv").doc(rep.id + "_v" + rep.version), rep);
        batch.set(B.collection("agreports").doc(built.id), { ...built, lockedAt:FV() });
        await batch.commit();
        notify("השבוע ננעל ונשלח לאישור " + ag.name);
      }catch(e){ notify("הנעילה נכשלה: " + (e.code || e.message)); }
      setBusy("");
    }
    function addAgency(){
      const name = nag.name.trim(), rate = Number(nag.rate);
      if(!name || !(rate > 0)) return;
      const id = rid(8);
      B.collection("agencies").doc(id).set({ id, name, rate, active:true, at:Date.now(), by:who })
        .then(()=>{ notify(name + " נוספה"); setNag({ name:"", rate:String(AG_RATE) }); }).catch(e => notify("שמירה נכשלה: " + (e.code || e.message)));
    }
    const updAg = (a, patch) => B.collection("agencies").doc(a.id).set(patch, { merge:true }).catch(e => notify("שמירה נכשלה: " + (e.code || e.message)));
    const updW = (w, patch) => B.collection("workers").doc(w.id).set(patch, { merge:true }).catch(e => notify("שמירה נכשלה: " + (e.code || e.message)));

    const month = addDay(ws, 3).slice(0, 7);   // החודש של רוב ימי השבוע
    const wl = workers.filter(w => w.active !== false && (!onlyNone || !w.agency) && (!q || String(w.name).includes(q.trim())))
      .sort((a, b) => String(a.name).localeCompare(String(b.name), "he"));
    const sName = id => (sitesById[id] && sitesById[id].name) || "";

    return html`
      <div>
        <div class="rowbet adate">
          <button class="chip" onClick=${()=>setWs(addDay(ws, -7))}>‹ שבוע קודם</button>
          <b>${wkLabel(ws)}</b>
          <button class="chip" disabled=${addDay(ws, 7) > today} onClick=${()=>setWs(addDay(ws, 7))}>שבוע הבא ›</button>
        </div>
        ${!act.length && html`<div class="alert warn" style=${{ margin:"12px 0" }}><span class="b"></span>עוד לא הוגדרו חברות כ״א. מוסיפים אותן למטה, ואז משייכים את העובדים.</div>`}
        ${wd && wd.err && html`<div class="alert crit" style=${{ margin:"12px 0" }}><span class="b"></span>${wd.err}</div>`}
        ${act.map(ag => {
          const wset = new Set(workers.filter(w => w.agency === ag.id).map(w => w.id));
          const ar = rows.filter(r => wset.has(r.w));
          const opn = ar.filter(r => r.openFlags.length);
          const rep = reps.find(r => r.id === ag.id + "_" + ws) || null, ack = ackOf(rep, acks);
          const built = wd && wd.punches && wd.ws === ws ? agBuild(ag, ws, ar, wById, sitesById, who, rep) : null;
          const changed = rep && built && !agSame(rep, built);
          const canLock = office && ended && built && !opn.length && (!rep || changed) && busy !== ag.id;
          const mo = agMonth(month, ag.id, reps, acks);
          return html`
            <div key=${ag.id} class="card" style=${{ marginTop:12 }}>
              <div class="rowbet">
                <div><b>${ag.name}</b><div class="sub2">${wset.size} עובדים משויכים · ${nis(ag.rate || AG_RATE)} לשעה</div></div>
                <span class=${"aflag " + (!rep ? "warn" : ack && ack.status === "approved" ? "ok" : ack ? "crit" : "warn")}>${!rep ? "לא נעול" : ack ? (ack.status === "approved" ? "✓ אושר" : "⚠ השגה") : "ממתין לאישור"}</span>
              </div>
              ${!wd ? html`<div class="sub2" style=${{ marginTop:8 }}>טוען את השבוע…</div>` : html`
                <div class="kpis" style=${{ marginTop:10 }}>
                  <div class="kpi"><b>${built ? built.tot.length : "—"}</b><span>עובדים</span></div>
                  <div class="kpi"><b>${built ? built.totalHrs.toFixed(2) : "—"}</b><span>שעות</span></div>
                  <div class="kpi"><b>${built ? nis(built.amount) : "—"}</b><span>לתשלום</span></div>
                  <div class=${"kpi " + (opn.length ? "crit" : "")}><b>${opn.length}</b><span>לבדיקה</span></div>
                </div>
                ${!ended && html`<div class="sub2" style=${{ marginTop:8 }}>השבוע עוד לא הסתיים — נועלים אחרי מוצאי שבת.</div>`}
                ${ended && opn.length > 0 && html`<div class="alert crit" style=${{ marginTop:8 }}><span class="b"></span>אי אפשר לנעול: ${opn.length} ימים לבדיקה — ${opn.slice(0, 6).map(r => r.name + " " + dmyS(r.day).slice(0, 5)).join(", ")}${opn.length > 6 ? "…" : ""}.</div>
                  <button class="btn wide" style=${{ marginTop:8 }} onClick=${()=>onReview && onReview(ws)}>🔍 פתח את רשימת הבדיקה של השבוע</button>`}
                ${changed && html`<div class="alert warn" style=${{ marginTop:8 }}><span class="b"></span>השעות השתנו מאז הנעילה (תיקון אחרי נעילה). צריך לנעול מחדש — החברה תקבל גרסה ${rep.version + 1} עם פירוט השינויים.</div>`}
                ${office && ended && (!rep || changed) && html`<button class="btn pri wide" style=${{ marginTop:10 }} disabled=${!canLock} onClick=${()=>lock(ag, built, rep)}>${busy === ag.id ? "נועל…" : rep ? "🔒 נעל מחדש ושלח (גרסה " + (rep.version + 1) + ")" : "🔒 נעל ושלח לאישור החברה"}</button>`}`}
              ${rep && html`
                <div class="sub2" style=${{ marginTop:10 }}>נעול: גרסה ${rep.version} · ${rep.totalHrs.toFixed(2)} שעות · ${nis(rep.amount)} · ${ackText(ack)}</div>
                <div class="btnrow" style=${{ marginTop:6 }}>
                  <button class="chip" onClick=${()=>setOpen(open === rep.id ? null : rep.id)}>${open === rep.id ? "הסתר" : "הצג דוח"}</button>
                  <button class="chip" onClick=${()=>agXlsx("שעות " + ag.name + " שבוע " + ws, [{ rep, ack, rows:rep.rows }])}>⬇ אקסל</button>
                </div>
                ${open === rep.id && html`<${AgRepView} rep=${rep} ack=${ack} acks=${acks} />`}`}
              <div class="sub2" style=${{ marginTop:10, paddingTop:8, borderTop:"1px solid var(--line-2)" }}>
                חודש ${monthLabel(month)} (רק שבועות נעולים): ${mo.H.toFixed(2)} שעות · ${nis(mo.A)} ·
                ${mo.weeks.map(x => html` <span key=${x.ws} class=${"aflag " + (x.ack && x.ack.status === "approved" ? "ok" : x.ack ? "crit" : "warn")}>${x.ws.slice(8)}/${x.ws.slice(5, 7)} ${!x.rep ? "לא נעול" : x.ack ? (x.ack.status === "approved" ? "✓" : "השגה") : "ממתין"}</span>`)}
                ${mo.weeks.some(x => x.rep) && html` <button class="chip" onClick=${()=>agXlsx("שעות " + ag.name + " " + monthLabel(month).replace("/", "."), mo.weeks.filter(x => x.rep).map(x => ({ rep:x.rep, ack:x.ack, rows:x.rows })))}>⬇ אקסל חודשי</button>`}
              </div>
            </div>`;
        })}

        <details class="amon card" style=${{ marginTop:14 }} open=${!act.length}>
          <summary class="lbl">חברות כ״א (${act.length})</summary>
          ${agencies.map(a => html`
            <div key=${a.id} class=${"awk " + (a.active === false ? "off" : "")}>
              <div class="an">${a.name}<small>${nis(a.rate || AG_RATE)} לשעה${a.active === false ? " · מושבתת" : ""}</small></div>
              ${office && html`<div class="awkb">
                <button class="chip" onClick=${()=>{ const v = prompt("תעריף לשעה (₪) ל-" + a.name, String(a.rate || AG_RATE)); if(v != null && Number(v) > 0) updAg(a, { rate:Number(v) }); }}>₪</button>
                <button class="chip" onClick=${()=>{ const v = prompt("שם החברה", a.name); if(v && v.trim()) updAg(a, { name:v.trim() }); }}>✎</button>
                <button class="chip" onClick=${()=> a.active === false ? updAg(a, { active:true }) : confirm("להשבית את " + a.name + "? הדוחות הקודמים נשמרים.") && updAg(a, { active:false })}>${a.active === false ? "הפעל" : "השבת"}</button>
              </div>`}
            </div>`)}
          ${office && html`<div class="newunit roh" style=${{ display:"flex", gap:8, flexWrap:"wrap", marginTop:8 }}>
            <input type="text" style=${{ flex:"2 1 160px" }} placeholder="שם החברה" value=${nag.name} onInput=${e => setNag({ ...nag, name:e.target.value })} />
            <input type="number" inputMode="decimal" style=${{ flex:"1 1 80px" }} placeholder="₪ לשעה" value=${nag.rate} onInput=${e => setNag({ ...nag, rate:e.target.value })} />
            <button class="btn pri" disabled=${!nag.name.trim() || !(Number(nag.rate) > 0)} onClick=${addAgency}>הוסף חברה</button>
          </div>`}
        </details>

        ${act.length > 0 && html`<details class="amon card" style=${{ marginTop:12 }}>
          <summary class="lbl">שיוך עובדים לחברות (${workers.filter(w => w.active !== false && w.agency).length} משויכים · ${workers.filter(w => w.active !== false && !w.agency).length} בלי שיוך)</summary>
          <div class="rowbet" style=${{ margin:"8px 0" }}>
            <input class="tin" style=${{ fontFamily:"inherit" }} type="search" value=${q} placeholder="חיפוש עובד" onInput=${e => setQ(e.target.value)} />
            <button class=${"chip " + (onlyNone ? "on" : "")} style=${{ flex:"none" }} onClick=${()=>setOnlyNone(!onlyNone)}>רק בלי שיוך</button>
          </div>

          ${office && html`<${AgImport} B=${B} workers=${workers} agencies=${agencies} sitesById=${sitesById} notify=${notify} />`}
          ${wl.map(w => html`
            <div key=${w.id} class="agw">
              <span class="an">${w.name}<small>${sName(w.site)}</small></span>

              </select>
              <input type="text" disabled=${!office || !w.agency} placeholder="מס׳ עובד" value=${w.empNo || ""} maxLength=${20}
                onChange=${e => updW(w, { empNo:e.target.value.trim() })} />
            </div>`)}
          ${wl.length === 0 && html`<div class="empty" style=${{ padding:"14px 0" }}>${onlyNone ? "כל העובדים משויכים" : "לא נמצאו עובדים"}.</div>`}
        </details>`}
        <div class="hint">נועלים כל שבוע שהסתיים, אחרי שאין ימים לבדיקה. החברה מקבלת רק את השעות של העובדים שלה — שם, מספר עובד, תאריך, אתר, כניסה, יציאה ושעות. בלי תמונות ומיקומים. תיקון אחרי נעילה מחייב נעילה מחדש, והגרסה הקודמת נשמרת.</div>
      </div>`;
  }

  /* ── הפורטל של חברת כ״א: רק הדוחות שלה, אישור או השגה ── */
  function AgencyPortal({ staff, phone, notify, onLogout }){
    const [ag, setAg] = useState(null);
    const [reps, setReps] = useState(null);
    const [acks, setAcks] = useState([]);
    const [err, setErr] = useState("");
    const [open, setOpen] = useState(null);
    const [disp, setDisp] = useState(null);
    const [note, setNote] = useState("");
    const [tab, setTab] = useState("weeks");
    const [month, setMonth] = useState(()=> dstr(Date.now()).slice(0, 7));
    const B = useMemo(()=> staff.att && typeof firebase !== "undefined" ? firebase.firestore().collection("t").doc(staff.att) : null, [staff.att]);
    useEffect(()=>{
      if(!B || !staff.agency) return;
      const e = x => setErr(String(x.code || x.message || x));
      B.collection("agencies").doc(staff.agency).get().then(d => setAg(d.exists ? d.data() : { name:"" })).catch(e);
      const u1 = B.collection("agreports").where("ag", "==", staff.agency).onSnapshot(q => setReps(q.docs.map(d => d.data()).sort((a, b) => b.ws.localeCompare(a.ws))), e);
      const u2 = B.collection("agacks").where("ag", "==", staff.agency).onSnapshot(q => setAcks(q.docs.map(d => d.data({ serverTimestamps:"estimate" }))), e);
      return ()=>{ u1(); u2(); };
    }, [B]);
    function send(rep, status){
      const id = rep.id + "_v" + rep.version;
      B.collection("agacks").doc(id).set({ id, rep:rep.id, ag:staff.agency, version:rep.version, status, note: status === "approved" ? "" : note.trim(), by:staff.name, phone, at:FV() })
        .then(()=>{ notify(status === "approved" ? "הדוח אושר — תודה" : "ההשגה נשלחה למשרד"); setDisp(null); setNote(""); })
        .catch(x => notify("השליחה נכשלה: " + (x.code || x.message)));
    }
    if(!staff.att || !staff.agency) return html`<div class="screen narrow"><div class="card"><div class="lbl">החשבון עוד לא הוגדר</div><div class="hint" style=${{ textAlign:"start" }}>פנה למשרד של ט.ש. מי-רון.</div><button class="btn wide" style=${{ marginTop:12 }} onClick=${onLogout}>יציאה</button></div></div>`;

    const mSel = months.includes(month) ? month : (months[0] || month);
    const mo = agMonth(mSel, staff.agency, list, acks);
    const agn = (ag && ag.name) || (list[0] && list[0].agName) || "";
    return html`

        <div class="card" style=${{ marginTop:12 }}>
          <div class="hint" style=${{ textAlign:"start", margin:0 }}>כל שבוע (א׳–ש׳) המשרד נועל את השעות של העובדים שלכם ושולח אותן לכאן. בודקים, ולוחצים <b>"✓ מאשר"</b> — או <b>"השגה"</b> עם פירוט. תיקון אחרי נעילה מגיע כגרסה חדשה עם פירוט מה השתנה, ומחכה שוב לאישור.</div>
        </div>
        ${err && html`<div class="alert crit" style=${{ marginTop:12 }}><span class="b"></span>${err}</div>`}
        <div class="chips" style=${{ margin:"14px 0 6px" }}>
          <button class=${"chip " + (tab === "weeks" ? "on" : "")} onClick=${()=>setTab("weeks")}>שבועות${waiting.length ? " (" + waiting.length + " ממתינים)" : ""}</button>
          <button class=${"chip " + (tab === "month" ? "on" : "")} onClick=${()=>setTab("month")}>סיכום חודשי</button>
        </div>
        ${reps == null ? html`<div class="empty">טוען…</div>` : list.length === 0 ? html`<div class="empty">עוד אין דוחות נעולים.</div>`
        : tab === "weeks" ? list.map(rep => {
          const ack = ackOf(rep, acks);
          return html`
            <div key=${rep.id} class="card" style=${{ marginTop:10 }}>
              <div class="rowbet">
                <div><b>שבוע ${wkLabel(rep.ws)}</b><div class="sub2">${rep.tot.length} עובדים · ${rep.totalHrs.toFixed(2)} שעות · ${nis(rep.amount)}${rep.version > 1 ? " · גרסה " + rep.version : ""}</div></div>
                <span class=${"aflag " + (!ack ? "warn" : ack.status === "approved" ? "ok" : "crit")}>${!ack ? "ממתין לאישורך" : ack.status === "approved" ? "✓ אושר" : "⚠ השגה"}</span>
              </div>
              <div class="btnrow" style=${{ marginTop:8 }}>
                <button class="chip" onClick=${()=>setOpen(open === rep.id ? null : rep.id)}>${open === rep.id ? "הסתר" : "הצג פירוט"}</button>
                <button class="chip" onClick=${()=>agXlsx("שעות " + agn + " שבוע " + rep.ws, [{ rep, ack, rows:rep.rows }])}>⬇ אקסל</button>
              </div>
              ${(open === rep.id || !ack) && html`<${AgRepView} rep=${rep} ack=${ack} acks=${acks} />`}
              ${ack && html`<div class="sub2" style=${{ marginTop:6 }}>${ackText(ack)}${ack.note ? " — " + ack.note : ""}</div>`}
              ${!ack && (disp === rep.id
                ? html`<div class="newunit" style=${{ display:"flex", flexDirection:"column", gap:8, marginTop:10 }}>
                    <textarea rows="3" placeholder="מה לא תקין? (שם העובד, התאריך ומה צריך להיות)" value=${note} onInput=${e => setNote(e.target.value)} maxLength=${1000}></textarea>
                    <div class="btnrow"><button class="btn" onClick=${()=>{ setDisp(null); setNote(""); }}>ביטול</button><button class="btn danger" disabled=${note.trim().length < 3} onClick=${()=>send(rep, "disputed")}>שלח השגה</button></div>
                  </div>`
                : html`<div class="btnrow" style=${{ marginTop:10 }}>
                    <button class="btn" onClick=${()=>{ setDisp(rep.id); setNote(""); }}>השגה</button>
                    <button class="btn ok" onClick=${()=> confirm("לאשר את השעות של שבוע " + wkLabel(rep.ws) + "?\n" + rep.totalHrs.toFixed(2) + " שעות · " + nis(rep.amount) + "\n\nהאישור נרשם עם שמך ושעת השרת, ולא ניתן לשנות אותו.") && send(rep, "approved")}>✓ מאשר</button>
                  </div>`)}
            </div>`;
        })
        : html`
          <div class="rowbet adate">
            <select class="pick" value=${mSel} onChange=${e => setMonth(e.target.value)}>${months.map(m => html`<option key=${m} value=${m}>${monthLabel(m)}</option>`)}</select>
          </div>
          <div class="kpis" style=${{ marginTop:10 }}>
            <div class="kpi"><b>${mo.H.toFixed(2)}</b><span>שעות בחודש</span></div>
            <div class="kpi"><b>${nis(mo.A)}</b><span>סכום</span></div>
            <div class=${"kpi " + (mo.done ? "" : "warn")}><b>${mo.weeks.filter(x => x.ack && x.ack.status === "approved").length}/${mo.weeks.length}</b><span>שבועות שאושרו</span></div>
          </div>
          <div class="card" style=${{ marginTop:10 }}>
            ${mo.weeks.map(x => html`<div key=${x.ws} class="rkord"><b>שבוע ${wkLabel(x.ws)}</b> · ${x.rep ? x.rows.reduce((s, y) => s + y.h, 0).toFixed(2) + " שעות בחודש הזה" : "עוד לא נעול"}<div>${x.rep ? ackText(x.ack) : ""}</div></div>`)}
          </div>
          <button class="btn pri rokeep wide" style=${{ marginTop:10 }} disabled=${!mo.weeks.some(x => x.rep)} onClick=${()=>agXlsx("שעות " + agn + " " + monthLabel(mSel).replace("/", "."), mo.weeks.filter(x => x.rep).map(x => ({ rep:x.rep, ack:x.ack, rows:x.rows })))}>⬇ אקסל חודשי</button>
          ${!mo.done && html`<div class="hint">החודש סגור כשכל השבועות שלו נעולים ומאושרים.</div>`}`}
        <button class="btn wide" style=${{ marginTop:16 }} onClick=${onLogout}>יציאה מהחשבון</button>
      </div>`;
  }

  function AttRowSheet({ r, w, day, hist, photos, sitesById, onBig, onClose, onSave, refUrl, onSetRef }){
    const [inV, setInV] = useState(r && r.inT != null ? hhmm(r.inT) : "");
    const quickOpen = !!(r && r.quick && !r.quick.reentered && !r.fix);
    const [outV, setOutV] = useState(r && r.outT != null && !quickOpen ? hhmm(r.outT) : "");
    const [absent, setAbsent] = useState(false);
    const [reason, setReason] = useState("");
    const name = (w && w.name) || (r && r.name) || "";
    const ps = r ? r.ps : [];
    const inT = atTime(day, inV), outT = atTime(day, outV);
    const valid = absent || (inT != null && (outT == null || outT > inT));
    return html`
      <div class="scrim" onClick=${onClose}>
        <div class="sheet asheet" onClick=${e => e.stopPropagation()}>
          <h3>${name}</h3>
          <div class="who">${dayLabel(day)}${r && r.ms ? " · " + hrs(r.ms).toFixed(2) + " שעות" : ""}</div>
          ${r && r.flags.filter(f => f.sev !== "ok").length > 0 && html`<div class="af" style=${{ marginBottom:10 }}>${r.flags.filter(f => f.sev !== "ok").map(f => html`<span key=${f.k} class=${"aflag " + f.sev}>${f.t}</span>`)}</div>`}
          ${ps.length === 0 && html`<div class="alert warn" style=${{ marginBottom:10 }}><span class="b"></span>אין רישום סלפי ביום הזה.</div>`}
          <div class="aref">

            <div><b>תמונת הזיהוי</b><div class="sub2">${refUrl === "" ? "עוד אין תמונת זיהוי — היא נשמרת אוטומטית מהסלפי הראשון של העובד." : "השוו אותה לתמונות של היום. אם מישהו אחר מצטלם במקום העובד — רואים את זה כאן."}</div></div>
          </div>
          ${ps.map(p => {
            const s = sitesById[p.site] || {};
            const d = p.lat != null && s.lat != null ? geoDist(p, s) : null;
            return html`
              <div key=${p.id} class="apunch">
                <button class="thumb" onClick=${()=> photos[p.id] && onBig(photos[p.id])}>${photos[p.id] ? html`<img src=${photos[p.id]} alt="" />` : html`<span class="ph">${photos[p.id] === "" ? "אין" : "…"}</span>`}</button>
                <div>
                  <b>${p.type === "in" ? "כניסה" : "יציאה"} ${hhmm(p._t.t)}</b> <small>${p._t.src === "srv" ? "שעת שרת" : p._t.src === "late" ? "שעת טלפון (נשלח מאוחר)" : "ממתין לשרת"}</small>
                  <div class="sub2">${s.name || p.siteName || "—"}${d != null ? " · " + fmtDist(d) + " מהאתר" : ""}${p.lat != null ? html` · <a href=${"https://maps.google.com/?q=" + p.lat + "," + p.lng} target="_blank" rel="noopener">מפה</a> (±${p.acc}מ׳)` : " · בלי מיקום"} · טלפון ${String(p.dev || "").slice(0, 4)}</div>
                  ${p._f.length > 0 && html`<div class="af">${p._f.map(f => html`<span key=${f.k} class=${"aflag " + f.sev}>${f.t}</span>`)}</div>`}
                  ${photos[p.id] && photos[p.id] !== refUrl && html`<button class="linkbtn roh" onClick=${()=> confirm("להחליף את תמונת הזיהוי של " + name + " בתמונה הזו?") && onSetRef(p.id)}>קבע כתמונת זיהוי</button>`}
                </div>
              </div>`;
          })}
          ${hist.length > 0 && html`
            <div class="lbl" style=${{ marginTop:12 }}>היסטוריית תיקונים</div>
            ${hist.map(f => html`<div key=${f.id} class="logrow"><span class="tm">${tsMs(f.at) ? dmy(tsMs(f.at)) + " " + hhmm(tsMs(f.at)) : ""}</span> · <b>${f.by}</b> · ${f.absent ? "סימן היעדרות" : f.approved ? (f.bulk ? "אישר באישור מרוכז" : "אישר כמו שהוא") : "כניסה " + hm(f.inT) + " · יציאה " + hm(f.outT)}${f.reason ? " — " + f.reason : ""}</div>`)}`}
          ${r && r.quick && !r.fix && html`<div class="alert warn roh" style=${{ marginTop:12 }}><span class="b"></span>
            ${r.quick.reentered
              ? html`העובד לחץ "יציאה" ב-${hhmm(r.quick.outT)}, ${r.quick.gap < 1 ? "פחות מדקה" : r.quick.gap === 1 ? "דקה" : r.quick.gap + " דקות"} אחרי הכניסה, ואחר כך נכנס שוב — כנראה לחיצה בטעות.
                  ${r.inT != null && r.outT != null && html`<button class="btn ok wide" style=${{ marginTop:8 }} onClick=${()=>onSave({ approved:false, absent:false, inT:r.inT, outT:r.outT, reason:"יציאה בטעות ב-" + hhmm(r.quick.outT) + " בוטלה" })}>↺ בטל את היציאה בטעות</button>`}`
              : html`העובד לחץ "יציאה" ב-${hhmm(r.quick.outT)}, ${r.quick.gap < 1 ? "פחות מדקה" : r.quick.gap === 1 ? "דקה" : r.quick.gap + " דקות"} אחרי הכניסה, ולא נכנס שוב. אם עבד כרגיל — הזינו למטה את שעת היציאה האמיתית (למשל לפי מנהל העבודה) וסיבה.`}
          </div>`}
          <div class="lbl roh" style=${{ marginTop:14 }}>תיקון או אישור</div>
          <div class="afix2 roh">
            <label class="afield">כניסה<input type="time" value=${inV} disabled=${absent} onInput=${e => setInV(e.target.value)} /></label>
            <label class="afield">יציאה<input type="time" value=${outV} disabled=${absent} onInput=${e => setOutV(e.target.value)} /></label>
          </div>
          <label class="acheck roh"><input type="checkbox" checked=${absent} onChange=${e => setAbsent(e.target.checked)} /> לא עבד ביום הזה (לא ייספר לשכר)</label>
          <label class="afield roh">סיבה (חובה לתיקון)<input type="text" value=${reason} placeholder="למשל: שכח לצלם ביציאה, אישר מנהל העבודה" onInput=${e => setReason(e.target.value)} /></label>
          <div class="btnrow" style=${{ marginTop:10 }}>
            <button class="btn" onClick=${onClose}>סגור</button>
            ${ps.length > 0 && html`<button class="btn ok" onClick=${()=>onSave({ approved:true, inT:null, outT:null, absent:false, reason: reason.trim() || "נבדק ואושר" })}>✓ אשר כמו שהוא</button>`}
            <button class="btn pri" disabled=${!valid || !reason.trim()} onClick=${()=>onSave({ approved:false, absent, inT: absent ? null : inT, outT: absent ? null : outT, reason: reason.trim() })}>שמור תיקון</button>
          </div>
        </div>
      </div>`;
  }

  function AttWorkers({ B, code, workers, visSites, mgr, who, notify, rels }){
    const [name, setName] = useState("");
    const pickSites = visSites.filter(s => s.active);
    const [siteSel, setSite] = useState(pickSites[0] ? pickSites[0].id : "");
    // האתר שנבחר חייב להיות אחד מהאתרים שברשימה. אחרת (האתרים נטענו אחרי פתיחת המסך, או שהוחלף מנהל)
    // הרשימה מציגה את האתר הראשון אבל הבחירה ריקה או ישנה — והעובד לא נוסף או נוסף לאתר אחר
    const site = pickSites.some(s => s.id === siteSel) ? siteSel : (pickSites[0] ? pickSites[0].id : "");
    const [lang, setLang] = useState("he");
    const [bulk, setBulk] = useState(false);
    const [q, setQ] = useState("");
    const [edit, setEdit] = useState(null);
    const [showOff, setShowOff] = useState(false);
    const visIds = new Set(visSites.map(s => s.id));
    const siteName = id => { const s = visSites.find(x => x.id === id); return s ? s.name : "אתר אחר"; };
    const relLog = (rels || []).filter(r => r.status !== "open").map(r => ({ r, w: workers.find(x => x.id === r.w) }))
      .filter(x => x.w && (mgr === "all" || visIds.has(x.w.site)))
      .sort((a, b) => (tsMs(b.r.doneAt || b.r.at) || 0) - (tsMs(a.r.doneAt || a.r.at) || 0));
    // ברשימה: כל שורה "שם" או "שם, אתר, שפה" (גם הדבקה מאקסל — עמודות מופרדות בטאב)
    const LANGS = { "עברית":"he", "ערבית":"ar", "אנגלית":"en", "הינדי":"hi", "הודית":"hi", "רוסית":"ru", he:"he", ar:"ar", en:"en", hi:"hi", ru:"ru" };
    Object.keys(WT).forEach(k => { LANGS[WT[k].name.toLowerCase()] = k; });
    const norm = s => String(s || "").replace(/["׳״']/g, "").replace(/\s+/g, " ").trim().toLowerCase();
    function matchSite(txt){
      const t = norm(txt);
      if(!t) return null;
      return visSites.find(s => norm(s.name) === t) || visSites.find(s => String(s.num || "") === t)
        || visSites.find(s => norm(s.name).includes(t) || t.includes(norm(s.name))) || null;
    }
    function add(){
      const lines = (bulk ? name.split(/\n+/) : [name]).map(s => s.trim()).filter(Boolean);
      if(!lines.length || !site) return;
      const have = new Set(workers.filter(w => w.active !== false).map(w => norm(w.name)));
      const batch = Cloud.db.batch();
      let added = 0, dup = [], nosite = 0;
      lines.forEach(line => {
        const cols = bulk ? line.split(/\t|[,;|]/).map(s => s.trim()) : [line];
        const n = cols[0];
        if(!n) return;
        if(have.has(norm(n))){ dup.push(n); return; }
        let l = lang; const ss = [];
        cols.slice(1).forEach(c => {
          if(!c) return;
          if(LANGS[norm(c)]) l = LANGS[norm(c)];
          else { const ms = matchSite(c); if(ms){ if(!ss.includes(ms.id)) ss.push(ms.id); } else nosite++; }
        });
        const s = ss[0] || site;
        have.add(norm(n));
        const id = rid(10);
        batch.set(B.collection("workers").doc(id), { id, name:n, site:s, sites: ss.length ? ss : [s], lang:l, active:true, at:Date.now(), by:who });
        added++;
      });
      if(added) batch.commit().catch(e => notify("שמירה נכשלה: " + (e.code || e.message)));
      setName("");
      const msg = [added === 1 && lines.length === 1 ? lines[0].split(/\t|[,;|]/)[0].trim() + " נוסף — שלח לו את הקישור" : added + " עובדים נוספו"];
      if(dup.length) msg.push(dup.length + " כבר קיימים ודולגו (" + dup.slice(0, 3).join(", ") + (dup.length > 3 ? "…" : "") + ")");
      if(nosite) msg.push(nosite + " אתרים לא זוהו — שויכו ל" + siteName(site));
      notify(msg.join(" · "));
    }
    async function share(w){
      const link = workerLink(code, w);
      const text = (WMSG[w.lang] || WMSG.he)(w.name, link);
      try{ if(navigator.share){ await navigator.share({ text }); return; } }catch(e){ if(e && e.name === "AbortError") return; }
      try{ await navigator.clipboard.writeText(text); notify("ההודעה עם הקישור הועתקה — הדבק בוואטסאפ"); }
      catch(e){ window.prompt("העתק את הקישור:", link); }
    }
    const upd = (w, patch, m) => { B.collection("workers").doc(w.id).set(patch, { merge:true }).catch(e => notify("שמירה נכשלה: " + (e.code || e.message))); if(m) notify(m); };
    const list = workers.filter(w => (mgr === "all" || wSites(w).some(x => visIds.has(x))) && (showOff || w.active !== false) && (!q || w.name.includes(q)))
      .sort((a, b) => siteName(a.site).localeCompare(siteName(b.site), "he") || a.name.localeCompare(b.name, "he"));
    const groups = [];
    list.forEach(w => { const g = groups[groups.length - 1]; if(g && g.site === w.site) g.ws.push(w); else groups.push({ site:w.site, ws:[w] }); });
    return html`
      <div class="card">
        <div class="lbl">הוספת עובד</div>
        <div class="newunit roh" style=${{ display:"flex", flexDirection:"column", gap:8 }}>
          ${bulk
            ? html`<textarea rows="5" value=${name} placeholder=${"עובד בכל שורה. אפשר להדביק מאקסל:\nשם מלא, אתר, שפה\nלמשל: ראג׳ קומאר, " + (visSites[0] ? visSites[0].name : "שם האתר") + ", הינדי\n(בלי אתר — ישויך לאתר שנבחר למטה)"} onInput=${e => setName(e.target.value)}></textarea>`
            : html`<input type="text" value=${name} placeholder="שם מלא" onInput=${e => setName(e.target.value)} onKeyDown=${e => e.key === "Enter" && add()} />`}
          <div style=${{ display:"flex", gap:8 }}>
            <select value=${site} onChange=${e => setSite(e.target.value)}>${pickSites.map(s => html`<option key=${s.id} value=${s.id}>${s.name}</option>`)}</select>
            <select value=${lang} style=${{ width:110, flex:"none" }} onChange=${e => setLang(e.target.value)}>${Object.keys(WT).map(k => html`<option key=${k} value=${k}>${WT[k].name}</option>`)}</select>
          </div>
          <div class="btnrow">
            <button class="btn" onClick=${()=>setBulk(!bulk)}>${bulk ? "עובד אחד" : "רשימה"}</button>
            <button class="btn pri" disabled=${!name.trim() || !site} onClick=${add}>הוסף</button>
          </div>
        </div>
      </div>
      <div class="rowbet" style=${{ margin:"14px 0 6px" }}>
        <input class="tin" style=${{ fontFamily:"inherit" }} type="search" value=${q} placeholder="חיפוש עובד" onInput=${e => setQ(e.target.value)} />
        <button class=${"chip " + (showOff ? "on" : "")} style=${{ flex:"none" }} onClick=${()=>setShowOff(!showOff)}>כולל מושבתים</button>
      </div>
      ${groups.map(g => html`
        <div key=${g.site} class="card asite">
          <b>${siteName(g.site)}</b> <span class="sub2">· ${g.ws.length} עובדים</span>
          ${g.ws.map(w => edit && edit.id === w.id
            ? html`<div key=${w.id} class="newunit" style=${{ display:"flex", gap:6, flexWrap:"wrap", margin:"8px 0" }}>
                <input type="text" value=${edit.name} onInput=${e => setEdit({ ...edit, name:e.target.value })} />
                <select value=${edit.site} onChange=${e => setEdit({ ...edit, site:e.target.value })}>${pickSites.map(s => html`<option key=${s.id} value=${s.id}>${s.name}</option>`)}</select>
                <select value=${edit.lang || "he"} onChange=${e => setEdit({ ...edit, lang:e.target.value })}>${Object.keys(WT).map(k => html`<option key=${k} value=${k}>${WT[k].name}</option>`)}</select>

  function PhoneLogin(){

      return new firebase.auth.RecaptchaVerifier(el, { size:"invisible" });
    }
    function resetCaptcha(){ try{ ver.current && ver.current.clear(); }catch(x){} ver.current = null; try{ capBox.current.innerHTML = ""; }catch(x){} }
    async function send(){
      const p = normPhone(ph);
      if(!p){ setErr("מספר לא תקין — למשל 050-1234567"); return; }
      setBusy(true); setErr("");
      try{
        fbInit();

        conf.current = await firebase.auth().signInWithPhoneNumber(p, ver.current);
        setStep("code");
      }catch(e){ setErr(authErr(e)); resetCaptcha(); }
      setBusy(false);
    }
    async function confirm(){
      if(!conf.current) return;
      setBusy(true); setErr("");
      try{ await conf.current.confirm(code.replace(/\D/g, "")); }
      catch(e){ setErr(authErr(e)); setBusy(false); }
    }
    const digits = code.replace(/\D/g, "");

          <button class="btn pri wide" style=${{marginTop:10}} disabled=${busy || digits.length !== 6} onClick=${confirm}>${busy ? "בודק…" : "כניסה"}</button>
          <button class="btn wide" style=${{marginTop:8}} onClick=${()=>{ setStep("phone"); setCode(""); setErr(""); resetCaptcha(); }}>מספר אחר / שלח קוד שוב</button>`}
