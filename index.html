      finally{ setBusy(false); }
    }
    const report = () => rows.map(r => ({ project:r.name, spend:r.spend, budget:r.budget, n:r.n, tal:r.x.tal, open:r.x.open, transit:r.x.transit, exc:r.x.exc, credits:r.x.credits }));
    function printReport(){
      const data = { mode:"report", who, month:mon, rows:report(), total:tot, totalBudget:totB };
      const w = window.open(RAKESH_APP + "print.html#" + encodeURIComponent(JSON.stringify(data)), "_blank");
      if(!w) notify("הדפדפן חסם את פתיחת הדוח — אפשר חלונות קופצים לבקרה");
    }
    function csv(){
      const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
      const head = ["פרויקט", "הוזמן החודש (כולל מע״מ)", "תקציב חודשי", "ניצול %", "הזמנות", "ממתינות לטל", "לא הועברו לספק", "בדרך", "חריגות בקבלה", "זיכויים פתוחים"];
      const lines = [head.map(q).join(",")].concat(report().map(r => [r.project, r.spend, r.budget || "", r.budget ? Math.round(r.spend / r.budget * 100) : "", r.n, r.tal, r.open, r.transit, r.exc, r.credits].map(q).join(",")));
      lines.push([q("סה״כ"), tot, totB || "", "", "", "", "", "", "", ""].join(","));
      const url = URL.createObjectURL(new Blob(["\ufeff" + lines.join("\r\n")], { type:"text/csv;charset=utf-8" }));
      const a = document.createElement("a"); a.href = url; a.download = "דוח-רכש-" + mon + ".csv"; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 5000);
    }
    return html`<div class="screen">
      ${tabs}
      <div class="shead ordhead"><div class="ordttl"><h2>📊 רכש לפי פרויקט</h2>
        <span class="sub">${d ? "כמה הוזמן בכל פרויקט, כולל מע״מ, מול התקציב החודשי · עודכן " + hhmm(d.at) : "טוען…"}</span></div>
        <button class="btn" style=${{flex:"none"}} disabled=${!d} onClick=${load} title="רענון">🔄</button>
      </div>
      ${err && html`<div class="alert crit" style=${{marginBottom:10}}><span class="b"></span>${err}</div>`}
      ${d && html`
        <div class="chips" style=${{margin:"4px 0 10px"}}>${d.months.slice().reverse().map(m => html`<button key=${m} class=${"chip " + (mon === m ? "on" : "")} onClick=${()=>setMon(m)}>${monLbl(m)}</button>`)}</div>
        <div class="pjsum">
          <div>הוזמן ב-${monLbl(mon)}<b>${ordMoney(tot)}</b>כולל מע״מ</div>
          <div>תקציבים<b>${totB ? ordMoney(totB) : "—"}</b>${totB ? Math.round(tot / totB * 100) + "% ניצול" : "לא הוגדרו"}</div>
          <div style=${nOver ? {borderColor:"var(--crit)", color:"var(--crit)"} : {}}>מעל התקציב<b style=${nOver ? {color:"var(--crit)"} : {}}>${nOver}</b>פרויקטים</div>
        </div>
        <div class="ordbar">
          <span style=${{flex:1}}></span>
          <button class="btn pri" disabled=${!rows.length} onClick=${printReport}>🧾 דוח חודשי</button>
          <button class="btn" disabled=${!rows.length} onClick=${csv}>⬇ CSV</button>
        </div>
        ${rows.map(r => { const mx = Math.max(1, ...r.spark); return html`<div key=${r.name} class=${"pjcard" + (r.pct > 1 ? " over" : "")}>
          <div class="pjhead"><b>${r.name}</b>
            <span class="pjamt">${ordMoney(r.spend)}<small>${r.budget ? "מתוך " + ordMoney(r.budget) + " · " + Math.round(r.pct * 100) + "%" : "אין תקציב"}</small></span></div>
          ${r.budget > 0 && html`<div class="pjbar"><i class=${r.pct > 1 ? "crit" : r.pct > 0.85 ? "warn" : ""} style=${{width: Math.min(100, Math.round(r.pct * 100)) + "%"}}></i></div>`}
          <div class="pjmeta">
            <span>${r.n} הזמנות ב-${monLbl(mon)}</span>
            ${r.x.tal > 0 && html`<span class="pill warn">⏳ ${r.x.tal} ממתינות לטל</span>`}
            ${r.x.open > 0 && html`<span class="pill inactive">${r.x.open} לא הועברו לספק</span>`}
            ${r.x.transit > 0 && html`<span class="pill inactive">🚚 ${r.x.transit} בדרך</span>`}
            ${r.x.exc > 0 && html`<span class="pill crit">⚠ ${r.x.exc} חריגות</span>`}
            ${r.x.credits > 0 && html`<span class="pill warn">↩ ${r.x.credits} זיכויים</span>`}
          </div>
          ${r.sups.length > 0 && html`<div class="sub2" style=${{margin:"6px 0 0"}}>ספקים: ${r.sups.map(([n, v]) => n + " " + ordMoney(v * vat)).join(" · ")}</div>`}
          <div class="pjspark" aria-hidden="true">${r.spark.map((v, i) => html`<span key=${i} class=${d.months[i] === mon ? "cur" : ""} style=${{height: Math.max(2, Math.round(v / mx * 32)) + "px"}} title=${ordMoney(v)}></span>`)}</div>
          <div class="pjsparkl">${d.months.map(m => html`<span key=${m}>${monLbl(m).slice(0, 2)}</span>`)}</div>
          <button class="linkbtn" style=${{marginTop:6, fontSize:".78rem"}} disabled=${busy} onClick=${()=>setBudget(r)}>✎ ${r.budget ? "שנה תקציב" : "קבע תקציב חודשי"}</button>
        </div>`; })}
        ${!rows.length && html`<div class="empty">אין הזמנות ב-${monLbl(mon)}</div>`}`}
    </div>`;
  }

  /* "הועבר לספק" לשורה אחת (ספק אחד בהזמנה): ספק בפועל + אישור. כמו לסמן בגיליון */
  function OrdFwd({ r, suppliers, onDone, notify }){
    const opts = [...new Set([...(suppliers || []), ...(r.real ? [r.real] : [])])];
    const [sup, setSup] = useState(r.real || (opts.includes(r.supplier) ? r.supplier : ""));
    const [busy, setBusy] = useState(false);
    async function go(){
      if(!sup){ notify("בחר ספק בפועל"); return; }
      setBusy(true);
      try{
        const t = await orderAction({ t:"fwd", rowId:r.id, real:sup });
        if(t === "ok") notify("📦 סומן: הועבר ל" + sup);
        else if(t.startsWith("already")) notify("כבר סומן שהועבר לספק" + (t.slice(8).trim() ? " (" + t.slice(8).trim() + ")" : "") + " — לא נשלח שוב");
        else notify(ORD_ERR[t] || "לא נשמר: " + t);
        onDone();
      }catch(e){ notify("לא נשמר: " + (e.message || e)); }
      finally{ setBusy(false); }
    }
    return html`<div class="ordfwd">
      <select aria-label="ספק בפועל" value=${sup} onChange=${e=>setSup(e.target.value)}>
        <option value="">ספק בפועל…</option>
        ${opts.map(x => html`<option key=${x} value=${x}>${x}</option>`)}
      </select>
      <button class="btn ok" disabled=${busy} onClick=${go}>${busy ? "⏳" : "📦"} הועבר לספק</button>
    </div>`;
  }

  /* מסך "הזמנות פתוחות" (משרד): כל ההזמנות שעוד לא הועברו לספק, עם הדפסה. שרון מרכזת ומדפיסה, טל רואה מה ממתין לו */
  function OrdersQueue({ q, reload, who, phone, notify, tabs }){
    const [f, setF] = useState("all"), [sel, setSel] = useState({}), [qs, setQs] = useState(""), [job, setJob] = useState(null);
    useEffect(()=>{ reload(); }, []);
    const all = q.list || [];
    const ql = qs.trim().toLowerCase();
    const shown = all.filter(o => (f === "all" || (f === "tal" ? o.stage === "tal" : o.stage !== "tal"))
      && (!ql || [o.project, o.user, o.oid, ...o.rows.map(r => r.supplier + " " + r.items)].join(" ").toLowerCase().includes(ql)));
    const selList = shown.filter(o => sel[o.oid]);
    const nTal = all.filter(o => o.stage === "tal").length;
    // פותח תצוגה מקדימה על המסך; ההדפסה עצמה — מכפתור "הדפס" שבה (באייפון ההדפסה חייבת לצאת ישר מלחיצה, על תוכן שכבר מוצג)
    const print = mode => { const l = selList.length ? selList : shown; if(!l.length){ notify("אין הזמנות להדפסה"); return; } setJob({ mode, list:l, k:Date.now() }); };
    const me = q.me || {};
    const [acting, setActing] = useState("");
    async function decide(o, ok){
      let note = "";
      if(ok){ if(!confirm("לאשר את ההזמנה של " + o.user + " ל" + o.project + " על סך " + ordMoney(o.total) + " כולל מע״מ?")) return; }
      else { note = prompt("למה ההזמנה נדחית? (נרשם בגיליון והמנהל יראה שבוטלה)", "") || ""; if(!note.trim()) return; }
      setActing(o.oid);
      try{
        const t = await orderAction({ t:"approve", oid:o.oid, ok, note:note.trim() });
        if(t === "ok") notify(ok ? "✓ אושר — ההזמנה עברה לשרון" : "ההזמנה נדחתה");
        else if(t.startsWith("already")) notify("ההזמנה כבר טופלה (" + t.slice(8).trim() + ")");
        else notify(ORD_ERR[t] || "לא נשמר: " + t);
        reload();
      }catch(e){ notify("לא נשמר: " + (e.message || e)); }
      finally{ setActing(""); }
    }
    return html`<div class="screen">
      ${tabs}
      <div class="shead ordhead"><div class="ordttl"><h2>🛒 הזמנות פתוחות</h2>
        <span class="sub">${q.list ? all.length + " הזמנות שעוד לא הועברו לספק" + (q.at ? " · עודכן " + hhmm(q.at) : "") : "טוען…"}</span></div>
        <button class="btn" disabled=${q.busy} onClick=${reload}>${q.busy ? "⏳" : "🔄"} רענון</button>
      </div>
      <${PushToggle} phone=${phone} name=${who} notify=${notify} />
      ${q.err && html`<div class="alert crit" style=${{marginBottom:10}}><span class="b"></span>לא הצלחתי לטעון את ההזמנות: ${q.err}</div>`}
      <div class="chips" style=${{margin:"4px 0 12px"}}>
        ${[["all", "הכול", all.length], ["tal", "ממתינות לטל", nTal], ["sharon", "לטיפול שרון", all.length - nTal]].map(([k, n, c]) =>
          html`<button key=${k} class=${"chip " + (f === k ? "on" : "")} onClick=${()=>{ setF(k); setSel({}); }}>${n} (${c})</button>`)}
      </div>
      <input class="tin" style=${{fontFamily:"inherit", marginBottom:10}} placeholder="🔍 חיפוש — פרויקט, מזמין, ספק, פריט" value=${qs} onInput=${e=>setQs(e.target.value)} />
      ${shown.length > 0 && html`<div class="ordbar">
        <label class="acheck" style=${{margin:0}}><input type="checkbox" checked=${selList.length === shown.length} onChange=${e=>{ const o = {}; if(e.target.checked) shown.forEach(x => { o[x.oid] = true; }); setSel(o); }} />סמן הכול</label>
        <span style=${{flex:1}}></span>
        <button class="btn pri" onClick=${()=>print("page")}>🖨 ${selList.length ? "הדפס נבחרות (" + selList.length + ")" : "הדפס הכול"}</button>
        <button class="btn" onClick=${()=>print("list")}>📋 רשימה מרוכזת</button>
      </div>`}
      <div>
        ${shown.map(o => { const [ic, lb, tone] = ORD_ST[o.stage]; return html`<div key=${o.oid} class=${"ordcard" + (o.stage === "tal" ? " tal" : "")}>
          <div class="oh">
            <input type="checkbox" aria-label=${"בחר להדפסה: " + o.project} checked=${!!sel[o.oid]} onChange=${()=>setSel(s => ({ ...s, [o.oid]:!s[o.oid] }))} />
            <div class="ot"><b>${o.project}</b><small>${o.user}${o.phone ? " · " + ordPhone(o.phone) : ""} · ${ordWhen(o.created)} · ${o.rows.length === 1 ? "ספק אחד" : o.rows.length + " ספקים"}</small></div>
            <span class="oamt">${ordMoney(o.total)}</span>
          </div>
          <div class="otags">
            <span class=${"pill " + tone}>${ic} ${lb}</span>
            ${o.urgent && html`<span class="pill crit">⚡ דחוף</span>`}
            ${o.needBy && html`<span class="pill inactive">נדרש עד ${ordNeedBy(o.needBy)}</span>`}
            ${o.rows.some(r => r.req) && html`<span class="pill warn">✎ בקשת שינוי</span>`}
          </div>
          ${o.note && html`<div class="onote">💬 ${o.note}</div>`}
          ${o.stage === "tal" && (me.approver
            ? html`<div class="ordact">
                <button class="btn ok" disabled=${acting === o.oid} onClick=${()=>decide(o, true)}>${acting === o.oid ? "⏳" : "✓"} אשר הזמנה</button>
                <button class="btn danger" disabled=${acting === o.oid} onClick=${()=>decide(o, false)}>✕ דחה</button>
              </div>`
            : html`<div class="ordwait">⏳ ממתינה לאישור של טל — אחרי האישור אפשר להעביר לספק</div>`)}
          ${o.rows.map(r => { const ls = ordLines(r.items); return html`<div key=${r.id} class="osup">
            <h4>${r.supplier}${r.real && r.real !== r.supplier ? " ← " + r.real : ""}${r.sub > 0 && html`<span>${ordMoney(r.sub)} לפני מע״מ</span>`}</h4>
            <ul>${ls.length ? ls.map((l, i) => html`<li key=${i}>${l.n} — <b>${l.q}</b> ${l.u}</li>`) : html`<li>${r.items || "—"}</li>`}</ul>
            ${ordLinks(r).length > 0 && html`<div class="sub2" style=${{margin:"4px 0 0"}}>${ordLinks(r).map((u, i) => html`<a key=${i} href=${u} target="_blank" rel="noopener" style=${{marginInlineEnd:10}}>📷 תמונה ${i + 1}</a>`)}</div>`}
            ${r.req && html`<div class="onote">✎ ${r.req}</div>`}
            ${o.stage !== "tal" && me.office && html`<${OrdFwd} key=${r.id + ":" + q.at} r=${r} suppliers=${q.suppliers} onDone=${reload} notify=${notify} />`}
          </div>`; })}
        </div>`; })}
      </div>
      ${q.list && !shown.length && html`<div class="empty">${ql ? "לא נמצאו הזמנות" : f === "tal" ? "אין הזמנות שממתינות לאישור טל 👍" : "אין הזמנות פתוחות 👍"}</div>`}
      ${job && html`<${OrdersPrint} key=${job.k} list=${job.list} mode=${job.mode} who=${who} onClose=${()=>setJob(null)} />`}
    </div>`;
  }

  /* אפליקציית הרכש כלשונית בתוך הבקרה. נטענת פעם אחת ונשארת פתוחה ברקע (העגלה לא נעלמת במעבר בין לשוניות).
     הזמנה חדשה מהמלאי = שינוי ב-hash בלבד (#as=…&order=…), והרכש קולט אותה בלי לטעון מחדש */
  function BuyFrame({ src, show }){
    const ref = useRef(null), [h, setH] = useState(600);
    useEffect(()=>{
      if(!show) return;
      const fit = () => {
        const el = ref.current; if(!el) return;
        const top = el.getBoundingClientRect().top + window.scrollY;
        const nav = document.querySelector(".bnav");
        const bottom = nav ? nav.getBoundingClientRect().height : 0;
        setH(Math.max(420, Math.round(window.innerHeight - (top - window.scrollY) - bottom)));
      };
      try{ window.scrollTo(0, 0); }catch(e){}
      fit();
      const t = setTimeout(fit, 300);
      window.addEventListener("resize", fit);
      return ()=>{ clearTimeout(t); window.removeEventListener("resize", fit); };
    }, [show]);
    return html`<div class="buywrap" style=${{ display: show ? "block" : "none" }}>
      <iframe ref=${ref} class="buyframe" title="רכש — הזמנת חומר" src=${src} style=${{ height:h }} allow="camera; clipboard-write; web-share"></iframe>
    </div>`;
  }

  function App(){
    const cloudCode = useState(readTeamCode)[0];
    // אין קוד צוות במכשיר (אייקון במסך הבית, דפדפן אחר, קישור בלי קוד) → כניסה בטלפון, והקוד נמשך מרשומת המשתמש
    const needTeam = useState(()=>{ try{ return !cloudCode && sessionStorage.getItem("bakara_local") !== "1"; }catch(e){ return !cloudCode; } })[0];
    const [st, setSt] = useState(()=> cloudCode ? emptyState() : load());
    const stRef = useRef(null); if(stRef.current === null) stRef.current = st;
    const [cloud, setCloud] = useState({ mode: !!cloudCode, status: cloudCode ? "connecting" : "local", ready: !cloudCode, empty:false, loaded:{ sites:false, since:false, meta:false }, err:"" });
    const [photoMap, setPhotoMap] = useState({});
    const [teamSheet, setTeamSheet] = useState(false);
    const [teamInput, setTeamInput] = useState("");
    const [role, setRole] = useState("ctl");
    const [nav, setNav] = useState({ screen:"ctl.home" });
    const [toast, setToast] = useState(null);
    const [now, setNow] = useState(Date.now());
    const [ctl, setCtl] = useState({ tab:"ex", mgr:"all" });
    const desk = useMedia("(min-width:1024px)");
    // Esc סוגר את החלון הפתוח העליון (במחשב). לא כשמקלידים בתיבת טקסט ארוכה
    useEffect(()=>{
      const f = e => {
        if(e.key !== "Escape") return;
        const a = document.activeElement; if(a && a.tagName === "TEXTAREA") return;
        const s = document.querySelectorAll(".scrim, .lightbox"); if(s.length) s[s.length - 1].click();
      };
      document.addEventListener("keydown", f);
      return ()=>document.removeEventListener("keydown", f);
    }, []);
    const [idSheet, setIdSheet] = useState(false);
    const [me, setMe] = useState(()=>{ try{ const m = JSON.parse(localStorage.getItem("bakara_me")); if(m && m.name) return m; }catch(e){} return { name:"דוד" }; });
    // כניסה אישית: מי מחובר ומה התפקיד שלו (משרד / מנהל פרויקט)
    const [auth, setAuth] = useState(()=> ({ s: (cloudCode || needTeam) ? "checking" : "off" }));
    const [staffSheet, setStaffSheet] = useState(false);
    const [rkOpen, setRkOpen] = useState({});
    const [myFiles, setMyFiles] = useState(null);  // המסמכים האישיים שלי (פרטים בלבד, בלי התוכן)      // הזמנות פתוחות מהרכש לפי אתר ("בדרך")
    const signedIn = cloudCode && auth.s === "in";
    const who = signedIn ? auth.staff.name : me.name;
    const isViewer = signedIn && auth.staff.role === "viewer";
    const myMgr = signedIn && auth.staff.role !== "office" && !isViewer ? auth.staff.name : null;
    // isOffice = פעולות של המשרד (סנכרון מנהלים, ניהול משתמשים, איפוס). צופה רואה הכול אבל לא מבצע אותן
    const isOffice = !myMgr && !isViewer;
    async function checkStaff(u){
      if(!u || !u.phoneNumber){ setAuth({ s:"out" }); return; }
      setAuth({ s:"checking", phone:u.phoneNumber });
      try{
        const db = firebase.firestore();
        const d = await db.collection("staff").doc(u.phoneNumber).get();
        if(d.exists && d.data().active !== false){
          const sd = d.data();
          // חברת כ״א: מסך נפרד שמציג רק את דוחות השעות שלה (בלי קוד צוות ובלי גישה לשום נתון אחר)
          if(sd.role === "agency"){ setAuth({ s:"agency", phone:u.phoneNumber, staff:sd }); return; }
          if(!cloudCode){
            const tm = sd.teamSet || sd.team;
            if(tm && /^[A-Za-z0-9]{16,64}$/.test(tm)){
              try{ localStorage.setItem(TEAM_KEY, tm); sessionStorage.removeItem("bakara_local"); }catch(e){}
              location.reload(); return;
            }
            setAuth({ s:"noteam", phone:u.phoneNumber }); return;
          }
          // המכשיר מחובר לקוד צוות אחר מזה שרשום למשתמש (למשל מקישור ישן) — עוברים לצוות הנכון, כדי שכולם יעבדו על אותם נתונים
          // מעבר צוות רק אחרי הוראה מפורשת של ההנהלה ("זה הצוות הנכון" בחלון קוד צוות) — השדה teamSet.
          // השדה team לבדו לא מזיז מכשירים: גרסאות ישנות דורסות אותו אוטומטית.
          let fixed = ""; try{ fixed = sessionStorage.getItem("bakara_teamfix") || ""; }catch(e){}
          const wantTeam = sd.teamSet && /^[A-Za-z0-9]{16,64}$/.test(sd.teamSet) ? sd.teamSet : "";
          if(wantTeam && wantTeam !== cloudCode && fixed !== wantTeam){
            try{ localStorage.setItem(TEAM_KEY, wantTeam); sessionStorage.removeItem("bakara_local"); sessionStorage.setItem("bakara_teamfix", wantTeam); }catch(e){}
            location.reload(); return;
          }
          // משרד וצופה רואים את כל האתרים; צופה — בלי שום כתיבה
          Cloud.mgr = (sd.role === "office" || sd.role === "viewer") ? null : sd.name;
          setReadOnly(sd.role === "viewer");
          setAuth({ s:"in", phone:u.phoneNumber, staff:sd }); return;
        }

      update(d=>{

        s.boq = s.boq || [];
        s.boq.unshift({ id:"q" + Date.now().toString(36), at:Date.now(), by:who, ...entry });
        if(s.boq.length > 30) s.boq.length = 30;
        // מסמך האתר מוגבל ל-1MB — כתבי כמויות ישנים יוצאים כשהם תופסים יותר מדי
        while(s.boq.length > 1 && JSON.stringify(s.boq).length > 300000) s.boq.pop();

    function stockSave(siteId, orig, patch){
      update(d=>{
        const s = d.sites.find(x=>x.id===siteId); if(!s) return d;
        s.materials = s.materials || [];
        let m = orig != null ? s.materials.find(x=>x.item===orig) : null;
        if(!m){
          m = s.materials.find(x=>x.item===patch.item);
          if(!m){ m = { item:patch.item, need:0, onSite:0, unit:"יח׳", blocksTomorrow:false }; s.materials.push(m); }
        }
        const before = m.at ? m.onSite : null;
        if(patch.item && patch.item !== m.item && !s.materials.some(x=>x!==m && x.item===patch.item)) m.item = patch.item;
        ["onSite","unit","need","blocksTomorrow"].forEach(k => { if(patch[k] !== undefined) m[k] = patch[k]; });
        m.at = Date.now(); m.by = who;
        s.stockAt = m.at; s.stockBy = who;
        // ירידה בספירה בלי רישום שימוש — נשמרת בנפרד, כדי שיהיה ברור כמה חומר "נעלם"
        if(before != null && m.onSite !== before){
          const last = (s.usage || [])[0];
          if(m.onSite < before) addUsage(s, { item:m.item, q:before - m.onSite, unit:m.unit, kind:"count", by:who });
          else if(last && last.kind === "count" && last.item === m.item && last.by === who && Date.now() - last.at < 15 * 60e3) addUsage(s, { item:m.item, q:-(m.onSite - before), unit:m.unit, kind:"count", by:who });
        }
        pushLog(d, who, "עדכן מלאי: " + m.item + " · " + m.onSite + " " + m.unit + (before != null && before !== m.onSite ? " (היה " + before + ")" : ""), siteId);
        return d;
      });

    function stockUse(siteId, item, q, kind, note){

        m.onSite = Math.max(0, Math.round((before - q) * 1000) / 1000);
        m.at = Date.now(); m.by = who; s.stockAt = m.at; s.stockBy = who;
        left = m.onSite; unit = m.unit;
        addUsage(s, { item, q, unit:m.unit, kind, note, by:who });
        pushLog(d, who, (kind === "waste" ? "פחת/נזק: " : "שימוש בחומר: ") + item + " · " + q + " " + m.unit + (note ? " · " + note : "") + " (נשאר " + m.onSite + ")", siteId);
        return d;

      notify("נרשם " + (kind === "waste" ? "פחת" : "שימוש") + ": " + q + " " + unit + " " + item);

    return html`

        ${deskOn ? sideNav : html`<div class=${"topbar" + (inApp ? " noseg" : "")}>
          <div class="brand">
            <span class="plate"><img src=${LOGO} alt="ט.ש. מי רון" /></span>
            <span class="txt"><b>ט.ש. מי רון</b><span>פלס · בקרת ביצוע לאינסטלציה</span></span>
          </div>
          ${isViewer && html`<span class="rotag" title="המשתמש הזה יכול רק לצפות — אין לו הרשאה לשנות שום דבר">👁 צפייה בלבד</span>`}
          ${auth.s !== "agency" && !inApp && html`<div class="seg" role="tablist">
            <button role="tab" class=${role==="ctl"?"on":""} onClick=${()=>switchRole("ctl")}>בקרה</button>
            <button role="tab" class=${role==="field"?"on":""} onClick=${()=>switchRole("field")}>שטח</button>
            <button role="tab" class=${role==="stock"?"on":""} onClick=${()=>switchRole("stock")}>מלאי</button>
          </div>`}
          <span style=${{flex:1}}></span>
          ${auth.s !== "agency" && html`<button class="ic0 me" title=${"מחובר כ-"+me.name+" · החלף"} onClick=${()=>setIdSheet(true)}>${me.name.slice(0,1)}<i class=${"sdot "+cloud.status}></i>${pdNew > 0 && html`<i class="pdnew" title="מסמך חדש">${pdNew}</i>`}</button>`}
          <button class="ic0" title="מצב תצוגה" onClick=${toggleTheme}>◐</button>
          ${isOffice && ((!cloudCode && !needTeam) || signedIn) && html`<button class="ic0" title="אפס דמו" onClick=${reset}>↺</button>`}

        <div class="main">
        ${needTeam ? null

          ? html`<div class="banner">מצב מקומי — הנתונים נשמרים רק במכשיר הזה <button class="chip" onClick=${()=>setTeamSheet(true)}>הזן קוד צוות</button></div>`
          : cloud.status === "offline" ? html`<div class="banner">אין חיבור — השינויים נשמרים במכשיר ויסונכרנו כשהרשת תחזור</div>`
          : cloud.status === "error" && cloud.ready ? html`<div class="banner err">בעיית סנכרון (${cloud.err}) — השינויים עלולים לא להישמר במסד</div>` : null}
        ${role !== "inv" && (invWait > 0 || invCnt.tal > 0) && html`<button class="banner pdban" onClick=${()=>switchRole("inv")}>🧾 ${invWait > 0 ? (invWait === 1 ? "חשבונית מחכה לאישורך" : invWait + " חשבוניות מחכות לאישורך") : (invCnt.tal === 1 ? "חשבונית ממתינה לאישור תשלום שלך" : invCnt.tal + " חשבוניות ממתינות לאישור תשלום שלך")} — לחץ לצפייה</button>`}
        ${signedIn && pdNew > 0 && role !== "docs" && html`<button class="banner pdban" onClick=${()=>switchRole("docs")}>📁 ${pdNew === 1 ? "מסמך אישי חדש מחכה לך" : pdNew + " מסמכים אישיים חדשים מחכים לך"} — לחץ לצפייה</button>`}
        ${body}
        ${buySrc && html`<${BuyFrame} src=${buySrc} show=${nav.screen === "buy.home"} />`}
        ${inApp && !deskOn && html`<nav class="bnav" aria-label="ניווט">
          ${[["ctl", "📊", "בקרה", 0], ["field", "📍", "שטח", 0], ["stock", "📦", RAKESH_APP ? "מלאי ורכש" : "מלאי", ordOn ? ordN : 0],
             ...(invOn ? [["inv", "🧾", "חשבוניות", auth.staff.role === "office" ? invCnt.n + invCnt.tal : invWait]] : []),
             ...(signedIn ? [[auth.staff.role === "office" ? "docsadm" : "docs", "📁", "מסמכים", pdNew]] : [])
            ].map(([r, ic, lb, n]) => html`<button key=${r} class=${(role === r || (r === "docsadm" && role === "docs") || (r === "stock" && (role === "buy" || role === "orders" || role === "projects"))) ? "on" : ""} aria-current=${role === r ? "page" : null} onClick=${()=>{ switchRole(r); try{ window.scrollTo(0, 0); }catch(e){} }}>
              <span class="bi">${ic}${n ? html`<i class="bn">${n > 99 ? "99+" : n}</i>` : null}</span><span class="bl">${lb}</span></button>`)}
        </nav>`}
        <div class="brandfoot"><b>ט.ש. מי רון</b> · אנשים עושים הנדסה</div>
        </div>
        ${toast && html`<div class="toast"><div>${toast}</div></div>`}
        ${teamSheet && html`
          <div class="scrim" onClick=${()=>setTeamSheet(false)}>
            <div class="sheet" onClick=${e=>e.stopPropagation()}>
              <h3>קוד צוות</h3>
              <div class="who">${cloudCode ? "מחובר למסד המשותף (קוד " + cloudCode.slice(0, 4) + "…" + cloudCode.slice(-3) + "). מצב: " + cloud.status : "מצב מקומי — הנתונים נשמרים רק במכשיר הזה."} את הקוד מקבלים מההנהלה, בדרך כלל כקישור שפותח את האפליקציה כבר מחוברת.</div>
              ${cloudCode && isOffice && signedIn && html`<button class="opt" onClick=${setTeamForAll}><span class="e">✅</span>זה הצוות הנכון — העבר את כל המכשירים של המשתמשים אליו</button>`}
              ${cloudCode && html`<button class="opt" onClick=${shareTeam}><span class="e">📤</span>שתף קישור צוות למנהל (וואטסאפ) — רק לאנשים שמנהלים את הבקרה</button>`}
              ${!cloudCode && html`<input class="tin" type="text" dir="ltr" value=${teamInput} onInput=${e=>setTeamInput(e.target.value)} placeholder="הדבק כאן קוד צוות" autocapitalize="off" autocomplete="off" />`}
              <div class="btnrow" style=${{marginTop:10}}>
                ${cloudCode ? html`<button class="btn danger" onClick=${disconnectTeam}>נתק מהמסד</button>` : html`<button class="btn" onClick=${()=>setTeamSheet(false)}>ביטול</button>`}
                ${!cloudCode && html`<button class="btn pri" disabled=${!/^[A-Za-z0-9]{16,64}$/.test(teamInput.trim())} onClick=${saveTeam}>התחבר</button>`}

            </div>

        ${idSheet && html`
          <div class="scrim" onClick=${()=>setIdSheet(false)}>
            <div class="sheet" onClick=${e=>e.stopPropagation()}>
              ${signedIn ? html`
                <h3>החשבון שלי</h3>
                <div class="who">${auth.staff.name} · ${isViewer ? "צופה — רואה הכול, קריאה בלבד" : isOffice ? "משרד — רואה הכול" : "מנהל פרויקט — רואה רק את האתרים שלו (" + sites.length + ")"} · <span dir="ltr">${fmtPhone(auth.phone)}</span></div>
                <button class="opt" onClick=${()=>{ setIdSheet(false); switchRole("docs"); }}><span class="e">📁</span>המסמכים שלי — תלושים, הפרשות, טפסים${pdNew ? " (" + pdNew + " חדשים)" : ""}</button>
                ${auth.staff.role === "office" && html`<button class="opt" onClick=${()=>{ setIdSheet(false); switchRole("docsadm"); }}><span class="e">🗂</span>מסמכים אישיים של כולם — העלאה וניהול</button>`}
                ${ordOn && html`<button class="opt" onClick=${()=>{ setIdSheet(false); switchRole("orders"); }}><span class="e">🛒</span>הזמנות פתוחות — הדפסה והתראות${ordN ? " (" + ordN + ")" : ""}</button>`}
                ${invOn && html`<button class="opt" onClick=${()=>{ setIdSheet(false); switchRole("inv"); }}><span class="e">🧾</span>${auth.staff.role === "office" ? "חשבוניות ספקים" + (invCnt.n + invCnt.tal ? " (" + (invCnt.n + invCnt.tal) + ")" : "") : "חשבוניות לאישורך" + (invWait ? " (" + invWait + ")" : "")}</button>`}
                ${isOffice && html`<button class="opt" onClick=${()=>{ setIdSheet(false); setStaffSheet(true); }}><span class="e">👥</span>משתמשים והרשאות</button>`}
                ${isOffice && html`<button class="opt" onClick=${()=>{ setIdSheet(false); setTeamSheet(true); }}><span class="e">🔑</span>קוד צוות · שיתוף קישור</button>`}
                <button class="opt" onClick=${logout}><span class="e">🚪</span>יציאה מהחשבון</button>
              ` : html`
              <h3>מי אתה?</h3>
              <div class="who">השם נרשם ביומן הפעולות ליד כל פעולה שתבצע. התחברות מאובטחת אישית תיכנס עם חיבור המסד המשותף.</div>
              ${[{name:"דוד", role:"הנהלה"}, {name:"טל", role:"מאשר הזמנות"}, {name:"שרון", role:"רכש"}, ...cards.filter(c=>c.name!=="לא משויך").map(c=>({name:c.name, role:c.role})), {name:"איש שטח"}].map(m => html`
                <button key=${m.name} class="opt" onClick=${()=>pickMe(m)}>
                  <span class="e">${me.name===m.name ? "✓" : "👤"}</span>${m.name}${m.role ? " · " + m.role : ""}
                </button>`)}
              <button class="opt" onClick=${()=>{ setIdSheet(false); setTeamSheet(true); }}><span class="e">🔑</span>קוד צוות · מסד משותף (${cloudCode ? "מחובר" : "מקומי"})</button>`}
            </div>
          </div>`}
        ${staffSheet && html`<${StaffAdmin} st=${st} who=${who} myPhone=${auth.phone} notify=${notify} onClose=${()=>setStaffSheet(false)} />`}
      </div>`;
  }

  function Tile({ val, label, kind, cls }){
    return html`<div class=${"mt " + (cls != null ? cls : tone(kind, val))}><b>${val == null ? "—" : val}</b><span>${label}</span></div>`;
  }

  /* מלאי של אתר: מתי עודכן ועל ידי מי */
  function stockInfo(s, st, now){
    const mats = s.materials || [];
    const last = stockLast(s);
    let by = s.stockBy || "";
    const latest = mats.filter(m => m.at).sort((a, b) => b.at - a.at)[0];
    if(latest && latest.at >= (s.stockAt || 0)) by = latest.by || by;
    return {
      last, by, fresh: last > 0 && now - last < CFG.stockDays * DAY,
      short: mats.filter(m => m.onSite < m.need).length, count: mats.length
    };
  }

  /* שיוך מנהלים לפרויקטים — רק להנהלה/משרד. השינוי נשמר באתר עצמו ומסומן "ידני", כך שהרשימה הקבועה בקוד לא דורסת אותו */
  function MgrAssign({ st, update, who, notify }){
    const [names, setNames] = useState(null), [q, setQ] = useState("");
    useEffect(()=> firebase.firestore().collection("staff").onSnapshot(
      qs => setNames(qs.docs.map(d => d.data()).filter(x => x.active !== false && x.role === "mgr" && x.name).map(x => x.name).sort((a, b) => a.localeCompare(b, "he"))),
      () => setNames([])), []);
    const sites = st.sites.filter(s => s.active).filter(s => !q.trim() || s.name.includes(q.trim()) || siteMgrs(s).some(n => n.includes(q.trim())))
      .sort((a, b) => a.name.localeCompare(b.name, "he"));
    function save(id, owner, mgrs){
      update(d => {
        const s = d.sites.find(x => x.id === id); if(!s) return d;
        s.owner = owner ? { name:owner, role:"מנהל פרויקט" } : { name:"לא משויך", role:"דרוש שיוך מנהל" };
        s.mgrs = [...new Set(mgrs.filter(n => n && n !== owner))];
        s.mgrManual = true;
        pushLog(d, who, "שיוך מנהלים: " + (owner || "לא משויך") + (s.mgrs.length ? " + " + s.mgrs.join(", ") : ""), id);
        return d;
      });
      notify("נשמר — " + (st.sites.find(x => x.id === id) || {}).name);
    }
    if(!names) return html`<div class="empty">טוען את רשימת המנהלים…</div>`;
    return html`<div class="card" style=${{marginBottom:12}}>
      <div class="lbl">🔧 שיוך מנהלים לפרויקטים</div>
      <div class="sub2">בכל פרויקט: מנהל ראשי (אחראי — אליו הולכים חריגים ואישורי חשבוניות) ומנהלים נוספים עם גישה מלאה לאתר. השינוי נשמר מיד ומופיע אצל כולם.</div>
      <input class="tin" style=${{fontFamily:"inherit", margin:"8px 0"}} placeholder="🔍 חיפוש פרויקט או מנהל" value=${q} onInput=${e=>setQ(e.target.value)} />
      ${sites.map(s => {
        const own = ownerName(s), main = own === "לא משויך" || own === "—" ? "" : own, extra = s.mgrs || [];
        return html`<div key=${s.id} class="mgrrow">
          <div class="mgrname"><b>${s.name}</b>${!main ? html` <span class="tg" style=${{background:"var(--crit-wash)", color:"var(--crit)"}}>לא משויך</span>` : null}</div>
          <label class="mgrsel">ראשי
            <select class="tin" value=${main} onChange=${e=>save(s.id, e.target.value, extra)}>
              <option value="">— לא משויך —</option>
              ${(names.includes(main) || !main ? names : [main, ...names]).map(n => html`<option key=${n} value=${n}>${n}</option>`)}
            </select></label>
          <div class="mgrextra">נוספים:
            ${extra.map(n => html`<button key=${n} class="chip on" title="הסר" onClick=${()=>save(s.id, main, extra.filter(x => x !== n))}>${n} ✕</button>`)}
            <select class="tin" value="" onChange=${e=>{ if(e.target.value) save(s.id, main, [...extra, e.target.value]); }}>
              <option value="">➕ הוסף</option>
              ${names.filter(n => n !== main && !extra.includes(n)).map(n => html`<option key=${n} value=${n}>${n}</option>`)}
            </select>
          </div>
        </div>`; })}
    </div>`;
  }

  function Control({ st, now, exceptions, cards, ctl, setCtl, onOpen, onNudge, onResolve, notify, who, locked, update }){
    const [assign, setAssign] = useState(false);
    const [rep, setRep] = useState(null);
    const { tab, mgr } = ctl;
    const list = exceptions.filter(e => mgr === "all" || locked || e.owner === mgr);
    const crit = exceptions.filter(e => e.sev === "crit").length;
    const l3 = exceptions.filter(e => e.level === 3).length;
    const active = st.sites.filter(s => s.active);
    const pilotSites = active.filter(s => inPilot(ownerName(s)));
    const subm = pilotSites.filter(s => curWeekly(s, now)).length;
    const nudges = st.nudges || {};
    const siteName = id => { const s = st.sites.find(x => x.id === id); return s ? s.name : ""; };
    const T = (k, label) => html`<button class=${"chip "+(tab===k?"on":"")} onClick=${()=>setCtl({...ctl, tab:k})}>${label}</button>`;

    async function shareRep(){
      try{ if(navigator.share){ await navigator.share({ text: rep }); return; } }
      catch(e){ if(e && e.name === "AbortError") return; }
      try{ await navigator.clipboard.writeText(rep); notify("הדוח הועתק — הדבק בוואטסאפ"); }
      catch(e){ notify("לא ניתן להעתיק אוטומטית — סמן והעתק ידנית"); }
    }

    return html`
      <div class="screen">
        <div class="shead rowbet">
          <div><h2>מרכז בקרה</h2><span class="sub">${active.length} אתרים פעילים · שבוע ${weekLabel(now)} · עדכון ${hhmm(now)}</span></div>
          <button class="btn" style=${{flex:"none", padding:"8px 14px"}} onClick=${()=>setRep(buildReport(st, exceptions, cards, now))}>📋 דוח</button>
        </div>

        <div class="kpis">
          <div class=${"kpi "+(exceptions.length?"warn":"")}><b>${exceptions.length}</b><span>חריגים פתוחים</span></div>
          <div class=${"kpi "+(crit?"crit":"")}><b>${crit}</b><span>אדומים</span></div>
          <div class=${"kpi "+(l3?"crit":"")}><b>${l3}</b><span>דרג בעלים</span></div>
          <div class=${"kpi "+(subm < pilotSites.length ? "warn" : "")}><b>${subm}/${pilotSites.length}</b><span>דוח שבועי הוגש${PILOT.length ? " (פיילוט)" : ""}</span></div>
        </div>

        ${!locked && PILOT.length > 0 && html`<div class="alert warn" style=${{margin:"10px 0 0"}}><span class="b"></span>פיילוט: ${PILOT.join(", ")} — חריגי דוח שבועי, מלאי ודיווח יומי נספרים רק להם.</div>`}

        <div class="chips navchips">
          ${T("ex", "חריגים (" + list.length + ")")}
          ${T("att", "נוכחות")}
          ${T("mgr", "מנהלים")}
          ${T("plan", "תוכנית שבועית")}
          ${T("stock", "מלאי")}
          ${T("log", "יומן פעולות")}
        </div>

        ${!locked && mgr !== "all" && tab !== "mgr" && tab !== "log" && html`<div class="alert warn" style=${{marginBottom:10}}><span class="b"></span>מסונן לפי מנהל: ${mgr}
          <button class="chip" style=${{marginInlineStart:"auto"}} onClick=${()=>setCtl({...ctl, mgr:"all"})}>נקה סינון</button></div>`}

        ${tab === "ex" && html`
          <div class="exlist">
            ${list.map(e => {
              const n = nudges[e.key];
              return html`
                <div key=${e.key} class=${"ex "+e.sev}>
                  <div class="rowbet" style=${{alignItems:"flex-start"}}>
                    <div class="t">${e.title}</div>
                    <span class=${"lvl l"+e.level}>${LEVEL_SHORT[e.level]}</span>
                  </div>
                  ${e.siteName && html`<div class="ds">${e.siteName}</div>`}
                  <div class="ds">${e.detail}</div>
                  <div class="meta">אחראי: <b>${e.owner}</b>${e.ownerRole ? " · " + e.ownerRole : ""}${e.senior ? " · מנהל בכיר: " + e.senior : ""}<br/>ממתין ל: ${e.waitingOn} · פתוח <b>${ageText(e.ageMs)}</b> · ${LEVEL_TEXT[e.level]}</div>
                  ${n && html`<div class="meta">נדחף ע״י ${n.by} לפני ${ageText(now - n.at)}</div>`}
                  <div class="btnrow">
                    <button class="btn" onClick=${()=>onOpen(e.siteId)}>${e.siteIds && e.siteIds.length > 1 ? "פתח אתר ראשון" : "פתח אתר"}</button>
                    ${(e.kind === "reported" || e.kind === "wissue" || e.kind === "safety") && html`<button class="btn ok" onClick=${()=>onResolve(e)}>טופל</button>`}
                    <button class="btn pri" onClick=${()=>onNudge(e)}>דחוף אחראי</button>
                  </div>
                </div>`;
            })}
            ${list.length === 0 && html`<div class="alert empty"><span class="b"></span>אין חריגים פתוחים${mgr!=="all" ? " אצל "+mgr : ""} — הכל בקצב</div>`}
          </div>
          <div class="hint">נושאי הבקרה לפי טופס התוכנית השבועית: ליווי שלד · קומפלטים · השלמות · ספרינקלרים · חניונים · כ״א בשטח · הערות/חריגים · בטיחות, ובנוסף מלאי באתר. חריג עובר דרג אחרי ${CFG.escL2h} שעות (דרג 2) ו-${CFG.escL3h} שעות (דרג בעלים). נקודת בטיחות עולה מיד לדרג 2.</div>
        `}

        ${tab === "mgr" && update && html`
          <button class=${"btn " + (assign ? "pri" : "")} style=${{flex:"none", marginBottom:12}} onClick=${()=>setAssign(a => !a)}>${assign ? "✓ סיום שיוך" : "🔧 שיוך מנהלים לפרויקטים"}</button>
          ${assign && html`<${MgrAssign} st=${st} update=${update} who=${who} notify=${notify} />`}`}
        ${tab === "mgr" && !assign && html`
          <div style=${{display:"flex", flexDirection:"column", gap:12}}>
            ${cards.map(c => html`
              <div key=${c.name} class="card mc">
                <div class="rowbet">
                  <div><div style=${{fontWeight:700, fontSize:"1.02rem"}}>${c.name}${c.pilot && PILOT.length ? html` <span class="tg" style=${{background:"var(--accent-wash)", color:"var(--accent-ink)"}}>פיילוט</span>` : null}</div><div class="sub" style=${{fontFamily:"Heebo,sans-serif", fontSize:".74rem", color:"var(--ink-3)"}}>${c.role} · ${c.sites} אתרים</div></div>
                  <span class=${"pill "+c.health}>${c.health==="crit"?"דורש התערבות":c.health==="warn"?"דורש מעקב":"תקין"}</span>
                </div>
                <div class="mgrid">
                  <${Tile} val=${c.open} label="חריגים פתוחים" cls=${c.crit ? "crit" : c.open ? "warn" : ""} />
                  <${Tile} val=${c.open ? c.avgAgeH + " שע׳" : "—"} label="גיל ממוצע" kind=${c.open ? "age" : ""} />
                  <${Tile} val=${c.safety} label="חריגי בטיחות" kind="cnt" />
                  <${Tile} val=${c.weekly + "/" + c.sites} label="דוח שבועי הוגש" cls=${c.weekly < c.sites ? "warn" : ""} />
                  <${Tile} val=${c.progress == null ? null : c.progress + "%"} label="התקדמות ממוצעת" />
                  <${Tile} val=${c.stalled} label="מסלולים תקועים / מתחת ליעד" kind="cntw" />
                  <${Tile} val=${c.workers} label="כ״א בשטח השבוע" />
                  <${Tile} val=${c.stockFresh + "/" + c.sites} label=${"מלאי עודכן (" + CFG.stockDays + " ימים)"} cls=${c.stockFresh < c.sites ? "warn" : ""} />
                  <${Tile} val=${c.checkin == null ? null : c.checkin + "%"} label="דיווח יומי (7 ימים)" kind="ci" />

          </div>

        `}

        ${tab === "att" && html`<${Attendance} st=${st} now=${now} mgr=${mgr} who=${who} notify=${notify} office=${!locked} av=${ctl.av} setAv=${v => setCtl({ ...ctl, tab:"att", av:v })} />`}

              </div>`)}
            ${(st.log || []).length === 0 && html`<div class="empty" style=${{padding:"24px 0"}}>עדיין אין פעולות ביומן. כל דוח, עדכון מלאי, אישור ודחיפה יירשמו כאן עם שם המבצע.</div>`}
          </div>

        ${rep && html`
          <div class="scrim" onClick=${()=>setRep(null)}>

  }

  /* הטבלה המאוחדת = טופס "דוח תוכנית עבודה שבועית" של כל המנהלים */
  function PlanCell({ s, k, now }){
    const cur = curWeekly(s, now);
    if(!cur) return html`<td class="pc na">·</td>`;
    const v = cur.tracks && cur.tracks[k];
    if(!v) return html`<td class="pc nr">—</td>`;
    const ts = trackState(s, k, now);
    const cls = v.pct >= 100 ? "done" : ts.stalled ? "bad" : ts.gap ? "warn" : "";
    const dl = ts.delta;
    return html`<td class=${"pc "+cls}><b>${v.pct}%</b>${dl ? html`<i>${dl > 0 ? "▲" : "▼"}${Math.abs(dl)}</i>` : null}${v.goal != null ? html`<small>יעד ${v.goal}</small>` : null}</td>`;
  }

  function PlanMatrix({ st, now, mgr, cards, exceptions, onOpen }){
    // מנהל נוסף (בלי כרטיס משלו) רואה את הכרטיסים של האתרים שלו
    const names = cards.map(c => c.name).filter(n => mgr === "all" || n === mgr || !cards.some(c => c.name === mgr));
    const rowsOf = n => st.sites.filter(s => s.active && ((s.owner && s.owner.name) || "—") === n).sort((a, b) => a.num - b.num);
    const withText = st.sites.filter(s => {
      if(!s.active || (mgr !== "all" && ((s.owner && s.owner.name) || "—") !== mgr)) return false;
      const w = s.weekly; return w && (hasText(w.note) || hasText(w.safety));
    });
    return html`
      <div class="pm">
        <table class="plan">
          <thead><tr>
            <th class="nm">אתר</th>
            ${TRACKS.map(t => html`<th key=${t.k} title=${t.label}>${t.short || t.label}</th>`)}
            <th>כ״א</th>
          </tr></thead>
          <tbody>
            ${names.map(n => {
              const rows = rowsOf(n);
              return html`
                <tr class="grp" key=${"g"+n}><td colspan=${TRACKS.length + 2}>${n} · ${rows.length} אתרים · ${inPilot(n) ? "דוח שבועי " + rows.filter(s => curWeekly(s, now)).length + "/" + rows.length : "לא בפיילוט"}</td></tr>
                ${rows.map(s => {
                  const cur = curWeekly(s, now);
                  const flag = exOfSite(exceptions, s.id).some(e => e.kind === "safety" || e.kind === "wissue");
                  return html`
                    <tr key=${s.id} class="srow" onClick=${()=>onOpen(s.id)}>
                      <td class="nm">${flag ? "⚠ " : ""}${s.name}<small>${s.contractor}</small></td>
                      ${TRACKS.map(t => html`<${PlanCell} key=${t.k} s=${s} k=${t.k} now=${now} />`)}
                      <td class=${"pc "+(cur ? (cur.workers === 0 && trackOpen(cur) ? "bad" : "") : "na")}>${cur ? (cur.workers == null ? "—" : html`<b>${cur.workers}</b>`) : "·"}</td>
                    </tr>`;
                })}`;
            })}
          </tbody>
        </table>
      </div>
      <div class="legend"><span class="lg bad"></span>תקוע / כ״א 0 <span class="lg warn"></span>מתחת ליעד השבוע <span class="lg done"></span>100% · — לא רלוונטי · · טרם הוגש דוח השבוע · ▲▼ שינוי מהדוח הקודם</div>

      ${withText.length > 0 && html`
        <div class="lbl" style=${{marginTop:18}}>הערות / חריגים ובטיחות מהדוחות</div>
        <div style=${{display:"flex", flexDirection:"column", gap:8}}>
          ${withText.map(s => html`
            <button key=${s.id} class="wu" onClick=${()=>onOpen(s.id)}>
              <span class="m"><b>${s.name}</b>
                ${hasText(s.weekly.note) ? html`<span>${s.weekly.issue && !s.weekly.issueResolvedAt ? "⚠ " : ""}${s.weekly.note}</span>` : null}
                ${hasText(s.weekly.safety) ? html`<span style=${{color: s.weekly.safetyResolvedAt ? "var(--ink-3)" : "var(--crit)"}}>🦺 ${s.weekly.safety}${s.weekly.safetyResolvedAt ? " · טופל" : ""}</span>` : null}
              </span>
            </button>`)}
        </div>`}
      <div class="hint">כך נראה הטופס השבועי של כל המנהלים במקום אחד. הקשה על אתר פותחת את הפירוט. מנהל מגיש את הדוח בלשונית שטח ← דוח שבועי.</div>`;
  }

  /* מלאי כל האתרים — בקרה על מה שהמנהלים הזינו */
  function StockOverview({ st, now, mgr, cards, onOpen }){
    const sites = st.sites.filter(s => s.active && (mgr === "all" || managedBy(s, mgr)))
      .map(s => ({ s, i: stockInfo(s, st, now) }))
      .sort((a, b) => ((inPilot(ownerName(b.s)) ? 1 : 0) - (inPilot(ownerName(a.s)) ? 1 : 0)) || (b.i.short - a.i.short) || ((a.i.fresh ? 1 : 0) - (b.i.fresh ? 1 : 0)) || a.s.num - b.s.num);

            ${(s.materials || []).map(m => html`

            <div class="btnrow" style=${{marginTop:8}}><button class="btn" onClick=${()=>onOpen(s.id)}>פתח אתר</button></div>
          </div>`)}

      </div>
      <div class="hint">המנהלים מזינים מלאי בלשונית מלאי. "לא נספר" = כמות שעדיין לא אושרה על ידי מנהל הפרויקט (נתון הדגמה). חוסר = כמות במלאי נמוכה מהמינימום שהמנהל הגדיר.</div>`;
  }

              <button class="opt" onClick=${()=>{ setSheet(false); notify("נפתח צ׳אט האתר"); }}><span class="e">💬</span> צ׳אט האתר</button>
            </div>
