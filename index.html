<body>
<style>
  :root{
    --paper:#F4F6F8; --surface:#FFFFFF; --surface-2:#EBEEF3; --surface-3:#E1E6EC;
    --ink:#19212B; --ink-2:#54606E; --ink-3:#8792A1;
    --line:#D5DCE4; --line-2:#E5E9EF;
    --accent:#2C60D0; --accent-ink:#204CA6; --accent-wash:#E6EDFB;
    --ok:#2E8555; --warn:#C4820F; --crit:#C93E30;
    --ok-wash:#E2F0E8; --warn-wash:#F6EBD6; --crit-wash:#F8E3E0;
    --shadow:0 1px 2px rgba(20,30,45,.05), 0 10px 28px rgba(20,30,45,.08);
    --shadow-lg:0 8px 20px rgba(20,30,45,.1), 0 28px 60px rgba(20,30,45,.16);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#10141A; --surface:#181D24; --surface-2:#222932; --surface-3:#2C343E;
      --ink:#E7EBF1; --ink-2:#9EAAB8; --ink-3:#6D7987;
      --line:#2B333D; --line-2:#232A33;
      --accent:#6E9CF1; --accent-ink:#AAC5F8; --accent-wash:#1E2A44;
      --ok:#54B37D; --warn:#E0AC53; --crit:#E56C5E;
      --ok-wash:#16281E; --warn-wash:#2B2414; --crit-wash:#2E1B18;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.42);
      --shadow-lg:0 10px 26px rgba(0,0,0,.45), 0 30px 70px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --paper:#10141A; --surface:#181D24; --surface-2:#222932; --surface-3:#2C343E;
    --ink:#E7EBF1; --ink-2:#9EAAB8; --ink-3:#6D7987;
    --line:#2B333D; --line-2:#232A33;
    --accent:#6E9CF1; --accent-ink:#AAC5F8; --accent-wash:#1E2A44;
    --ok:#54B37D; --warn:#E0AC53; --crit:#E56C5E;
    --ok-wash:#16281E; --warn-wash:#2B2414; --crit-wash:#2E1B18;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.42);
    --shadow-lg:0 10px 26px rgba(0,0,0,.45), 0 30px 70px rgba(0,0,0,.55);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    direction:rtl; background:var(--paper); color:var(--ink);
    font-family:"Assistant","Segoe UI",Tahoma,sans-serif; font-size:16px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  button,select{ font-family:inherit; }
  button{ cursor:pointer; }
  h1,h2,h3,h4{ font-family:"Frank Ruhl Libre","Assistant",serif; margin:0; line-height:1.22; }

  .app{ max-width:1180px; margin:0 auto; min-height:100vh; padding-bottom:40px; }

  .topbar{
    position:sticky; top:0; z-index:40; background:var(--paper);
    background:color-mix(in srgb, var(--paper) 90%, transparent);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:14px; padding:12px 20px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:10px; margin-inline-end:auto; }
  .brand .plate{ background:#fff; border:1px solid var(--line); border-radius:9px; padding:5px 7px; display:flex; flex:none; }
  .brand .plate img{ height:26px; width:auto; display:block; }
  .brand .txt{ display:flex; flex-direction:column; line-height:1.15; }
  .brand .txt b{ font-family:"Frank Ruhl Libre",serif; font-weight:900; font-size:1.05rem; letter-spacing:-.01em; }
  .brand .txt span{ font-family:"Heebo",sans-serif; font-size:.68rem; color:var(--ink-3); margin-top:1px; }
  .brandfoot{ text-align:center; font-family:"Heebo",sans-serif; font-size:.72rem; color:var(--ink-3); padding:26px 16px 4px; }
  .brandfoot b{ color:var(--ink-2); font-weight:700; }

  .seg{ display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:11px; padding:3px; gap:2px; }

    ["רוטשטיין","קיים",5,"רמת השרון"],
    ["קבוצת אשטרום","קיים",6,"בת ים הרצל"],
    ["פורמה","קיים",7,"הפרדס יפו"],
    ["אשטרום הנדסה","קיים",8,"מרים החשמונאית"],
    ["יעקבי יוניברסל","קיים",9,"לוד"],
    ["יעקבי יוניברסל","קיים",10,'פ"ת'],
    ["דניה סיבוס","קיים",11,"קרסו חולון"],
    ["אלקטרה","קיים",12,"כפר אזר 116"],
    ["אלקטרה","קיים",13,"כפר אזר 123"],
    ["לוינשטיין נתיב","קיים",14,"בת ים עצמאות"],
    ["הר סוף","קיים",15,"הר סוף קוטג'ים"],
    ["הר סוף","קיים",16,"הר סוף 105"],
    ["הר סוף","קיים",17,"הר סוף 19-20"],
    ["הר סוף","קיים",18,"הר סוף 504"],
    ["פורמה","קיים",19,"הברון הירש"],
    ["דניה סיבוס","קיים",20,"הולצברג בת ים"],
    ["דניה סיבוס","קיים",21,"שנקר חולון"],
    ["דניה סיבוס","אין",22,"חנקין חולון"],
    ["דניה סיבוס","קיים",23,"גליל ים"],
    ["דניה סיבוס","קיים",24,"מרינה הרצליה"],
    ["יצחקי מלונאות","אין",25,'לאון ת"א'],
    ["אשטרום","קיים",26,'מז"ה ת"א'],
    ["דניה סיבוס","קיים",27,"מרלוג פוקס"],
    ["קבוצת גבאי","קיים",28,"לידו מגורים"],
    ["קבוצת גבאי","קיים",29,"מלון אשדוד"],
    ["דניה סיבוס","קיים",30,"הר נוף"],
    ["דניה סיבוס","קיים",31,"עיר עולם"]
  ];

  /* ---- מנהלי פרויקט אמיתיים — נלקחו מאפליקציית הרכש (שמות פרטיים בלבד, בלי טלפונים).
     מפתח = מספר אתר בתיק. co = מנהל בכיר/מורשה נוסף על הפרויקט (דרג 2). ---- */
  const MGR = {
    1:{ name:"יזיד", co:["מג׳ד"] },  2:{ name:"אייל" },  3:{ name:"סאמר" },  4:{ name:"סאמר" },
    5:{ name:"גיא" },  6:{ name:"יער", co:["ליאור"] },  7:{ name:"אלכס" },  8:{ name:"ראובן" },
    9:{ name:"סאמר" },  10:{ name:"באהה" },  11:{ name:"מוראר", co:["מג׳ד"] },  12:{ name:"אבו לאבן" },
    13:{ name:"אבו לאבן" },  14:{ name:"יער", co:["ליאור"] },  15:{ name:"וואהל" },  16:{ name:"וואהל" },
    17:{ name:"באהה" },  18:{ name:"סאמר" },  19:{ name:"צביקה" },  20:{ name:"מג׳ד" },  21:{ name:"מג׳ד" },
    23:{ name:"משה" },  25:{ name:"אולג" },  26:{ name:"באהה", co:["איתי"] },  27:{ name:"וואהל" },
    28:{ name:"אולג" },  29:{ name:"אולג" },  30:{ name:"יניב" },  31:{ name:"כרובי" }
  };
  function applyRoster(site){
    const m = MGR[site.num];
    site.owner = m
      ? { name:m.name, role:"מנהל פרויקט" }
      : { name:"לא משויך", role:"דרוש שיוך מנהל" };
    site.senior = (m && m.co) ? m.co.join(", ") : "";
  }

  /* ניקוי נתוני הדגמה ישנים (שלבי שחור/לחץ/לבן, יחידות עבודה, מלאי שלא נספר) — פעם אחת */
  const CLEAN_V = 1;
  function applyClean(site){
    ["stages","schedule","blackConsultant","surplus"].forEach(k => { delete site[k]; });
    if(site.owner) delete site.owner.status;
    site.units = (site.units || []).filter(u => (u.photos || []).length > 0);
    site.materials = (site.materials || []).filter(m => m.at);
  }

  function seed(){
    const sites = RAW.map(([contractor, exists, n, name])=>{
      return { id:"s"+n, num:n, name, contractor, active: exists !== "אין", materials:[], units:[], owner:null };
    });
    sites.forEach(applyRoster);
    const T = Date.now();
    return {
      sites, rosterV: 2, cleanV: CLEAN_V,
      log: [], nudges: {}, trackStart: T,
      since: {},
      requests: [], transfers: []
    };
  }

  const KEY = "pls_state_v4";
  function load(){
    try{
      const s = localStorage.getItem(KEY);
      if(s){
        const st = JSON.parse(s);
        (st.sites || []).forEach(site => {
          site.checkinLog = site.checkinLog || [];
          (site.units || []).forEach(u => { if(!Array.isArray(u.photos)) u.photos = []; });
        });
        if(st.rosterV !== 2){ (st.sites || []).forEach(applyRoster); st.rosterV = 2; }
        if(st.cleanV !== CLEAN_V){ (st.sites || []).forEach(applyClean); st.cleanV = CLEAN_V; }
        st.log = st.log || []; st.nudges = st.nudges || {}; st.since = st.since || {};
        st.trackStart = st.trackStart || Date.now();
        return st;
      }
    }catch(e){}
    return seed();
  }
  function persist(st){
    try{ localStorage.setItem(KEY, JSON.stringify(st)); return true; }
    catch(e){ return false; }
  }

  // Read a picked image file, downscale, return a compressed JPEG data URL.
  function fileToScaledDataURL(file, maxDim, quality){
    return new Promise((resolve, reject)=>{
      if(!file || !/^image\//.test(file.type)) { reject(new Error("not an image")); return; }
      const reader = new FileReader();
      reader.onerror = ()=> reject(new Error("read failed"));
      reader.onload = ()=>{
        const img = new Image();
        img.onerror = ()=> reject(new Error("decode failed"));
        img.onload = ()=>{
          let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
          const scale = Math.min(1, maxDim / Math.max(w, h));
          w = Math.round(w * scale); h = Math.round(h * scale);
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          try{ resolve(canvas.toDataURL("image/jpeg", quality)); }
          catch(err){ reject(err); }
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  /* ───────── בקרה וניטור: נושאי הבקרה = עמודות תוכנית העבודה השבועית ─────────
     ליווי שלד · קומפלטים · השלמות · ספרינקלרים · חניונים · כ"א בשטח · הערות/חריגים · בטיחות
     (+ מלאי באתר שמנהל הפרויקט מזין). כל הספים במקום אחד (CFG). */
  const CFG = {
    checkinBy: 10,         // שעה: מכאן אתר בלי דיווח יומי מסומן
    checkinEsc: 12,        // שעה: מכאן החריגה עוברת לדרג בעלים
    weeklyBy: 12,          // שעה ביום א׳: עד אז צריך להגיש את הדוח השבועי
    stockDays: 3,          // ימים: מלאי שלא עודכן מעבר לזה נחשב לא מעודכן
    workerDrop: 0.6,       // ירידת כ"א: ביחס לשבוע שעבר מתחת ל-60% = חריג
    escL2h: 4,             // שעות פתוחה → דרג 2
    escL3h: 24,            // שעות פתוחה → דרג 3 (בעלים)
    workDays: [0,1,2,3,4]  // א׳–ה׳
  };
  const LEVEL_SHORT = { 1:"דרג 1", 2:"דרג 2", 3:"דרג 3" };
  const LEVEL_TEXT = { 1:"דרג 1 · מנהל אחראי", 2:"דרג 2 · מנהל בכיר", 3:"דרג 3 · בעלים" };
  const HOUR = 3600e3, DAY = 24 * HOUR;

  /* עמודות הטופס "דוח תוכנית עבודה שבועית" */
  const TRACKS = [
    { k:"skeleton",   label:"ליווי שלד", short:"שלד" },
    { k:"complets",   label:"קומפלטים" },
    { k:"finishing",  label:"השלמות" },
    { k:"sprinklers", label:"ספרינקלרים", short:"ספרינק׳" },
    { k:"parking",    label:"חניונים" }
  ];

  /* פיילוט: רק המנהלים האלה נספרים בחריגי "דוח חסר", "מלאי לא עודכן" ו"דיווח יומי חסר".
     כשמצטרפים עוד מנהלים — מוסיפים לכאן, או מרוקנים את הרשימה כדי לכלול את כולם. */
  const PILOT = ["גיא", "יער", "סאמר", "יניב"];
  const inPilot = name => PILOT.length === 0 || PILOT.includes(name);
  const ownerName = s => (s.owner && s.owner.name) || "—";

  const pad2 = n => String(n).padStart(2, "0");
  function dstr(ts){ const d = new Date(ts); return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
  function hhmm(ts){ const d = new Date(ts); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
  function dmy(ts){ const d = new Date(ts); return pad2(d.getDate()) + "/" + pad2(d.getMonth()+1); }
  function isWorkday(ts){ return CFG.workDays.includes(new Date(ts).getDay()); }
  function ageText(ms){
    const m = Math.max(0, Math.round(ms / 60000));
    if(m < 60) return m + " דק׳";
    const h = Math.round(m / 60);
    if(h < 48) return h + " שע׳";
    return Math.round(h / 24) + " ימים";
  }
  function pushLog(d, who, text, siteId){
    d.log = d.log || [];
    d.log.unshift({ id: "l" + Date.now().toString(36) + Math.random().toString(36).slice(2,6), ts: Date.now(), who, text, siteId: siteId || null });
    if(d.log.length > 400) d.log.length = 400;
  }

  /* ---- שבוע עבודה: מתחיל ביום א׳ ---- */
  function weekStart(ts){ const d = new Date(ts); d.setHours(0,0,0,0); d.setDate(d.getDate() - d.getDay()); return d.getTime(); }
  const weekKey = ts => dstr(weekStart(ts));
  const weekLabel = ts => dmy(weekStart(ts)) + "–" + dmy(weekStart(ts) + 4 * DAY);
  const curWeekly = (s, now) => (s.weekly && s.weekly.week === weekKey(now)) ? s.weekly : null;
  const pctOf = (r, k) => { const v = r && r.tracks ? r.tracks[k] : null; return v == null ? null : (typeof v === "object" ? v.pct : v); };
  /* דוחות של שבועות קודמים, מהישן לחדש */
  function weekHistory(s, now){
    const h = (s.weeklyHist || []).slice();
    if(s.weekly && s.weekly.week !== weekKey(now)) h.push(s.weekly);
    return h;
  }
  function compactWeekly(w){
    const tracks = {};
    TRACKS.forEach(t => { tracks[t.k] = pctOf(w, t.k); });
    return { week: w.week, tracks, workers: w.workers == null ? null : w.workers };
  }
  const trackOpen = w => TRACKS.some(t => { const v = w.tracks && w.tracks[t.k]; return v && v.pct < 100; });
  const hasText = v => !!(v && String(v).trim());

  /* מצב מסלול אחד באתר: האם עומד, האם יש פער ליעד השבועי */
  function trackState(s, k, now){
    const cur = curWeekly(s, now);
    const v = cur && cur.tracks ? cur.tracks[k] : null;
    if(!v) return null;
    const hist = weekHistory(s, now);
    const prev = hist.length ? pctOf(hist[hist.length - 1], k) : null;
    let streak = 1;
    for(let i = hist.length - 1; i >= 0 && pctOf(hist[i], k) === v.pct; i--) streak++;
    const d = new Date(now), late = d.getDay() > 4 || (d.getDay() === 4 && d.getHours() >= 12);
    return {
      pct: v.pct, goal: v.goal == null ? null : v.goal, prev,
      delta: prev == null ? null : v.pct - prev,
      stalled: v.pct < 100 && prev != null && v.pct <= prev,
      streak: prev != null && v.pct === prev ? streak : 1,
      gap: (v.goal != null && v.pct < v.goal && late) ? v.goal - v.pct : 0
    };
  }

  /* מלאי: מתי עודכן לאחרונה (לא פחות מתחילת המעקב) */
  const stockRef = (s, floor) => Math.max(s.stockAt || 0, ...(s.materials || []).map(m => m.at || 0), floor || 0);
  const stockLast = s => Math.max(s.stockAt || 0, ...(s.materials || []).map(m => m.at || 0));

  /* חריגים מחושבים מהמצב עצמו (לא נשמרים), ו"מאז מתי" נשמר ב-st.since */
  function deriveExceptions(st, now){
    const out = [];
    const today = dstr(now), hour = new Date(now).getHours(), wk = weekKey(now);
    const since = st.since || {};
    const add = (e)=>{
      e.sinceTs = e.fixedTs || since[e.key] || now;
      e.ageMs = Math.max(0, now - e.sinceTs);
      const ageH = e.ageMs / HOUR;
      e.level = e.kind === "checkin"
        ? (hour >= CFG.checkinEsc ? 3 : 1)
        : (ageH >= CFG.escL3h ? 3 : ageH >= CFG.escL2h ? 2 : 1);
      if(e.minLevel) e.level = Math.max(e.level, e.minLevel);
      out.push(e);
    };
    const ownerOf = s => (s.owner && s.owner.name) || "—";

    st.sites.forEach(s=>{
      if(!s.active) return;
      const ow = ownerOf(s);
      const role = (s.owner && s.owner.role) || "";
      const base = { siteId: s.id, siteName: s.name, owner: ow, ownerRole: role, senior: s.senior || "" };
      if(ow === "לא משויך"){
        add({ ...base, key: s.id + ":noowner", kind: "noowner", sev: "crit",
          title: "אתר פעיל בלי מנהל משויך", detail: "אין אחראי על הדוח השבועי, החומרים והבקרה באתר",
          waitingOn: "הנהלה — לשייך מנהל פרויקט" });
      }
      const w = s.weekly, cur = curWeekly(s, now);

      /* עמודות: ליווי שלד / קומפלטים / השלמות / ספרינקלרים / חניונים */
      TRACKS.forEach(t=>{
        const ts = trackState(s, t.k, now);
        if(!ts || ts.pct >= 100 || !(ts.stalled || ts.gap)) return;
        const parts = [];
        if(ts.stalled) parts.push(ts.streak >= 2 ? "ללא שינוי " + ts.streak + " דוחות רצופים" : "כמו בשבוע שעבר (" + ts.prev + "%)");
        if(ts.gap) parts.push("פער של " + ts.gap + " נק׳ מיעד השבוע (" + ts.goal + "%)");
        add({ ...base, key: s.id + ":track:" + t.k, kind: "track", sub: ts.stalled ? "stalled" : "gap",
          sev: (ts.streak >= 3 || ts.gap >= 30) ? "crit" : "warn",
          title: t.label + (ts.stalled ? " לא התקדם" : " מתחת ליעד") + " — " + ts.pct + "%",
          detail: parts.join(" · "),
          waitingOn: "מנהל הפרויקט — הסבר ותוכנית החזרה", fixedTs: cur.at });
      });

      /* כ"א בשטח */
      if(cur && cur.workers != null){
        const hist = weekHistory(s, now), pw = hist.length ? hist[hist.length - 1].workers : null;
        if(cur.workers === 0 && trackOpen(cur)){
          add({ ...base, key: s.id + ":workers", kind: "workers", sev: "crit",
            title: "אין כוח אדם בשטח", detail: "יש מסלולים פתוחים בדוח השבועי, וכ״א מדווח 0",
            waitingOn: "מנהל הפרויקט — איוש הצוות", fixedTs: cur.at });
        } else if(pw != null && pw >= 5 && cur.workers <= pw * CFG.workerDrop){
          add({ ...base, key: s.id + ":workers", kind: "workers", sev: "warn",
            title: "ירידה בכוח אדם: " + pw + " ← " + cur.workers, detail: "ירידה חדה ביחס לדוח הקודם",
            waitingOn: "מנהל הפרויקט — הסבר ותוספת כ״א", fixedTs: cur.at });
        }
      }

      /* הערות / חריגים מהדוח השבועי */
      if(w && w.issue && hasText(w.note) && !w.issueResolvedAt){
        add({ ...base, key: s.id + ":wissue", kind: "wissue", sev: "warn",
          title: "חריג בדוח השבועי: " + w.note.trim(),
          detail: "דווח ע״י " + (w.by || "—") + " ב-" + dmy(w.at) + " " + hhmm(w.at),
          waitingOn: "מנהל אחראי — טיפול וסימון 'טופל'", fixedTs: w.at });
      }
      /* בטיחות — עולה מיד לדרג 2 */
      if(w && hasText(w.safety) && !w.safetyResolvedAt){
        add({ ...base, key: s.id + ":safety", kind: "safety", sev: "crit", minLevel: 2,
          title: "בטיחות: " + w.safety.trim(),
          detail: "דווח ע״י " + (w.by || "—") + " ב-" + dmy(w.at) + " " + hhmm(w.at),
          waitingOn: "מנהל הפרויקט — טיפול ותיעוד", fixedTs: w.at });
      }

      /* מלאי באתר מול המינימום שהמנהל הגדיר */
      (s.materials || []).forEach(m=>{
        if(!(m.onSite < m.need)) return;
        const lack = m.need - m.onSite;
        const donor = st.sites.filter(o => o.active && o.id !== s.id)
          .map(o => ({ o, d: (o.materials || []).find(x => x.at && x.item.trim() === m.item.trim() && x.need > 0 && x.onSite - x.need > 0) }))
          .filter(x => x.d).sort((a, b) => (b.d.onSite - b.d.need) - (a.d.onSite - a.d.need))[0];
        add({ ...base, key: s.id + ":material:" + m.item, kind: "material",
          sev: m.blocksTomorrow ? "crit" : "warn",
          title: "חוסר " + lack + " " + m.unit + " " + m.item,
          detail: "במלאי " + m.onSite + " מתוך מינימום " + m.need + (m.blocksTomorrow ? " · יעכב את העבודה" : "") +
            (donor ? " · אפשר לנייד מ" + donor.o.name + " (" + ((donor.o.owner && donor.o.owner.name) || "—") + "): עודף " + (donor.d.onSite - donor.d.need) + " " + donor.d.unit : ""),
          waitingOn: "מנהל הפרויקט — השלמת החומר (ניוד מאתר אחר או הזמנה ברכש)" });
      });

      if(s.checkin && s.checkin.status === "issue" && !s.checkin.resolvedAt){
        add({ ...base, key: s.id + ":reported", kind: "reported", sev: "warn",
          title: "חריגה מהשטח: " + s.checkin.note,
          detail: "דווח ע״י " + s.checkin.by + " ב-" + dmy(s.checkin.at) + " " + hhmm(s.checkin.at),
          waitingOn: "מנהל אחראי — טיפול וסימון 'טופל'", fixedTs: s.checkin.at });
      }
    });

    /* חריגים מקובצים לפי מנהל (כדי לא להציף) */
    const grouped = (pick, mk)=>{
      const g = {};
      st.sites.forEach(s=>{ if(s.active && inPilot(ownerName(s)) && pick(s)) (g[ownerName(s)] = g[ownerName(s)] || []).push(s); });
      Object.keys(g).forEach(name => mk(name, g[name]));
    };
    const names = arr => arr.slice(0, 4).map(x => x.name).join(" · ") + (arr.length > 4 ? " · ועוד " + (arr.length - 4) : "");
    const roleOf = arr => (arr[0].owner && arr[0].owner.role) || "";

    if(isWorkday(now) && hour >= CFG.checkinBy){
      const deadline = new Date(now); deadline.setHours(CFG.checkinBy, 0, 0, 0);
      grouped(s => !(s.checkin && s.checkin.date === today), (name, arr)=>
        add({ key: "mgr:" + name + ":checkin:" + today, kind: "checkin",
          sev: hour >= CFG.checkinEsc ? "crit" : "warn",
          siteId: arr[0].id, siteIds: arr.map(x => x.id), siteName: null, owner: name, ownerRole: roleOf(arr),
          title: arr.length + (arr.length === 1 ? " אתר בלי דיווח יומי" : " אתרים בלי דיווח יומי"),
          detail: names(arr), waitingOn: "דיווח יומי מהשטח", fixedTs: deadline.getTime() }));
    }

    /* דוח שבועי חסר: מיום א׳ 12:00 ועד ההגשה */
    const weeklyDue = new Date(weekStart(now)); weeklyDue.setHours(CFG.weeklyBy, 0, 0, 0);
    if(isWorkday(now) && now >= weeklyDue.getTime()){
      grouped(s => !curWeekly(s, now), (name, arr)=>
        add({ key: "mgr:" + name + ":weekly:" + wk, kind: "weekly", sev: "warn",
          siteId: arr[0].id, siteIds: arr.map(x => x.id), siteName: null, owner: name, ownerRole: roleOf(arr),
          title: arr.length + (arr.length === 1 ? " אתר בלי דוח שבועי" : " אתרים בלי דוח שבועי"),
          detail: names(arr), waitingOn: "דוח תוכנית עבודה שבועית — שטח ← הגש דוח שבועי", fixedTs: weeklyDue.getTime() }));
    }

    /* מלאי שלא עודכן */
    if(isWorkday(now)){
      grouped(s => now - stockRef(s, st.trackStart) >= CFG.stockDays * DAY, (name, arr)=>
        add({ key: "mgr:" + name + ":stock", kind: "stock", sev: "warn",
          siteId: arr[0].id, siteIds: arr.map(x => x.id), siteName: null, owner: name, ownerRole: roleOf(arr),
          title: arr.length + (arr.length === 1 ? " אתר בלי עדכון מלאי" : " אתרים בלי עדכון מלאי"),
          detail: names(arr) + " · מעל " + CFG.stockDays + " ימים", waitingOn: "עדכון מלאי בלשונית מלאי",
          fixedTs: Math.min(...arr.map(x => stockRef(x, st.trackStart) + CFG.stockDays * DAY)) }));
    }

    const sevRank = { crit: 0, warn: 1 };
    out.sort((a, b) => b.level - a.level || sevRank[a.sev] - sevRank[b.sev] || b.ageMs - a.ageMs);
    return out;
  }

  const exOfSite = (exceptions, id) => exceptions.filter(e => e.siteIds ? e.siteIds.includes(id) : e.siteId === id);

  /* סטטוס אתר לפי החריגים שלו */
  function siteStatus(s, exs, now){
    if(!s.active) return "inactive";
    const mine = exOfSite(exs, s.id);
    if(mine.some(e => e.sev === "crit")) return "crit";
    if(mine.length) return "warn";
    return curWeekly(s, now) ? "ok" : "nodata";
  }
  const STATUS_TEXT = { ok:"בקצב", warn:"דורש מעקב", crit:"בסיכון", inactive:"לא פעיל", nodata:"אין דוח השבוע" };

  function scorecards(st, exceptions, now){
    const hour = new Date(now).getHours();
    const startDs = dstr(st.trackStart || now);
    const days = [];
    for(let i = 0; i < 7; i++){
      const ts = now - i * DAY;
      if(!isWorkday(ts)) continue;
      const ds = dstr(ts);
      if(ds < startDs) continue;
      if(i === 0 && hour < CFG.checkinBy) continue;
      days.push(ds);
    }
    const names = [...new Set(st.sites.filter(s => s.active).map(s => (s.owner && s.owner.name) || "—"))];
    const rank = { crit: 0, warn: 1, ok: 2 };
    return names.map(name=>{
      const sites = st.sites.filter(s => s.active && ((s.owner && s.owner.name) || "—") === name);
      const ex = exceptions.filter(e => e.owner === name);
      const reps = sites.map(s => curWeekly(s, now)).filter(Boolean);
      const pcts = reps.flatMap(w => TRACKS.map(t => w.tracks && w.tracks[t.k]).filter(Boolean).map(v => v.pct));
      let checkin = null;
      if(days.length){
        let hit = 0;
        sites.forEach(s => days.forEach(d => { if((s.checkinLog || []).includes(d)) hit++; }));
        checkin = Math.round(100 * hit / (sites.length * days.length));
      }
      const crit = ex.filter(e => e.sev === "crit").length;
      const l3 = ex.filter(e => e.level === 3).length;
      return {
        name, role: (sites[0].owner && sites[0].owner.role) || "", sites: sites.length,
        open: ex.length, crit, l3,
        avgAgeH: ex.length ? Math.round(ex.reduce((a, e) => a + e.ageMs, 0) / ex.length / HOUR) : 0,
        weekly: reps.length,
        progress: pcts.length ? Math.round(pcts.reduce((a, v) => a + v, 0) / pcts.length) : null,
        stalled: ex.filter(e => e.kind === "track").length,
        workers: reps.length ? reps.reduce((a, w) => a + (w.workers || 0), 0) : null,
        safety: ex.filter(e => e.kind === "safety").length,
        stockFresh: sites.filter(s => { const l = stockLast(s); return l > 0 && now - l < CFG.stockDays * DAY; }).length,
        shortages: ex.filter(e => e.kind === "material").length,
        checkin, pilot: inPilot(name),
        health: (l3 > 0 || crit >= 2) ? "crit" : ex.length ? "warn" : "ok"
      };
    }).sort((a, b) => (b.pilot ? 1 : 0) - (a.pilot ? 1 : 0) || rank[a.health] - rank[b.health] || b.l3 - a.l3 || b.open - a.open);
  }

  function tone(kind, v){
    if(v == null) return "";
    if(kind === "age") return v >= 24 ? "crit" : v >= 4 ? "warn" : "";
    if(kind === "ci")  return v < 50 ? "crit" : v < 80 ? "warn" : "";
    if(kind === "cnt") return v > 0 ? "crit" : "";
    if(kind === "cntw") return v > 0 ? "warn" : "";
    return "";
  }

  function buildReport(st, exceptions, cards, now){
    const lines = [];
    const active = st.sites.filter(s => s.active);
    const crit = exceptions.filter(e => e.sev === "crit").length;
    const l3 = exceptions.filter(e => e.level === 3).length;
    const pilotSites = active.filter(s => inPilot(ownerName(s)));
    const subm = pilotSites.filter(s => curWeekly(s, now)).length;
    lines.push("📋 דוח בקרה — ט.ש. מי רון");
    lines.push(dmy(now) + "/" + new Date(now).getFullYear() + " · " + hhmm(now) + " · שבוע " + weekLabel(now));
    lines.push("");
    lines.push("אתרים פעילים: " + active.length + " · דוח שבועי הוגש: " + subm + "/" + pilotSites.length + (PILOT.length ? " (פיילוט: " + PILOT.join(", ") + ")" : ""));
    lines.push("חריגים פתוחים: " + exceptions.length + " (אדומים: " + crit + ") · בדרג בעלים: " + l3);
    if(exceptions.length){
      lines.push("");
      lines.push("— חריגים בולטים —");
      exceptions.slice(0, 8).forEach(e =>
        lines.push("• " + e.title + (e.siteName ? " (" + e.siteName + ")" : "") + " — אחראי: " + e.owner + " — פתוח " + ageText(e.ageMs) + " — " + LEVEL_SHORT[e.level]));
    }
    lines.push("");
    lines.push("— כרטיסי מנהלים —");
    cards.forEach(c =>
      lines.push(c.name + " (" + c.sites + " אתרים): חריגים " + c.open + (c.open ? " (גיל ממוצע " + c.avgAgeH + " שע׳)" : "") +
        " · דוח שבועי " + c.weekly + "/" + c.sites +
        " · התקדמות " + (c.progress == null ? "—" : c.progress + "%") +
        " · מסלולים בעייתיים " + c.stalled +
        " · כ״א " + (c.workers == null ? "—" : c.workers) +
        " · מלאי עודכן " + c.stockFresh + "/" + c.sites));
    return lines.join("\n");
  }

     כל הנתונים יושבים תחת t/{קוד צוות}/...  הקוד נמסר למנהלים בקישור (#k=...) ונשמר במכשיר.

  const docKey = k => String(k).replace(/\//g, "|");

    const s = cleanDoc(site);

  function cloudStart(code, h){
    if(typeof firebase === "undefined"){ h.status("error", { code:"sdk-missing" }); return ()=>{}; }
    if(!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    const db = firebase.firestore();
    try{ db.enablePersistence({ synchronizeTabs:true }).catch(()=>{}); }catch(e){}
    Cloud.db = db; Cloud.base = db.collection("t").doc(code); Cloud.on = true;
    const unsubs = [];
    let stopped = false;
    firebase.auth().signInAnonymously().then(()=>{
      if(stopped) return;
      const col = n => Cloud.base.collection(n);
      const err = e => h.status("error", e);
      ["sites","requests","transfers","nudges","since"].forEach(n =>
        unsubs.push(col(n).onSnapshot(s => h.data(n, s.docs.map(d => d.data()), s.metadata.fromCache), err)));
      unsubs.push(col("log").orderBy("ts", "desc").limit(150)
        .onSnapshot(s => h.data("log", s.docs.map(d => d.data()), s.metadata.fromCache), err));
      unsubs.push(col("meta").doc("app").onSnapshot(d => h.meta(d.exists ? d.data() : null), err));
      h.status("connecting");
    }).catch(e => h.status("error", e));
    return ()=>{ stopped = true; unsubs.forEach(u => { try{ u(); }catch(e){} }); };
  }

  function cloudWrite(prev, next){
    if(!Cloud.on) return;
    const col = n => Cloud.base.collection(n);
    const batch = Cloud.db.batch();
    let ops = 0;
    const set = (n, id, data) => { batch.set(col(n).doc(docKey(id)), data); ops++; };
    const del = (n, id) => { batch.delete(col(n).doc(docKey(id))); ops++; };

    [["sites", stripSite], ["requests", cleanDoc], ["transfers", cleanDoc]].forEach(([n, fix])=>{
      const before = new Map((prev[n] || []).map(x => [x.id, JSON.stringify(x)]));
      const ids = new Set();
      (next[n] || []).forEach(x => { ids.add(x.id); if(before.get(x.id) !== JSON.stringify(x)) set(n, x.id, fix(x)); });
      before.forEach((_, id) => { if(!ids.has(id)) del(n, id); });
    });
    const pn = prev.nudges || {}, nn = next.nudges || {};
    Object.keys(nn).forEach(k => { if(JSON.stringify(pn[k]) !== JSON.stringify(nn[k])) set("nudges", k, { k, at:nn[k].at, by:nn[k].by }); });
    Object.keys(pn).forEach(k => { if(!(k in nn)) del("nudges", k); });
    const ps = prev.since || {}, ns = next.since || {};
    Object.keys(ns).forEach(k => { if(ps[k] !== ns[k]) set("since", k, { k, ts:ns[k] }); });
    Object.keys(ps).forEach(k => { if(!(k in ns)) del("since", k); });
    const seen = new Set((prev.log || []).map(l => l.id));
    (next.log || []).forEach(l => { if(l.id && !seen.has(l.id)) set("log", l.id, cleanDoc(l)); });
    if(prev.trackStart !== next.trackStart || prev.rosterV !== next.rosterV || prev.cleanV !== next.cleanV){
      batch.set(col("meta").doc("app"), { trackStart:next.trackStart, rosterV:next.rosterV, cleanV:next.cleanV || 0 }, { merge:true }); ops++;
    }
    if(ops) batch.commit().catch(e => console.warn("cloud write failed", e));
  }
  function cloudPhotos(siteId, cb){
    if(!Cloud.on) return ()=>{};
    return Cloud.base.collection("photos").where("siteId", "==", siteId)
      .onSnapshot(s => cb(s.docs.map(d => d.data())), ()=>{});
  }
  const cloudPhotoPut = p => Cloud.on && Cloud.base.collection("photos").doc(p.id).set(p).catch(e => console.warn("photo write failed", e));
  const cloudPhotoDel = id => Cloud.on && Cloud.base.collection("photos").doc(id).delete().catch(()=>{});

    const update = useCallback((fn)=>{

    const applyRemote = useCallback((name, docs, fromCache)=>{

      else if(name === "nudges"){ next.nudges = {}; docs.forEach(d => { next.nudges[d.k] = { at:d.at, by:d.by }; }); }
      else if(name === "since"){ next.since = {}; docs.forEach(d => { next.since[d.k] = d.ts; }); }

        if(!Array.isArray(u.photos)) u.photos = [];
        u.photos.push(cloudCode ? { id:pid, ts:pts, by:who } : { id:pid, url:dataUrl, ts:pts, by:who });
        pushLog(d, who, "צירף תמונה (" + u.title + ")", siteId);
        return d;
      });
    }
    function removePhoto(siteId, unitId, photoId){
      if(cloudCode) cloudPhotoDel(photoId);
      update(d=>{
        const u = d.sites.find(s=>s.id===siteId).units.find(x=>x.id===unitId);
        u.photos = (u.photos || []).filter(p => p.id !== photoId);
        pushLog(d, who, "מחק תמונה (" + u.title + ")", siteId);
        return d;
      });
    }
    function addUnit(siteId, data){
      update(d=>{
        const s = d.sites.find(x=>x.id===siteId);
        s.units.push({ id:"u"+siteId+"_"+Date.now(), floor:data.floor.trim()||"—", title:data.title.trim(), stage:"task", photos:[], checklist:[] });
        pushLog(d, who, "פתח סעיף עבודה חדש: " + data.title.trim(), siteId);
        return d;
      });
      notify("סעיף עבודה חדש נוסף לאתר");
    }
    function checkin(siteId, status, note){
      update(d=>{
        const s = d.sites.find(x=>x.id===siteId);
        const ts = Date.now(), ds = dstr(ts);
        s.checkin = { at:ts, date:ds, by:who, status, note: note || "" };
        s.checkinLog = s.checkinLog || [];
        if(!s.checkinLog.includes(ds)) s.checkinLog.push(ds);
        if(s.checkinLog.length > 60) s.checkinLog.shift();
        pushLog(d, who, status === "issue" ? "דיווח יומי · חריגה: " + note : "דיווח יומי · אין חריגים", siteId);
        return d;
      });
      notify(status === "issue" ? "החריגה נשלחה לאחראי ולמרכז הבקרה" : "הדיווח היומי נרשם");
    }
    function resolveException(e){
      update(d=>{
        const s = d.sites.find(x=>x.id===e.siteId); if(!s) return d;
        const ts = Date.now();
        if(e.kind === "reported" && s.checkin) s.checkin.resolvedAt = ts;
        else if(e.kind === "wissue" && s.weekly) s.weekly.issueResolvedAt = ts;
        else if(e.kind === "safety" && s.weekly) s.weekly.safetyResolvedAt = ts;
        pushLog(d, who, "סימן כטופל: " + e.title, e.siteId);
        return d;
      });
      notify("סומן כטופל");
    }
    function submitWeekly(siteId, data){
      update(d=>{
        const s = d.sites.find(x=>x.id===siteId); if(!s) return d;
        const ts = Date.now(), wk = weekKey(ts), same = s.weekly && s.weekly.week === wk;
        if(s.weekly && !same){
          s.weeklyHist = s.weeklyHist || [];
          s.weeklyHist.push(compactWeekly(s.weekly));
          if(s.weeklyHist.length > 8) s.weeklyHist.shift();
        }
        const o = same ? s.weekly : null;
        s.weekly = {
          week: wk, at: ts, by: who, foreman: data.foreman, lead: data.lead, tracks: data.tracks, workers: data.workers,
          note: data.note, issue: data.issue, issueResolvedAt: (o && o.note === data.note) ? (o.issueResolvedAt || null) : null,
          safety: data.safety, safetyResolvedAt: (o && o.safety === data.safety) ? (o.safetyResolvedAt || null) : null
        };
        const ps = TRACKS.filter(t => data.tracks[t.k]).map(t => t.label + " " + data.tracks[t.k].pct + "%").join(", ");
        pushLog(d, who, (same ? "עדכן" : "הגיש") + " דוח שבועי · " + (ps || "ללא מסלולים") + " · כ״א " + data.workers, siteId);
        return d;
      });
      setNav({ screen:"field.home" });
      notify("הדוח השבועי נשלח למרכז הבקרה");
    }
    function stockSave(siteId, orig, patch){
      update(d=>{
        const s = d.sites.find(x=>x.id===siteId); if(!s) return d;
        s.materials = s.materials || [];
        let m = orig != null ? s.materials.find(x=>x.item===orig) : null;
        if(!m){
          m = s.materials.find(x=>x.item===patch.item);
          if(!m){ m = { item:patch.item, need:0, onSite:0, unit:"יח׳", blocksTomorrow:false }; s.materials.push(m); }
        }
        const before = m.at ? m.onSite : null;
        if(patch.item && patch.item !== m.item && !s.materials.some(x=>x!==m && x.item===patch.item)) m.item = patch.item;
        ["onSite","unit","need","blocksTomorrow"].forEach(k => { if(patch[k] !== undefined) m[k] = patch[k]; });
        m.at = Date.now(); m.by = who;
        s.stockAt = m.at; s.stockBy = who;
        pushLog(d, who, "עדכן מלאי: " + m.item + " · " + m.onSite + " " + m.unit + (before != null && before !== m.onSite ? " (היה " + before + ")" : ""), siteId);
        return d;
      });
    }
    function stockDelete(siteId, item){
      update(d=>{
        const s = d.sites.find(x=>x.id===siteId); if(!s) return d;
        s.materials = (s.materials || []).filter(m => m.item !== item);
        s.stockAt = Date.now(); s.stockBy = who;
        pushLog(d, who, "הסיר פריט מהמלאי: " + item, siteId);
        return d;
      });
      notify("הפריט הוסר מהמלאי");
    }
    function stockConfirm(siteId){
      update(d=>{
        const s = d.sites.find(x=>x.id===siteId); if(!s) return d;
        s.stockAt = Date.now(); s.stockBy = who;
        pushLog(d, who, "אישר שהמלאי מעודכן (" + (s.materials || []).length + " פריטים)", siteId);
        return d;
      });
      notify("המלאי סומן כמעודכן להיום");
    }
    function nudge(e){
      update(d=>{
        d.nudges = d.nudges || {};
        d.nudges[e.key] = { at: Date.now(), by: who };
        pushLog(d, who, "דחף את " + e.owner + ": " + e.title, e.siteId);
        return d;
      });
      notify("נרשמה דחיפה ל" + e.owner + " · Push אמיתי יופעל עם חיבור המסד המשותף");
    }
    let body;
    const blocked = cloudCode && (!cloud.ready || cloud.empty);
    if(blocked)
      body = cloud.empty
        ? html`<div class="screen narrow"><div class="card">
            <div class="lbl">המסד המשותף ריק</div>
            <div class="val">עדיין אין נתונים בצוות הזה.</div>
            <div class="hint" style=${{textAlign:"start"}}>הלחיצה תעלה את 31 הפרויקטים ואת המנהלים אל המסד, ומאותו רגע כל מי שמחובר רואה אותם.</div>
            <button class="btn pri wide" style=${{marginTop:12}} onClick=${seedCloud}>טען נתוני בסיס (31 פרויקטים)</button>
          </div></div>`
        : html`<div class="screen narrow"><div class="empty">
            ${cloud.status === "error" ? "שגיאת חיבור: " + (cloud.err || "לא ידועה") : navigator.onLine ? "טוען נתונים משותפים…" : "אין חיבור — מחכה לרשת"}
            <div style=${{marginTop:14}}><button class="btn" style=${{flex:"none", padding:"9px 16px"}} onClick=${goLocal}>המשך במצב מקומי</button></div>
          </div></div>`;
    else if(nav.screen === "ctl.home")
      body = html`<${Control} st=${st} now=${now} exceptions=${exceptions} cards=${cards} ctl=${ctl} setCtl=${setCtl}
        onOpen=${id=>setNav({screen:"ctl.site", id})} onNudge=${nudge} onResolve=${resolveException} notify=${notify} />`;
    else if(nav.screen === "ctl.site")
      body = html`<${SiteDetail} site=${bySite(nav.id)} st=${st} now=${now} ex=${exOfSite(exceptions, nav.id)}
        log=${(st.log||[]).filter(l=>l.siteId===nav.id).slice(0,8)}
        onBack=${()=>setNav({screen:"ctl.home"})} notify=${notify} />`;
    else if(nav.screen === "field.home")
      body = html`<${FieldHome} sites=${sites} now=${now} onCheckin=${checkin} onOpen=${(sid,uid)=>setNav({screen:"field.report", sid, uid})} onAddUnit=${addUnit} onWeekly=${sid=>setNav({screen:"field.weekly", sid})} />`;
    else if(nav.screen === "field.weekly"){
      const wsite = bySite(nav.sid);
      body = wsite
        ? html`<${WeeklyForm} key=${wsite.id} site=${wsite} now=${now} onSubmit=${submitWeekly} onBack=${()=>setNav({screen:"field.home"})} />`
        : html`<div class="screen narrow"><div class="empty">האתר לא נמצא</div></div>`;
    }
    else if(nav.screen === "field.report"){
      const rsite = bySite(nav.sid);
      const runit = rsite && rsite.units.find(u=>u.id===nav.uid);
      body = runit
        ? html`<${Report} site=${rsite} unit=${runit} photoMap=${photoMap} onBack=${()=>setNav({screen:"field.home"})}
            onToggle=${toggleTask} onAddTask=${addTask} onRemoveTask=${removeTask}
            onAddPhoto=${addPhoto} onRemovePhoto=${removePhoto}
            notify=${notify} />`
        : html`<div class="screen narrow"><div class="empty">היחידה לא נמצאה</div></div>`;
    }
    else if(nav.screen === "stock.home")
      body = html`<${StockHome} st=${st} now=${now} who=${who} onStockSave=${stockSave} onStockDelete=${stockDelete} onStockConfirm=${stockConfirm} />`;

    return html`
      <div class="app">
        <div class="topbar">
          <div class="brand">
            <span class="plate"><img src=${LOGO} alt="ט.ש. מי רון" /></span>
            <span class="txt"><b>ט.ש. מי רון</b><span>פלס · בקרת ביצוע לאינסטלציה</span></span>
          </div>
          <div class="seg" role="tablist">
            <button role="tab" class=${role==="ctl"?"on":""} onClick=${()=>switchRole("ctl")}>בקרה</button>
            <button role="tab" class=${role==="field"?"on":""} onClick=${()=>switchRole("field")}>שטח</button>
            <button role="tab" class=${role==="stock"?"on":""} onClick=${()=>switchRole("stock")}>מלאי</button>
          </div>
          <button class="ic0 me" title=${"מחובר כ-"+me.name+" · החלף"} onClick=${()=>setIdSheet(true)}>${me.name.slice(0,1)}<i class=${"sdot "+cloud.status}></i></button>
          <button class="ic0" title="מצב תצוגה" onClick=${toggleTheme}>◐</button>
          <button class="ic0" title="אפס דמו" onClick=${reset}>↺</button>
        </div>
        ${!cloudCode
          ? html`<div class="banner">מצב מקומי — הנתונים נשמרים רק במכשיר הזה <button class="chip" onClick=${()=>setTeamSheet(true)}>הזן קוד צוות</button></div>`
          : cloud.status === "offline" ? html`<div class="banner">אין חיבור — השינויים נשמרים במכשיר ויסונכרנו כשהרשת תחזור</div>`
          : cloud.status === "error" && cloud.ready ? html`<div class="banner err">בעיית סנכרון (${cloud.err}) — השינויים עלולים לא להישמר במסד</div>` : null}
        ${body}
        <div class="brandfoot"><b>ט.ש. מי רון</b> · אנשים עושים הנדסה</div>
        ${toast && html`<div class="toast"><div>${toast}</div></div>`}
        ${teamSheet && html`
          <div class="scrim" onClick=${()=>setTeamSheet(false)}>
            <div class="sheet" onClick=${e=>e.stopPropagation()}>
              <h3>קוד צוות</h3>
              <div class="who">${cloudCode ? "מחובר למסד המשותף. מצב: " + cloud.status : "מצב מקומי — הנתונים נשמרים רק במכשיר הזה."} את הקוד מקבלים מההנהלה, בדרך כלל כקישור שפותח את האפליקציה כבר מחוברת.</div>
              <input class="tin" type="text" dir="ltr" value=${teamInput} onInput=${e=>setTeamInput(e.target.value)} placeholder="הדבק כאן קוד צוות" autocapitalize="off" autocomplete="off" />
              <div class="btnrow" style=${{marginTop:10}}>
                ${cloudCode ? html`<button class="btn danger" onClick=${disconnectTeam}>נתק מהמסד</button>` : html`<button class="btn" onClick=${()=>setTeamSheet(false)}>ביטול</button>`}
                <button class="btn pri" disabled=${!/^[A-Za-z0-9]{16,64}$/.test(teamInput.trim())} onClick=${saveTeam}>התחבר</button>
              </div>
            </div>
          </div>`}
        ${idSheet && html`
          <div class="scrim" onClick=${()=>setIdSheet(false)}>
            <div class="sheet" onClick=${e=>e.stopPropagation()}>
              <h3>מי אתה?</h3>
              <div class="who">השם נרשם ביומן הפעולות ליד כל פעולה שתבצע. התחברות מאובטחת אישית תיכנס עם חיבור המסד המשותף.</div>
              ${[{name:"דוד", role:"הנהלה"}, {name:"טל", role:"מאשר הזמנות"}, {name:"שרון", role:"רכש"}, ...cards.filter(c=>c.name!=="לא משויך").map(c=>({name:c.name, role:c.role})), {name:"איש שטח"}].map(m => html`
                <button key=${m.name} class="opt" onClick=${()=>pickMe(m)}>
                  <span class="e">${me.name===m.name ? "✓" : "👤"}</span>${m.name}${m.role ? " · " + m.role : ""}
                </button>`)}
              <button class="opt" onClick=${()=>{ setIdSheet(false); setTeamSheet(true); }}><span class="e">🔑</span>קוד צוות · מסד משותף (${cloudCode ? "מחובר" : "מקומי"})</button>
            </div>
          </div>`}
      </div>`;
  }

  function Tile({ val, label, kind, cls }){
    return html`<div class=${"mt " + (cls != null ? cls : tone(kind, val))}><b>${val == null ? "—" : val}</b><span>${label}</span></div>`;
  }

  /* מלאי של אתר: מתי עודכן ועל ידי מי */
  function stockInfo(s, st, now){
    const mats = s.materials || [];
    const last = stockLast(s);
    let by = s.stockBy || "";
    const latest = mats.filter(m => m.at).sort((a, b) => b.at - a.at)[0];
    if(latest && latest.at >= (s.stockAt || 0)) by = latest.by || by;
    return {
      last, by, fresh: last > 0 && now - last < CFG.stockDays * DAY,
      short: mats.filter(m => m.onSite < m.need).length, count: mats.length
    };
  }

  function Control({ st, now, exceptions, cards, ctl, setCtl, onOpen, onNudge, onResolve, notify }){
    const [rep, setRep] = useState(null);
    const { tab, mgr } = ctl;
    const list = exceptions.filter(e => mgr === "all" || e.owner === mgr);
    const crit = exceptions.filter(e => e.sev === "crit").length;
    const l3 = exceptions.filter(e => e.level === 3).length;
    const active = st.sites.filter(s => s.active);
    const pilotSites = active.filter(s => inPilot(ownerName(s)));
    const subm = pilotSites.filter(s => curWeekly(s, now)).length;
    const nudges = st.nudges || {};
    const siteName = id => { const s = st.sites.find(x => x.id === id); return s ? s.name : ""; };
    const T = (k, label) => html`<button class=${"chip "+(tab===k?"on":"")} onClick=${()=>setCtl({...ctl, tab:k})}>${label}</button>`;

    async function shareRep(){
      try{ if(navigator.share){ await navigator.share({ text: rep }); return; } }
      catch(e){ if(e && e.name === "AbortError") return; }
      try{ await navigator.clipboard.writeText(rep); notify("הדוח הועתק — הדבק בוואטסאפ"); }
      catch(e){ notify("לא ניתן להעתיק אוטומטית — סמן והעתק ידנית"); }
    }

    return html`
      <div class="screen">
        <div class="shead rowbet">
          <div><h2>מרכז בקרה</h2><span class="sub">${active.length} אתרים פעילים · שבוע ${weekLabel(now)} · עדכון ${hhmm(now)}</span></div>
          <button class="btn" style=${{flex:"none", padding:"8px 14px"}} onClick=${()=>setRep(buildReport(st, exceptions, cards, now))}>📋 דוח</button>
        </div>

        <div class="kpis">
          <div class=${"kpi "+(exceptions.length?"warn":"")}><b>${exceptions.length}</b><span>חריגים פתוחים</span></div>
          <div class=${"kpi "+(crit?"crit":"")}><b>${crit}</b><span>אדומים</span></div>
          <div class=${"kpi "+(l3?"crit":"")}><b>${l3}</b><span>דרג בעלים</span></div>
          <div class=${"kpi "+(subm < pilotSites.length ? "warn" : "")}><b>${subm}/${pilotSites.length}</b><span>דוח שבועי הוגש${PILOT.length ? " (פיילוט)" : ""}</span></div>
        </div>

        ${PILOT.length > 0 && html`<div class="alert warn" style=${{margin:"10px 0 0"}}><span class="b"></span>פיילוט: ${PILOT.join(", ")} — חריגי דוח שבועי, מלאי ודיווח יומי נספרים רק להם.</div>`}

        <div class="chips">
          ${T("ex", "חריגים (" + list.length + ")")}
          ${T("mgr", "מנהלים")}
          ${T("plan", "תוכנית שבועית")}
          ${T("stock", "מלאי")}
          ${T("log", "יומן פעולות")}
        </div>

        ${mgr !== "all" && tab !== "mgr" && tab !== "log" && html`<div class="alert warn" style=${{marginBottom:10}}><span class="b"></span>מסונן לפי מנהל: ${mgr}
          <button class="chip" style=${{marginInlineStart:"auto"}} onClick=${()=>setCtl({...ctl, mgr:"all"})}>נקה סינון</button></div>`}

        ${tab === "ex" && html`
          <div class="exlist">
            ${list.map(e => {
              const n = nudges[e.key];
              return html`
                <div key=${e.key} class=${"ex "+e.sev}>
                  <div class="rowbet" style=${{alignItems:"flex-start"}}>
                    <div class="t">${e.title}</div>
                    <span class=${"lvl l"+e.level}>${LEVEL_SHORT[e.level]}</span>
                  </div>
                  ${e.siteName && html`<div class="ds">${e.siteName}</div>`}
                  <div class="ds">${e.detail}</div>
                  <div class="meta">אחראי: <b>${e.owner}</b>${e.ownerRole ? " · " + e.ownerRole : ""}${e.senior ? " · מנהל בכיר: " + e.senior : ""}<br/>ממתין ל: ${e.waitingOn} · פתוח <b>${ageText(e.ageMs)}</b> · ${LEVEL_TEXT[e.level]}</div>
                  ${n && html`<div class="meta">נדחף ע״י ${n.by} לפני ${ageText(now - n.at)}</div>`}
                  <div class="btnrow">
                    <button class="btn" onClick=${()=>onOpen(e.siteId)}>${e.siteIds && e.siteIds.length > 1 ? "פתח אתר ראשון" : "פתח אתר"}</button>
                    ${(e.kind === "reported" || e.kind === "wissue" || e.kind === "safety") && html`<button class="btn ok" onClick=${()=>onResolve(e)}>טופל</button>`}
                    <button class="btn pri" onClick=${()=>onNudge(e)}>דחוף אחראי</button>
                  </div>
                </div>`;
            })}
            ${list.length === 0 && html`<div class="alert empty"><span class="b"></span>אין חריגים פתוחים${mgr!=="all" ? " אצל "+mgr : ""} — הכל בקצב</div>`}
          </div>
          <div class="hint">נושאי הבקרה לפי טופס התוכנית השבועית: ליווי שלד · קומפלטים · השלמות · ספרינקלרים · חניונים · כ״א בשטח · הערות/חריגים · בטיחות, ובנוסף מלאי באתר. חריג עובר דרג אחרי ${CFG.escL2h} שעות (דרג 2) ו-${CFG.escL3h} שעות (דרג בעלים). נקודת בטיחות עולה מיד לדרג 2.</div>
        `}

        ${tab === "mgr" && html`
          <div style=${{display:"flex", flexDirection:"column", gap:12}}>
            ${cards.map(c => html`
              <div key=${c.name} class="card mc">
                <div class="rowbet">
                  <div><div style=${{fontWeight:700, fontSize:"1.02rem"}}>${c.name}${c.pilot && PILOT.length ? html` <span class="tg" style=${{background:"var(--accent-wash)", color:"var(--accent-ink)"}}>פיילוט</span>` : null}</div><div class="sub" style=${{fontFamily:"Heebo,sans-serif", fontSize:".74rem", color:"var(--ink-3)"}}>${c.role} · ${c.sites} אתרים</div></div>
                  <span class=${"pill "+c.health}>${c.health==="crit"?"דורש התערבות":c.health==="warn"?"דורש מעקב":"תקין"}</span>
                </div>
                <div class="mgrid">
                  <${Tile} val=${c.open} label="חריגים פתוחים" cls=${c.crit ? "crit" : c.open ? "warn" : ""} />
                  <${Tile} val=${c.open ? c.avgAgeH + " שע׳" : "—"} label="גיל ממוצע" kind=${c.open ? "age" : ""} />
                  <${Tile} val=${c.safety} label="חריגי בטיחות" kind="cnt" />
                  <${Tile} val=${c.weekly + "/" + c.sites} label="דוח שבועי הוגש" cls=${c.weekly < c.sites ? "warn" : ""} />
                  <${Tile} val=${c.progress == null ? null : c.progress + "%"} label="התקדמות ממוצעת" />
                  <${Tile} val=${c.stalled} label="מסלולים תקועים / מתחת ליעד" kind="cntw" />
                  <${Tile} val=${c.workers} label="כ״א בשטח השבוע" />
                  <${Tile} val=${c.stockFresh + "/" + c.sites} label=${"מלאי עודכן (" + CFG.stockDays + " ימים)"} cls=${c.stockFresh < c.sites ? "warn" : ""} />
                  <${Tile} val=${c.checkin == null ? null : c.checkin + "%"} label="דיווח יומי (7 ימים)" kind="ci" />
                </div>
                <div class="btnrow" style=${{marginTop:12}}>
                  <button class="btn" onClick=${()=>setCtl({tab:"ex", mgr:c.name})}>החריגים של ${c.name.split(" ")[0]}</button>
                  <button class="btn" onClick=${()=>setCtl({tab:"plan", mgr:c.name})}>תוכנית שבועית</button>
                </div>
              </div>`)}
          </div>
          <div class="hint">אין ציון יחיד בכוונה — כל מדד מוצג לבד כדי שלא ינסו "לשחק" אותו. ההתקדמות נמדדת מדוחות התוכנית השבועית של המנהלים, לצד כ״א, בטיחות ומלאי.</div>
        `}

        ${tab === "plan" && html`<${PlanMatrix} st=${st} now=${now} mgr=${mgr} cards=${cards} exceptions=${exceptions} onOpen=${onOpen} />`}
        ${tab === "stock" && html`<${StockOverview} st=${st} now=${now} mgr=${mgr} cards=${cards} onOpen=${onOpen} />`}

        ${tab === "log" && html`
          <div class="card">
            ${(st.log || []).slice(0, 80).map((l, i) => html`
              <div class="logrow" key=${i}>
                <span class="tm">${dmy(l.ts)} ${hhmm(l.ts)}</span> · <b>${l.who}</b>${l.siteId ? " · " + siteName(l.siteId) : ""}<br/>${l.text}
              </div>`)}
            ${(st.log || []).length === 0 && html`<div class="empty" style=${{padding:"24px 0"}}>עדיין אין פעולות ביומן. כל דוח, עדכון מלאי, אישור ודחיפה יירשמו כאן עם שם המבצע.</div>`}
          </div>
        `}

        ${rep && html`
          <div class="scrim" onClick=${()=>setRep(null)}>
            <div class="sheet" onClick=${e=>e.stopPropagation()}>
              <h3>דוח בקרה</h3>
              <div class="who">מוכן לשליחה בוואטסאפ</div>
              <pre class="rep">${rep}</pre>
              <div class="btnrow">
                <button class="btn" onClick=${()=>setRep(null)}>סגור</button>
                <button class="btn pri" onClick=${shareRep}>שתף / העתק</button>
              </div>
            </div>
          </div>`}
      </div>`;
  }

  /* הטבלה המאוחדת = טופס "דוח תוכנית עבודה שבועית" של כל המנהלים */
  function PlanCell({ s, k, now }){
    const cur = curWeekly(s, now);
    if(!cur) return html`<td class="pc na">·</td>`;
    const v = cur.tracks && cur.tracks[k];
    if(!v) return html`<td class="pc nr">—</td>`;
    const ts = trackState(s, k, now);
    const cls = v.pct >= 100 ? "done" : ts.stalled ? "bad" : ts.gap ? "warn" : "";
    const dl = ts.delta;
    return html`<td class=${"pc "+cls}><b>${v.pct}%</b>${dl ? html`<i>${dl > 0 ? "▲" : "▼"}${Math.abs(dl)}</i>` : null}${v.goal != null ? html`<small>יעד ${v.goal}</small>` : null}</td>`;
  }

  function PlanMatrix({ st, now, mgr, cards, exceptions, onOpen }){
    const names = cards.map(c => c.name).filter(n => mgr === "all" || n === mgr);
    const rowsOf = n => st.sites.filter(s => s.active && ((s.owner && s.owner.name) || "—") === n).sort((a, b) => a.num - b.num);
    const withText = st.sites.filter(s => {
      if(!s.active || (mgr !== "all" && ((s.owner && s.owner.name) || "—") !== mgr)) return false;
      const w = s.weekly; return w && (hasText(w.note) || hasText(w.safety));
    });
    return html`
      <div class="pm">
        <table class="plan">
          <thead><tr>
            <th class="nm">אתר</th>
            ${TRACKS.map(t => html`<th key=${t.k} title=${t.label}>${t.short || t.label}</th>`)}
            <th>כ״א</th>
          </tr></thead>
          <tbody>
            ${names.map(n => {
              const rows = rowsOf(n);
              return html`
                <tr class="grp" key=${"g"+n}><td colspan=${TRACKS.length + 2}>${n} · ${rows.length} אתרים · ${inPilot(n) ? "דוח שבועי " + rows.filter(s => curWeekly(s, now)).length + "/" + rows.length : "לא בפיילוט"}</td></tr>
                ${rows.map(s => {
                  const cur = curWeekly(s, now);
                  const flag = exOfSite(exceptions, s.id).some(e => e.kind === "safety" || e.kind === "wissue");
                  return html`
                    <tr key=${s.id} class="srow" onClick=${()=>onOpen(s.id)}>
                      <td class="nm">${flag ? "⚠ " : ""}${s.name}<small>${s.contractor}</small></td>
                      ${TRACKS.map(t => html`<${PlanCell} key=${t.k} s=${s} k=${t.k} now=${now} />`)}
                      <td class=${"pc "+(cur ? (cur.workers === 0 && trackOpen(cur) ? "bad" : "") : "na")}>${cur ? (cur.workers == null ? "—" : html`<b>${cur.workers}</b>`) : "·"}</td>
                    </tr>`;
                })}`;
            })}
          </tbody>
        </table>
      </div>
      <div class="legend"><span class="lg bad"></span>תקוע / כ״א 0 <span class="lg warn"></span>מתחת ליעד השבוע <span class="lg done"></span>100% · — לא רלוונטי · · טרם הוגש דוח השבוע · ▲▼ שינוי מהדוח הקודם</div>

      ${withText.length > 0 && html`
        <div class="lbl" style=${{marginTop:18}}>הערות / חריגים ובטיחות מהדוחות</div>
        <div style=${{display:"flex", flexDirection:"column", gap:8}}>
          ${withText.map(s => html`
            <button key=${s.id} class="wu" onClick=${()=>onOpen(s.id)}>
              <span class="m"><b>${s.name}</b>
                ${hasText(s.weekly.note) ? html`<span>${s.weekly.issue && !s.weekly.issueResolvedAt ? "⚠ " : ""}${s.weekly.note}</span>` : null}
                ${hasText(s.weekly.safety) ? html`<span style=${{color: s.weekly.safetyResolvedAt ? "var(--ink-3)" : "var(--crit)"}}>🦺 ${s.weekly.safety}${s.weekly.safetyResolvedAt ? " · טופל" : ""}</span>` : null}
              </span>
            </button>`)}
        </div>`}
      <div class="hint">כך נראה הטופס השבועי של כל המנהלים במקום אחד. הקשה על אתר פותחת את הפירוט. מנהל מגיש את הדוח בלשונית שטח ← דוח שבועי.</div>`;
  }

  /* מלאי כל האתרים — בקרה על מה שהמנהלים הזינו */
  function StockOverview({ st, now, mgr, cards, onOpen }){
    const sites = st.sites.filter(s => s.active && (mgr === "all" || ((s.owner && s.owner.name) || "—") === mgr))
      .map(s => ({ s, i: stockInfo(s, st, now) }))
      .sort((a, b) => ((inPilot(ownerName(b.s)) ? 1 : 0) - (inPilot(ownerName(a.s)) ? 1 : 0)) || (b.i.short - a.i.short) || ((a.i.fresh ? 1 : 0) - (b.i.fresh ? 1 : 0)) || a.s.num - b.s.num);
    const counted = sites.filter(x => inPilot(ownerName(x.s)));
    const fresh = counted.filter(x => x.i.fresh).length, short = sites.reduce((a, x) => a + x.i.short, 0);
    return html`
      <div class="lbl">${fresh}/${counted.length} אתרים${PILOT.length ? " בפיילוט" : ""} עודכנו ב-${CFG.stockDays} הימים האחרונים · ${short} חוסרים מול המינימום</div>
      <div style=${{display:"flex", flexDirection:"column", gap:10, marginTop:6}}>
        ${sites.map(({ s, i }) => html`
          <div key=${s.id} class=${"card stk "+(i.short ? "short" : "")}>
            <div class="rowbet" style=${{alignItems:"flex-start"}}>
              <div><div style=${{fontWeight:700}}>${s.name}</div>
                <div class="sub" style=${{fontFamily:"Heebo,sans-serif", fontSize:".72rem", color:"var(--ink-3)"}}>${s.owner ? s.owner.name : "—"} · ${s.contractor}</div></div>
              <span class=${"pill "+(i.fresh ? "ok" : "warn")}>${i.last ? (i.fresh ? "עודכן " : "לא עודכן · ") + ageText(now - i.last) : "טרם עודכן"}</span>
            </div>
            ${i.last ? html`<div class="meta2">עדכון אחרון: ${dmy(i.last)} ${hhmm(i.last)}${i.by ? " · " + i.by : ""}</div>` : null}
            ${(s.materials || []).map(m => html`
              <div class=${"sr "+(m.onSite < m.need ? "bad" : "")} key=${m.item}>
                <span class="n">${m.item}</span>
                <span class="q"><b>${m.onSite}</b> ${m.unit}${m.need ? html`<small> / מינ׳ ${m.need}</small>` : null}</span>
                ${m.at ? html`<span class="tg">${ageText(now - m.at)}</span>` : html`<span class="tg">לא נספר</span>`}
              </div>`)}
            ${(s.materials || []).length === 0 && html`<div class="meta2">לא הוזן מלאי באתר</div>`}
            <div class="btnrow" style=${{marginTop:8}}><button class="btn" onClick=${()=>onOpen(s.id)}>פתח אתר</button></div>
          </div>`)}
        ${sites.length === 0 && html`<div class="empty">אין אתרים להצגה</div>`}
      </div>
      <div class="hint">המנהלים מזינים מלאי בלשונית מלאי. "לא נספר" = כמות שעדיין לא אושרה על ידי מנהל הפרויקט (נתון הדגמה). חוסר = כמות במלאי נמוכה מהמינימום שהמנהל הגדיר.</div>`;
  }

  function SiteDetail({ site, ex, log, now, st, onBack, notify }){
    const [sheet, setSheet] = useState(false);
    if(!site) return null;
    const status = siteStatus(site, ex, now);
    const own = ex.filter(e => !e.siteIds);
    const cur = curWeekly(site, now);
    const info = stockInfo(site, st, now);

    return html`
      <div class="screen narrow">
        <div class="shead">
          <button class="back" onClick=${onBack} aria-label="חזרה">→</button>

            <div><h2 style=${{fontSize:"1.3rem"}}>${site.name}</h2><span class="sub">${site.contractor}${site.active?"":" · לא פעיל"}</span></div>
            <span class=${"pill "+status}>${STATUS_TEXT[status]}</span>
          </div>
        </div>

        <div class="card" style=${{marginTop:14}}>
          <div class="lbl">תוכנית שבועית · ${weekLabel(now)}</div>
          ${cur ? html`
            <div class="sub2">הוגש ${dmy(cur.at)} ${hhmm(cur.at)} · ${cur.by}${cur.foreman ? " · מנהל עבודה: " + cur.foreman : ""}${cur.lead ? " · ראש צוות: " + cur.lead : ""}</div>
            ${TRACKS.map(t => {

                  : html`<span class="tv nr">לא רלוונטי</span>`}

            <div class="trow"><span class="tn">כ״א בשטח</span><span class="tb"></span><span class="tv">${cur.workers == null ? "—" : cur.workers}</span></div>
            ${hasText(cur.note) ? html`<div class="val" style=${{marginTop:10, fontSize:".86rem"}}>${cur.issue && !cur.issueResolvedAt ? "⚠ " : ""}${cur.note}${cur.issueResolvedAt ? " · טופל" : ""}</div>` : null}
            ${hasText(cur.safety) ? html`<div class=${"val "+(cur.safetyResolvedAt ? "" : "crit")} style=${{marginTop:6, fontSize:".86rem"}}>🦺 ${cur.safety}${cur.safetyResolvedAt ? " · טופל" : ""}</div>` : null}`
          : html`<div class="val" style=${{color:"var(--warn)"}}>טרם הוגש דוח שבועי לשבוע הזה</div>`}
        </div>

        <div class="card">
          <div class="lbl">מלאי באתר</div>
          <div class="sub2">${info.last ? "עודכן " + dmy(info.last) + " " + hhmm(info.last) + (info.by ? " · " + info.by : "") : "טרם עודכן ע״י מנהל הפרויקט"}</div>
          ${(site.materials || []).map(m => html`
            <div class=${"sr "+(m.onSite < m.need ? "bad" : "")} key=${m.item}>
              <span class="n">${m.item}</span>
              <span class="q"><b>${m.onSite}</b> ${m.unit}${m.need ? html`<small> / מינ׳ ${m.need}</small>` : null}</span>
              ${!m.at ? html`<span class="tg">לא נספר</span>` : null}
            </div>`)}
          ${(site.materials || []).length === 0 && html`<div class="val" style=${{color:"var(--ink-3)"}}>לא הוזן מלאי</div>`}
        </div>

        ${own.length > 0 && html`
