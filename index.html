  function useMedia(q){
    const [m, setM] = useState(()=>{ try{ return window.matchMedia(q).matches; }catch(e){ return false; } });
    useEffect(()=>{
      let mq; try{ mq = window.matchMedia(q); }catch(e){ return; }
      const f = ()=>setM(mq.matches); f();
      if(mq.addEventListener) mq.addEventListener("change", f); else mq.addListener(f);
      return ()=>{ if(mq.removeEventListener) mq.removeEventListener("change", f); else mq.removeListener(f); };
    }, [q]);
    return m;
  }

  /* ───── מסמכים אישיים: תלושי שכר, הפרשות, 106, חוזה, רכב והוצאות ─────
     כל משתמש רואה רק את המסמכים שלו; המשרד מעלה ורואה את של כולם (האכיפה בחוקי המסד — pdocs/{טלפון}).
     תוכן הקבצים נקרא ונכתב ישירות מול ה-REST של Firestore עם אסימון הכניסה — כך הוא לא נשמר במטמון
     הקבוע של הדפדפן (IndexedDB). רק פרטי המסמך (סוג, חודש, שם קובץ) עוברים דרך ה-SDK.
     PDF מרוכז מתוכנת השכר מפוצל בדפדפן לפי עובד: ת.ז. (נשמרת רק כגיבוב SHA-256), מספר עובד או שם מלא. */
  const PD_TYPES = [
    { k:"pay",      n:"תלוש שכר",                     e:"💰", per:"m" },
    { k:"pens",     n:"הפרשות פנסיה / גמל / השתלמות", e:"🏦", per:"m" },
    { k:"f106",     n:"טופס 106",                     e:"🧾", per:"y" },
    { k:"f101",     n:"טופס 101",                     e:"📝", per:"y" },
    { k:"contract", n:"חוזה העסקה",                   e:"✍️", per:"" },
    { k:"car",      n:"רכב",                          e:"🚗", per:"" },
    { k:"exp",      n:"הוצאות והחזרים",               e:"🧮", per:"m" },
    { k:"other",    n:"אחר",                          e:"📎", per:"" }
  ];
  const PD = {}; PD_TYPES.forEach(t => { PD[t.k] = t; });
  const HE_MONTHS = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
  const pdPer = p => /^\d{4}-\d{2}$/.test(p || "") ? HE_MONTHS[+p.slice(5) - 1] + " " + p.slice(0, 4) : (p || "");
  const pdPrevMonth = () => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); };
  const pdDefPer = k => PD[k].per === "m" ? pdPrevMonth() : PD[k].per === "y" ? String(new Date().getFullYear() - 1) : "";
  const pdTitle = f => (PD[f.type] || PD.other).n + (f.period ? " · " + pdPer(f.period) : "") + (f.note ? " · " + f.note : "");
  const pdSize = n => n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
  const PD_PART = 750000;          // בתים לחלק (מסמך Firestore מוגבל ל-1MB)
  const PD_MAX = 20 * 1048576;     // קובץ בודד עד 20MB
  const pdCol = p => firebase.firestore().collection("pdocs").doc(p).collection("files");

  function pdB64(u8){ let s = ""; for(let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
  function pdUnB64(b){ const s = atob(b), u = new Uint8Array(s.length); for(let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
  // קריאה/כתיבה של חלקי הקובץ ב-REST (עם אסימון הכניסה — החוקים חלים כרגיל)
  async function pdRest(path, method, body){
    const u = firebase.auth().currentUser; if(!u) throw new Error("לא מחובר");
    const tok = await u.getIdToken();
    const url = (window.__fsEmu || "https://firestore.googleapis.com") + "/v1/projects/" + FB_CONFIG.projectId + "/databases/(default)/documents/" + path.split("/").map(encodeURIComponent).join("/");
    const r = await fetch(url, { method: method || "GET", cache:"no-store",
      headers: { Authorization:"Bearer " + tok, ...(body ? { "Content-Type":"application/json" } : {}) }, body: body ? JSON.stringify(body) : undefined });
    if(!r.ok){
      if(method === "DELETE" && r.status === 404) return null;
      let m = ""; try{ m = (await r.json()).error.message || ""; }catch(e){}
      throw new Error(r.status === 403 ? "אין הרשאה למסמך הזה" : "שגיאה " + r.status + (m ? " — " + m.slice(0, 120) : ""));
    }
    return method === "DELETE" ? null : r.json();
  }
  async function pdLoad(p, f){
    const parts = await Promise.all(Array.from({ length: f.parts || 1 }, (_, i) =>
      pdRest("pdocs/" + p + "/files/" + f.id + "/parts/" + i).then(j => pdUnB64(j.fields.d.bytesValue))));
    const out = new Uint8Array(parts.reduce((a, x) => a + x.length, 0));
    let o = 0; parts.forEach(x => { out.set(x, o); o += x.length; });
    return out;
  }
  // שמירה: קודם החלקים, ורק בסוף פרטי המסמך — כך מסמך חלקי לא מופיע אצל המנהל
  async function pdSave(p, meta, bytes, who){
    const col = pdCol(p), ref = meta.id ? col.doc(meta.id) : col.doc(), id = ref.id;
    const n = Math.max(1, Math.ceil(bytes.length / PD_PART));
    let old = 0;
    try{ const o = await ref.get({ source:"server" }); if(o.exists) old = o.data().parts || 0; }catch(e){}
    for(let i = 0; i < n; i++)
      await pdRest("pdocs/" + p + "/files/" + id + "/parts/" + i, "PATCH", { fields: { d: { bytesValue: pdB64(bytes.subarray(i * PD_PART, (i + 1) * PD_PART)) } } });
    for(let i = n; i < old; i++) await pdRest("pdocs/" + p + "/files/" + id + "/parts/" + i, "DELETE").catch(()=>{});
    await ref.set({ id, type:meta.type, period:meta.period || "", note:meta.note || "", fname:meta.fname || "", mime:meta.mime || "application/pdf",
      pages:meta.pages || 0, parts:n, size:bytes.length, seen:null, at:firebase.firestore.FieldValue.serverTimestamp(), by:who });
    const prof = firebase.firestore().collection("pdocs").doc(p);
    const cur = await prof.get({ source:"server" }).then(d => d.exists ? d.data() : {}).catch(()=>({}));
    const last = (cur.last || {})[meta.type] || "";
    await prof.set({ n: firebase.firestore.FieldValue.increment(old ? 0 : 1), at:Date.now(),
      ...(meta.period && meta.period > last ? { last: { [meta.type]: meta.period } } : {}) }, { merge:true });
    return id;
  }
  async function pdDelete(p, f){
    for(let i = 0; i < (f.parts || 1); i++) await pdRest("pdocs/" + p + "/files/" + f.id + "/parts/" + i, "DELETE");
    await pdCol(p).doc(f.id).delete();
    await firebase.firestore().collection("pdocs").doc(p).set({ n: firebase.firestore.FieldValue.increment(-1) }, { merge:true }).catch(()=>{});
  }

  // ת.ז. ישראלית: ספרת ביקורת. נשמרת במסד רק כגיבוב
  function isIlId(s){
    s = String(s).padStart(9, "0");
    if(!/^\d{9}$/.test(s) || /^0+$/.test(s)) return false;
    let t = 0; for(let i = 0; i < 9; i++){ const x = +s[i] * (i % 2 + 1); t += x > 9 ? x - 9 : x; }
    return t % 10 === 0;
  }
  async function pdIdHash(id){
    const d = String(id).replace(/\D/g, "").padStart(9, "0");
    const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("miron-pdocs:" + d));
    return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join("");
  }
  const pdRev = s => [...s].reverse().join("");
  const pdNorm = s => String(s || "").replace(/[֑-ׇ]/g, "").replace(/[״"'׳`]/g, "").replace(/\s+/g, " ").trim();
  // מספרים שעשויים להיות ת.ז. בעמוד (גם בסדר הפוך — PDF בעברית שומר לפעמים את הספרות הפוך)
  function pdIdsOf(text){
    const out = new Set();
    (text.match(/\d+/g) || []).filter(r => r.length >= 5 && r.length <= 9).forEach(r => { [r, pdRev(r)].forEach(x => { if(isIlId(x)) out.add(x.padStart(9, "0")); }); });
    return [...out];
  }
  // מספרים שליד המילה "עובד" (מספר עובד בתוכנת השכר)
  function pdEmpNos(text){
    const out = new Set(), re = /עובד|דבוע/g; let m;
    while((m = re.exec(text))){
      const win = text.slice(Math.max(0, m.index - 25), m.index + 30);
      (win.match(/\d{1,7}/g) || []).forEach(r => { out.add(String(+r)); out.add(String(+pdRev(r))); });
    }
    return out;
  }
  // לכל עמוד: מי העובד. ת.ז. > מספר עובד > שם מלא. יותר מאדם אחד באותה רמה = התנגשות (בחירה ידנית)
  function pdMatch(page, people){
    const words = new Set(pdNorm(page.text).split(/[^א-תA-Za-z]+/).filter(Boolean));
    const emp = pdEmpNos(page.text), hits = { id:[], emp:[], name:[] };
    people.forEach(pp => {
      if(pp.idH && page.hashes.includes(pp.idH)) hits.id.push(pp.phone);
      if(pp.empNo && emp.has(String(+pp.empNo))) hits.emp.push(pp.phone);
      const toks = pdNorm(pp.fullName).split(" ").filter(t => t.length >= 2);
      if(toks.length >= 2 && toks.every(t => words.has(t) || words.has(pdRev(t)))) hits.name.push(pp.phone);
    });
    for(const how of ["id", "emp", "name"]){
      const u = [...new Set(hits[how])];
      if(u.length === 1) return { phone:u[0], how };
      if(u.length > 1) return { phone:"", how:"conflict", conflict:u };
    }
    return { phone:"", how:"" };
  }

  let _pdflib = null;
  function loadPdfLib(){
    if(window.PDFLib) return Promise.resolve(window.PDFLib);
    if(_pdflib) return _pdflib;
    _pdflib = new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js";
      s.onload = () => res(window.PDFLib);
      s.onerror = () => { _pdflib = null; rej(new Error("לא הצלחתי לטעון את כלי פיצול ה-PDF — בדוק חיבור לאינטרנט")); };
      document.head.appendChild(s);
    });
    return _pdflib;
  }
  async function pdOpenPdf(bytes){
    const pdfjs = await loadPdfJs();
    let password;
    for(;;){
      try{ return await pdfjs.getDocument({ data: bytes.slice(), password }).promise; }
      catch(e){
        if(e && e.name === "PasswordException"){
          password = prompt(e.code === 2 ? "הסיסמה שגויה. נסה שוב:" : "הקובץ מוגן בסיסמה. הקלד את הסיסמה:");
          if(password == null) throw new Error("הקובץ מוגן בסיסמה");
          continue;
        }
        throw e;
      }
    }
  }
  async function pdRender(pdf, n, width){
    const page = await pdf.getPage(n), v1 = page.getViewport({ scale:1 });
    const scale = width / v1.width, vp = page.getViewport({ scale });
    const c = document.createElement("canvas"); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext:ctx, viewport:vp }).promise;
    return { c, w:v1.width, h:v1.height };
  }
  // קובץ חדש עם העמודים של עובד אחד. קובץ מוצפן (pdf-lib לא מפצל אותו) — העמודים עוברים כתמונה
  async function pdExtract(src, pdf, idxs){
    const L = await loadPdfLib(), out = await L.PDFDocument.create();
    if(src){ (await out.copyPages(src, idxs)).forEach(p => out.addPage(p)); }
    else for(const i of idxs){
      const r = await pdRender(pdf, i + 1, 1600);
      const jpg = await out.embedJpg(await new Promise(res => r.c.toBlob(b => b.arrayBuffer().then(res), "image/jpeg", .85)));
      const pg = out.addPage([r.w, r.h]); pg.drawImage(jpg, { x:0, y:0, width:r.w, height:r.h });
    }
    return new Uint8Array(await out.save());
  }

  /* תצוגת מסמך: PDF מצויר בעמודים (עובד גם באייפון מתוך האפליקציה), תמונה כמו שהיא */
  function PdViewer({ p, f, mine, onClose, notify }){
    const [st, setSt] = useState({ s:"load" });
    const box = useRef(null);
    useEffect(()=>{
      let dead = false, url = null;
      (async ()=>{
        try{
          const bytes = await pdLoad(p, f);
          if(dead) return;
          const blob = new Blob([bytes], { type: f.mime || "application/pdf" });
          url = URL.createObjectURL(blob);
          setSt({ s:"ok", url, blob });
          if(mine && !f.seen) pdCol(p).doc(f.id).update({ seen: firebase.firestore.FieldValue.serverTimestamp() }).catch(()=>{});
          if((f.mime || "application/pdf") === "application/pdf"){
            const pdf = await pdOpenPdf(bytes);
            const w = Math.min(900, (box.current ? box.current.clientWidth : 360) || 360) * Math.min(2, window.devicePixelRatio || 1);
            for(let i = 1; i <= pdf.numPages && !dead; i++){
              const r = await pdRender(pdf, i, w);
              r.c.className = "pdpage"; if(box.current) box.current.appendChild(r.c);
            }
          }
        }catch(e){ if(!dead) setSt({ s:"err", err: e.message || String(e) }); }
      })();
      return ()=>{ dead = true; if(url) URL.revokeObjectURL(url); };
    }, []);
    const fname = f.fname || (pdTitle(f) + ((f.mime || "").startsWith("image/") ? ".jpg" : ".pdf"));
    async function share(){
      try{
        const file = new File([st.blob], fname, { type: st.blob.type });
        if(navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:pdTitle(f) }); return; }
      }catch(e){ if(e && e.name === "AbortError") return; }
      save();
    }
    function save(){ const a = document.createElement("a"); a.href = st.url; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); notify && notify("הקובץ נשמר בהורדות"); }
    return html`
      <div class="pdview" role="dialog" aria-label=${pdTitle(f)}>
        <div class="pdbar">
          <button class="ic0" title="סגור" onClick=${onClose}>✕</button>
          <b>${(PD[f.type] || PD.other).e} ${pdTitle(f)}</b>
          ${st.s === "ok" && html`<button class="btn" style=${{flex:"none", padding:"7px 12px"}} onClick=${share}>📤 שתף / שמור</button>`}
        </div>
        <div class="pdbody" ref=${box}>
          ${st.s === "load" && html`<div class="empty" style=${{color:"#ddd"}}>טוען מסמך…</div>`}
          ${st.s === "err" && html`<div class="empty" style=${{color:"#f88"}}>לא הצלחתי לפתוח: ${st.err}</div>`}
          ${st.s === "ok" && (f.mime || "").startsWith("image/") && html`<img class="pdpage" src=${st.url} alt=${pdTitle(f)} />`}
        </div>
      </div>`;
  }

  /* רשימת מסמכים של אדם אחד — המסך "המסמכים שלי", וגם בכרטיס עובד אצל המשרד (עם מחיקה) */
  function PdList({ p, files, mine, office, notify }){
    const [flt, setFlt] = useState("all");
    const [open, setOpen] = useState(null);
    if(!files) return html`<div class="empty">טוען…</div>`;
    const types = PD_TYPES.filter(t => files.some(f => f.type === t.k));
    const list = files.filter(f => flt === "all" || f.type === flt)
      .sort((a, b) => String(b.period || "").localeCompare(String(a.period || "")) || ((b.at && b.at.seconds) || 0) - ((a.at && a.at.seconds) || 0));
    const yearOf = f => (f.period || "").slice(0, 4) || "ללא תקופה";
    const years = [...new Set(list.map(yearOf))];
    async function del(f){
      if(!confirm("למחוק את \"" + pdTitle(f) + "\"? אי אפשר לשחזר.")) return;
      try{ await pdDelete(p, f); notify("המסמך נמחק"); }catch(e){ notify("המחיקה נכשלה: " + (e.message || e)); }
    }
    return html`
      ${types.length > 1 && html`<div class="chips">
        <button class=${"chip " + (flt === "all" ? "on" : "")} onClick=${()=>setFlt("all")}>הכול (${files.length})</button>
        ${types.map(t => html`<button key=${t.k} class=${"chip " + (flt === t.k ? "on" : "")} onClick=${()=>setFlt(t.k)}>${t.e} ${t.n}</button>`)}
      </div>`}
      ${!list.length && html`<div class="empty">${mine ? "עדיין אין לך מסמכים. כשהמשרד יעלה תלוש או מסמך — הוא יופיע כאן." : "אין מסמכים"}</div>`}
      ${years.map(y => html`<div key=${y}>
        <div class="lbl" style=${{marginTop:14}}>${y}</div>
        <div class="pdlist">
          ${list.filter(f => yearOf(f) === y).map(f => html`
            <div key=${f.id} class=${"pdrow" + (mine && !f.seen ? " new" : "")}>
              <button class="pdopen" onClick=${()=>setOpen(f)}>
                <span class="pde">${(PD[f.type] || PD.other).e}</span>
                <span class="pdt"><b>${(PD[f.type] || PD.other).n}${f.note ? " · " + f.note : ""}</b>
                  <small>${f.period ? pdPer(f.period) : "ללא תקופה"}${f.pages ? " · " + f.pages + " עמ׳" : ""} · <bdi dir="ltr">${pdSize(f.size || 0)}</bdi>${office ? (f.seen ? " · ✓ נצפה" : " · טרם נצפה") : ""}</small></span>
                ${mine && !f.seen && html`<span class="pill warn">חדש</span>`}
              </button>
              ${office && html`<button class="ic0" title="מחק" onClick=${()=>del(f)}>🗑</button>`}
            </div>`)}
        </div></div>`)}
      ${open && html`<${PdViewer} p=${p} f=${open} mine=${mine} notify=${notify} onClose=${()=>setOpen(null)} />`}`;
  }

  function MyDocs({ phone, name, files, notify, onAll }){
    return html`<div class="screen narrow">
      <div class="shead rowbet"><div><h2>📁 המסמכים שלי</h2><span class="sub">${name} · תלושים, הפרשות, טפסים וחוזה</span></div>
        ${onAll && html`<button class="btn" style=${{flex:"none"}} onClick=${onAll}>🗂 של כל העובדים</button>`}</div>
      <div class="sub2">🔒 רק אתה ומשרד ט.ש. מי-רון רואים את המסמכים האלה. מנהלים אחרים לא רואים אותם.</div>
      <${PdList} p=${phone} files=${files} mine=${true} notify=${notify} />
    </div>`;
  }

  /* ───── המשרד: סקירה, כרטיסי עובדים, העלאה ───── */
  function DocsAdmin({ who, myPhone, notify, onMine }){
    const [staff, setStaff] = useState(null), [profs, setProfs] = useState({});
    const [tab, setTab] = useState("all");               // all | split | one
    const [person, setPerson] = useState(null);           // טלפון — כרטיס עובד פתוח
    const [edit, setEdit] = useState(null);               // טלפון — עריכת פרטי זיהוי
    const [mon, setMon] = useState(pdPrevMonth());
    useEffect(()=> firebase.firestore().collection("staff").onSnapshot(
      q => setStaff(q.docs.map(d => ({ phone:d.id, ...d.data() })).filter(s => s.role !== "agency" && s.role !== "viewer" && s.active !== false)
        .sort((a, b) => String(a.name).localeCompare(String(b.name), "he"))),
      e => notify("אין הרשאה לרשימת המשתמשים: " + (e.code || e.message))), []);
    useEffect(()=> firebase.firestore().collection("pdocs").onSnapshot(
      q => { const m = {}; q.docs.forEach(d => { m[d.id] = d.data(); }); setProfs(m); },
      e => notify("אין הרשאה למסמכים: " + (e.code || e.message))), []);
    const people = (staff || []).map(s => ({ ...s, ...(profs[s.phone] || {}), name:s.name, fullName:(profs[s.phone] || {}).fullName || "" }));
    const has = (pp, k) => ((pp.last || {})[k] || "") >= mon;
    const nPay = people.filter(pp => has(pp, "pay")).length, nPens = people.filter(pp => has(pp, "pens")).length;
    const noId = people.filter(pp => !pp.idH && !pp.empNo && !pp.fullName).length;
    if(person){
      const pp = people.find(x => x.phone === person) || { phone:person, name:"?" };
      return html`<div class="screen narrow">
        <div class="shead rowbet"><div><h2>${pp.fullName || pp.name}</h2><span class="sub">מסמכים אישיים · <span dir="ltr">${fmtPhone(pp.phone)}</span></span></div>
          <button class="btn" style=${{flex:"none", padding:"8px 14px"}} onClick=${()=>setPerson(null)}>→ חזרה</button></div>
        <div class="btnrow" style=${{margin:"6px 0 4px"}}>
          <button class="btn" onClick=${()=>setEdit(pp.phone)}>🪪 פרטי זיהוי</button>
          <button class="btn pri" onClick=${()=>{ setTab("one:" + pp.phone); setPerson(null); }}>⬆ העלה מסמך</button>
        </div>
        <${PersonFiles} p=${pp.phone} notify=${notify} />
        ${edit && html`<${PdIdSheet} pp=${people.find(x => x.phone === edit)} who=${who} notify=${notify} onClose=${()=>setEdit(null)} />`}
      </div>`;
    }
    return html`<div class="screen">
      <div class="shead rowbet"><div><h2>📁 מסמכים אישיים</h2><span class="sub">${people.length} משתמשים · רק המשרד ובעל המסמך רואים</span></div>
        ${onMine && html`<button class="btn" style=${{flex:"none"}} onClick=${onMine}>📁 המסמכים שלי</button>`}</div>
      <div class="chips">
        <button class=${"chip " + (tab === "all" ? "on" : "")} onClick=${()=>setTab("all")}>סקירה</button>
        <button class=${"chip " + (tab === "split" ? "on" : "")} onClick=${()=>setTab("split")}>⬆ PDF מרוכז מתוכנת השכר</button>
        <button class=${"chip " + (tab.startsWith("one") ? "on" : "")} onClick=${()=>setTab("one")}>⬆ מסמך לעובד אחד</button>
      </div>
      ${tab === "split" && html`<${PdSplit} people=${people} who=${who} notify=${notify} onDone=${()=>setTab("all")} />`}
      ${tab.startsWith("one") && html`<${PdOne} people=${people} who=${who} notify=${notify} initial=${tab.slice(4)} onDone=${p=>{ setTab("all"); setPerson(p); }} />`}
      ${tab === "all" && html`
        <div class="kpis" style=${{marginTop:8}}>
          <div class=${"kpi " + (nPay < people.length ? "warn" : "")}><b>${nPay}/${people.length}</b><span>תלוש ${pdPer(mon)}</span></div>
          <div class=${"kpi " + (nPens < people.length ? "warn" : "")}><b>${nPens}/${people.length}</b><span>הפרשות ${pdPer(mon)}</span></div>
          <div class=${"kpi " + (noId ? "warn" : "")}><b>${noId}</b><span>בלי פרטי זיהוי</span></div>
        </div>
        <div class="rowbet" style=${{margin:"12px 0 6px"}}>
          <div class="sub2" style=${{margin:0}}>חודש לבדיקה</div>
          <input type="month" class="tin" style=${{width:"auto", fontFamily:"inherit"}} value=${mon} onChange=${e=>e.target.value && setMon(e.target.value)} />
        </div>
        ${noId > 0 && html`<div class="alert warn" style=${{margin:"6px 0 10px"}}><span class="b"></span>כדי שהפיצול האוטומטי יזהה כל עובד — מלא לכל אחד שם מלא כמו בתלוש, ת.ז. או מספר עובד (🪪). ת.ז. נשמרת מוצפנת.</div>`}
        ${!staff ? html`<div class="empty">טוען…</div>` : html`<div class="pdlist">
          ${people.map(pp => html`<div key=${pp.phone} class="pdrow">
            <button class="pdopen" onClick=${()=>setPerson(pp.phone)}>
              <span class="pde">${pp.name.slice(0, 1)}</span>
              <span class="pdt"><b>${pp.fullName || pp.name}</b>
                <small>${pp.role === "office" ? "משרד" : "מנהל"} · ${pp.n || 0} מסמכים${!pp.idH && !pp.empNo && !pp.fullName ? " · ⚠ בלי פרטי זיהוי" : (pp.idH ? " · ת.ז. ✓" : "") + (pp.empNo ? " · עובד " + pp.empNo : "")}</small></span>
              <span class=${"pill " + (has(pp, "pay") ? "ok" : "inactive")} title="תלוש">💰 ${has(pp, "pay") ? "✓" : "—"}</span>
              <span class=${"pill " + (has(pp, "pens") ? "ok" : "inactive")} title="הפרשות">🏦 ${has(pp, "pens") ? "✓" : "—"}</span>
            </button>
            <button class="ic0" title="פרטי זיהוי" onClick=${()=>setEdit(pp.phone)}>🪪</button>
          </div>`)}
        </div>`}`}
      ${edit && html`<${PdIdSheet} pp=${people.find(x => x.phone === edit)} who=${who} notify=${notify} onClose=${()=>setEdit(null)} />`}
    </div>`;
  }
  function PersonFiles({ p, notify }){
    const [files, setFiles] = useState(null);
    useEffect(()=> pdCol(p).onSnapshot(q => setFiles(q.docs.map(d => d.data())), e => notify("אין הרשאה: " + (e.code || e.message))), [p]);
    return html`<${PdList} p=${p} files=${files} office=${true} notify=${notify} />`;
  }
  // פרטי זיהוי לפיצול האוטומטי: שם מלא כמו בתלוש, מספר עובד, ת.ז. (נשמרת רק כגיבוב)
  function PdIdSheet({ pp, who, notify, onClose }){
    const [full, setFull] = useState(pp.fullName || ""), [emp, setEmp] = useState(pp.empNo || ""), [tz, setTz] = useState("");
    const tzBad = tz && !isIlId(tz.replace(/\D/g, ""));
    async function save(){
      const d = { name:pp.name, fullName:full.trim(), empNo:emp.replace(/\D/g, ""), at:Date.now(), by:who };
      if(tz) d.idH = await pdIdHash(tz);
      try{ await firebase.firestore().collection("pdocs").doc(pp.phone).set(d, { merge:true }); notify("נשמר"); onClose(); }
      catch(e){ notify("שמירה נכשלה: " + (e.code || e.message)); }
    }
    return html`<div class="scrim" onClick=${onClose}><div class="sheet" onClick=${e=>e.stopPropagation()}>
      <h3>🪪 ${pp.name} — פרטי זיהוי</h3>
      <div class="who">לפי הפרטים האלה המערכת מזהה את העמודים של ${pp.name} בתוך PDF מרוכז. מספיק אחד מהם; ת.ז. הכי מדויקת.</div>
      <div class="lbl">שם מלא כמו בתלוש</div>
      <input class="tin" style=${{fontFamily:"inherit"}} value=${full} onInput=${e=>setFull(e.target.value)} placeholder="שם פרטי ושם משפחה" />
      <div class="lbl" style=${{marginTop:10}}>מספר עובד בתוכנת השכר</div>
      <input class="tin" inputmode="numeric" dir="ltr" value=${emp} onInput=${e=>setEmp(e.target.value)} />
      <div class="lbl" style=${{marginTop:10}}>תעודת זהות ${pp.idH ? "— שמורה ✓ (להחלפה הקלד חדשה)" : ""}</div>
      <input class="tin" inputmode="numeric" dir="ltr" autocomplete="off" value=${tz} onInput=${e=>setTz(e.target.value)} placeholder=${pp.idH ? "•••••••••" : "9 ספרות"} />
      <div class="sub2">${tzBad ? html`<b style=${{color:"var(--crit)"}}>ספרת הביקורת לא תקינה</b>` : "הת.ז. לא נשמרת — רק טביעה מוצפנת (SHA-256) שמאפשרת לזהות אותה בתלוש."}</div>
      <div class="btnrow" style=${{marginTop:10}}><button class="btn" onClick=${onClose}>ביטול</button><button class="btn pri" disabled=${tzBad} onClick=${save}>שמור</button></div>
    </div></div>`;
  }

  const PdPeriod = ({ type, val, set }) => PD[type].per === "m"
    ? html`<input type="month" class="tin" style=${{fontFamily:"inherit"}} value=${val} onChange=${e=>set(e.target.value)} />`
    : PD[type].per === "y"
    ? html`<input type="number" class="tin" dir="ltr" min="2000" max="2100" value=${val} onInput=${e=>set(e.target.value)} />`
    : html`<input class="tin" style=${{fontFamily:"inherit"}} value=${val} onInput=${e=>set(e.target.value)} placeholder="תיאור קצר (לא חובה) — למשל: רישיון רכב 2026" />`;
  const pdPerOk = (type, v) => PD[type].per === "m" ? /^\d{4}-\d{2}$/.test(v) : PD[type].per === "y" ? /^\d{4}$/.test(v) : true;
  const PdTypeSel = ({ type, set }) => html`<select class="tin" style=${{fontFamily:"inherit"}} value=${type} onChange=${e=>set(e.target.value)}>
    ${PD_TYPES.map(t => html`<option key=${t.k} value=${t.k}>${t.e} ${t.n}</option>`)}</select>`;

  /* מסמך לעובד אחד (PDF או צילום) */
  function PdOne({ people, who, notify, initial, onDone }){
    const [p, setP] = useState(initial || ""), [type, setType] = useState("pay"), [per, setPer] = useState(pdDefPer("pay"));
    const [file, setFile] = useState(null), [busy, setBusy] = useState(false);
    const setT = k => { setType(k); setPer(pdDefPer(k)); };
    async function go(){
      if(file.size > PD_MAX){ notify("הקובץ גדול מדי (עד 20MB)"); return; }
      setBusy(true);
      try{
        const bytes = new Uint8Array(await file.arrayBuffer());
        const mime = file.type || (/\.pdf$/i.test(file.name) ? "application/pdf" : "application/octet-stream");
        const per0 = PD[type].per ? per : "";
        const id = PD[type].per ? type + "_" + per0 : undefined;
        if(id){
          const ex = await pdCol(p).doc(id).get({ source:"server" }).catch(()=>null);
          if(ex && ex.exists && !confirm("כבר קיים " + PD[type].n + " ל" + pdPer(per0) + ". להחליף אותו?")){ setBusy(false); return; }
        }
        let pages = 0;
        if(mime === "application/pdf"){ try{ pages = (await pdOpenPdf(bytes)).numPages; }catch(e){} }
        await pdSave(p, { id, type, period:per0, note: PD[type].per ? "" : per.trim(), fname:file.name, mime, pages }, bytes, who);
        notify("הועלה ל" + (people.find(x => x.phone === p) || {}).name);
        onDone(p);
      }catch(e){ notify("ההעלאה נכשלה: " + (e.message || e)); }
      setBusy(false);
    }
    return html`<div class="card" style=${{marginTop:10, maxWidth:520}}>
      <div class="lbl">למי</div>
      <select class="tin" style=${{fontFamily:"inherit"}} value=${p} onChange=${e=>setP(e.target.value)}>
        <option value="">— בחר —</option>
        ${people.map(pp => html`<option key=${pp.phone} value=${pp.phone}>${pp.fullName || pp.name}</option>`)}
      </select>
      <div class="lbl" style=${{marginTop:10}}>סוג מסמך</div><${PdTypeSel} type=${type} set=${setT} />
      <div class="lbl" style=${{marginTop:10}}>${PD[type].per === "m" ? "חודש" : PD[type].per === "y" ? "שנה" : "תיאור"}</div><${PdPeriod} type=${type} val=${per} set=${setPer} />
      <div class="lbl" style=${{marginTop:10}}>קובץ (PDF או צילום)</div>
      <input type="file" accept="application/pdf,image/*" onChange=${e=>setFile(e.target.files[0] || null)} />
      <button class="btn pri wide" style=${{marginTop:14}} disabled=${!p || !file || busy || !pdPerOk(type, per)} onClick=${go}>${busy ? "מעלה…" : "⬆ העלה"}</button>
    </div>`;
  }

  /* PDF מרוכז (כל התלושים בקובץ אחד) → קובץ נפרד לכל עובד */
  function PdSplit({ people, who, notify, onDone }){
    const [type, setType] = useState("pay"), [per, setPer] = useState(pdDefPer("pay"));
    const [file, setFile] = useState(null), [pages, setPages] = useState(null);
    const [busy, setBusy] = useState(""), [prev, setPrev] = useState(null);
    const doc = useRef(null);
    const setT = k => { setType(k); setPer(pdDefPer(k)); };
    const pname = ph => { const x = people.find(pp => pp.phone === ph); return x ? (x.fullName || x.name) : "?"; };
    async function analyze(f){
      setFile(f); setPages(null);
      if(!f) return;
      if(f.size > 60 * 1048576){ notify("הקובץ גדול מדי"); return; }
      setBusy("קורא את הקובץ…");
      try{
        const bytes = new Uint8Array(await f.arrayBuffer());
        const pdf = await pdOpenPdf(bytes);
        let src = null;
        try{ const L = await loadPdfLib(); src = await L.PDFDocument.load(bytes); }catch(e){ src = null; }   // מוצפן → מצב תמונה
        doc.current = { pdf, src, name:f.name };
        const out = [];
        for(let i = 1; i <= pdf.numPages; i++){
          setBusy("מזהה עובדים… עמוד " + i + " מתוך " + pdf.numPages);
          const tc = await (await pdf.getPage(i)).getTextContent();
          const text = pdNorm(tc.items.map(it => it.str).join(" "));
          const ids = pdIdsOf(text);
          const hashes = await Promise.all(ids.map(pdIdHash));
          const pg = { i: i - 1, text, ids, hashes };
          Object.assign(pg, pdMatch(pg, people));
          out.push(pg);
        }
        if(!out.some(pg => pg.text.length > 20)) notify("אין טקסט בקובץ (סריקה?) — צריך לשייך כל עמוד ידנית");
        setPages(out);
      }catch(e){ notify("לא הצלחתי לקרוא את הקובץ: " + (e.message || e)); setFile(null); }
      setBusy("");
    }
    const setPage = (i, phone) => setPages(ps => ps.map(pg => pg.i === i ? { ...pg, phone, how: phone ? (phone === "skip" ? "skip" : "manual") : "" } : pg));
    function fillPrev(){
      setPages(ps => { let last = ""; return ps.map(pg => { if(pg.phone && pg.phone !== "skip"){ last = pg.phone; return pg; } return !pg.phone && last ? { ...pg, phone:last, how:"cont" } : pg; }); });
    }
    async function preview(i){
      setPrev({ i, url:null });
      try{ const r = await pdRender(doc.current.pdf, i + 1, Math.min(1100, window.innerWidth * (window.devicePixelRatio || 1))); setPrev({ i, url:r.c.toDataURL("image/jpeg", .85) }); }
      catch(e){ setPrev(null); notify("לא הצלחתי להציג"); }
    }
    const open = (pages || []).filter(pg => !pg.phone).length;
    const groups = {}; (pages || []).forEach(pg => { if(pg.phone && pg.phone !== "skip") (groups[pg.phone] = groups[pg.phone] || []).push(pg.i); });
    const gp = Object.keys(groups);
    async function upload(){
      const per0 = PD[type].per ? per : "", id = PD[type].per ? type + "_" + per0 : undefined;
      if(id){
        const ex = [];
        for(const ph of gp){ const d = await pdCol(ph).doc(id).get({ source:"server" }).catch(()=>null); if(d && d.exists) ex.push(pname(ph)); }
        if(ex.length && !confirm("כבר קיים " + PD[type].n + " ל" + pdPer(per0) + " אצל: " + ex.join(", ") + ".\nלהחליף?")) return;
      }
      // ת.ז. שמופיעה בעמודים של עובד אחד בלבד בקובץ — נלמדת לפעם הבאה (ח.פ. של החברה מופיע אצל כולם ולא נלמד)
      const owners = {}; (pages || []).forEach(pg => { if(pg.phone && pg.phone !== "skip") pg.ids.forEach(x => { (owners[x] = owners[x] || new Set()).add(pg.phone); }); });
      let done = 0, fail = [];
      for(const ph of gp){
        setBusy("מעלה " + (++done) + " מתוך " + gp.length + " — " + pname(ph));
        try{
          const bytes = await pdExtract(doc.current.src, doc.current.pdf, groups[ph]);
          await pdSave(ph, { id, type, period:per0, note: PD[type].per ? "" : per.trim(), fname:pdTitle({ type, period:per0 }) + ".pdf", mime:"application/pdf", pages:groups[ph].length }, bytes, who);
          const pp = people.find(x => x.phone === ph) || {};
          // ת.ז. והיפוך שלה (PDF בעברית) הן אותו מספר — היפוך שומר על ספרת הביקורת
          const own = [...new Set(Object.keys(owners).filter(x => owners[x].size === 1 && owners[x].has(ph)).map(x => x < pdRev(x) ? x : pdRev(x)))];
          if(!pp.idH && own.length === 1 && gp.length > 1)
            await firebase.firestore().collection("pdocs").doc(ph).set({ idH: await pdIdHash(own[0]), name:pp.name || "" }, { merge:true }).catch(()=>{});
        }catch(e){ fail.push(pname(ph) + " (" + (e.message || e) + ")"); }
      }
      setBusy("");
      if(fail.length){ alert("לא הועלו:\n" + fail.join("\n")); return; }
      notify("הועלו " + gp.length + " מסמכים — " + PD[type].n + " " + pdPer(per0));
      onDone();
    }
    const HOW = { id:["ok", "ת.ז."], emp:["ok", "מס׳ עובד"], name:["ok", "שם"], manual:["inactive", "ידני"], cont:["warn", "המשך?"], skip:["inactive", "דילוג"], conflict:["crit", "⚠ כמה עובדים"], "":["crit", "לא זוהה"] };
    return html`<div style=${{marginTop:10}}>
      ${!pages && html`<div class="card" style=${{maxWidth:560}}>
        <div class="sub2" style=${{marginTop:0}}>מעלים קובץ PDF אחד עם כל התלושים (או דוח ההפרשות) כפי שהגיע מתוכנת השכר. המערכת מזהה כל עמוד לפי ת.ז., מספר עובד או שם מלא, מציגה לך לאישור, ושומרת לכל עובד קובץ נפרד. שום דבר לא עולה לפני שאישרת.</div>
        <div class="lbl" style=${{marginTop:10}}>סוג מסמך</div><${PdTypeSel} type=${type} set=${setT} />
        <div class="lbl" style=${{marginTop:10}}>${PD[type].per === "m" ? "חודש" : PD[type].per === "y" ? "שנה" : "תיאור"}</div><${PdPeriod} type=${type} val=${per} set=${setPer} />
        <div class="lbl" style=${{marginTop:10}}>קובץ PDF מרוכז</div>
        <input type="file" accept="application/pdf" disabled=${!!busy || !pdPerOk(type, per)} onChange=${e=>analyze(e.target.files[0] || null)} />
        ${busy && html`<div class="sub2">${busy}</div>`}
      </div>`}
      ${pages && html`
        <div class="card">
          <div class="rowbet"><div><b>${file && file.name}</b><div class="sub2" style=${{margin:0}}>${PD[type].e} ${PD[type].n} ${PD[type].per ? pdPer(per) : per} · ${pages.length} עמודים · ${gp.length} עובדים${doc.current && !doc.current.src ? " · קובץ מוצפן — העמודים יישמרו כתמונה" : ""}</div></div>
            <button class="btn" style=${{flex:"none", padding:"7px 12px"}} disabled=${!!busy} onClick=${()=>{ setPages(null); setFile(null); }}>החלף קובץ</button></div>
          ${open > 0 && html`<div class="alert warn" style=${{marginTop:10}}><span class="b"></span>${open} עמודים לא שויכו. בחר עובד או "דלג" לכל אחד.
            <button class="chip" style=${{marginInlineStart:"auto"}} onClick=${fillPrev}>שייך לעובד של העמוד הקודם</button></div>`}
          ${pages.some(pg => pg.how === "cont") && html`<div class="sub2">"המשך?" — שויך לעובד של העמוד הקודם. ודא בתצוגה (👁) שזה באמת המשך שלו.</div>`}
        </div>
        <div class="pdlist" style=${{marginTop:10}}>
          ${pages.map(pg => html`<div key=${pg.i} class="pdrow">
            <button class="ic0" title="הצג עמוד" onClick=${()=>preview(pg.i)}>👁</button>
            <span class="pdt" style=${{flex:"none", minWidth:54}}><b>עמ׳ ${pg.i + 1}</b></span>
            <select class="tin" style=${{fontFamily:"inherit", flex:1, minWidth:0, padding:"7px 9px"}} value=${pg.phone} onChange=${e=>setPage(pg.i, e.target.value)}>
              <option value="">— לא שויך —</option>
              ${(pg.conflict || []).length > 0 && html`<optgroup label="נמצאו בעמוד">${pg.conflict.map(ph => html`<option key=${"c" + ph} value=${ph}>${pname(ph)}</option>`)}</optgroup>`}
              ${people.map(pp => html`<option key=${pp.phone} value=${pp.phone}>${pp.fullName || pp.name}</option>`)}
              <option value="skip">דלג — לא להעלות</option>
            </select>
            <span class=${"pill " + HOW[pg.how][0]}>${HOW[pg.how][1]}</span>
          </div>`)}
        </div>
        <div class="card" style=${{marginTop:10, position:"sticky", bottom:8}}>
          ${busy ? html`<div class="sub2" style=${{margin:0}}>${busy}</div>`
            : html`<button class="btn pri wide" disabled=${open > 0 || !gp.length} onClick=${upload}>⬆ העלה ${gp.length} מסמכים נפרדים${open ? " (נשארו " + open + " עמודים לשייך)" : ""}</button>`}
        </div>`}
      ${prev && html`<div class="lightbox" onClick=${()=>setPrev(null)}>
        <button class="x" onClick=${()=>setPrev(null)}>✕</button>
        ${prev.url ? html`<img src=${prev.url} alt=${"עמוד " + (prev.i + 1)} />` : html`<div style=${{color:"#fff"}}>טוען…</div>`}
      </div>`}
    </div>`;
  }

  /* ───── חשבוניות ספקים ─────
     החשבוניות נקלטות לבד מתיבת המייל (תהליך ברקע שכותב ל-inv), או בהעלאה ידנית.
       inv/{id}            — פרטי החשבונית: ספק, מספר, תאריך, סכום, מע״מ, פרויקט, סטטוס, אישורים
       inv/{id}/parts/{i}  — תוכן הקובץ בחלקים (ב-REST, לא נשמר במטמון הדפדפן — כמו המסמכים האישיים)
       invsup/{id}         — כרטיס ספק: שם, ח.פ., כתובות מייל, סוג אישור
       invmeta/cfg         — מי מאשר תשלומים, ח.פ. של החברה עצמה
       invmeta/mail        — מצב החיבור לתיבת המייל (נכתב ע״י תהליך הרקע)
     רואים: המשרד בלבד. מנהל פרויקט רואה רק חשבוניות שנשלחו אליו לאישור (pm == השם שלו).
     מסלול: חדשה ← (מנהל פרויקט, בספק "לא סטנדרטי") ← אישור תשלום (בספק רגיל) ← מאושרת ← שולמה */
  const INV_ST = {
    new:  { n:"להשלמת פרטים",        c:"warn",     e:"🆕" },
    pm:   { n:"ממתינה למנהל פרויקט", c:"warn",     e:"👷" },
    tal:  { n:"ממתינה לאישור תשלום", c:"warn",     e:"✍️" },
    ok:   { n:"מאושרת לתשלום",       c:"ok",       e:"✓" },
    paid: { n:"שולמה",               c:"inactive", e:"💳" },
    rej:  { n:"נדחתה",               c:"crit",     e:"✕" }
  };
  const INV_MODE = {
    tal:  { n:"רגיל",       d:"אישור תשלום בלבד" },
    pm:   { n:"לא סטנדרטי", d:"קודם מנהל הפרויקט, אחר כך אישור תשלום (טרקטור, חול, צילומים…)" },
    auto: { n:"אוטומטי",    d:"הוראת קבע / חיוב קבוע — בלי אישור" }
  };
  const invCol = () => firebase.firestore().collection("inv");
  const invSupCol = () => firebase.firestore().collection("invsup");
  const invMeta = k => firebase.firestore().collection("invmeta").doc(k);
  const invMoney = n => (n || n === 0) && isFinite(n) ? "₪" + Number(n).toLocaleString("he-IL", { minimumFractionDigits: Number(n) % 1 ? 2 : 0, maximumFractionDigits:2 }) : "—";
  const invDmy = d => /^\d{4}-\d{2}-\d{2}$/.test(d || "") ? d.slice(8) + "/" + d.slice(5, 7) + "/" + d.slice(2, 4) : "";
  const invMonthOf = f => (f.date || "").slice(0, 7) || (tsMs(f.at) ? new Date(tsMs(f.at)).toISOString().slice(0, 7) : "");
  const invSupName = (f, sups) => { const s = sups && sups.find(x => x.id === f.sup); return s ? s.name : f.supName || ""; };
  const invPayers = cfg => (cfg && cfg.payers && cfg.payers.length ? cfg.payers : ["טל"]);
  // הסטטוס הבא אחרי שהמשרד השלים את הפרטים — לפי סוג הספק
  const invNext = mode => mode === "auto" ? "ok" : mode === "pm" ? "pm" : "tal";

  async function invLoad(f){
    const parts = await Promise.all(Array.from({ length: f.parts || 1 }, (_, i) =>
      pdRest("inv/" + f.id + "/parts/" + i).then(j => pdUnB64(j.fields.d.bytesValue))));
    const out = new Uint8Array(parts.reduce((a, x) => a + x.length, 0));
    let o = 0; parts.forEach(x => { out.set(x, o); o += x.length; });
    return out;
  }
  // קודם החלקים, ורק בסוף פרטי החשבונית — כך חשבונית חלקית לא מופיעה ברשימה
  async function invSave(meta, bytes){
    const ref = invCol().doc(), id = ref.id;
    const n = Math.max(1, Math.ceil(bytes.length / PD_PART));
    for(let i = 0; i < n; i++)
      await pdRest("inv/" + id + "/parts/" + i, "PATCH", { fields: { d: { bytesValue: pdB64(bytes.subarray(i * PD_PART, (i + 1) * PD_PART)) } } });
    await ref.set({ ...meta, id, parts:n, size:bytes.length, at:FV() });
    return id;
  }
  async function invDelete(f){
    for(let i = 0; i < (f.parts || 1); i++) await pdRest("inv/" + f.id + "/parts/" + i, "DELETE");
    await invCol().doc(f.id).delete();
  }
  const invHist = (who, s, note) => firebase.firestore.FieldValue.arrayUnion({ s, by:who, t:Date.now(), ...(note ? { note } : {}) });

  /* קריאת הפרטים מתוך ה-PDF: ח.פ. של הספק, מספר חשבונית, תאריך, סכום ומע״מ.
     ניחוש בלבד — המשרד מאשר או מתקן. PDF סרוק (תמונה) — אין טקסט, ממלאים ביד */
  const invNum = s => { const x = parseFloat(String(s).replace(/,/g, "")); return isFinite(x) ? x : null; };
  // הרבה PDF-ים בעברית שומרים את המילים בסדר חזותי (הפוך). מוסיפים עותק שבו כל מילה בעברית מתהפכת חזרה
  const invWordRev = t => t.replace(/[\u05d0-\u05ea]+/g, w => [...w].reverse().join(""));
  // וגם הספרות יוצאות לפעמים הפוך ("00.045,3" במקום "3,540.00"). בודקים לפי סכומים ותאריכים לאיזה כיוון המסמך נוטה
  const INV_NUMTOK = /\d[\d.,\/\-]*\d|\d/g;
  const invOkMoney = x => /^\d{1,3}(,\d{3})+(\.\d{1,2})?$|^\d+\.\d{2}$/.test(x);
  const invOkDate = x => { const m = x.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})$/); return !!m && +m[2] >= 1 && +m[2] <= 12 && +m[1] >= 1 && +m[1] <= 31; };
  function invFixDigits(t){
    let f = 0, r = 0;
    (t.match(INV_NUMTOK) || []).forEach(x => { const y = pdRev(x), a = invOkMoney(x) || invOkDate(x), b = invOkMoney(y) || invOkDate(y); if(a && !b) f++; if(b && !a) r++; });
    return r > f ? t.replace(INV_NUMTOK, x => pdRev(x)) : t;
  }
  /* שמות ספקים: השוואה בלי נקודות/גרשיים/רווחים כפולים ("ש. אפרתי" = "ש.אפרתי") */
  const invKey = s => String(s || "").replace(/["'״׳`.\-–,()\/\\]/g, " ").replace(/\s+/g, " ").trim();
  const invKey0 = s => invKey(s).replace(/ /g, "");
  const invNames = s => [s.name, ...(s.aka || [])].filter(Boolean);
  // שם ספק שמופיע בטקסט החשבונית כמילה שלמה — הארוך ביותר מנצח (כדי ש"אאא טסה" יגבר על "טסה")
  const INV_GENERIC = /^(תשתיות|אירוע|הדפסות|מנוף|באגר|הובלה|הובלות|אתר|עובדים|טרקטורים|מחפרון|חוזה|ספק|קבלן|שומר|זרם מים|בידוד|משאבות|מכולות|מכולה)$/;
  function invNameHit(t, sups){
    const k = " " + invKey(t) + " ";
    let best = null, bl = 0;
    (sups || []).forEach(s => invNames(s).forEach(n => {
      const nk = invKey(n);
      if(nk.replace(/ /g, "").length < 3 || nk.length <= bl || INV_GENERIC.test(nk)) return;
      const re = new RegExp("(^|[^\\u05d0-\\u05eaA-Za-z])" + nk.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "($|[^\\u05d0-\\u05eaA-Za-z])", "i");
      if(re.test(k)){ best = s; bl = nk.length; }
    }));
    return best;
  }
  // כתובות של מערכות הפקת חשבוניות — משרתות הרבה ספקים, לכן לא מזהים לפיהן ספק
  // (noreply בדומיין של הספק עצמו — למשל InvoiceNoreply@kastrosafety.org — כן מזהה אותו)
  const INV_SHARED_MAIL = /@([a-z0-9-]+\.)*(greeninvoice|morning|icount|ezcount|easy-?count|invoice4u|rivhit|sumit|tranzila|cardcom|hashavshevet|priority-?software|yeshinvoice|paperless|modular365)\./i;
  const invMailOk = m => /@/.test(m || "") && !INV_SHARED_MAIL.test(m);
  function invParse(text, sups, ourHp, from, subj){
    const t0 = invFixDigits(pdNorm(text)), t = t0 + " | " + invWordRev(t0), out = {};
    // ח.פ. / ע.מ. — 9 ספרות עם ספרת ביקורת (גם בסדר הפוך — PDF בעברית שומר לפעמים ספרות הפוך)
    // מספר שליד "הקצאה" (מספר הקצאה של רשות המסים) או "לקוח" לא נחשב; מספר שליד ח.פ./ע.מ./עוסק — עדיף
    const hps = [], pref = [], hre = /\d{8,9}/g; let hm;
    while((hm = hre.exec(t))){
      const c0 = t.slice(Math.max(0, hm.index - 28), hm.index) + " " + t.slice(hm.index + hm[0].length, hm.index + hm[0].length + 28);
      const ctx = c0 + " " + invWordRev(c0);   // הטקסט נקרא גם הפוך — בודקים את ההקשר בשני הכיוונים
      if(/הקצא|אסמכתא|לקוח|טלפון|טל |פקס|חשבון בנק|מס׳? חשבון|סניף|בנק/.test(ctx) && !/ח\.?\s?פ|ע\.?\s?מ|ח"פ|עוסק מורשה(?! לצרכן)/.test(ctx)) continue;
      const strong = /ח\.?\s?פ|ע\.?\s?מ|ח"פ|עוסק|מס׳? ?ספק/.test(ctx);
      const ours0 = String(ourHp || "").replace(/\D/g, "").padStart(9, "0");
      if([hm[0], pdRev(hm[0])].some(x => x.padStart(9, "0") === ours0)) continue;   // ח.פ. שלנו — בשני הכיוונים
      [hm[0], pdRev(hm[0])].forEach(x => { x = x.padStart(9, "0"); if(isIlId(x) && !hps.includes(x)){ hps.push(x); if(strong) pref.push(x); } });
    }
    const ours = String(ourHp || "").replace(/\D/g, "");
    const cand = [...pref, ...hps.filter(h => !pref.includes(h))].filter(h => h !== ours);
    const bySup = (sups || []).find(s => s.hp && cand.includes(s.hp));
    if(bySup){ out.sup = bySup.id; out.hp = bySup.hp; } else if(cand.length) out.hp = cand[0];
    // אחרי ח.פ.: לפי כתובת השולח, ואז לפי שם הספק שכתוב בחשבונית
    const fm = String(from || "").toLowerCase();
    if(!out.sup && invMailOk(fm)){ const s = (sups || []).find(x => (x.emails || []).includes(fm)); if(s) out.sup = s.id; }
    if(!out.sup){ const s = invNameHit(t + " | " + (subj || ""), sups); if(s){ out.sup = s.id; out.byName = true; } }
    // תאריך: הראשון שנראה תקין (עד שנתיים אחורה, לא בעתיד הרחוק)
    const now = new Date(), re = /(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/g; let m;
    while((m = re.exec(t))){
      let d = +m[1], mo = +m[2], y = +m[3]; if(y < 100) y += 2000;
      if(mo < 1 || mo > 12 || d < 1 || d > 31) continue;
      const dt = new Date(y, mo - 1, d);
      if(dt > new Date(now.getTime() + 40 * 864e5) || dt < new Date(now.getTime() - 730 * 864e5)) continue;
      out.date = y + "-" + String(mo).padStart(2, "0") + "-" + String(d).padStart(2, "0"); break;
    }
    // מספר חשבונית: ליד "חשבונית" (משני הצדדים, כי סדר המילים בעברית מתהפך לפעמים)
    const nm = t.match(/(?:חשבונית(?: מס)?(?: ?\/? ?קבלה)?|חשבון עסקה|invoice)\s*(?:מספר|מס|no\.?|#)?\s*:?\s*(\d{3,10})\b/i)
            || t.match(/\b(\d{3,10})\s*:?\s*(?:מספר|מס)?\s*(?:קבלה ?\/? ?)?(?:מס )?חשבונית/);
    if(nm) out.no = nm[1];
    // סכומים: עם אגורות (1,234.50). סה״כ לתשלום — הסכום שליד מילות הסיכום, אחרת הגדול ביותר
    const amts = [], ar = /\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+\.\d{2}/g;
    while((m = ar.exec(t))){ const v = invNum(m[0]); if(v != null && v > 0 && v < 1e8) amts.push({ v, i:m.index }); }
    if(amts.length){
      const keys = [/סהכ לתשלום|לתשלום|סהכ כולל מעמ|סהכ חשבונית|total/gi];
      let best = null;
      keys.forEach(k => { let km; while((km = k.exec(t))){ amts.filter(a => Math.abs(a.i - km.index) < 60).forEach(a => { if(!best || a.v > best) best = a.v; }); } });
      out.total = best || Math.max(...amts.map(a => a.v));
      // מע״מ: סכום בטקסט שמתאים ל-18% מתוך הסכום הכולל (או 17% לחשבוניות ישנות)
      const vat = amts.map(a => a.v).find(v => [18, 17].some(p => Math.abs(v - out.total * p / (100 + p)) < 1));
      if(vat) out.vat = vat;
    }
    return out;
  }
  async function invReadFile(bytes, mime){
    if(mime !== "application/pdf") return { pages:1, text:"" };
    const pdf = await pdOpenPdf(bytes);
    let text = "";
    for(let i = 1; i <= Math.min(3, pdf.numPages); i++){
      const tc = await (await pdf.getPage(i)).getTextContent();
      text += " " + tc.items.map(it => it.str).join(" ");
    }
    return { pages:pdf.numPages, text };
  }

  /* תצוגת הקובץ (מסך מלא) */
  function InvViewer({ f, title, onClose, notify }){
    const [st, setSt] = useState({ s:"load" });
    const box = useRef(null);
    useEffect(()=>{
      let dead = false, url = null;
      (async ()=>{
        try{
          if(!f.parts){ setSt({ s:"err", err:"לחשבונית הזו אין קובץ — " + (f.link ? "היא הגיעה כקישור" : "רק פרטים") }); return; }
          const bytes = await invLoad(f);
          if(dead) return;
          const blob = new Blob([bytes], { type: f.mime || "application/pdf" });
          url = URL.createObjectURL(blob);
          setSt({ s:"ok", url, blob });
          if((f.mime || "application/pdf") === "application/pdf"){
            const pdf = await pdOpenPdf(bytes);
            const w = Math.min(900, (box.current ? box.current.clientWidth : 360) || 360) * Math.min(2, window.devicePixelRatio || 1);
            for(let i = 1; i <= pdf.numPages && !dead; i++){
              const r = await pdRender(pdf, i, w);
              r.c.className = "pdpage"; if(box.current) box.current.appendChild(r.c);
            }
          }
        }catch(e){ if(!dead) setSt({ s:"err", err: e.message || String(e) }); }
      })();
      return ()=>{ dead = true; if(url) URL.revokeObjectURL(url); };
    }, []);
    const fname = f.fname || "חשבונית.pdf";
    function save(){ const a = document.createElement("a"); a.href = st.url; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); notify && notify("הקובץ נשמר בהורדות"); }
    return html`
      <div class="pdview" role="dialog" aria-label=${title}>
        <div class="pdbar">
          <button class="ic0" title="סגור" onClick=${onClose}>✕</button>
          <b>🧾 ${title}</b>
          ${st.s === "ok" && html`<button class="btn" style=${{flex:"none", padding:"7px 12px"}} onClick=${save}>⬇ שמור</button>`}
        </div>
        <div class="pdbody" ref=${box}>
          ${st.s === "load" && html`<div class="empty" style=${{color:"#ddd"}}>טוען חשבונית…</div>`}
          ${st.s === "err" && html`<div class="empty" style=${{color:"#f88"}}>לא הצלחתי לפתוח: ${st.err}</div>`}
          ${st.s === "ok" && (f.mime || "").startsWith("image/") && html`<img class="pdpage" src=${st.url} alt=${title} />`}
        </div>
      </div>`;
  }

  /* שורה ברשימה */
  /* 🔗 התאמה להזמנה: הזמנות מהרכש לאותו ספק ופרויקט, עם מצב הקבלה ותעודת המשלוח. נשמר בחשבונית + שורה בהערות בגיליון */
  function InvMatch({ f, d, sup, site, who, notify }){
    const [rows, setRows] = useState(null), [err, setErr] = useState(""), [sel, setSel] = useState(() => new Set(f.orders || []));
    const [others, setOthers] = useState(false), [busy, setBusy] = useState(false);
    const proj = site ? ((RAKESH_PROJECTS.find(p => p[2] === site.num) || [])[1] || "") : "";
    async function load(){
      setErr(""); setRows(null);
      const day = d.date ? new Date(d.date + "T12:00:00").getTime() : Date.now();
      try{ const j = await rkGet("match", { from: day - 75 * 864e5, to: day + 5 * 864e5, ...(proj ? { project:proj } : {}) }); setRows(j.rows || []); }
      catch(e){ setErr(String(e.message || e)); setRows([]); }
    }
    useEffect(()=>{ load(); }, [d.sup, d.site, d.date]);
    const supName = sup ? sup.name : "";
    const mine = (rows || []).filter(r => supLike(r.real || r.supplier, supName) || supLike(r.supplier, supName) || sel.has(r.id));
    const shown = others ? (rows || []) : mine;
    const picked = (rows || []).filter(r => sel.has(r.id));
    const m = invMatchCalc({ total: invNum(d.total), vat: invNum(d.vat) }, picked);
    const label = "חשבונית " + (d.no || "בלי מספר") + " · " + (supName || "") + " · " + (m.net == null ? "" : "₪" + Math.round(m.net).toLocaleString("he-IL") + " לפני מע״מ") + (m.flag ? " · פער ₪" + Math.round(m.gap).toLocaleString("he-IL") : "");
    async function save(){
      if(!picked.length){ notify("סמן לפחות הזמנה אחת"); return; }
      setBusy(true);
      try{
        await invCol().doc(f.id).update({ orders: picked.map(r => r.id), match: { ordered:m.ordered, net:m.net, gap:m.gap, flag:m.flag, recv:m.recv, by:who, at:FV() } });
        const t = await orderAction({ t:"inv_link", rowIds: picked.map(r => r.id), label });
        notify(t === "ok" ? (m.flag ? "⚠ נשמר — יש פער, אפשר לפתוח דרישת זיכוי" : "🔗 ההתאמה נשמרה") : "נשמר בחשבונית, אבל לא בגיליון: " + (ORD_ERR[t] || t));
      }catch(e){ notify("לא נשמר: " + (e.message || e)); }
      finally{ setBusy(false); }
    }
    async function credit(){
      if(!picked.length) return;
      if(!confirm("לסמן \"נדרש זיכוי\" ב-" + picked.length + " הזמנות בגיליון?")) return;
      setBusy(true);
      try{
        let ok = 0;
        for(const r of picked){ const t = await orderAction({ t:"credit", rowId:r.id, status:"נדרש זיכוי", note: label }); if(t === "ok") ok++; }
        notify(ok === picked.length ? "📝 נפתחה דרישת זיכוי — מופיעה בלשונית \"זיכויים\"" : "נשמר ב-" + ok + " מתוך " + picked.length);
        load();
      }catch(e){ notify("לא נשמר: " + (e.message || e)); }
      finally{ setBusy(false); }
    }
    const rcvTxt = r => r.rcv === "תקין" ? "✓ התקבל תקין" : r.rcv === "חריגה" ? "⚠ התקבל עם חריגה" : r.fwd ? "🚚 הועבר לספק, עוד לא התקבל" : "⏳ עוד לא הועבר לספק";
    const links = r => String(r.noteLink || "").split(/\s+/).filter(u => /^https:\/\//.test(u));
    return html`<div class="imatch">
      <h4>🔗 התאמה להזמנה (הזמנה ↔ תעודת משלוח ↔ חשבונית)</h4>
      <div class="sub2" style=${{margin:0}}>${proj ? "פרויקט " + proj : "בלי פרויקט — מוצגות הזמנות מכל הפרויקטים"} · ${d.date ? "75 יום לפני " + invDmy(d.date) : "90 הימים האחרונים"}${supName ? " · ספק " + supName : ""}</div>
      ${err && html`<div class="alert crit" style=${{marginTop:8}}><span class="b"></span>${err}</div>`}
      ${rows === null ? html`<div class="sub2" style=${{marginTop:8}}>⏳ טוען הזמנות…</div>` : html`
        ${shown.map(r => html`<label key=${r.id} class="imrow">
          <input type="checkbox" checked=${sel.has(r.id)} onChange=${()=>setSel(s => { const n = new Set(s); n.has(r.id) ? n.delete(r.id) : n.add(r.id); return n; })} />
          <span class="imt"><b>${ordWhen(r.created)} · ${r.project}</b><br/>${r.real || r.supplier}${r.real && !supLike(r.real, r.supplier) ? " (הוזמן מ" + r.supplier + ")" : ""} · ${r.user} · ${r.id}<br/>
            ${rcvTxt(r)}${r.noteNo ? " · תעודה " + r.noteNo : ""}${links(r).map((u, i) => html` <a href=${u} target="_blank" rel="noopener">📄${links(r).length > 1 ? i + 1 : ""}</a>`)}
            ${r.exc && html`<div style=${{color:"var(--crit)", whiteSpace:"pre-line", marginTop:2}}>${r.exc}</div>`}
            ${r.credit && html`<div style=${{color:"var(--warn)"}}>זיכוי: ${r.credit}${r.creditNo ? " · " + r.creditNo : ""}</div>`}</span>
          <span class="ima">${r.sub ? ordMoney(r.sub) : "—"}</span>
        </label>`)}
        ${!shown.length && html`<div class="sub2" style=${{marginTop:8}}>${(rows || []).length ? "אין הזמנות מהספק הזה בטווח — סמן \"הצג את כל ההזמנות\"" : "אין הזמנות בטווח הזה"}</div>`}

  /* ↩ זיכויים פתוחים (מהגיליון): נדרש זיכוי / נשלחה דרישה לספק — עדכון סטטוס ומספר זיכוי, נכתב לגיליון */

        ${(r.notes || "").split("\n").filter(l => /^🧾|^זיכוי/.test(l)).slice(-3).map((l, i) => html`<div key=${i} class="sub2" style=${{margin:"4px 0 0"}}>${l}</div>`)}
        <div class="ordfwd">

    if(!Object.keys(learn).length) return 0;
    try{ await invSupCol().doc(sup.id).update(learn); }catch(e){ return 0; }
    const hp = learn.hp || "", em = learn.emails ? fm : "";
    const orphan = (invs || []).filter(x => x.id !== f.id && !x.sup && (x.status === "new" || x.status === "rej") && ((hp && x.hp === hp) || (em && String(x.from || "").toLowerCase() === em)));

    orphan.forEach(x => b.update(invCol().doc(x.id), { sup:sup.id, supName:sup.name, hp: x.hp || sup.hp || hp }));

  /* ───── ייבוא ספקים מהטבלאות שכבר קיימות במשרד (אקסל) ─────

     שמות שהם אותו ספק ("טסה" / "אאא טסה", "ש. אפרתי" / "ש.אפרתי") מתאחדים — השם השכיח נשאר, השאר נשמרים כשמות נוספים.
     מגיליון "הוצאות לפי פרויקט" נלקח גם סדר עמודות הפרויקטים — לדוח החודשי. */
  const INV_MONTHS = /^(ינואר|פברואר|מרץ|אפריל|מאי|יוני|יולי|אוגוסט|ספטמבר|אוקטובר|נובמבר|דצמבר)/;

      const into = g.k.length >= 3 && out.find(o => o.all.some(n => (" " + invKey(n) + " ").includes(w) || ws(n) === wg));
      if(into){ into.all.push(...g.names); into.n += g.n; if(g.n > into.top){ into.top = g.n; into.name = g.names[0]; } if(g.kind === "con") into.kind = "con"; }

  function InvImpSheet({ sups, cfg, notify, onClose }){

        <div class="pdlist" style=${{maxHeight:"52vh", overflow:"auto", marginTop:8}}>

            <input type="checkbox" checked=${!!pick[i]} onChange=${e=>setPick(p => ({ ...p, [i]:e.target.checked }))} />
            <span class="pdt"><b>${o.name}</b><small>${[o.kind === "con" ? "קבלן" : "ספק", o.n + " שורות", o.dup ? "כבר קיים" : "", o.aka.length ? "גם: " + o.aka.join(", ") : ""].filter(Boolean).join(" · ")}</small></span>

  /* ───── דוח חודשי במבנה של גיליון "הוצאות לפי פרויקט" ─────
     כל חשבונית = שורה: ספק, הסכום לפני מע״מ בעמודת הפרויקט שלה, סה״כ, אסמכתא. ספקים ואחריהם קבלנים.
     + גיליון "מעקב תשלומים" (ספק × חודש, כולל מע״מ) + גיליון פירוט. */
  const invNet = f => f.total == null ? 0 : Math.round((f.vat != null ? f.total - f.vat : f.total / 1.18) * 100) / 100;
  function invColMap(list, cfg){
    const cols = (cfg && cfg.cols && cfg.cols.length ? cfg.cols : []).slice();
    if(!cols.includes("כללי")) cols.push("כללי");
    // מילים כלליות לא קובעות התאמה ("מלון אשדוד" ≠ "מלון תל אביב", "עצמאות בת ים" ≠ "גליל ים")
    const STOP = new Set(["מלון", "הר", "בת", "ים", "תל", "אביב", "בית", "קרית", "רמת", "גן", "כפר", "מגרש", "פרויקט", "קוטגים", "קוטג׳ים"]);
    const W = s => invKey(s).split(" ").filter(w => w.length >= 2 && !STOP.has(w) && !/^\d+$/.test(w));
    const map = {};
    [...new Set(list.map(f => f.siteName).filter(Boolean))].forEach(n => {

  }
  function invProjXlsx(all, rows, sups, cfg, mon){

    const kindOf = f => (supOf(f) || {}).kind === "con" ? "con" : "sup";

    const sec = (kind, head, totName) => {

  /* קובץ אחד לרו״ח: עמוד סיכום ואחריו כל החשבוניות של החודש */
  function invCoverPages(rows, title){
    const W = 1240, H = 1754, M = 90, RH = 46, per = 30, pages = [];
    const sum = rows.reduce((a, r) => a + (r.total || 0), 0), vat = rows.reduce((a, r) => a + (r.vat || 0), 0);
    for(let p = 0; p * per < rows.length || p === 0; p++){
      const c = document.createElement("canvas"); c.width = W; c.height = H;
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, W, H);
      x.direction = "rtl"; x.textAlign = "right"; x.fillStyle = "#111";
      x.font = "bold 44px Heebo, Arial, sans-serif"; x.fillText(title, W - M, M + 20);
      x.font = "26px Heebo, Arial, sans-serif"; x.fillStyle = "#555";
      x.fillText(rows.length + " חשבוניות · סה״כ " + invMoney(sum) + " · מע״מ " + invMoney(vat) + (pages.length || rows.length > per ? " · עמוד " + (p + 1) + " מתוך " + Math.max(1, Math.ceil(rows.length / per)) : ""), W - M, M + 68);
      const cols = [["#", 50], ["ספק", 300], ["מס׳ חשבונית", 170], ["תאריך", 140], ["פרויקט", 230], ["סכום", 170]];

  async function invBundle(list, sups, title, onStep){
    const L = await loadPdfLib(), out = await L.PDFDocument.create();
    const rows = list.map(f => ({ sup:invSupName(f, sups), no:f.no, date:f.date, site:f.siteName, total:f.total, vat:f.vat }));
    for(const c of invCoverPages(rows, title)){
      const png = await out.embedPng(await new Promise(res => c.toBlob(b => b.arrayBuffer().then(res), "image/png")));
      const pg = out.addPage([595.28, 841.89]); pg.drawImage(png, { x:0, y:0, width:595.28, height:841.89 });
    }
    const missing = [];
    for(let i = 0; i < list.length; i++){
      const f = list[i]; onStep && onStep(i + 1, list.length);
      if(!f.parts){ missing.push(f); continue; }
      try{
        const bytes = await invLoad(f);
        if((f.mime || "application/pdf") === "application/pdf"){
          let src = null;
          try{ src = await L.PDFDocument.load(bytes); }catch(e){ src = null; }
          if(src) (await out.copyPages(src, src.getPageIndices())).forEach(p => out.addPage(p));
          else {   // PDF מוצפן — העמודים עוברים כתמונה
            const pdf = await pdOpenPdf(bytes);
            const tmp = await L.PDFDocument.load(await pdExtract(null, pdf, Array.from({ length:pdf.numPages }, (_, k) => k)));
            (await out.copyPages(tmp, tmp.getPageIndices())).forEach(p => out.addPage(p));
          }
        } else {
          const img = /png/.test(f.mime) ? await out.embedPng(bytes) : await out.embedJpg(bytes);
          const s = Math.min(595.28 / img.width, 841.89 / img.height);
          const pg = out.addPage([595.28, 841.89]); pg.drawImage(img, { x:(595.28 - img.width * s) / 2, y:(841.89 - img.height * s) / 2, width:img.width * s, height:img.height * s });
        }
      }catch(e){ missing.push(f); }
    }
    return { bytes: new Uint8Array(await out.save()), missing };
  }

  /* ───── התראות לטלפון: הרשמה של המכשיר (Web Push). המנוי נשמר ב-push/{טלפון}, וסקריפט הרכש מפעיל את השליחה ───── */
  function urlB64(s){ const p = "=".repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(b, c => c.charCodeAt(0)); }
  function pushKey(ep){ let h = 0; for(let i = 0; i < ep.length; i++) h = (h * 31 + ep.charCodeAt(i)) >>> 0; return "k" + h.toString(36) + ep.length.toString(36); }
  async function swReg(){
    if(!("serviceWorker" in navigator)) return null;
    return (await navigator.serviceWorker.getRegistration()) || null;
  }
  function PushToggle({ phone, name, notify }){
    const can = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
    const [on, setOn] = useState(null), [busy, setBusy] = useState(false);
    useEffect(()=>{
      if(!can) return;
      swReg().then(r => r ? r.pushManager.getSubscription() : null).then(sub => setOn(!!sub && Notification.permission === "granted")).catch(()=>setOn(false));
    }, []);
    const ref = () => firebase.firestore().collection("push").doc(phone);
    async function enable(){
      setBusy(true);
      try{
        const perm = await Notification.requestPermission();
        if(perm !== "granted"){ notify("ההתראות חסומות — צריך לאפשר התראות לבקרה בהגדרות הטלפון או הדפדפן"); return; }
        const reg = await swReg();
        if(!reg){ notify("רענן את הבקרה ונסה שוב"); return; }
        let sub = await reg.pushManager.getSubscription();
        if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:urlB64(VAPID_PUBLIC) });
        const j = sub.toJSON();
        await ref().set({ name, orders:true, subs:{ [pushKey(j.endpoint)]: { endpoint:j.endpoint, keys:j.keys, ua:navigator.userAgent.slice(0, 120), at:firebase.firestore.FieldValue.serverTimestamp() } } }, { merge:true });
        setOn(true); notify("🔔 התראות על הזמנות חדשות הופעלו במכשיר הזה");
      }catch(e){ notify("לא הצלחתי להפעיל התראות: " + (e.message || e)); }
      finally{ setBusy(false); }
    }
    async function disable(){
      setBusy(true);
      try{
        const reg = await swReg(), sub = reg && await reg.pushManager.getSubscription();
        if(sub){ const k = pushKey(sub.endpoint); await sub.unsubscribe().catch(()=>{}); await ref().update({ ["subs." + k]: firebase.firestore.FieldValue.delete() }).catch(()=>{}); }
        setOn(false); notify("ההתראות כובו במכשיר הזה");
      }catch(e){ notify("לא הצלחתי לכבות: " + (e.message || e)); }
      finally{ setBusy(false); }
    }
    if(!can) return html`<div class="pushbox"><span>🔕 ${ios ? "באייפון ההתראות עובדות רק כשהבקרה מותקנת: בספארי לחץ שתף ← \"הוסף למסך הבית\", פתח את הבקרה מהאייקון, ואז הפעל כאן התראות" : "המכשיר או הדפדפן הזה לא תומך בהתראות"}</span></div>`;
    return html`<div class="pushbox">
      <span>${on ? "🔔 התראה על כל הזמנה חדשה פעילה במכשיר הזה" : "🔕 רוצה לקבל התראה בטלפון כשנכנסת הזמנה חדשה?"}</span>
      ${on === null ? null : on
        ? html`<button class="btn" disabled=${busy} onClick=${disable}>כבה התראות</button>`
        : html`<button class="btn pri" disabled=${busy} onClick=${enable}>🔔 הפעל התראות</button>`}
    </div>`;
  }

  /* תצוגת הדפסה: נבנית מחוץ לאפליקציה (portal) ומוצגת רק בהדפסה. mode: "page" — עמוד לכל הזמנה, "list" — רשימה מרוכזת.
     ההדפסה עצמה נפתחת ישירות מהלחיצה (באייפון ספארי חוסם הדפסה שלא נפתחת מתוך הלחיצה עצמה) — ראו print ב-OrdersQueue */
  function OrdersPrint({ list, mode, who, onClose }){
    useLayoutEffect(()=>{ document.body.classList.add("printing"); return ()=>document.body.classList.remove("printing"); }, []);
    // הדפסה בדף נפרד ונקי (בלי העיצוב של הבקרה): במחשב לשונית חדשה, באייפון ספארי — מאפליקציה במסך הבית אפל לא מאפשרת להדפיס.
    // הדף נמצא באתר הרכש (מחוץ לתחום של אפליקציית הבקרה), והנתונים עוברים בכתובת אחרי # — לא נשלחים לשום שרת

    const printed = "הודפס " + ordWhen(Date.now()) + (who ? " ע״י " + who : "");
    const one = o => html`

          ${o.needBy ? html`<br/>נדרש עד: ${ordNeedBy(o.needBy)}` : null}${o.note ? html`<br/>הערת המזמין: ${o.note}` : null}

          <div class="sup">${r.supplier}${r.real && r.real !== r.supplier ? " ← ספק בפועל: " + r.real : ""}${r.sub > 0 ? " · " + ordMoney(r.sub) + " לפני מע״מ" : ""} <span style=${{fontWeight:400, fontSize:"9pt"}}>(${r.id})</span></div>
          <table><thead><tr><th>פריט</th><th>כמות</th><th>יחידה</th></tr></thead><tbody>
            ${ls.length ? ls.map((l, i) => html`<tr key=${i}><td>${l.n}${l.sku ? " · מק״ט " + l.sku : ""}</td><td class="q">${l.q}</td><td class="q">${l.u}</td></tr>`)
              : html`<tr><td colspan="3">${r.items || "—"}</td></tr>`}
          </tbody></table>

          ${ordLinks(r).length ? html`<div class="meta">📷 ${ordLinks(r).length === 1 ? "תמונה מצורפת" : ordLinks(r).length + " תמונות מצורפות"} — לצפייה בבקרה או בגיליון</div>` : null}
        </div>`; })}
        ${mode === "page" && html`<div class="sig">
          ${o.needAp && html`<div>אישור טל (חתימה ותאריך)</div>`}
          <div>טופל ע״י שרון · הועבר לספק (תאריך)</div>
        </div>`}
        ${mode === "page" && html`<div class="foot">ט.ש. מי-רון · ${printed}</div>`}
      </div>`;
    return ReactDOM.createPortal(html`<div class="ordprint">
      <div class="pbar"><b>${mode === "page" ? "🖨 " + list.length + (list.length === 1 ? " הזמנה" : " הזמנות") + " — עמוד לכל הזמנה" : "📋 רשימה מרוכזת — " + list.length + " הזמנות"}</b>

  /* 📊 לפי פרויקט (משרד): כמה הוזמן בכל פרויקט בחודש מול התקציב, מצב ההזמנות, 6 חודשים אחרונים, ודוח חודשי להדפסה / CSV.
     המקור: גיליון "הזמנות" (ולשונית "תקציבים") דרך סקריפט הרכש. תקציב נשמר בגיליון */

    useEffect(()=>{ load(); }, []);
    const vat = (d && d.vat) || 1.18;

    const rows = !d ? [] : [...new Set([...Object.keys(d.projects), ...Object.keys(d.budgets || {})])].map(name => {
      const x = d.projects[name] || { months:{}, sups:{} }, mm = x.months[mon] || { sub:0, n:0 };
      const budget = (d.budgets || {})[name] || 0, spend = Math.round(mm.sub * vat);
      const sups = Object.entries((x.sups || {})[mon] || {}).sort((a, b) => b[1] - a[1]).slice(0, 3);

    }).filter(r => r.spend || r.budget || r.x.open || r.x.tal || r.x.transit || r.x.credits).sort((a, b) => b.spend - a.spend || a.name.localeCompare(b.name, "he"));
    const tot = rows.reduce((a, r) => a + r.spend, 0), totB = rows.reduce((a, r) => a + r.budget, 0), nOver = rows.filter(r => r.pct > 1).length;
    async function setBudget(r){
      const v = prompt("תקציב חודשי לפרויקט " + r.name + " (₪ כולל מע״מ). 0 = בלי תקציב", r.budget || "");
      if(v == null) return;
      const amount = Math.max(0, Math.round(Number(String(v).replace(/[^\d.]/g, "")) || 0));
