  }

  /* כתב כמויות מתוכנית — המנהל מעלה PDF, המערכת מודדת וסופרת, והמנהל מאשר */
  function PlanBoq({ site, onSave, onDelete, onBack, notify }){
    const [phase, setPhase] = useState("list");   // list | busy | review
    const [prog, setProg] = useState("");
    const [pages, setPages] = useState([]);       // לכל עמוד בקובץ: קומה, קנה מידה, צנרת, סמלים
    const [cur, setCur] = useState(0);
    const [name, setName] = useState("");
    const [extra, setExtra] = useState([]);
    const [height, setHeight] = useState("3");    // גובה לכל ירידה/עלייה
    const [hang, setHang] = useState(true);
    const [fitOn, setFitOn] = useState(true);
    const [showGray, setShowGray] = useState(false);
    const [sel, setSel] = useState(null);
    const [q, setQ] = useState("");
    const [ans, setAns] = useState(null);
    const [asking, setAsking] = useState(false);
    const [openB, setOpenB] = useState({});       // כתבי כמויות שפתוחים במלואם
    const fileRef = useRef(null), cvRef = useRef(null);
    const known = site.boqColors || {};
    const list = site.boq || [];
    const pg = pages[cur];

    function mkPage(r){
      const kn = id => known[id] || {};
      const byId = {};
      r.items.forEach(x => byId[x.id] = x.cells);
      r.syms.forEach(x => byId[x.id] = x.cells);
      return { no:r.no, mode:r.mode, scale0:r.scale0, scale:r.scale0, detected:r.detected, floor:r.floor, include:true, overview:r.overview, gw:r.gw, gh:r.gh, cell:r.cell,
        legendN:r.legendN, layers:r.layers, byId,
        rows: r.items.map(it => { const k = kn(it.id); return { id:it.id, color:it.color, layer:it.layer, gray:it.gray, hint:it.hint, legend:it.legend,
          // ברירת מחדל: צבעוני — כן; שכבה שאינה של צנרת / ארונות / אדום בלי שכבות (בדרך כלל הערות) — לא
          on: k.on != null ? k.on !== false : (!it.gray && (it.hint ? it.hint !== "ארונות כיבוי" : !it.layer && it.color.toLowerCase() !== "#ff0000")),
          name: k.name || it.legend || it.hint || "", sp: k.sp || "2",
          parts: it.parts.map(p => ({ dia: p.dia || k.dia || "", orig:p.dia, slope:p.slope, base:p.lenM, len:"" })),
          fits: it.fits.map(f => ({ ...f, on:true })) }; }),
        syms: r.syms.map(x => { const k = kn(x.id); return { id:x.id, color:x.color, size:x.size, curve:x.curve, count:x.count, gray:x.gray, tagged:x.tagged, hint:x.hint, pts:x.pts,
          on: k.on != null ? k.on !== false : (!x.gray && !x.tagged && x.count >= 2), name: k.name || "", dia: k.dia || "",
          kind: k.kind || (x.size <= 0.2 ? "vert" : "unit") }; }) };
    }
    async function onFile(e){
      const file = e.target.files && e.target.files[0]; e.target.value = "";
      if(!file) return;
      if(!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)){ notify("צריך קובץ PDF של התוכנית"); return; }
      setPhase("busy"); setProg("פותח את התוכנית…");
      try{
        const plan = await openPlan(file);
        const N = Math.min(plan.pages, 20), out = [];
        for(let p = 1; p <= N; p++){
          const pre = N > 1 ? "עמוד " + p + " מתוך " + N + " · " : "";
          setProg(pre + "קורא את השרטוט…");
          const r = await analyzePage(plan, p, (d, n) => setProg(pre + "מודד את הצנרת… " + Math.round(100 * d / n) + "%"));
          out.push(mkPage(r));
        }
        setPages(out); setCur(0);
        setName(plan.name);
        setExtra([]); setSel(null); setShowGray(false);
        setPhase("review");
        if(plan.pages > N) notify("בקובץ " + plan.pages + " עמודים — נמדדו " + N + " הראשונים");
        if(!out.some(p => p.rows.some(r => !r.gray) || p.syms.length)) notify("לא נמצאו קווים או סמלים צבעוניים — ייתכן שזו תוכנית סרוקה");
      }catch(err){ console.error(err); setPhase("list"); notify("הניתוח נכשל: " + (err && err.message || err)); }
    }
    // המפה הקטנה עם הדגשת השורה שנבחרה
    useEffect(()=>{
      const c = cvRef.current; if(!c || !pg) return;
      c.width = pg.gw; c.height = pg.gh;
      const g = c.getContext("2d");
      g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
      g.globalAlpha = sel ? 0.22 : 1; g.drawImage(pg.overview, 0, 0); g.globalAlpha = 1;
      if(sel && pg.byId[sel.id]){
        const isSym = sel.id.startsWith("sym:");
        g.fillStyle = ["#000000", "#6e6e6e", "#b0b0b0"].includes(sel.color) ? "#e8590c" : sel.color;
        g.strokeStyle = "#e8590c"; g.lineWidth = 2;
        pg.byId[sel.id].forEach(i => {
          const x = i % pg.gw, y = Math.floor(i / pg.gw);
          if(isSym){ g.beginPath(); g.arc(x, y, 7, 0, 7); g.stroke(); } else g.fillRect(x - 1, y - 1, 3, 3);
        });
      }
    }, [pages, cur, sel, phase, showGray]);
    // הקשה על המפה: הסמל או הקו הקרובים נבחרים (וסמל — גם מסומן לספירה)
    function onMapTap(e){
      if(!pg) return;
      const rc = e.currentTarget.getBoundingClientRect();
      const gx = (e.clientX - rc.left) / rc.width * pg.gw, gy = (e.clientY - rc.top) / rc.height * pg.gh;
      const cmm = pg.cell / PLAN_PX;
      let best = null, bd = 9;
      pg.syms.forEach((x, i) => x.pts.forEach(([px, py]) => { const d = Math.hypot(px / cmm - gx, py / cmm - gy); if(d < bd){ bd = d; best = ["s", i]; } }));
      if(!best){
        const cx = Math.floor(gx), cy = Math.floor(gy);
        pg.rows.forEach((r, i) => { const cs = pg.byId[r.id]; if(!cs || (r.gray && !showGray)) return;
          for(let dy = -3; dy <= 3; dy++) for(let dx = -3; dx <= 3; dx++) if(cs.has((cy + dy) * pg.gw + cx + dx)){ const d = Math.hypot(dx, dy); if(d < bd){ bd = d; best = ["r", i]; } } });
      }
      if(!best){ setSel(null); return; }
      const [t, i] = best, it = t === "s" ? pg.syms[i] : pg.rows[i];
      setSel(it);
      if(t === "s" && !it.on) setSym(i, { on:true });
      setTimeout(() => { const el = document.getElementById("boq-" + t + i); el && el.scrollIntoView({ behavior:"smooth", block:"center" }); }, 50);
    }

    const kOf = p => p ? p.scale / p.scale0 : 1;
    const qtyP = (pt, k) => pt.len != null && pt.len !== "" ? +pt.len : Math.round(pt.base * k * 10) / 10;
    const setPage = patch => setPages(ps => ps.map((p, j) => j === cur ? { ...p, ...patch } : p));
    const setRow = (i, patch) => setPages(ps => {
      const old = ps[cur].rows[i];
      return ps.map((p, j) => j === cur ? { ...p, rows:p.rows.map((r, k) => k === i ? { ...r, ...patch } : r) }
        : patch.name !== undefined ? { ...p, rows:p.rows.map(r => r.id === old.id && (!r.name || r.name === old.name) ? { ...r, name:patch.name } : r) } : p);
    });
    const setPart = (i, pi, patch) => setPages(ps => ps.map((p, j) => j !== cur ? p : { ...p, rows:p.rows.map((r, k) => k !== i ? r : { ...r, parts:r.parts.map((x, m) => m === pi ? { ...x, ...patch } : x) }) }));
    const setFit = (i, fi, patch) => setPages(ps => ps.map((p, j) => j !== cur ? p : { ...p, rows:p.rows.map((r, k) => k !== i ? r : { ...r, fits:r.fits.map((x, m) => m === fi ? { ...x, ...patch } : x) }) }));
    const setSym = (i, patch) => setPages(ps => {
      const old = ps[cur].syms[i];
      return ps.map((p, j) => j === cur ? { ...p, syms:p.syms.map((r, k) => k === i ? { ...r, ...patch } : r) }
        : patch.name !== undefined ? { ...p, syms:p.syms.map(r => r.id === old.id && (!r.name || r.name === old.name) ? { ...r, name:patch.name } : r) } : p);
    });
    const H = +height || 0;
    const cz = o => { Object.keys(o).forEach(k => { if(o[k] === "" || o[k] == null) delete o[k]; }); return o; };
    function save(){
      const out = [], floors = [];
      let noName = 0;
      pages.filter(p => p.include).forEach(p => {
        const f = (p.floor || "").trim(), k = kOf(p);
        if(f && !floors.includes(f)) floors.push(f);
        const src = p.mode === "vec" ? "נמדד מהשרטוט" : "נמדד לפי צבע";
        p.rows.filter(r => r.on).forEach(r => {
          if(!r.name.trim()) noName++;
          const nm = r.name.trim() || (r.gray || "קו בצבע " + r.color), sp = +r.sp;
          r.parts.forEach(pt => {
            const qv = qtyP(pt, k); if(!(qv > 0)) return;
            out.push(cz({ f, name:nm, dia:pt.dia.trim(), sl:pt.slope, qty:qv, unit:"מ״א", color:r.color, src, k:"p" }));
            if(hang && sp > 0) out.push(cz({ f, name:"תליות — " + nm, dia:pt.dia.trim(), qty:Math.ceil(qv / sp), unit:"יח׳", src:"תלייה כל " + sp + " מ׳", k:"h" }));
          });
          if(fitOn) r.fits.filter(x => x.on && +x.n > 0).forEach(x => out.push(cz({ f, name:x.type + " — " + nm, dia:x.dia, qty:+x.n, unit:"יח׳", color:r.color, src:"נספר מהחיבורים בשרטוט (הערכה)", k:"f" })));
        });
        p.syms.filter(x => x.on && +x.count > 0).forEach(x => {
          if(!x.name.trim()) noName++;
          const nm = x.name.trim() || "סמל Ø" + Math.round(x.size * 100) + " ס״מ";
          out.push(cz({ f, name:nm, dia:x.dia.trim(), qty:+x.count, unit:"יח׳", color:x.color, src:"נספר בתוכנית", k:"s" }));
          if(x.kind === "vert" && H > 0) out.push(cz({ f, name:nm + " — צנרת אנכית", dia:x.dia.trim(), qty:Math.round(+x.count * H * 10) / 10, unit:"מ״א", color:x.color, src:x.count + " × " + H + " מ׳", k:"v" }));
        });
      });
      extra.filter(x => x.name.trim() && +x.qty > 0).forEach(x => out.push(cz({ f:x.f || "", name:x.name.trim(), dia:x.dia.trim(), qty:+x.qty, unit:x.unit, src:"ידני", k:"x" })));
      if(!out.length){ notify("סמן לפחות שורה אחת"); return; }
      if(noName && !confirm(noName + " שורות מסומנות בלי שם (יופיעו כ\"קו בצבע…\" / \"סמל Ø…\"). לשמור בכל זאת?")) return;
      const colors = {};
      pages.forEach(p => {
        p.rows.forEach(r => { const un = r.parts.find(x => !x.orig); if(r.name.trim() || r.on !== !r.gray) colors[r.id] = cz({ name:r.name.trim(), dia:un ? un.dia.trim() : "", sp:r.sp, on:r.on }); });
        p.syms.forEach(x => { if(x.name.trim()) colors[x.id] = cz({ name:x.name.trim(), dia:x.dia.trim(), kind:x.kind, on:x.on }); });
      });
      const inc = pages.filter(p => p.include);
      onSave(site.id, { plan: name.trim() || "תוכנית", scale: inc.length ? inc[0].scale : 100, height: H, floors, pages: inc.length, rows: out }, colors);
      setPhase("list"); setPages([]);
    }
    // ── אקסל ──
    const info = b => [[], ["אתר: " + site.name], ["תוכנית: " + b.plan + " · קנה מידה 1:" + b.scale + (b.height ? " · גובה ירידה/עלייה " + b.height + " מ׳" : "")],
      ["הופק: " + dmy(b.at) + "/" + new Date(b.at).getFullYear() + " · " + b.by], ["טיוטה ממדידה אוטומטית — לבדיקת המנהל"]];
    const tbl = r => [r.head, ...r.body];
    function exportX(b){
      const flat = boqFlat([b]), hasF = flat.some(r => r.f);
      const sheets = [{ name:"סיכום", widths:[40, 10, 10, 8], rows:[...tbl(boqRun({ group:["name", "dia"] }, flat)), ...info(b)] }];
      if(hasF) sheets.push({ name:"לפי קומה", widths:[12, 40, 10, 10, 8], rows:tbl(boqRun({ group:["f", "name", "dia"] }, flat)) });
      sheets.push({ name:"פירוט", widths:[12, 44, 10, 8, 10, 8, 14, 30], rows:[["קומה", "פריט", "קוטר", "שיפוע", "כמות", "יחידה", "סוג", "מקור"],
        ...b.rows.map(r => [r.f || "", r.name, r.dia || "", r.sl || "", r.qty, r.unit, BOQ_K[r.k] || "", r.src || ""])] });
      saveFile(xlsxBlob(sheets), "כתב כמויות - " + site.name + " - " + b.plan + ".xlsx");
    }
    function exportAll(){
      const flat = boqFlat(list);
      saveFile(xlsxBlob([
        { name:"סיכום כללי", widths:[40, 10, 10, 8], rows:[...tbl(boqRun({ group:["name", "dia"] }, flat)), [], ["אתר: " + site.name + " · כל התוכניות (" + list.length + ")"]] },
        { name:"לפי תוכנית וקומה", widths:[28, 12, 40, 10, 10, 8], rows:tbl(boqRun({ group:["plan", "f", "name", "dia"] }, flat)) }
      ]), "כתב כמויות - " + site.name + " - כל התוכניות.xlsx");
    }
    function exportAns(a){
      saveFile(xlsxBlob([{ name:"תוצאה", widths:a.head.map((h, i) => i === a.head.length - 1 ? 8 : h === "פריט" ? 40 : h === "תוכנית" ? 28 : 12),
        rows:[a.head, ...a.body, [], ["סה״כ: " + a.totals.join(" · ")], ["שאלה: " + a.q], ["סינון: " + boqSpecText(a.spec)], ["אתר: " + site.name]] }]),
        "שאלה על כתב כמויות - " + site.name + ".xlsx");
    }
    async function ask(text){
      text = (text || "").trim(); if(!text) return;
      const flat = boqFlat(list); if(!flat.length) return;
      setQ(text); setAsking(true);
      try{ const { spec, ai } = await boqAsk(text, flat); setAns({ q:text, spec, ai, ...boqRun(spec, flat) }); }
      finally{ setAsking(false); }
    }

    const swatch = (color, active, onClick, round) => html`<button onClick=${onClick} title="הצג בתוכנית"
      style=${{width:30, height:30, borderRadius: round ? 15 : 7, border: active ? "3px solid var(--ink)" : "1px solid var(--line)", background:color, flex:"none"}}></button>`;
    const pipeRow = (r, i) => html`
      <div key=${r.id} id=${"boq-r" + i} class="card" style=${{padding:"10px 12px", marginBottom:8, opacity: r.on ? 1 : .55}}>
        <div class="rowbet" style=${{gap:8}}>
          <input type="checkbox" checked=${r.on} onChange=${e=>setRow(i, { on:e.target.checked })} style=${{width:20, height:20}} />
          ${swatch(r.color, sel && sel.id === r.id, ()=>setSel(sel && sel.id === r.id ? null : r))}
          <input class="bin" type="text" style=${{flex:1}} value=${r.name} onInput=${e=>setRow(i, { name:e.target.value })} placeholder=${r.gray ? r.gray : "שם לפי המקרא (למשל: ביוב מתחת לתקרה)"} />
        </div>
        ${(r.layer || r.legend) && html`<div class="sub2" style=${{marginTop:3}}>${r.layer ? "שכבה: " + r.layer : ""}${r.layer && r.legend ? " · " : ""}${r.legend ? "במקרא: " + r.legend : ""}</div>`}
        ${r.parts.map((pt, pi) => html`
          <div key=${pi} class="rowbet" style=${{gap:6, marginTop:6}}>
            <input class="bin" type="text" style=${{width:74}} value=${pt.dia} onInput=${e=>setPart(i, pi, { dia:e.target.value })} placeholder="קוטר" />
            <input class="bin" type="number" inputmode="decimal" style=${{width:84}} value=${qtyP(pt, kOf(pg))} onInput=${e=>setPart(i, pi, { len:e.target.value })} />
            <span class="sub">מ״א${pt.slope ? " · שיפוע " + pt.slope : ""}${pt.orig ? "" : r.parts.length > 1 ? " · בלי כיתוב קוטר" : ""}</span>
            ${pi === 0 && hang && html`<span class="sub" style=${{marginInlineStart:"auto"}}>תלייה כל</span><input class="bin" type="number" inputmode="decimal" style=${{width:56}} value=${r.sp} onInput=${e=>setRow(i, { sp:e.target.value })} /><span class="sub">מ׳</span>`}
          </div>`)}
        ${fitOn && r.on && r.fits.length > 0 && html`
          <div style=${{display:"flex", flexWrap:"wrap", gap:6, marginTop:8}}>
            ${r.fits.map((x, fi) => html`<label key=${fi} class="sub" style=${{display:"inline-flex", alignItems:"center", gap:4, border:"1px solid var(--line-2)", borderRadius:8, padding:"2px 6px", opacity:x.on ? 1 : .5}}>
              <input type="checkbox" checked=${x.on} onChange=${e=>setFit(i, fi, { on:e.target.checked })} />${x.type}${x.dia ? " " + x.dia : ""} ×
              <input class="bin" type="number" inputmode="numeric" style=${{width:48, padding:"2px 4px"}} value=${x.n} onInput=${e=>setFit(i, fi, { n:e.target.value })} /></label>`)}
          </div>`}
      </div>`;
    const cell = { padding:"4px 6px", borderBottom:"1px solid var(--line-2)", textAlign:"start" };
    const nGrayOn = pg ? pg.rows.filter(r => r.gray && r.on).length : 0;
    const byFloor = rows => { const m = new Map(); rows.forEach(r => { const f = r.f || ""; (m.get(f) || m.set(f, []).get(f)).push(r); }); return [...m.entries()].sort((a, b) => (parseFloat(floorKey(a[0])) || 0) - (parseFloat(floorKey(b[0])) || 0)); };
    return html`
      <div class="screen narrow">
        <div class="shead rowbet">
          <div><h2>📐 כתב כמויות מתוכנית</h2><span class="sub">${site.name}</span></div>
          <button class="btn" style=${{flex:"none", padding:"8px 14px"}} onClick=${onBack}>חזרה</button>
        </div>
        <input ref=${fileRef} type="file" accept="application/pdf,.pdf" style=${{display:"none"}} onChange=${onFile} />

        ${phase === "busy" && html`<div class="card"><div class="empty" style=${{padding:"26px 0"}}>⏳ ${prog}</div></div>`}

        ${phase === "list" && html`
          <div class="card ci" style=${{marginBottom:12}}>
            <div class="lbl">תוכנית חדשה</div>
            <div class="hint" style=${{textAlign:"start", margin:"4px 0 10px"}}>מעלים PDF מקורי מהמתכנן (לא סריקה), אפשר כמה עמודים/קומות בקובץ אחד. המערכת מודדת את הצנרת, לוקחת קוטר ושיפוע מהכיתוב שבתוכנית ושמות מהמקרא, סופרת סמלים, זוויות וטי, ומחשבת צנרת אנכית ותליות. אתה בודק ומאשר.</div>
            <button class="btn pri wide" onClick=${()=>fileRef.current && fileRef.current.click()}>📄 העלה תוכנית PDF</button>
          </div>
          ${list.length > 0 && html`
            <div class="card ci" style=${{marginBottom:12}}>
              <div class="lbl">🔎 שאלה על הכמויות באתר</div>
              <form class="addrow" style=${{marginTop:6}} onSubmit=${e=>{ e.preventDefault(); ask(q); }}>
                <input type="text" value=${q} onInput=${e=>setQ(e.target.value)} placeholder='למשל: כמה מטר צינור 2" בקומה 3' maxLength=${200} />
                <button type="submit" class="add" disabled=${!q.trim() || asking} aria-label="שאל">${asking ? "…" : "➤"}</button>
              </form>
              <div style=${{display:"flex", flexWrap:"wrap", gap:6, marginTop:8}}>
                ${['כמה מטר צינור 2" בקומה 3', "רשימת ספרינקלרים לפי קומה", "השווה בין שתי התוכניות האחרונות", "סה״כ צנרת לפי קוטר"].map(x => html`<button key=${x} class="btn" style=${{flex:"none", padding:"4px 10px", fontSize:".8rem"}} onClick=${()=>ask(x)}>${x}</button>`)}
              </div>
              ${ans && html`
                <div style=${{marginTop:10}}>
                  <div class="sub2">${ans.ai ? "🤖 " : ""}${boqSpecText(ans.spec)} · ${ans.n} שורות</div>
                  ${ans.body.length === 0 ? html`<div class="empty" style=${{padding:"10px 0"}}>לא נמצאו שורות שמתאימות לשאלה</div>` : html`
                    <div style=${{overflowX:"auto", marginTop:6}}>
                      <table style=${{width:"100%", borderCollapse:"collapse", fontSize:".85rem"}}>
                        <thead><tr>${ans.head.map(h => html`<th key=${h} style=${{...cell, background:"var(--line-2)"}}>${h}</th>`)}</tr></thead>
                        <tbody>${ans.body.map((r, i) => html`<tr key=${i}>${r.map((v, j) => html`<td key=${j} style=${cell} dir=${typeof v === "number" ? "ltr" : null}>${v}</td>`)}</tr>`)}</tbody>
                      </table>
                    </div>
                    <div class="rowbet" style=${{marginTop:6}}><b>סה״כ: ${ans.totals.join(" · ")}</b><button class="btn" style=${{flex:"none"}} onClick=${()=>exportAns(ans)}>⬇ אקסל</button></div>`}
                </div>`}
            </div>`}
          ${list.map(b => html`
            <div key=${b.id} class="card" style=${{marginBottom:10}}>
              <div class="rowbet"><b>${b.plan}</b><span class="sub">1:${b.scale}${b.floors && b.floors.length ? " · " + b.floors.join(", ") : ""}</span></div>
              <div class="sub2" style=${{margin:"2px 0 8px"}}>${dmy(b.at)} ${hhmm(b.at)} · ${b.by}</div>
              ${byFloor(openB[b.id] || b.rows.length <= 10 ? b.rows : b.rows.slice(0, 8)).map(([f, rs]) => html`<div key=${f}>
                ${f && byFloor(b.rows).length > 1 && html`<div class="sub" style=${{fontWeight:700, marginTop:6}}>${f}</div>`}
                ${rs.map((r, i) => html`<div key=${i} class="rowbet" style=${{fontSize:".86rem", padding:"3px 0", borderTop:"1px solid var(--line-2)"}}>
                  <span>${r.color ? html`<i style=${{display:"inline-block", width:10, height:10, borderRadius:2, background:r.color, marginInlineEnd:6}}></i>` : null}${r.name}${r.dia ? " " + r.dia : ""}</span>
                  <b dir="ltr">${r.qty} ${r.unit}</b></div>`)}</div>`)}
              ${b.rows.length > 10 && html`<button class="addsection" style=${{marginTop:6}} onClick=${()=>setOpenB(o => ({ ...o, [b.id]:!o[b.id] }))}>${openB[b.id] ? "▲ פחות" : "▼ הצג הכול (" + b.rows.length + " שורות)"}</button>`}
              <div class="btnrow" style=${{marginTop:10}}>
                <button class="btn" onClick=${()=>exportX(b)}>⬇ אקסל</button>
                <button class="btn danger" onClick=${()=>{ if(confirm("למחוק את כתב הכמויות של " + b.plan + "?")) onDelete(site.id, b.id); }}>מחק</button>
              </div>
            </div>`)}
          ${list.length > 1 && html`<button class="btn wide" style=${{marginBottom:10}} onClick=${exportAll}>⬇ אקסל של כל התוכניות באתר</button>`}
          ${list.length === 0 && html`<div class="empty" style=${{padding:"10px 0"}}>עדיין אין כתבי כמויות לאתר הזה</div>`}
        `}

        ${phase === "review" && pg && html`
          <datalist id="boq-items">${RAKESH_ITEMS.map(n => html`<option key=${n} value=${n} />`)}</datalist>
          <div class="card" style=${{marginBottom:12}}>
            <input class="bin" type="text" value=${name} onInput=${e=>setName(e.target.value)} placeholder="שם התוכנית (למשל: מרתף 2- תקרה)" />
            ${pages.length > 1 && html`
              <div style=${{display:"flex", flexWrap:"wrap", gap:6, marginTop:8}}>
                ${pages.map((p, j) => html`<button key=${j} class=${"btn" + (j === cur ? " pri" : "")} style=${{flex:"none", padding:"4px 10px", fontSize:".82rem", opacity:p.include ? 1 : .5}}
                  onClick=${()=>{ setCur(j); setSel(null); }}>עמוד ${p.no}${p.floor ? " · " + p.floor : ""}</button>`)}
              </div>`}
            <div class="rowbet" style=${{marginTop:8, gap:8}}>
              <span class="sub">קומה</span>
              <input class="bin" type="text" style=${{flex:1}} value=${pg.floor} onInput=${e=>setPage({ floor:e.target.value })} placeholder="למשל: קומה 3 / קרקע / מרתף -2" />
              ${pages.length > 1 && html`<label class="sub" style=${{display:"inline-flex", gap:4, alignItems:"center"}}><input type="checkbox" checked=${pg.include} onChange=${e=>setPage({ include:e.target.checked })} />לכלול</label>`}
            </div>
            <div class="rowbet" style=${{marginTop:8, gap:8}}>
              <span class="sub">קנה מידה 1:</span>
              <input class="bin" type="number" inputmode="numeric" style=${{width:80}} value=${pg.scale} onInput=${e=>setPage({ scale:+e.target.value || pg.scale0 })} />
              <span class="sub" style=${{flex:1}}>${pg.detected ? "זוהה מהתוכנית" : "לא זוהה — בדוק באבן הפינה"}</span>
            </div>
            <div class="sub2" style=${{marginTop:6}}>${pg.mode === "vec" ? "📏 שרטוט וקטורי — כל קטע נמדד מהקובץ" + (pg.layers ? " לפי שכבות" : "") : "🖼️ הצנרת שמורה בקובץ כתמונה — נמדד לפי צבע (דיוק נמוך יותר)"}${pg.legendN ? " · " + pg.legendN + " דוגמיות מקרא לא נספרו" : ""}</div>
            <div class="rowbet" style=${{marginTop:8, gap:8}}>
              <span class="sub">גובה כל ירידה/עלייה</span>
              <input class="bin" type="number" inputmode="decimal" style=${{width:70}} value=${height} onInput=${e=>setHeight(e.target.value)} />
              <span class="sub" style=${{flex:1}}>מ׳</span>
            </div>
            <label class="rowbet" style=${{marginTop:8, gap:8, justifyContent:"flex-start"}}>
              <input type="checkbox" checked=${hang} onChange=${e=>setHang(e.target.checked)} style=${{width:20, height:20}} />
              <span class="sub">לחשב תליות לכל קו (לפי מרחק בין תליות)</span>
            </label>
            <label class="rowbet" style=${{marginTop:8, gap:8, justifyContent:"flex-start"}}>
              <input type="checkbox" checked=${fitOn} onChange=${e=>setFitOn(e.target.checked)} style=${{width:20, height:20}} />
              <span class="sub">לספור זוויות וטי מהחיבורים בשרטוט (הערכה, רק בשרטוט וקטורי)</span>
            </label>
          </div>
          <canvas ref=${cvRef} onClick=${onMapTap} style=${{width:"100%", border:"1px solid var(--line-2)", borderRadius:10, background:"#fff", position:"sticky", top:4, zIndex:2, cursor:"pointer"}}></canvas>
          <div class="hint" style=${{textAlign:"start"}}>הקש על סמל או קו במפה — הוא ייבחר ויודגש (סמל גם יסומן לספירה, וכל הזהים לו נספרים). או לחץ על ריבוע/עיגול הצבע כדי לראות איפה זה בתוכנית. שמות שתיתן ייזכרו לפעם הבאה באתר הזה.</div>

          <div class="lbl" style=${{marginTop:10}}>צנרת אופקית — נמדד מהתוכנית</div>
          ${pg.rows.map((r, i) => r.gray ? null : pipeRow(r, i))}
          ${pg.rows.some(r => r.gray) && html`<button class="addsection" onClick=${()=>setShowGray(v => !v)}>${showGray ? "▲ הסתר קווים שחורים/אפורים" : "▼ קווים שחורים/אפורים (" + pg.rows.filter(r => r.gray).length + (nGrayOn ? ", " + nGrayOn + " מסומנים" : "") + ")"}</button>`}
          ${showGray && html`
            <div class="hint" style=${{textAlign:"start"}}>שחור ואפור משמשים גם לשרטוט האדריכלי. לחץ על הריבוע, ואם מסומנת צנרת (ולא קירות) — סמן ותן שם.</div>
            ${pg.rows.map((r, i) => r.gray ? pipeRow(r, i) : null)}`}

          <div class="lbl" style=${{marginTop:12}}>סמלים שנספרו בתוכנית</div>
          <div class="hint" style=${{textAlign:"start", marginTop:0}}>ירידה/עלייה = כמות × הגובה שלמעלה, נכנס כצנרת אנכית. ספרינקלר, קולטן, מגוף וכו׳ = יחידות.</div>
          ${pg.syms.map((x, i) => html`
            <div key=${x.id} id=${"boq-s" + i} class="card" style=${{padding:"10px 12px", marginBottom:8, opacity: x.on ? 1 : .55}}>
              <div class="rowbet" style=${{gap:8}}>
                <input type="checkbox" checked=${x.on} onChange=${e=>setSym(i, { on:e.target.checked })} style=${{width:20, height:20}} />
                ${swatch(x.color, sel && sel.id === x.id, ()=>setSel(sel && sel.id === x.id ? null : x), x.curve)}
                <input class="bin" type="text" list="boq-items" style=${{flex:1}} value=${x.name} onInput=${e=>setSym(i, { name:e.target.value })} placeholder=${(x.curve ? "עיגול" : "צורה") + " Ø" + Math.round(x.size * 100) + " ס״מ — מה זה? (ספרינקלר, ירידה 4״, קולטן…)"} />
              </div>
              ${(x.tagged || x.hint) && html`<div class="sub2" style=${{marginTop:3}}>${x.tagged ? "עם כיתוב בפנים — כנראה בועות צירים/תגיות" : "שכבה: " + x.hint}</div>`}
              <div class="rowbet" style=${{gap:6, marginTop:6}}>
                <input class="bin" type="text" style=${{width:64}} value=${x.dia} onInput=${e=>setSym(i, { dia:e.target.value })} placeholder="קוטר" />
                <input class="bin" type="number" inputmode="numeric" style=${{width:64}} value=${x.count} onInput=${e=>setSym(i, { count:e.target.value })} />
                <span class="sub">יח׳</span>
                <select class="bin" style=${{width:120, marginInlineStart:"auto"}} value=${x.kind} onChange=${e=>setSym(i, { kind:e.target.value })}>
                  <option value="vert">ירידה/עלייה</option><option value="unit">פריט (יח׳)</option>
                </select>
              </div>
              ${x.kind === "vert" && x.on && H > 0 && html`<div class="sub" style=${{marginTop:4}}>צנרת אנכית: ${x.count} × ${H} = <b>${Math.round(x.count * H * 10) / 10} מ״א</b></div>`}
            </div>`)}
          ${pg.syms.length === 0 && html`<div class="empty" style=${{padding:"8px 0"}}>לא נמצאו סמלים בתוכנית</div>`}

          <div class="lbl" style=${{marginTop:12}}>פריטים נוספים (ארונות כיבוי, בורות, משאבות…)</div>
          ${extra.map((x, i) => html`
            <div key=${i} class="rowbet" style=${{gap:6, marginBottom:6}}>
              <input class="bin" type="text" list="boq-items" style=${{flex:1}} value=${x.name} onInput=${e=>setExtra(xs => xs.map((y, j) => j === i ? { ...y, name:e.target.value } : y))} placeholder="פריט" />
              <input class="bin" type="text" style=${{width:60}} value=${x.dia} onInput=${e=>setExtra(xs => xs.map((y, j) => j === i ? { ...y, dia:e.target.value } : y))} placeholder="קוטר" />
              <input class="bin" type="number" inputmode="decimal" style=${{width:64}} value=${x.qty} onInput=${e=>setExtra(xs => xs.map((y, j) => j === i ? { ...y, qty:e.target.value } : y))} placeholder="כמות" />
              <select class="bin" style=${{width:70}} value=${x.unit} onChange=${e=>setExtra(xs => xs.map((y, j) => j === i ? { ...y, unit:e.target.value } : y))}><option>יח׳</option><option>מ״א</option></select>
            </div>`)}
          <button class="addsection" onClick=${()=>setExtra(xs => [...xs, { name:"", dia:"", qty:"", unit:"יח׳", f:(pg.floor || "").trim() }])}>＋ הוסף פריט</button>
          <div class="btnrow" style=${{marginTop:12}}>
            <button class="btn" onClick=${()=>{ setPhase("list"); setPages([]); }}>ביטול</button>
            <button class="btn pri" onClick=${save}>✓ שמור כתב כמויות</button>
          </div>
          <div class="hint">בשרטוט וקטורי האורך נמדד מהקווים עצמם. כשהצנרת שמורה כתמונה הדיוק כ-±10%. קוטר בלי כיתוב לידו — אפשר להשלים ידנית. אפשר לתקן כל מספר. צנרת אנכית = מספר העיגולים × הגובה; תליות = אורך ÷ מרחק בין תליות.</div>
        `}
      </div>`;
  }

  /* כרטיס החשבון במסך השטח: יעד החודש, תקציב החומר והביצוע עד עכשיו */
  function BillCard({ site, now, onBill }){
    const bill = useBill(site.id), mk = monthKey(now);
    const m = bill ? billMoney(bill, site, mk) : null;
    return html`
      <div class="card ci" style=${{marginBottom:12}}>
        <div class="lbl">📑 חשבון ביצוע ותקציב חומר · ${mLabel(mk)}</div>
        ${bill === undefined ? html`<div class="val" style=${{color:"var(--ink-3)"}}>טוען…</div>`
          : !bill ? html`<div class="val" style=${{color:"var(--ink-3)"}}>טרם הועלה חשבון לאתר הזה</div>`
          : m.hasPlan ? html`<div class="val">יעד החודש ${nisR(m.target)} · תקציב חומר ${nisR(m.budget)}</div>
              <div class="sub2">בוצע לפי הדוחות השבועיים: ${nisR(m.actual)}${m.target ? " (" + Math.round(m.actual / m.target * 100) + "% מהיעד)" : ""}</div>`
          : html`<div class="val">${bill.name || "חשבון"}</div><div class="sub2">המשרד עוד לא קבע יעד כמויות ל${mLabel(mk)} · בוצע עד כה ${nisR(m.actual)}</div>`}
        <div class="btnrow" style=${{marginTop:10}}><button class="btn" onClick=${()=>onBill(site.id)}>פתח חשבון</button></div>
      </div>`;
  }

  function FieldHome({ sites, now, onCheckin, onOpen, onAddUnit, onWeekly, onBoq, onBill }){
    const active = sites.filter(s=>s.active);
    // האתר שנבחר נשמר בין המסכים (חזרה מהדוח השבועי / מהחשבון לא מאפסת את הבחירה)
    const [sid, setSid0] = useState(()=>{ try{ const v = sessionStorage.getItem("bakara_field_sid"); if(v && active.some(s=>s.id===v)) return v; }catch(e){} return active[0].id; });
    const setSid = v => { setSid0(v); try{ sessionStorage.setItem("bakara_field_sid", v); }catch(e){} };
    const [adding, setAdding] = useState(false);
    const [issue, setIssue] = useState(false);
    const [note, setNote] = useState("");
    const [nu, setNu] = useState({ title:"", floor:"" });
    const site = sites.find(s=>s.id===sid) || active[0];
    const wk = curWeekly(site, now);

    function submitUnit(e){
      e.preventDefault();
      if(!nu.title.trim()) return;
      onAddUnit(site.id, nu);
      setNu({ title:"", floor:"" });
      setAdding(false);
    }

    return html`
      <div class="screen narrow">
        <div class="shead"><h2>דיווח שטח</h2><span class="sub">בחר אתר · דוח שבועי, דיווח יומי ומשימות</span></div>
        <select class="pick" value=${sid} onChange=${e=>{ setSid(e.target.value); setAdding(false); }}>
          ${active.map(s => html`<option key=${s.id} value=${s.id}>${s.name} · ${s.contractor}${curWeekly(s, now) ? " ✓" : ""}</option>`)}
        </select>

        <div class="card ci" style=${{marginBottom:12}}>
          <div class="lbl">דוח תוכנית עבודה שבועית · ${weekLabel(now)}</div>
          ${wk
            ? html`<div class="val">✓ הוגש ${dmy(wk.at)} ${hhmm(wk.at)} · ${wk.by}</div>
                <div class="sub2">${TRACKS.filter(t => wk.tracks && wk.tracks[t.k]).map(t => t.label + " " + wk.tracks[t.k].pct + "%").join(" · ") || "אין מסלולים רלוונטיים"} · כ״א ${wk.workers == null ? "—" : wk.workers}</div>`
            : html`<div class="val" style=${{color:"var(--warn)"}}>טרם הוגש דוח שבועי לאתר הזה</div>`}
          <div class="btnrow" style=${{marginTop:10}}>
            <button class="btn pri" onClick=${()=>onWeekly(site.id)}>${wk ? "עדכן דוח שבועי" : "📅 מלא דוח שבועי"}</button>
          </div>
        </div>
        ${onBill && html`<${BillCard} key=${site.id} site=${site} now=${now} onBill=${onBill} />`}

        <div class="card ci" style=${{marginBottom:12}}>
          <div class="lbl">דיווח יומי · ${site.name}</div>
          ${site.checkin && site.checkin.date === dstr(now)
            ? html`<div class="val">✓ דווח היום ${hhmm(site.checkin.at)} · ${site.checkin.by} · ${site.checkin.status === "issue" ? "חריגה: " + site.checkin.note : "אין חריגים"}</div>`
            : html`<div class="val" style=${{color:"var(--warn)"}}>טרם דווח היום${new Date(now).getHours() >= CFG.checkinBy ? " — נדרש דיווח" : ""}</div>`}
          ${!issue
            ? html`<div class="btnrow" style=${{marginTop:10}}>
                <button class="btn ok" onClick=${()=>onCheckin(site.id, "ok", "")}>✓ אין חריגים</button>
                <button class="btn danger" onClick=${()=>setIssue(true)}>⚠ יש חריגה</button>
              </div>`
            : html`<form class="addrow" onSubmit=${(e)=>{ e.preventDefault(); if(!note.trim()) return; onCheckin(site.id, "issue", note.trim()); setNote(""); setIssue(false); }}>
                <input type="text" value=${note} onInput=${e=>setNote(e.target.value)} placeholder="תאר בקצרה את החריגה…" maxLength=${100} />
                <button type="submit" class="add" disabled=${!note.trim()} aria-label="שלח">➤</button>
              </form>`}
        </div>
        <div class="card ci" style=${{marginBottom:12}}>
          <div class="lbl">📐 כתב כמויות מתוכנית</div>
          <div class="val">${(site.boq || []).length ? (site.boq || []).length + " תוכניות · אחרונה: " + site.boq[0].plan : "מעלים PDF של תוכנית ומקבלים טיוטת כתב כמויות"}</div>
          <div class="btnrow" style=${{marginTop:10}}><button class="btn" onClick=${()=>onBoq(site.id)}>${(site.boq || []).length ? "פתח / תוכנית חדשה" : "📄 העלה תוכנית"}</button></div>
        </div>
        <div class="lbl" style=${{marginTop:6}}>משימות ותיעוד מצולם באתר</div>
        <div style=${{display:"flex", flexDirection:"column", gap:9}}>
          ${site.units.map(u=>{
            const done = u.checklist.length>0 && u.checklist.every(c=>c.done);
            return html`
              <button key=${u.id} class="wu" onClick=${()=>onOpen(site.id, u.id)}>
                <span class="ic">${done ? "✓" : "📋"}</span>
                <span class="m"><b>${u.title}</b><span>${u.floor} · ${u.checklist.filter(c=>c.done).length}/${u.checklist.length} משימות · ${(u.photos||[]).length} תמונות</span></span>
              </button>`;
          })}
          ${site.units.length === 0 && !adding && html`<div class="empty" style=${{padding:"14px 0"}}>אין עדיין משימות לתיעוד באתר הזה</div>`}

          ${adding
            ? html`
              <form class="newunit" onSubmit=${submitUnit}>
                <input type="text" placeholder="שם המשימה (למשל: צילום ליווי שלד קומה 4)" value=${nu.title} onInput=${e=>setNu({...nu, title:e.target.value})} maxLength=${60} />
                <input type="text" placeholder="מיקום / קומה" value=${nu.floor} onInput=${e=>setNu({...nu, floor:e.target.value})} maxLength=${30} />
                <div class="btnrow">
                  <button type="button" class="btn" onClick=${()=>setAdding(false)}>ביטול</button>
                  <button type="submit" class="btn pri" disabled=${!nu.title.trim()}>הוסף משימה</button>
                </div>
              </form>`
            : html`<button class="addsection" onClick=${()=>setAdding(true)}>＋ הוסף משימה / תיעוד</button>`}
        </div>
        <div class="hint">אפשר לפתוח משימה, להוסיף לה סעיפי צ׳קליסט ולצרף תמונות. ההנהלה רואה את התמונות ביומן הפעולות.</div>
      </div>`;
  }

  /* מסך החשבון של אתר: המשרד מעלה חשבון וקובע יעד כמויות לחודש; המנהל רואה את האתר שלו בלבד (נאכף בחוקים) */
  function BillScreen({ site, now, office, who, onBack, notify }){
    const bill = useBill(site.id);
    const months = [];
    for(let i = -3; i <= 1; i++){ const d = new Date(now); d.setDate(1); d.setMonth(d.getMonth() + i); months.push(monthKey(d.getTime())); }
    const [mk, setMk] = useState(monthKey(now));
    const [imp, setImp] = useState(null);          // { sheets:[{name, rows}], i, res }
    const [plan, setPlan] = useState(null);        // טיוטת יעד בעריכה: { c: "כמות" }
    const [busy, setBusy] = useState(false);
    const fileRef = useRef(null);
    const sums = bill ? billSums(bill, site, mk) : null, money = bill ? billMoney(bill, site, mk) : null;
    const curPlan = bill ? ((bill.plan || {})[mk] || {}) : {};
    useEffect(()=>{ setPlan(null); }, [mk]);

    function onFile(e){
      const f = e.target.files && e.target.files[0]; e.target.value = "";
      if(!f) return;
      f.arrayBuffer().then(b => xlsxRows(b, true)).then(sheets => {
        setImp({ sheets, i: billPickSheet(sheets), file: f.name.replace(/\.xlsx$/i, "") });
      }).catch(()=> notify("לא הצלחתי לקרוא את הקובץ. צריך קובץ אקסל (xlsx)"));
    }
    const impRes = imp ? billParse(imp.sheets[imp.i].rows) : null;
    function saveImport(){
      if(!impRes || impRes.err) return;
      setBusy(true);
      // שיוך שהמשרד תיקן ידנית בחשבון הקודם נשמר לפי מספר הסעיף
      const oldT = {};
      ((bill && bill.items) || []).forEach(i => { if(i.tFix) oldT[i.c] = i.t; });
      const items = impRes.items.map(i => i.c in oldT ? { ...i, t: oldT[i.c], tFix: true } : i);
      billWrite(site.id, { name: impRes.title || imp.sheets[imp.i].name || imp.file, sheet: imp.sheets[imp.i].name, file: imp.file, at: Date.now(), by: who, items })
        .then(()=>{ setImp(null); notify("החשבון נשמר · " + items.length + " סעיפים"); })
        .catch(e => notify("שמירה נכשלה: " + (e.code || e.message))).finally(()=> setBusy(false));
    }
    function setTrack(c, t){
      const items = bill.items.map(i => i.c === c ? { ...i, t, tFix: true } : i);
      billWrite(site.id, { items }).catch(e => notify("שמירה נכשלה: " + (e.code || e.message)));
    }
    function savePlan(){
      const out = {};
      Object.entries(plan).forEach(([c, v]) => { const n = r2(Number(v)); if(v !== "" && n > 0) out[c] = n; });
      setBusy(true);
      billWrite(site.id, { plan: { [mk]: out }, planAt: Date.now(), planBy: who }, mk)
        .then(()=>{ setPlan(null); notify("יעד " + mLabel(mk) + " נשמר"); })
        .catch(e => notify("שמירה נכשלה: " + (e.code || e.message))).finally(()=> setBusy(false));
    }
    function exportDraft(){
      const tl = k => (TRACKS.find(t => t.k === k) || BILL_OTHER).label;
      let tot = 0;
      const rows = [["מספר סעיף", "תאור הסעיף", "יחידת מידה", "כמות", "מחיר ליח׳", "כמות קודמת", "כמות נוכחית", "כמות מצטברת", "אחוז ביצוע", "סה״כ מצטבר", "יעד החודש", "מסלול בדוח השבועי"]];
      let ch = null;
      bill.items.forEach(i => {
        if(i.ch !== ch){ ch = i.ch; if(ch) rows.push(["", ch]); }
        const prev = sums.before[i.c], cur = sums.month[i.c], cum = r2(prev + cur), sum = Math.round(cum * (i.p || 0));
        tot += sum;
        rows.push([i.c.startsWith("+") ? "" : i.c.replace(/#\d+$/, ""), i.d, i.u, i.q, i.p || "", prev, cur || "", cum, i.q ? Math.round(cum / i.q * 100) + "%" : "", sum, curPlan[i.c] || "", tl(i.t)]);
      });
      rows.push([], ["", "סה״כ מצטבר (לפני קיזוזים, עכבון והתייקרות)", "", "", "", "", "", "", "", tot]);
      rows.push([], ["אתר: " + site.name + " · " + mLabel(mk)], ["בסיס: " + (bill.name || "") + " (נטען " + dmy(bill.at) + ")"],
        ["כמות נוכחית = סכום הכמויות בדוחות השבועיים של " + mLabel(mk) + " (לפי יום א׳ של השבוע) · טיוטה לבדיקה לפני הגשה"]);
      const notes = [["שבוע", "מסלול", "מה בוצע (מלל המנהל)"], ...sums.notes.map(n => [dmy(new Date(n.week).getTime()), tl(n.k === "other" ? "" : n.k), n.t])];
      saveFile(xlsxBlob([{ name:"טיוטת חשבון", rows, widths:[16, 44, 8, 8, 10, 10, 10, 10, 9, 12, 9, 14] },
        { name:"מלל מהדוחות", rows: notes, widths:[10, 14, 70] }]), "טיוטת חשבון - " + site.name + " - " + mLabel(mk) + ".xlsx");
    }

    const groups = [...TRACKS, BILL_OTHER];
    return html`
      <div class="screen narrow">
        <div class="shead">
          <button class="back" onClick=${onBack} aria-label="חזרה">→</button>
          <div><h2 style=${{fontSize:"1.2rem"}}>חשבון ביצוע · ${site.name}</h2><span class="sub">${bill ? (bill.name || "חשבון") + " · נטען " + dmy(bill.at) + (bill.by ? " · " + bill.by : "") : "יעד חודשי, תקציב חומר וטיוטת חשבון"}</span></div>
        </div>

        ${office && html`
          <div class="card" style=${{marginTop:12}}>
            <input ref=${fileRef} type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden onChange=${onFile} />
            ${!imp ? html`
              <div class="rowbet"><span class="prevv">${bill ? "חשבון חדש בסוף החודש מחליף את הבסיס (הכמויות המצטברות)" : "מעלים את קובץ החשבון של האתר (אקסל)"}</span>
                <button class="btn" onClick=${()=>fileRef.current && fileRef.current.click()}>📥 ${bill ? "העלה חשבון חדש" : "העלה חשבון"}</button></div>`
            : html`
              <div class="lbl">טעינת חשבון · ${imp.file}</div>
              ${imp.sheets.length > 1 && html`<select class="pick" value=${imp.i} onChange=${e => setImp({ ...imp, i: +e.target.value })}>
                ${imp.sheets.map((s, j) => html`<option key=${j} value=${j}>${s.name || "גיליון " + (j + 1)}</option>`)}</select>`}
              ${impRes.err ? html`<div class="alert warn"><span class="b"></span>${impRes.err}</div>`
                : html`<div class="prevv" style=${{margin:"8px 0"}}>${impRes.title || ""} · ${impRes.items.length} סעיפים ·
                    ${groups.map(g => g.label + " " + impRes.items.filter(i => (i.t || "") === g.k).length).join(" · ")}</div>`}
              <div class="btnrow">
                <button class="btn" onClick=${()=>setImp(null)}>ביטול</button>
                <button class="btn pri" disabled=${busy || !!impRes.err} onClick=${saveImport}>שמור חשבון לאתר</button>
              </div>
              <div class="hint">הכמות המצטברת בגיליון הופכת לבסיס. מכאן והלאה מצטברות עליה הכמויות מהדוחות השבועיים.</div>`}
          </div>`}

        ${bill === undefined ? html`<div class="empty">טוען…</div>`
          : !bill ? html`<div class="empty">${office ? "עוד לא הועלה חשבון לאתר הזה" : "המשרד עוד לא העלה חשבון לאתר הזה"}</div>`
          : html`
          <div class="card" style=${{marginTop:12}}>
            <div class="rowbet" style=${{marginBottom:8}}>
              <select class="pick" style=${{margin:0, flex:1}} value=${mk} onChange=${e => setMk(e.target.value)}>
                ${months.map(m => html`<option key=${m} value=${m}>${mLabel(m)}</option>`)}
              </select>
            </div>
            <div class="bmoney">
              <div><b>${money.hasPlan ? nisR(money.target) : "—"}</b><span>יעד החודש (הכנסה צפויה)</span></div>
              <div><b>${money.hasPlan ? nisR(money.budget) : "—"}</b><span>תקציב חומר · ${CFG.matPct}%</span></div>
              <div><b>${nisR(money.actual)}</b><span>בוצע לפי הדוחות${money.target ? " · " + Math.round(money.actual / money.target * 100) + "%" : ""}</span></div>
            </div>
            ${!money.hasPlan && html`<div class="prevv" style=${{marginTop:8}}>${office ? "קבע יעד כמויות לחודש בסעיפים למטה — ממנו נגזרים ההכנסה הצפויה ותקציב החומר." : "המשרד עוד לא קבע יעד כמויות לחודש הזה."}</div>`}
            <div class="btnrow" style=${{marginTop:10}}>
              ${office && !plan && html`<button class="btn" onClick=${()=>{ const p = {}; bill.items.forEach(i => { if(curPlan[i.c]) p[i.c] = String(curPlan[i.c]); }); setPlan(p); }}>🎯 ${money.hasPlan ? "ערוך יעד" : "קבע יעד"} ל${mLabel(mk)}</button>`}
              ${office && plan && html`<button class="btn" onClick=${()=>setPlan(null)}>ביטול</button><button class="btn pri" disabled=${busy} onClick=${savePlan}>שמור יעד</button>`}
              <button class="btn" onClick=${exportDraft}>📤 טיוטת חשבון ${mLabel(mk)}</button>
            </div>
          </div>

          ${groups.map(g => {
            const its = bill.items.filter(i => (i.t || "") === g.k);
            if(!its.length) return null;
            return html`
              <div class="card trk" key=${g.k || "other"}>
                <b>${g.label}</b>
                <div class="bitems">
                  ${its.map(i => {
                    const done = sums.done[i.c], left = r2(i.q - done);
                    return html`
                      <div class="bit" key=${i.c}>
                        <div class="bd">${i.d}
                          <small>${fmtQ(done)}/${fmtQ(i.q)} ${unitTxt(i.u)}${left > 0 ? " · נשאר " + fmtQ(left) : " · הושלם"}${sums.month[i.c] ? " · החודש " + fmtQ(sums.month[i.c]) : ""}${!plan && curPlan[i.c] ? " · יעד " + fmtQ(curPlan[i.c]) : ""}${i.p ? " · " + nisR(i.p) + (i.u === "%" ? " לכל 1%" : " ליח׳") : ""}</small>
                        </div>
                        ${office && plan ? html`<input type="number" inputMode="decimal" min="0" step="any" value=${plan[i.c] || ""} placeholder="יעד"
                            aria-label=${"יעד החודש · " + i.d} onInput=${e => setPlan({ ...plan, [i.c]: e.target.value })} />`
                          : office ? html`<select value=${i.t || ""} aria-label="מסלול" onChange=${e => setTrack(i.c, e.target.value)}>
                            ${groups.map(x => html`<option key=${x.k} value=${x.k}>${x.k ? (x.short || x.label) : "כללי"}</option>`)}</select>` : null}
                      </div>`;
                  })}
                </div>
              </div>`;
          })}
          <div class="hint">${office ? "החשבון והמחירים גלויים רק למשרד, לצופה ולמנהלי האתר הזה. כל מנהל רואה רק את החשבון של האתרים שלו." : "החשבון של האתר הזה גלוי רק לך ולמשרד."} הכמויות נכנסות מהדוח השבועי (שטח ← דוח שבועי).</div>`}
      </div>`;
  }

  /* הטופס השבועי — אותן עמודות כמו הטופס על הנייר */
  function WeeklyForm({ site, now, onSubmit, onBack }){
    const cur = curWeekly(site, now);
    const hist = weekHistory(site, now), prev = hist.length ? hist[hist.length - 1] : null;
    const old = site.weekly && !cur ? site.weekly : null;   // דוח קודם: חריגים פתוחים עוברים הלאה
    const [d, setD] = useState(()=>{
      const tracks = {};
      TRACKS.forEach(t => {
        const v = cur && cur.tracks ? cur.tracks[t.k] : null, p = prev ? pctOf(prev, t.k) : null;
        tracks[t.k] = cur ? (v ? { pct: v.pct, goal: v.goal == null ? null : v.goal } : null) : (p != null && p < 100 ? { pct: p, goal: null } : null);
      });
      const base = cur || site.weekly || {};
      const openNote = old && old.issue && !old.issueResolvedAt && hasText(old.note);
      const openSafety = old && hasText(old.safety) && !old.safetyResolvedAt;
      const bq = {};
      Object.entries((cur && cur.bq) || {}).forEach(([c, q]) => { bq[c] = String(q); });
      return {
        txt: { ...((cur && cur.txt) || {}) }, bq,
        tracks, foreman: base.foreman || "", lead: base.lead || "",
        workers: cur ? (cur.workers == null ? "" : String(cur.workers)) : (prev && prev.workers != null ? String(prev.workers) : ""),
        note: cur ? (cur.note || "") : (openNote ? old.note : ""), issue: cur ? !!cur.issue : !!openNote,
        safety: cur ? (cur.safety || "") : (openSafety ? old.safety : "")
      };
    });
    const set = patch => setD(x => ({ ...x, ...patch }));
    const setTrack = (k, v) => setD(x => ({ ...x, tracks: { ...x.tracks, [k]: v } }));
    const wOk = d.workers !== "" && !isNaN(Number(d.workers));
    const goals = [];
    for(let g = 5; g <= 100; g += 5) goals.push(g);
    // סעיפי החשבון: מה בוצע עד השבוע הזה (בלי הדוח הנוכחי), ויעד החודש של המשרד
    const bill = useBill(site.id), wk = weekKey(now);
    const sums = bill ? billSums(bill, site, null, wk) : null;
    const plan = bill ? ((bill.plan || {})[monthKey(now)] || {}) : {};
    const setTxt = (k, v) => setD(x => ({ ...x, txt: { ...x.txt, [k || "other"]: v } }));
    const setBq = (c, v) => setD(x => ({ ...x, bq: { ...x.bq, [c]: v } }));
    const bqBad = Object.values(d.bq).some(v => v !== "" && (isNaN(Number(v)) || Number(v) < 0));
    function itemsOf(k){
      if(!bill) return [];
      return (bill.items || []).filter(i => (i.t || "") === k && (sums.done[i.c] < i.q || d.bq[i.c]));
    }
    function billBlock(k){
      const its = itemsOf(k), tk = k || "other";
      return html`
        <label class="prevv" style=${{display:"block"}}>מה בוצע השבוע (מלל חופשי)
          <textarea class="wtxt" rows="2" value=${d.txt[tk] || ""} onInput=${e => setTxt(k, e.target.value)} maxLength=${300}
            placeholder=${k === "skeleton" ? "למשל: יציקה קומות 27–28" : k === "complets" ? "למשל: קולטנים ומים בקומה 28, 6 דירות" : "מה בוצע, איפה, ומה נשאר פתוח"}></textarea>
        </label>
        ${its.length ? html`
          <div class="bitems">
            ${its.map(i => {
              const v = d.bq[i.c] || "", tot = r2(sums.done[i.c] + (Number(v) || 0));
              return html`
                <div class=${"bit" + (tot > i.q ? " over" : "")} key=${i.c}>
                  <div class="bd">${i.d}
                    <small>בוצע ${fmtQ(sums.done[i.c])} מתוך ${fmtQ(i.q)} ${unitTxt(i.u)}${plan[i.c] ? " · יעד החודש " + fmtQ(plan[i.c]) : ""}${tot > i.q ? " · חורג מהחוזה" : ""}</small>
                  </div>
                  <input type="number" inputMode="decimal" min="0" step="any" value=${v} placeholder="השבוע"
                    aria-label=${"כמות השבוע · " + i.d} onInput=${e => setBq(i.c, e.target.value)} />
                </div>`;
            })}
          </div>` : null}`;
    }

    function submit(e){
      e.preventDefault();
      if(!wOk || bqBad) return;
      const txt = {}, bq = {};
      Object.entries(d.txt).forEach(([k, v]) => { if(hasText(v)) txt[k] = v.trim(); });
      Object.entries(d.bq).forEach(([c, v]) => { const n = r2(Number(v)); if(v !== "" && n > 0) bq[c] = n; });
      onSubmit(site.id, {
        txt: Object.keys(txt).length ? txt : null, bq: Object.keys(bq).length ? bq : null,
        tracks: d.tracks, workers: Math.max(0, Math.round(Number(d.workers))),
        foreman: d.foreman.trim(), lead: d.lead.trim(),
        note: d.note.trim(), issue: d.issue && hasText(d.note), safety: d.safety.trim()
      });
    }

    return html`
      <form class="screen narrow" onSubmit=${submit}>
        <div class="shead">
          <button type="button" class="back" onClick=${onBack} aria-label="חזרה">→</button>
          <div><h2 style=${{fontSize:"1.25rem"}}>דוח שבועי · ${site.name}</h2><span class="sub">${site.contractor} · שבוע ${weekLabel(now)} · מנהל פרויקט: ${site.owner.name}</span></div>
        </div>

        ${TRACKS.map(t => {
          const v = d.tracks[t.k], p = prev ? pctOf(prev, t.k) : null;
          return html`
            <div class=${"card trk "+(v ? "" : "off")} key=${t.k}>
              <div class="rowbet">
                <b>${t.label}</b>
                <label class="tgl"><input type="checkbox" checked=${!!v} onChange=${e => setTrack(t.k, e.target.checked ? { pct: p != null ? p : 0, goal: null } : null)} /> רלוונטי</label>
              </div>
              ${v ? html`
                <div class="prow">
                  <input type="range" class="rng" min="0" max="100" step="5" value=${v.pct} onInput=${e => setTrack(t.k, { ...v, pct: Number(e.target.value) })} aria-label=${t.label + " אחוז ביצוע"} />
                  <b class="pv">${v.pct}%</b>
                </div>
                <div class="grow">
                  <span>יעד לסוף השבוע</span>
                  <select value=${v.goal == null ? "" : v.goal} onChange=${e => setTrack(t.k, { ...v, goal: e.target.value === "" ? null : Number(e.target.value) })}>
                    <option value="">ללא יעד</option>
                    ${goals.map(g => html`<option key=${g} value=${g}>${g}%</option>`)}
                  </select>
                  ${p != null ? html`<span class="prevv">שבוע שעבר: ${p}%</span>` : null}
                </div>
                ${billBlock(t.k)}` : html`<div class="prevv">לא רלוונטי באתר הזה</div>`}
            </div>`;
        })}

        ${bill && itemsOf("").length ? html`
          <div class="card trk">
            <b>${BILL_OTHER.label}</b>
            ${billBlock("")}
          </div>` : null}
        ${bill === null ? html`<div class="hint">לאתר הזה עוד לא הועלה חשבון ביצוע, ולכן אין כאן סעיפים לכמויות. המלל החופשי בכל מסלול נשמר בכל מקרה.</div>` : null}

        <div class="card fl">
          <label>כ״א בשטח השבוע (מס׳ עובדים)
            <input type="number" inputMode="numeric" min="0" value=${d.workers} onInput=${e => set({ workers: e.target.value })} placeholder="0" required />
          </label>
          <label>מנהל עבודה
            <input type="text" value=${d.foreman} onInput=${e => set({ foreman: e.target.value })} maxLength=${40} />
          </label>
          <label>ראש צוות (במידה ויש)
            <input type="text" value=${d.lead} onInput=${e => set({ lead: e.target.value })} maxLength=${40} />
          </label>
        </div>

        <div class="card fl">
          <label>הערות / חריגים
            <textarea rows="3" value=${d.note} onInput=${e => set({ note: e.target.value })} maxLength=${300} placeholder="מה עוצר או מעכב? מה צריך מההנהלה?"></textarea>
          </label>
          <label class="tgl" style=${{opacity: hasText(d.note) ? 1 : .5}}><input type="checkbox" disabled=${!hasText(d.note)} checked=${d.issue && hasText(d.note)} onChange=${e => set({ issue: e.target.checked })} /> זה חריג שדורש טיפול (יופיע במרכז הבקרה עד שיסומן "טופל")</label>
          <label>נקודות בטיחות / חריגים בטיחותיים
            <textarea rows="2" value=${d.safety} onInput=${e => set({ safety: e.target.value })} maxLength=${300} placeholder="השאר ריק אם אין"></textarea>
          </label>
        </div>

        <button type="submit" class="btn pri wide" disabled=${!wOk || bqBad}>${cur ? "עדכן דוח שבועי" : "הגש דוח שבועי"}</button>
        <div class="hint">הדוח נרשם ביומן הפעולות ועולה למרכז הבקרה. נקודת בטיחות מסומנת אדומה ועולה מיד לדרג 2.</div>
      </form>`;
  }

  function Report({ site, unit, photoMap, onBack, onToggle, onAddTask, onRemoveTask, onAddPhoto, onRemovePhoto, notify }){
    const [newTask, setNewTask] = useState("");
    const [busy, setBusy] = useState(false);
    const [view, setView] = useState(null);
    const fileRef = useRef(null);
    const locked = false;
    const cl = unit.checklist;
    const photos = Array.isArray(unit.photos) ? unit.photos : [];
    const nPhotos = photos.length;
    const urlOf = p => p.url || (photoMap || {})[p.id] || "";
    const allDone = cl.length > 0 && cl.every(c=>c.done);

    function submitTask(e){
      e.preventDefault();
      const v = newTask.trim();
      if(!v || locked) return;
      onAddTask(site.id, unit.id, v);
      setNewTask("");
    }

    async function onPick(e){
      const files = Array.from(e.target.files || []);
      e.target.value = "";
      if(!files.length) return;
      setBusy(true);
      let added = 0;
      for(const f of files){
        try{
          const url = await fileToScaledDataURL(f, 1024, 0.6);
          onAddPhoto(site.id, unit.id, url);
          added++;
        }catch(err){
          notify("תמונה אחת לא נקלטה — נסה שוב");
        }
      }
      setBusy(false);
      if(added) notify(added === 1 ? "תמונה נוספה" : added + " תמונות נוספו");
    }

    return html`
      <div class="screen narrow">
        <div class="shead">
          <button class="back" onClick=${onBack} aria-label="חזרה">→</button>
          <div class="rowbet" style=${{flex:1}}>
            <div><h2 style=${{fontSize:"1.15rem"}}>${unit.title}</h2><span class="sub">${site.name} · ${unit.floor}</span></div>
          </div>
        </div>

        <div class="card" style=${{marginTop:14}}>
          <div class="lbl">צ׳קליסט · ${cl.filter(c=>c.done).length}/${cl.length}</div>
          <div class="check">
            ${cl.map((c,i)=> html`
              <div class="citem" key=${i}>
                <button class=${"ctoggle "+(c.done?"on":"")} disabled=${locked} onClick=${()=>onToggle(site.id, unit.id, i)}>
                  <span class="bx">${c.done ? "✓" : ""}</span>${c.t}
                </button>
                ${!locked && html`<button class="xbtn" title="הסר סעיף" onClick=${()=>onRemoveTask(site.id, unit.id, i)}>✕</button>`}
              </div>`)}
            ${cl.length===0 && html`<div style=${{fontFamily:"Heebo,sans-serif", fontSize:".82rem", color:"var(--ink-3)", padding:"6px 2px"}}>אין עדיין סעיפים — הוסף למטה</div>`}
          </div>
          ${!locked && html`
            <form class="addrow" onSubmit=${submitTask}>
              <input type="text" value=${newTask} onInput=${e=>setNewTask(e.target.value)} placeholder="הוסף סעיף לצ׳קליסט…" maxLength=${80} />
              <button type="submit" class="add" disabled=${!newTask.trim()} aria-label="הוסף">＋</button>
            </form>`}
        </div>

        <div class="card">
          <div class="lbl">תיעוד מצולם · ${nPhotos}</div>
          <input ref=${fileRef} type="file" accept="image/*" multiple hidden onChange=${onPick} />
          <button class="camera" disabled=${locked || busy} onClick=${()=>fileRef.current && fileRef.current.click()}>
            ${busy ? "מעבד תמונה…" : "📷 צלם או בחר תמונה"}
          </button>
          <div class="thumbs">
            ${photos.map(p => html`
              <button key=${p.id} class="thumb" onClick=${()=>{ if(urlOf(p)) setView(urlOf(p)); }}>
                ${urlOf(p) ? html`<img src=${urlOf(p)} alt="תמונת דיווח" />` : html`<span class="ph">טוען…</span>`}
                ${!locked && html`<span class="del" role="button" title="מחק" onClick=${(e)=>{ e.stopPropagation(); onRemovePhoto(site.id, unit.id, p.id); }}>✕</span>`}
              </button>`)}
            ${nPhotos===0 && html`<span style=${{fontFamily:"Heebo,sans-serif", fontSize:".78rem", color:"var(--ink-3)"}}>טרם צורפו תמונות</span>`}
          </div>
        </div>

        <button class="btn pri wide" disabled=${nPhotos===0} onClick=${()=>{ notify(allDone ? "הדיווח נשמר · המשימה הושלמה" : "הדיווח נשמר"); onBack(); }}>
          ${nPhotos===0 ? "צרף תמונה כדי לשמור" : allDone ? "שמור וסיים משימה" : "שמור דיווח"}
        </button>

        ${view && html`
          <div class="lightbox" onClick=${()=>setView(null)}>
            <button class="x" aria-label="סגור">✕</button>
            <img src=${view} alt="תמונת דיווח מוגדלת" onClick=${(e)=>e.stopPropagation()} />
          </div>`}
      </div>`;
  }

  /* מלאי באתר — מנהל הפרויקט מזין, ההנהלה רואה בלשונית "מלאי" במרכז הבקרה */
  function QtyCell({ value, onCommit }){
    const [v, setV] = useState(String(value));
    useEffect(()=>{ setV(String(value)); }, [value]);
    const commit = x => { const n = Number(x); if(x !== "" && !isNaN(n) && n >= 0 && n !== value) onCommit(n); else setV(String(value)); };
    return html`
      <div class="qty">
        <button type="button" aria-label="הוסף" onClick=${()=>onCommit(value + 1)}>＋</button>
        <input type="number" inputMode="decimal" min="0" value=${v} onInput=${e=>setV(e.target.value)} onBlur=${e=>commit(e.target.value)}
          onKeyDown=${e=>{ if(e.key === "Enter") e.target.blur(); }} aria-label="כמות במלאי" />
        <button type="button" aria-label="הפחת" onClick=${()=>value > 0 && onCommit(value - 1)}>−</button>
      </div>`;
  }

  function StockForm({ init, onSave, onCancel, onDelete }){
    const [f, setF] = useState(init || { item:"", onSite:"", unit:"יח׳", need:"", blocksTomorrow:false });
    const ok = f.item.trim() && f.onSite !== "" && !isNaN(Number(f.onSite));
    function submit(e){
      e.preventDefault(); if(!ok) return;
      onSave({ item: f.item.trim(), onSite: Number(f.onSite), unit: (f.unit || "יח׳").trim(), need: f.need === "" ? 0 : Number(f.need), blocksTomorrow: !!f.blocksTomorrow });
    }
    return html`
      <form class="newunit" onSubmit=${submit}>
        <input type="text" list="rakesh-items" placeholder="שם הפריט — עדיף מהקטלוג של הרכש" value=${f.item} onInput=${e=>setF({...f, item:e.target.value})} maxLength=${50} />
        <datalist id="rakesh-items">${RAKESH_ITEMS.map(n => html`<option key=${n} value=${n} />`)}</datalist>
        <div class="two">
          <input type="number" inputMode="decimal" min="0" placeholder="כמות במלאי" value=${f.onSite} onInput=${e=>setF({...f, onSite:e.target.value})} />
          <input type="text" list="units" placeholder="יחידה" value=${f.unit} onInput=${e=>setF({...f, unit:e.target.value})} maxLength=${12} />
        </div>
        <datalist id="units">${["יח׳","מ׳","ק״ג","גליל","קופסה","שק","צרור","מ״ר"].map(u => html`<option key=${u} value=${u}></option>`)}</datalist>
        <input type="number" inputMode="decimal" min="0" placeholder="מינימום נדרש באתר (אופציונלי) — מתחתיו נפתח חריג" value=${f.need} onInput=${e=>setF({...f, need:e.target.value})} />
        <label class="tgl"><input type="checkbox" checked=${!!f.blocksTomorrow} onChange=${e=>setF({...f, blocksTomorrow:e.target.checked})} /> חוסר בפריט הזה עוצר עבודה (חריג אדום)</label>
        <div class="btnrow">
          ${onDelete ? html`<button type="button" class="btn danger" onClick=${onDelete}>מחק פריט</button>` : null}
          <button type="button" class="btn" onClick=${onCancel}>ביטול</button>
          <button type="submit" class="btn pri" disabled=${!ok}>${init ? "שמור" : "הוסף"}</button>
        </div>
      </form>`;
  }

  function UseForm({ m, onSave, onCancel }){
    const [q, setQ] = useState(""), [kind, setKind] = useState("use"), [note, setNote] = useState("");
    const n = Number(q), have = Number(m.onSite) || 0;
    const ok = q !== "" && !isNaN(n) && n > 0 && n <= have;
    return html`
      <form class="newunit" onSubmit=${e=>{ e.preventDefault(); if(ok) onSave(n, kind, note.trim()); }}>
        <div class="sitenm">🔧 ${m.item}<span class="usehave"> · במלאי ${have} ${m.unit}</span></div>
        <div class="chips" style=${{margin:0}}>
          ${["use","waste"].map(k => html`<button type="button" key=${k} class=${"chip "+(kind===k?"on":"")} onClick=${()=>setKind(k)}>${USE_KIND[k]}</button>`)}
        </div>
        <input type="number" inputMode="decimal" min="0" step="any" placeholder=${"כמה " + m.unit + (kind === "waste" ? " נפגמו / אבדו" : " נוצלו")} value=${q} onInput=${e=>setQ(e.target.value)} autoFocus />
        ${n > have && html`<div class="usewarn">יותר ממה שרשום במלאי (${have} ${m.unit}). אם הספירה לא נכונה — סגור, תקן את הכמות במלאי ואז רשום.</div>`}
        <input type="text" maxLength=${60} placeholder=${kind === "waste" ? "מה קרה? (נשבר, נגנב, פג תוקף…)" : "איפה? (קומה 3, דירה 12…) — לא חובה"} value=${note} onInput=${e=>setNote(e.target.value)} />
        <div class="btnrow">
          <button type="button" class="btn" onClick=${onCancel}>ביטול</button>
          <button type="submit" class="btn pri" disabled=${!ok}>רשום והורד מהמלאי</button>
        </div>
      </form>`;
  }

  function UsageCard({ site, now }){
    const since = now - 30 * DAY;
    const list = (site.usage || []).filter(u => u.at >= since);
    if(!list.length) return null;
    const r3 = x => Math.round(x * 1000) / 1000;
    const by = {};
    list.forEach(u => { const x = by[u.item] = by[u.item] || { use:0, waste:0, count:0, unit:u.unit }; x[u.kind] = r3((x[u.kind] || 0) + u.q); });
    const items = Object.keys(by).sort((a, b) => (by[b].use + by[b].waste + by[b].count) - (by[a].use + by[a].waste + by[a].count));
    return html`
      <div class="card" style=${{marginTop:12}}>
        <div class="lbl">📉 צריכת חומר · 30 יום אחרונים</div>
        ${items.map(it => { const x = by[it]; return html`
          <div key=${it} class="rkord"><b>${it}</b>
            <div>${[x.use && "שימוש " + x.use, x.waste && "פחת " + x.waste, x.count && html`<span class="usecount">ירידה בספירה ${x.count}</span>`].filter(Boolean).map((p, i) => html`${i ? " · " : ""}${p}`)} ${x.unit}</div>
          </div>`; })}
        <details class="usehist">
          <summary class="linkbtn">כל הרישומים (${list.length})</summary>
          ${list.slice(0, 60).map(u => html`<div key=${u.id} class="rkord">
            ${dmy(u.at)} ${hhmm(u.at)} · ${u.by} · <b>${USE_KIND[u.kind] || u.kind}</b>
            <div>${u.item} · ${u.q} ${u.unit}${u.note ? " · " + u.note : ""}</div>
          </div>`)}
        </details>
        <div class="hint" style=${{textAlign:"start", marginTop:6}}>"ירידה בספירה" = הכמות ירדה בעדכון ידני (− או הקלדה) בלי רישום שימוש. כמות גדולה כאן — כדאי לברר לאן החומר הלך.</div>
      </div>`;
  }

  function StockEditor({ st, now, who, rk, onSave, onDelete, onConfirm, onUse, onOrder }){
    const actives = st.sites.filter(s => s.active);
    const mine = actives.filter(s => s.owner && s.owner.name === who);
    const [all, setAll] = useState(false);
    const list = (all || mine.length === 0) ? actives : mine;
    const [sid, setSid] = useState(null);
    const [adding, setAdding] = useState(false);
    const [editing, setEditing] = useState(null);
    const [using, setUsing] = useState(null);
    const site = list.find(s => s.id === sid) || list[0];
    if(!site) return html`<div class="empty">אין אתרים פעילים</div>`;
    const info = stockInfo(site, st, now);
    const mats = site.materials || [];
    // רכש: מה בדרך, כמה עוד צריך להזמין, וקישור שפותח סל מוכן באפליקציית הרכש
    const open = (rk || {})[site.id] || [];
    const toOrder = m => Math.max(0, (Number(m.need) || 0) - (Number(m.onSite) || 0) - rkOnOrder(rk, site.id, m.item).q);
    const short = mats.filter(m => toOrder(m) > 0);
    const pid = RAKESH_PID[site.num];
    const canOrder = !!(RAKESH_APP && pid);
    const orderLink = items => RAKESH_APP + "#order=" + encodeURIComponent(JSON.stringify({ p:pid, items }));

    return html`
      <div>
        ${mine.length > 0 && html`<div class="chips" style=${{margin:"0 0 10px"}}>
          <button class=${"chip "+(!all?"on":"")} onClick=${()=>setAll(false)}>האתרים שלי (${mine.length})</button>
          <button class=${"chip "+(all?"on":"")} onClick=${()=>setAll(true)}>כל האתרים</button>
        </div>`}
        <select class="pick" value=${site.id} onChange=${e=>{ setSid(e.target.value); setAdding(false); setEditing(null); setUsing(null); }}>
          ${list.map(s => html`<option key=${s.id} value=${s.id}>${s.name} · ${s.contractor}${s.owner ? " · " + s.owner.name : ""}</option>`)}
        </select>

        <div class="card ci" style=${{marginBottom:12}}>
          <div class="lbl">מלאי באתר · ${site.name}</div>
          <div class=${"val "+(info.fresh ? "" : "crit")} style=${{fontSize:".88rem"}}>
            ${info.last ? (info.fresh ? "✓ עודכן " : "לא עודכן · ") + ageText(now - info.last) + " · " + dmy(info.last) + " " + hhmm(info.last) + (info.by ? " · " + info.by : "") : "טרם עודכן ע״י מנהל הפרויקט — הכמויות למטה הן הדגמה"}
          </div>
          <div class="btnrow" style=${{marginTop:10}}>
            <button class="btn ok" onClick=${()=>onConfirm(site.id)}>✓ המלאי מעודכן להיום</button>
          </div>
        </div>
        ${open.length > 0 && html`<div class="card" style=${{marginBottom:12}}>
          <div class="lbl">🚚 הזמנות בדרך לאתר (${open.length})</div>
          ${open.map(o => html`<div key=${o.id} class="rkord"><b>${o.supplier || "ספק"}</b> · ${RK_STAGE[o.stage] || ""} · ${dmy(o.created)}<div>${o.items.map(it => it.n + " × " + it.q).join(" · ")}</div></div>`)}
          <div class="hint" style=${{textAlign:"start", marginTop:6}}>כשהסחורה מגיעה — מסמנים "קבלה" באפליקציית הרכש, והמלאי כאן מתעדכן לבד.</div>
        </div>`}
        ${canOrder && short.length > 1 && (onOrder
          ? html`<button type="button" class="btn pri wide rkbtn" style=${{marginBottom:12}} onClick=${()=>onOrder(short.map(m => ({ n:m.item, q:toOrder(m), u:m.unit })), pid)}>🛒 להזמין את כל החוסרים (${short.length})</button>`
          : html`<a class="btn pri wide rkbtn" style=${{marginBottom:12}} href=${orderLink(short.map(m => ({ n:m.item, q:toOrder(m), u:m.unit })))} target="_blank" rel="noopener">🛒 להזמין את כל החוסרים (${short.length}) ברכש</a>`)}
        ${canOrder && onOrder && html`<button type="button" class="btn wide rkbtn" style=${{marginBottom:12}} onClick=${()=>onOrder([], pid)}>🛒 הזמנה חדשה לאתר ${site.name}</button>`}

        <div style=${{display:"flex", flexDirection:"column", gap:9}}>
          ${mats.map(m => editing === m.item
            ? html`<${StockForm} key=${m.item} init=${{ item:m.item, onSite:String(m.onSite), unit:m.unit, need: m.need ? String(m.need) : "", blocksTomorrow:!!m.blocksTomorrow }}
                onSave=${p => { onSave(site.id, m.item, p); setEditing(null); }} onCancel=${()=>setEditing(null)}
                onDelete=${()=>{ onDelete(site.id, m.item); setEditing(null); }} />`
            : using === m.item
            ? html`<${UseForm} key=${m.item} m=${m} onCancel=${()=>setUsing(null)}
                onSave=${(q, kind, note) => { onUse(site.id, m.item, q, kind, note); setUsing(null); }} />`
            : html`
              <div key=${m.item} class=${"req stkrow "+(m.onSite < m.need ? "blocked" : "")}>
                <div class="top">
                  <div style=${{minWidth:0}}>
                    <div class="sitenm">${m.item}</div>
                    <div style=${{fontFamily:"Heebo,sans-serif", fontSize:".72rem", color: m.onSite < m.need ? "var(--crit)" : "var(--ink-3)"}}>
                      ${m.onSite < m.need ? "חוסר " + (m.need - m.onSite) + " " + m.unit + " · " : ""}${m.need ? "מינימום " + m.need + " " + m.unit : "ללא מינימום"}${m.at ? "" : " · לא נספר"}
                    </div>
                  </div>
                  <button type="button" class="xbtn" style=${{width:34, height:34}} aria-label="ערוך פריט" onClick=${()=>{ setEditing(m.item); setAdding(false); setUsing(null); }}>✎</button>
                </div>
                <div class="rowbet">
                  <${QtyCell} value=${m.onSite} onCommit=${n => onSave(site.id, m.item, { onSite:n })} />
                  <span class="unit">${m.unit}</span>
                </div>
                ${m.onSite > 0 && html`<button type="button" class="btn usebtn" onClick=${()=>{ setUsing(m.item); setEditing(null); setAdding(false); }}>🔧 שימוש בחומר</button>`}
                ${(()=>{ const oo = rkOnOrder(rk, site.id, m.item), q = toOrder(m); return html`
                  ${oo.q > 0 && html`<div class="rkline">🚚 בדרך: ${oo.q} ${m.unit}${oo.sup.length ? " · " + oo.sup.join(", ") : ""}</div>`}
                  ${canOrder && q > 0 && (onOrder
                    ? html`<button type="button" class="btn rkbtn" onClick=${()=>onOrder([{ n:m.item, q, u:m.unit }], pid)}>🛒 להזמין ${q} ${m.unit}</button>`
                    : html`<a class="btn rkbtn" href=${orderLink([{ n:m.item, q, u:m.unit }])} target="_blank" rel="noopener">🛒 להזמין ${q} ${m.unit} ברכש</a>`)}`; })()}
              </div>`)}
          ${mats.length === 0 && !adding && html`<div class="empty" style=${{padding:"22px 0"}}>עדיין לא הוזן מלאי באתר הזה</div>`}
          ${adding
            ? html`<${StockForm} onSave=${p => { onSave(site.id, null, p); setAdding(false); }} onCancel=${()=>setAdding(false)} />`
            : html`<button class="addsection" onClick=${()=>{ setAdding(true); setEditing(null); }}>＋ הוסף פריט למלאי</button>`}
        </div>
        <${UsageCard} site=${site} now=${now} />
        <div class="hint">השתמשת בחומר? "🔧 שימוש בחומר" מוריד מהמלאי ורושם לאן הוא הלך. ＋/− רק לתיקון ספירה. כל עדכון נרשם ביומן עם שמך. מינימום נדרש: כשהכמות יורדת מתחתיו נפתח חריג במרכז הבקרה. בלי עדכון ${CFG.stockDays} ימים — נפתח חריג "מלאי לא עודכן".</div>
      </div>`;
  }

  function StockHome({ st, now, who, rk, onStockSave, onStockDelete, onStockConfirm, onStockUse, onOrder, tabs }){
    return html`
      <div class="screen narrow">
        ${tabs}
        <div class="shead"><h2>מלאי באתר</h2><span class="sub">כל מנהל מנהל את המלאי של האתרים שלו · ההנהלה רואה בזמן אמת</span></div>
        <div style=${{marginTop:12}}>
          <${StockEditor} st=${st} now=${now} who=${who} rk=${rk} onSave=${onStockSave} onDelete=${onStockDelete} onConfirm=${onStockConfirm} onUse=${onStockUse} onOrder=${onOrder} />
        </div>
      </div>`;
  }

  const WK = readWorker();
  ReactDOM.createRoot(document.getElementById("root")).render(WK ? html`<${WorkerApp} id=${WK} />` : html`<${App} />`);
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
</script>

</body>
</html>
